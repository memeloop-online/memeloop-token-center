<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-labelledby="title desc">
  <title id="title">Plugin publication lifecycle</title>
  <desc id="desc">Install and verify, review the manifest, approve the exact artifact, publish globally. Rollback creates a new revision.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#64748b"/></marker></defs>
  <rect width="460" height="460" rx="20" fill="#f8fafc"/>
  <g fill="#e0f2fe" stroke="#bae6fd"><rect x="70" y="20" width="320" height="62" rx="12"/><rect x="70" y="108" width="320" height="62" rx="12"/><rect x="70" y="196" width="320" height="62" rx="12"/><rect x="70" y="284" width="320" height="62" rx="12"/><rect x="70" y="372" width="320" height="62" rx="12"/></g>
  <g fill="#0f172a" font-family="system-ui,sans-serif" text-anchor="middle"><g font-size="19"><text x="230" y="46">1. Install</text><text x="230" y="134">2. Review</text><text x="230" y="222">3. Approve</text><text x="230" y="310">4. Publish</text><text x="230" y="398">5. Roll back</text></g><g font-size="14" fill="#475569"><text x="230" y="68">Download and verify signature</text><text x="230" y="156">Inspect the manifest</text><text x="230" y="244">Register the exact artifact</text><text x="230" y="332">Activate a new revision</text><text x="230" y="420">Publish a new revision of prior content</text></g></g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M230 82v20"/><path d="M230 170v20"/><path d="M230 258v20"/><path d="M230 346v20"/></g>
</svg>
