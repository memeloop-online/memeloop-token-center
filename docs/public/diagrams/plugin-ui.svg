<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
  <title id="title">Operator plugin data flow</title>
  <desc id="desc">The browser requests plugin data from the MTC control plane. MTC checks authorization and tenant, fetches from the fixed plugin HTTPS endpoint, validates JSON, and returns a core-owned response envelope. Browser credentials are never forwarded.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#64748b"/></marker></defs>
  <rect width="560" height="400" rx="20" fill="#f8fafc"/>
  <g fill="#e0f2fe" stroke="#bae6fd"><rect x="110" y="24" width="340" height="58" rx="12"/><rect x="110" y="154" width="340" height="82" rx="12"/><rect x="110" y="318" width="340" height="58" rx="12"/></g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a"><g font-size="20"><text x="280" y="60">Operator browser</text><text x="280" y="186">MTC control plane</text><text x="280" y="354">Plugin HTTPS endpoint</text></g><g font-size="15" fill="#475569"><text x="280" y="212">Scope and tenant authorization</text><text x="210" y="108">Read plugin data</text><text x="350" y="132">Response envelope</text><text x="215" y="260">Bounded GET</text><text x="350" y="294">Validated JSON</text></g></g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M150 82v66"/><path d="M410 154V88"/><path d="M150 236v76"/><path d="M410 318v-76"/></g>
</svg>
