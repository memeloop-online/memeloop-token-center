# Review and replace every REPLACE_* value before creating this one-shot Job.
# The checked-in form is intentionally a dry-run: add the final `--apply` arg
# only after its exact-count output and the database snapshot are approved.
apiVersion: batch/v1
kind: Job
metadata:
  name: memeloop-token-center-legacy-credential-import
  namespace: REPLACE_TARGET_NAMESPACE
  labels:
    app.kubernetes.io/name: memeloop-token-center-legacy-credential-import
    app.kubernetes.io/component: migration
  annotations:
    memeloop-token-center/import-mode: dry-run
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memeloop-token-center-legacy-credential-import
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: REPLACE_IMAGE_PULL_SECRET
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-database-credentials
          image: REPLACE_PRIVATE_REGISTRY/memeloop-token-center-importer@sha256:REPLACE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cp /secrets/database-source/pgpass /credentials/pgpass
              chmod 0600 /credentials/pgpass
              test "$(stat -c '%u:%g:%a' /credentials/pgpass)" = "10001:10001:600"
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 24Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database-secret
              mountPath: /secrets/database-source
              readOnly: true
            - name: database-credentials
              mountPath: /credentials
      containers:
        - name: importer
          # Pin the reviewed existing Token Center importer image digest here.
          # Mutable tags are forbidden.
          image: REPLACE_PRIVATE_REGISTRY/memeloop-token-center-importer@sha256:REPLACE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/attach-legacy-cpa-credentials"]
          args:
            - --tenant-external-id
            - REPLACE_TENANT_EXTERNAL_ID
            - --cpa-management-url
            - REPLACE_CPA_READ_ONLY_BASE_URL
            - --cpa-management-token-file
            - /secrets/cpa/management-token
            # For the approved apply, add all five lines below together:
            # - --apply
            # - --target-api-base-url
            # - REPLACE_TOKEN_CENTER_PRIVATE_CONTROL_URL
            # - --service-token-file
            # - /secrets/target/service-token
            # Add --allow-http-cpa and/or --allow-http-target only for an
            # explicitly reviewed cluster-internal plaintext hop.
            # Never add --apply before the dry-run output is approved.
          env:
            - name: PGHOST
              value: REPLACE_TARGET_POSTGRES_HOST
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: token_center
            - name: PGDATABASE
              value: REPLACE_TARGET_DATABASE
            - name: PGPASSFILE
              value: /credentials/pgpass
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cpa-management-token
              mountPath: /secrets/cpa
              readOnly: true
            - name: database-credentials
              mountPath: /credentials
              readOnly: true
            # For apply only, mount the keys:write-only target Secret at
            # /secrets/target. Do not expose it to the dry-run pod.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cpa-management-token
          secret:
            secretName: REPLACE_CPA_READ_ONLY_MANAGEMENT_SECRET
            defaultMode: 0440
            items:
              - key: management-token
                path: management-token
        - name: database-secret
          secret:
            # This one-purpose Secret contains a libpq pgpass line, not a URI
            # or password exposed through the container environment.
            secretName: REPLACE_DATABASE_PGPASS_SECRET
            defaultMode: 0440
            items:
              - key: pgpass
                path: pgpass
        - name: database-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # For apply only, add a target-service-token Secret volume containing
        # service-token with defaultMode 0440 and its matching read-only
        # volumeMount above.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
