apiVersion: batch/v1
kind: Job
metadata:
  name: memeloop-token-center-cpamp-import
  namespace: cliproxyapi
  labels:
    app.kubernetes.io/name: memeloop-token-center-cpamp-import
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memeloop-token-center-cpamp-import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: REPLACE_IMAGE_PULL_SECRET
      nodeSelector:
        kubernetes.io/hostname: haixia
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-database-credentials
          image: REPLACE_PRIVATE_REGISTRY/memeloop-token-center-importer@sha256:REPLACE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cp /secrets/database-source/pgpass /credentials/pgpass
              chmod 0600 /credentials/pgpass
              test "$(stat -c '%u:%g:%a' /credentials/pgpass)" = "10001:10001:600"
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 24Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database-secret
              mountPath: /secrets/database-source
              readOnly: true
            - name: database-credentials
              mountPath: /credentials
      containers:
        - name: importer
          image: REPLACE_PRIVATE_REGISTRY/memeloop-token-center-importer@sha256:REPLACE_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: REPLACE_TARGET_POSTGRES_HOST
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: token_center
            - name: PGDATABASE
              value: REPLACE_TARGET_DATABASE
            - name: PGPASSFILE
              value: /credentials/pgpass
            - name: CPAMP_SQLITE_PATH
              value: /source/usage.sqlite
            - name: IMPORT_TENANT_EXTERNAL_ID
              value: cpa-dogfood-import
            - name: CPAMP_OVERLAP_MS
              value: "86400000"
            - name: CPAMP_IMPORT_SOURCE
              value: REPLACE_CPAMP_IMPORT_SOURCE
            - name: CPAMP_RESET_IMPORT
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database-credentials
              mountPath: /credentials
              readOnly: true
            - name: source
              mountPath: /source
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-secret
          secret:
            secretName: REPLACE_DATABASE_PGPASS_SECRET
            defaultMode: 0440
            items:
              - key: pgpass
                path: pgpass
        - name: database-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: source
          persistentVolumeClaim:
            claimName: cpa-manager-plus-data
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
