apiVersion: batch/v1
kind: Job
metadata:
  name: memeloop-token-center-cpamp-import
  namespace: cliproxyapi
  labels:
    app.kubernetes.io/name: memeloop-token-center-cpamp-import
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memeloop-token-center-cpamp-import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: haixia
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: alpine:3.22.1
          command:
            - /bin/sh
            - -ec
            - apk add --no-cache postgresql-client sqlite && exec /ops/migrate-cpamp.sh
          env:
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: memeloop-token-center-cpamp-import
                  key: database-url
            - name: CPAMP_SQLITE_PATH
              value: /source/usage.sqlite
            - name: IMPORT_TENANT_EXTERNAL_ID
              value: cpa-dogfood-import
            - name: CPAMP_OVERLAP_MS
              value: "86400000"
            - name: CPAMP_RESET_IMPORT
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: importer
              mountPath: /ops
              readOnly: true
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: cpa-manager-plus-data
            readOnly: true
        - name: importer
          configMap:
            name: memeloop-token-center-cpamp-import
            defaultMode: 0555
