apiVersion: batch/v1
kind: Job
metadata:
  name: memeloop-token-center-cpamp-import
  namespace: cliproxyapi
  labels:
    app.kubernetes.io/name: memeloop-token-center-cpamp-import
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memeloop-token-center-cpamp-import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: haixia
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: REPLACE_PRIVATE_REGISTRY/memeloop-token-center-importer@sha256:REPLACE_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: memeloop-token-center-pg-rw.memeloop-token-center-dev.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: token_center
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: memeloop-token-center-cpamp-import
                  key: database-password
            - name: PGDATABASE
              value: memeloop_token_center_dogfood
            - name: CPAMP_SQLITE_PATH
              value: /source/usage.sqlite
            - name: IMPORT_TENANT_EXTERNAL_ID
              value: cpa-dogfood-import
            - name: CPAMP_OVERLAP_MS
              value: "86400000"
            - name: CPAMP_RESET_IMPORT
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: cpa-manager-plus-data
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
