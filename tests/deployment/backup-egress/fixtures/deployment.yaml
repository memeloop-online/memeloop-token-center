apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtc-backup-egress
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    memeloop.io/activation-gate: parent-review-and-runtime-network-acceptance-required
spec:
  replicas: 0
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mtc-backup-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtc-backup-egress
        app.kubernetes.io/part-of: memeloop-token-center-test
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      nodeSelector:
        kubernetes.io/hostname: haixia
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: mihomo
          image: docker.io/metacubex/mihomo:v1.19.32@sha256:bac1a74de365ea59270ba134016762c6be05654d55246518de256113bd1c225e
          imagePullPolicy: IfNotPresent
          command: [/mihomo]
          args: [-d, /var/lib/mihomo, -f, /etc/mihomo/config.yaml]
          ports:
            - name: socks
              containerPort: 1080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 64Mi
          startupProbe:
            tcpSocket:
              port: socks
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: socks
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: socks
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/mihomo
              readOnly: true
            - name: runtime
              mountPath: /var/lib/mihomo
      volumes:
        - name: config
          secret:
            secretName: mtc-backup-egress-config
            optional: false
            defaultMode: 288
            items:
              - key: config.yaml
                path: config.yaml
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
