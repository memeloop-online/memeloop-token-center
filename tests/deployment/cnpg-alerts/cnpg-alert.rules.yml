# GitOps source commit: 66efccb5380a772cb89b6999bbe64b7cb6219002
# GitOps source path: apps/memeloop-token-center/data/monitoring.yaml
# GitOps source rule SHA-256: fb83e338a12665176e726b6dad4f97df9b6f6a46947b83abcdee7be5dd58c139
# This fixture is a test copy, not an independently maintained production rule.
groups:
  - name: memeloop-token-center.postgres
    rules:
      - alert: MTCPostgresPrimaryOrReadWriteEndpointUnavailable
        expr: |
          (
            (sum(kube_pod_status_ready{
              job="kube-state-metrics",
              namespace="memeloop-token-center",
              pod=~"memeloop-token-center-pg-[0-9]+",
              condition="true"
            }) or vector(0)) < 1
            or
            (sum(kube_endpoint_address{
              job="kube-state-metrics",
              namespace="memeloop-token-center",
              endpoint="memeloop-token-center-pg-rw",
              ready="true"
            }) or vector(0)) < 1
          )
          and on() (sum(up{job="kube-state-metrics"}) > 0)
        for: 2m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "MTC PostgreSQL primary is not Ready or its rw endpoint is unavailable"
          description: "Check the CNPG Cluster Ready/currentPrimary status and the memeloop-token-center-pg-rw EndpointSlice. Follow the bounded MTC CNPG maintenance closeout in the cluster Wiki."
