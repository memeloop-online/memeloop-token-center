{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "memeloop-token-center.fullname" . }}-migrate
  labels:
    {{- include "memeloop-token-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.migration.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.migration.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "memeloop-token-center.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # This is a pre-install hook, so the release ServiceAccount does not
      # exist yet. The migrator only needs network and Secret access.
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: {{ include "memeloop-token-center.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: MTC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.databaseUrlSecret.name }}
                  key: {{ .Values.config.databaseUrlSecret.key }}
            - name: MTC_DATABASE_MAX_CONNECTIONS
              value: {{ .Values.config.databaseMaxConnections | quote }}
            # Config parsing currently requires credentials even though the
            # migrate command never authenticates them. The token below is a
            # non-authenticating 32-byte sentinel that satisfies config parsing.
            - name: MTC_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.keyPepperSecret.name }}
                  key: {{ .Values.config.keyPepperSecret.key }}
            - name: MTC_SERVICE_TOKEN
              value: "bootstrap-disabled-for-migration"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
