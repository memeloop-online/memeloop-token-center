{{- $archiveProbeMinimum := add (div (add (int .Values.config.s3.readinessDeadlineMillis) 999) 1000) 2 -}}
{{- if and (eq .Values.probes.readiness.path "/readyz") (lt (int .Values.probes.readiness.timeoutSeconds) (int $archiveProbeMinimum)) -}}
{{- fail (printf "probes.readiness.timeoutSeconds must be >= %d for /readyz (archive deadline rounded up plus 2 seconds)" $archiveProbeMinimum) -}}
{{- end -}}
{{- if gt (int .Values.config.s3.connectTimeoutMillis) (int .Values.config.s3.requestTimeoutMillis) -}}
{{- fail "config.s3.connectTimeoutMillis must not exceed requestTimeoutMillis" -}}
{{- end -}}
{{- if lt (int64 .Values.config.proxyMemoryBudgetBytes) (add (mul (int64 .Values.config.responsesBodyMaxBytes) 12) 1048576) -}}
{{- fail "config.proxyMemoryBudgetBytes must cover responsesBodyMaxBytes times 12 plus 1Mi" -}}
{{- end -}}
{{- if lt (int64 .Values.config.responsesRequestSpoolBytes) (int64 .Values.config.responsesBodyMaxBytes) -}}
{{- fail "config.responsesRequestSpoolBytes must cover config.responsesBodyMaxBytes" -}}
{{- end -}}
{{- if or (eq .Values.requestSpool.mountPath "/") (contains ".." .Values.requestSpool.mountPath) -}}
{{- fail "requestSpool.mountPath must be a dedicated absolute path without traversal components" -}}
{{- end -}}
{{- $requestSpoolSizeBytes := include "memeloop-token-center.memoryBytes" .Values.requestSpool.sizeLimit | int64 -}}
{{- if lt $requestSpoolSizeBytes (int64 .Values.config.responsesRequestSpoolBytes) -}}
{{- fail "requestSpool.sizeLimit must cover config.responsesRequestSpoolBytes" -}}
{{- end -}}
{{- include "memeloop-token-center.runtimeInventory.validate" . -}}
{{- range $role := list "gateway" "control" "worker" "all" }}
{{- $roleConfig := index $.Values.roles $role }}
{{- if $roleConfig.enabled }}
{{- $runtimeWriter := or (eq $role "control") (eq $role "all") }}
{{- if or (eq $role "gateway") (eq $role "all") -}}
{{- $memoryLimit := dig "resources" "limits" "memory" "" $roleConfig -}}
{{- $memoryBytes := include "memeloop-token-center.memoryBytes" $memoryLimit | int64 -}}
{{- $requiredMemory := add (int64 $.Values.config.proxyMemoryBudgetBytes) 268435456 -}}
{{- if lt $memoryBytes $requiredMemory -}}
{{- fail (printf "roles.%s.resources.limits.memory must cover config.proxyMemoryBudgetBytes plus 256Mi (%d bytes required)" $role $requiredMemory) -}}
{{- end -}}
{{- $ephemeralStorageLimit := dig "resources" "limits" "ephemeral-storage" "" $roleConfig -}}
{{- $ephemeralStorageBytes := include "memeloop-token-center.memoryBytes" $ephemeralStorageLimit | int64 -}}
{{- $requiredEphemeralStorage := add $requestSpoolSizeBytes 67108864 -}}
{{- if lt $ephemeralStorageBytes $requiredEphemeralStorage -}}
{{- fail (printf "roles.%s.resources.limits.ephemeral-storage must cover requestSpool.sizeLimit plus 64Mi headroom" $role) -}}
{{- end -}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memeloop-token-center.roleName" (dict "root" $ "role" $role) }}
  annotations:
    # Worker joins ServiceAccount/PVC creation in wave 0. Argo waits for it
    # before applying split-role producers, including on a fresh installation.
    argocd.argoproj.io/sync-wave: {{ ternary "1" "0" (or (eq $role "gateway") (eq $role "control")) | quote }}
  labels:
    {{- include "memeloop-token-center.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  strategy:
    type: {{ $.Values.deploymentStrategy }}
  {{- if not $roleConfig.autoscaling.enabled }}
  replicas: {{ $roleConfig.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "memeloop-token-center.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "memeloop-token-center.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
        {{- with $.Values.podLabels }}
        {{- toYaml $.Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "memeloop-token-center.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- if $.Values.plugins.runtimeInventory.enabled }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- with $.Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $.Values.plugins.ociInstaller.enabled $.Values.plugins.runtimeInventory.enabled }}
      initContainers:
        {{- if $.Values.plugins.runtimeInventory.enabled }}
        - name: prepare-plugin-inventory
          image: {{ include "memeloop-token-center.roleImage" (dict "root" $ "role" $role) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - prepare-plugin-inventory
            - --directory
            - /var/lib/memeloop-token-center/plugin-runtime
            {{- if not $runtimeWriter }}
            - --read-only
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: plugin-runtime-inventory
              mountPath: /var/lib/memeloop-token-center/plugin-runtime
              readOnly: {{ not $runtimeWriter }}
        {{- end }}
        {{- if $.Values.plugins.ociInstaller.enabled }}
        {{- range $index, $artifact := $.Values.plugins.ociInstaller.artifacts }}
        - name: install-plugin-{{ $index }}
          image: {{ printf "%s@%s" $.Values.plugins.ociInstaller.image.repository $.Values.plugins.ociInstaller.image.digest | quote }}
          imagePullPolicy: {{ $.Values.plugins.ociInstaller.image.pullPolicy }}
          args:
            - {{ $artifact.reference | quote }}
            - --plugin-dir
            - {{ $.Values.plugins.mountPath | quote }}
            - --allowed-source
            - {{ $artifact.allowedSource | quote }}
            {{- range $.Values.plugins.ociInstaller.cosignPublicKeysSecret.keys }}
            - --cosign-public-key
            - {{ printf "/var/run/secrets/mtc-plugin-cosign/%s" . | quote }}
            {{- end }}
            {{- if $.Values.plugins.ociInstaller.registryAuthSecret.name }}
            {{- if $.Values.plugins.ociInstaller.registryAuthSecret.bearerTokenKey }}
            - --registry-bearer-token-file
            - /var/run/secrets/mtc-plugin-registry/bearer-token
            {{- else }}
            - --registry-username-file
            - /var/run/secrets/mtc-plugin-registry/username
            - --registry-password-file
            - /var/run/secrets/mtc-plugin-registry/password
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            {{- toYaml $.Values.plugins.ociInstaller.resources | nindent 12 }}
          volumeMounts:
            - name: plugins
              mountPath: {{ $.Values.plugins.mountPath }}
            - name: plugin-installer-tmp
              mountPath: /tmp
            - name: plugin-cosign-keys
              mountPath: /var/run/secrets/mtc-plugin-cosign
              readOnly: true
            {{- if $.Values.plugins.ociInstaller.registryAuthSecret.name }}
            - name: plugin-registry-auth
              mountPath: /var/run/secrets/mtc-plugin-registry
              readOnly: true
            {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: token-center
          image: {{ include "memeloop-token-center.roleImage" (dict "root" $ "role" $role) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["serve", "--role", {{ $role | quote }}]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "memeloop-token-center.env" $ | nindent 12 }}
            {{- include "memeloop-token-center.runtimeInventory.env" (dict "root" $ "writer" $runtimeWriter) | nindent 12 }}
            - name: MTC_GATEWAY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MTC_GATEWAY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MTC_GATEWAY_FAILURE_DOMAIN
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MTC_RUN_MIGRATIONS_ON_START
              value: "false"
            {{- include "memeloop-token-center.proxyEnv" $ | nindent 12 }}
            {{- if or (eq $role "control") (eq $role "all") }}
            - name: MTC_RUNTIME_PROFILING_ENABLED
              value: {{ $.Values.config.runtimeProfiling.enabled | quote }}
            - name: MTC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.config.serviceTokenSecret.name }}
                  key: {{ $.Values.config.serviceTokenSecret.key }}
            {{- if $.Values.config.memeloopCloudWebhookSecret.name }}
            - name: MTC_MEMELOOP_CLOUD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.config.memeloopCloudWebhookSecret.name }}
                  key: {{ $.Values.config.memeloopCloudWebhookSecret.key }}
            {{- end }}
            {{- else }}
            - name: MTC_SERVICE_TOKEN
              # Non-authenticating 32-byte sentinel that satisfies config parsing.
              value: "bootstrap-disabled-for-this-role"
            {{- end }}
          startupProbe:
            httpGet: { path: {{ $.Values.probes.startup.path | quote }}, port: http }
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: { path: {{ $.Values.probes.readiness.path | quote }}, port: http }
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: {{ $.Values.probes.liveness.path | quote }}, port: http }
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml $roleConfig.resources | nindent 12 }}
          {{- if or (or $.Values.plugins.enabled $.Values.plugins.runtimeInventory.enabled) (or (eq $role "gateway") (eq $role "all")) }}
          volumeMounts:
            {{- if or (eq $role "gateway") (eq $role "all") }}
            - name: responses-request-spool
              mountPath: {{ $.Values.requestSpool.mountPath | quote }}
              readOnly: false
            {{- end }}
            {{- if or $.Values.plugins.enabled $.Values.plugins.runtimeInventory.enabled }}
            {{- include "memeloop-token-center.runtimeInventory.mounts" (dict "root" $ "writer" $runtimeWriter) | nindent 12 }}
            {{- if $.Values.plugins.enabled }}
            - name: plugins
              mountPath: {{ $.Values.plugins.mountPath }}
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or (or $.Values.plugins.enabled $.Values.plugins.runtimeInventory.enabled) (or (eq $role "gateway") (eq $role "all")) }}
      volumes:
        {{- if or (eq $role "gateway") (eq $role "all") }}
        - name: responses-request-spool
          emptyDir:
            sizeLimit: {{ $.Values.requestSpool.sizeLimit | quote }}
        {{- end }}
        {{- if or $.Values.plugins.enabled $.Values.plugins.runtimeInventory.enabled }}
        {{- include "memeloop-token-center.runtimeInventory.volumes" (dict "root" $ "writer" $runtimeWriter) | nindent 8 }}
        {{- if $.Values.plugins.enabled }}
        - name: plugins
          {{- if $.Values.plugins.ociInstaller.enabled }}
          emptyDir:
            sizeLimit: {{ $.Values.plugins.ociInstaller.outputSizeLimit | quote }}
          {{- else if $.Values.plugins.existingConfigMap }}
          configMap:
            name: {{ $.Values.plugins.existingConfigMap }}
          {{- else if $.Values.plugins.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.plugins.existingClaim }}
          {{- else }}
          {{- fail "plugins.enabled requires plugins.existingConfigMap or plugins.existingClaim" }}
          {{- end }}
        {{- if $.Values.plugins.ociInstaller.enabled }}
        - name: plugin-installer-tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ $.Values.plugins.ociInstaller.tmpSizeLimit | quote }}
        - name: plugin-cosign-keys
          secret:
            secretName: {{ $.Values.plugins.ociInstaller.cosignPublicKeysSecret.name }}
            defaultMode: 0440
            items:
              {{- range $.Values.plugins.ociInstaller.cosignPublicKeysSecret.keys }}
              - key: {{ . | quote }}
                path: {{ . | quote }}
              {{- end }}
        {{- if $.Values.plugins.ociInstaller.registryAuthSecret.name }}
        - name: plugin-registry-auth
          secret:
            secretName: {{ $.Values.plugins.ociInstaller.registryAuthSecret.name }}
            defaultMode: 0440
            items:
              {{- if $.Values.plugins.ociInstaller.registryAuthSecret.bearerTokenKey }}
              - key: {{ $.Values.plugins.ociInstaller.registryAuthSecret.bearerTokenKey | quote }}
                path: bearer-token
              {{- else }}
              - key: {{ $.Values.plugins.ociInstaller.registryAuthSecret.usernameKey | quote }}
                path: username
              - key: {{ $.Values.plugins.ociInstaller.registryAuthSecret.passwordKey | quote }}
                path: password
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
