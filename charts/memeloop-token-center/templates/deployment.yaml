apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memeloop-token-center.fullname" . }}
  labels:
    {{- include "memeloop-token-center.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "memeloop-token-center.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "memeloop-token-center.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: token-center
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MTC_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.config.databaseUrlSecret.name }}, key: {{ .Values.config.databaseUrlSecret.key }} } }
            - name: MTC_KEY_PEPPER
              valueFrom: { secretKeyRef: { name: {{ .Values.config.keyPepperSecret.name }}, key: {{ .Values.config.keyPepperSecret.key }} } }
            - name: MTC_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.config.serviceTokenSecret.name }}, key: {{ .Values.config.serviceTokenSecret.key }} } }
            - name: MTC_ARCHIVE_BACKEND
              value: {{ .Values.config.archiveBackend | quote }}
            - name: MTC_S3_BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: MTC_S3_ENDPOINT
              value: {{ .Values.config.s3.endpoint | quote }}
            - name: MTC_S3_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: MTC_S3_ALLOW_HTTP
              value: {{ .Values.config.s3.allowHttp | quote }}
            - name: MTC_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.config.s3.credentialsSecret.name }}, key: {{ .Values.config.s3.credentialsSecret.accessKey }} } }
            - name: MTC_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.config.s3.credentialsSecret.name }}, key: {{ .Values.config.s3.credentialsSecret.secretKey }} } }
            - name: MTC_UPSTREAM_OPENAI_URL
              value: {{ .Values.config.upstream.openaiUrl | quote }}
            - name: MTC_UPSTREAM_ANTHROPIC_URL
              value: {{ .Values.config.upstream.anthropicUrl | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

