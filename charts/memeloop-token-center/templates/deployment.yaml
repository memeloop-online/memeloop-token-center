{{- range $role := list "gateway" "control" "worker" "all" }}
{{- $roleConfig := index $.Values.roles $role }}
{{- if $roleConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memeloop-token-center.roleName" (dict "root" $ "role" $role) }}
  labels:
    {{- include "memeloop-token-center.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  strategy:
    type: {{ $.Values.deploymentStrategy }}
    {{- if eq $.Values.deploymentStrategy "Recreate" }}
    # Explicitly clear the RollingUpdate-only field during SSA transitions.
    rollingUpdate: null
    {{- end }}
  {{- if not $roleConfig.autoscaling.enabled }}
  replicas: {{ $roleConfig.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "memeloop-token-center.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "memeloop-token-center.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
        {{- with $.Values.podLabels }}
        {{- toYaml $.Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "memeloop-token-center.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: token-center
          image: {{ include "memeloop-token-center.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["serve", "--role", {{ $role | quote }}]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "memeloop-token-center.env" $ | nindent 12 }}
            - name: MTC_RUN_MIGRATIONS_ON_START
              value: "false"
            {{- include "memeloop-token-center.proxyEnv" $ | nindent 12 }}
            {{- if or (eq $role "control") (eq $role "all") }}
            - name: MTC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.config.serviceTokenSecret.name }}
                  key: {{ $.Values.config.serviceTokenSecret.key }}
            {{- else }}
            - name: MTC_SERVICE_TOKEN
              # Non-authenticating 32-byte sentinel that satisfies config parsing.
              value: "bootstrap-disabled-for-this-role"
            {{- end }}
          startupProbe:
            httpGet: { path: {{ $.Values.probes.startup.path | quote }}, port: http }
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: { path: {{ $.Values.probes.readiness.path | quote }}, port: http }
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: {{ $.Values.probes.liveness.path | quote }}, port: http }
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml $roleConfig.resources | nindent 12 }}
          {{- if $.Values.plugins.enabled }}
          volumeMounts:
            - name: plugins
              mountPath: {{ $.Values.plugins.mountPath }}
              readOnly: true
          {{- end }}
      {{- if $.Values.plugins.enabled }}
      volumes:
        - name: plugins
          {{- if $.Values.plugins.existingConfigMap }}
          configMap:
            name: {{ $.Values.plugins.existingConfigMap }}
          {{- else if $.Values.plugins.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.plugins.existingClaim }}
          {{- else }}
          {{- fail "plugins.enabled requires plugins.existingConfigMap or plugins.existingClaim" }}
          {{- end }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
