{{- if .Values.ingress.enabled }}
{{- range $role := list "gateway" "control" }}
{{- $roleConfig := index $.Values.roles $role }}
{{- $ingressConfig := index $.Values.ingress $role }}
{{- if and $roleConfig.enabled $roleConfig.service.enabled $ingressConfig.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "memeloop-token-center.roleName" (dict "root" $ "role" $role) }}
  labels:
    {{- include "memeloop-token-center.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingressConfig.tlsSecretName }}
  tls:
    - hosts: [{{ $ingressConfig.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $ingressConfig.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "memeloop-token-center.roleName" (dict "root" $ "role" $role) }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
