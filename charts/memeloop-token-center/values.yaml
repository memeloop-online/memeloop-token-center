image:
  repository: ghcr.io/memeloop/memeloop-token-center
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

migration:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

roles:
  gateway:
    enabled: true
    replicaCount: 2
    service:
      enabled: true
      type: ClusterIP
      port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 256Mi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  control:
    enabled: true
    replicaCount: 1
    service:
      enabled: true
      type: ClusterIP
      port: 8080
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
    autoscaling: { enabled: false }
    podDisruptionBudget: { enabled: false }
  worker:
    enabled: true
    replicaCount: 1
    service: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 384Mi }
    autoscaling: { enabled: false }
    podDisruptionBudget: { enabled: false }
  all:
    enabled: false
    replicaCount: 1
    service:
      enabled: true
      type: ClusterIP
      port: 8080
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 512Mi }
    autoscaling: { enabled: false }
    podDisruptionBudget: { enabled: false }

config:
  databaseUrlSecret:
    name: memeloop-token-center-secrets
    key: database-url
  keyPepperSecret:
    name: memeloop-token-center-secrets
    key: key-pepper
  serviceTokenSecret:
    name: memeloop-token-center-secrets
    key: service-token
  archiveBackend: s3
  s3:
    bucket: memeloop-token-center
    endpoint: ""
    region: us-east-1
    allowHttp: false
    credentialsSecret:
      name: memeloop-token-center-secrets
      accessKey: s3-access-key
      secretKey: s3-secret-key
  upstream:
    openaiUrl: ""
    anthropicUrl: ""
  # Optional egress proxy for public OAuth/API and pricing catalog traffic.
  # Cluster-local PostgreSQL, S3, and Services remain direct via noProxy.
  outboundProxy:
    url: ""
    noProxy: "localhost,127.0.0.1,::1,.svc,.cluster.local,10.0.0.0/8,100.64.0.0/10"

plugins:
  enabled: false
  mountPath: /var/lib/memeloop-token-center/plugins
  existingConfigMap: ""
  existingClaim: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  gateway:
    host: api.token-center.example.com
    tlsSecretName: ""
  control:
    host: control.token-center.example.com
    tlsSecretName: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false
  interval: 30s
