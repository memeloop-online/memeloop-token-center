[package]
name = "mtc-preferred-account"
version = "1.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.57.1"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
