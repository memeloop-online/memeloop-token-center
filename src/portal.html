<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Memeloop Token Center</title>
  <style>
    :root{color-scheme:dark;background:#07111f;color:#e7edf7;font:14px Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17345b 0,transparent 34%),#07111f}.shell{max-width:1280px;margin:auto;padding:28px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.auth{display:flex;gap:8px}input,button{border:1px solid #2a4262;border-radius:8px;background:#0c1a2d;color:#e7edf7;padding:10px 12px}input{width:min(420px,55vw)}button{cursor:pointer;background:#3b82f6;border-color:#3b82f6}.cards{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin:24px 0}.card,.panel{background:#0b1829cc;border:1px solid #1e3552;border-radius:12px;padding:16px;box-shadow:0 16px 40px #0003}.label{color:#8fa6c3;font-size:12px}.value{font-size:24px;font-weight:700;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h2{font-size:15px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #1b304a}th{color:#8fa6c3;font-weight:500}.ok{color:#5ee19a}.fail{color:#fb7185}.empty{color:#8fa6c3;padding:24px 0}.bar{height:8px;background:#162a44;border-radius:10px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#60a5fa}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.auth{width:100%}input{flex:1}}
    .view{padding:5px 9px;background:#172d49;border-color:#29496d}pre{white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;background:#06101d;border-radius:8px;padding:12px;color:#bcd0e8}
  </style>
</head>
<body><main class="shell">
  <section class="top"><div><h1>请求与用量</h1><div class="label">使用你的 API key 查看该稳定 key 身份的历史；这里不能管理或修改任何配置。</div></div><div class="auth"><input id="key" type="password" placeholder="mtc_..." autocomplete="off"><button id="load">查看</button></div></section>
  <section class="cards" id="cards"></section>
  <section class="grid"><div class="panel"><h2>按模型</h2><div id="models"></div></div><div class="panel"><h2>每日趋势</h2><div id="days"></div></div></section>
  <section class="panel" style="margin-top:12px"><h2>最近请求</h2><div id="requests"></div></section>
  <section class="panel" id="detailPanel" style="display:none;margin-top:12px"><h2>请求详情</h2><div id="detail"></div></section>
</main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cards(s){return [['请求',s.total_requests],['成功',s.successful_requests],['失败',s.failed_requests],['Tokens',s.input_tokens+s.output_tokens],['费用',s.total_cost]].map(([l,v])=>`<div class=card><div class=label>${l}</div><div class=value>${esc(v)}</div></div>`).join('')}
function buckets(v){if(!v.length)return '<div class=empty>暂无数据</div>';let max=Math.max(...v.map(x=>x.requests),1);return v.map(x=>`<div style="margin:11px 0"><div>${esc(x.name)} <span class=label style=float:right>${x.requests} 次 · ${x.input_tokens+x.output_tokens} tokens</span></div><div class=bar><i style="width:${x.requests/max*100}%"></i></div></div>`).join('')}
async function load(){let key=$('key').value.trim();if(!key)return;sessionStorage.setItem('mtc-key',key);let h={Authorization:`Bearer ${key}`};try{let [stats,requests]=await Promise.all([fetch('/self/v1/stats',{headers:h}),fetch('/self/v1/requests?limit=50',{headers:h})]);if(!stats.ok)throw new Error('Key 无效或无权访问');let s=await stats.json(),r=await requests.json();$('cards').innerHTML=cards(s.summary);$('models').innerHTML=buckets(s.by_model);$('days').innerHTML=buckets(s.by_day);$('requests').innerHTML=r.length?`<table><thead><tr><th>时间</th><th>模型</th><th>协议</th><th>状态</th><th>耗时</th><th>Tokens</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.model)}</td><td>${esc(x.protocol)}</td><td class=${x.status_code>=200&&x.status_code<400?'ok':'fail'}>${esc(x.status_code??'进行中')}</td><td>${esc(x.duration_ms??'-')} ms</td><td>${x.input_tokens+x.output_tokens}</td><td><button class=view onclick="viewReq('${x.request_id}')">详情</button></td></tr>`).join('')}</tbody></table>`:'<div class=empty>暂无请求</div>'}catch(e){alert(e.message)}}
async function viewReq(id){let key=sessionStorage.getItem('mtc-key')||'';let r=await fetch(`/self/v1/requests/${id}`,{headers:{Authorization:`Bearer ${key}`}});if(!r.ok)return alert('无法读取该请求');let d=await r.json();$('detailPanel').style.display='block';$('detail').innerHTML=`<div class=label>${esc(d.request_id)} · ${esc(d.model)} · 归档${d.archive_complete?'完整':'存在缺口'}</div><h3>请求</h3><pre>${esc(JSON.stringify(d.request_body,null,2))}</pre><h3>响应</h3><pre>${esc(JSON.stringify(d.response_body,null,2))}</pre>`;$('detailPanel').scrollIntoView({behavior:'smooth'})}
$('key').value=sessionStorage.getItem('mtc-key')||'';$('load').onclick=load;if($('key').value)load();
  </script></body></html>
