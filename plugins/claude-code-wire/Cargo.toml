[package]
name = "mtc-claude-code-wire"
version = "1.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Standalone crate: intentionally outside the host cargo workspace so the
# wasm guest dependency set (wit-bindgen, sha2) never leaks into the host
# dependency tree.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# preserve_order keeps JSON key insertion order through parse/serialize,
# matching the JSON.stringify round-trip semantics the cch checksum relies on.
# preserve_order implies serde_json's std feature; that is fine because the
# guest targets wasm32-unknown-unknown, whose std is freestanding and adds
# no WASI imports (unlike wasm32-wasip2).
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", default-features = false }
# Keep wit-bindgen minimal; combined with the wasm32-unknown-unknown target
# the component imports only the declared host interface.
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "bitflags", "macro-string"] }

[dev-dependencies]
# Reference XXH64 used to cross-validate the hand-written port in tests.
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
