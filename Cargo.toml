[package]
name = "memeloop-token-center"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Open-source high-performance relay and usage analytics for AI text, image, and video workloads"
repository = "https://github.com/memeloop-online/memeloop-token-center"
homepage = "https://github.com/memeloop-online/memeloop-token-center"
documentation = "https://github.com/memeloop-online/memeloop-token-center/tree/master/docs"
publish = false

[lib]
name = "memeloop_token_center"
path = "src/lib.rs"

[[bin]]
name = "memeloop-token-center"
path = "src/main.rs"

[[bin]]
name = "install-plugin-oci"
path = "src/bin/install-plugin-oci.rs"
required-features = ["plugin-distribution"]

[[test]]
name = "cucumber"
harness = false

[features]
default = []
plugin-distribution = ["dep:oci-client", "dep:tempfile"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
http = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "service", "tokio"] }
jsonschema = { version = "0.49.9", default-features = false }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
mime_guess = "2"
object_store = { version = "0.14.1", features = ["aws"] }
oci-client = { version = "0.17", optional = true, default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "socks", "stream"] }
regex = "1"
rust_decimal = { version = "=1.42.1", default-features = false, features = ["serde-with-str", "std"] }
rustix = { version = "1", features = ["fs", "time"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "any", "postgres", "sqlite"] }
subtle = "2"
thiserror = "2"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
wasmtime = { version = "47.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemalloc-sys = { version = "0.7.1", features = ["profiling", "stats"] }
tikv-jemallocator = { version = "0.7.0", features = ["profiling", "stats"] }

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.15.0", default-features = false, features = ["prost-codec"] }

[dev-dependencies]
cucumber = { version = "0.23.0", features = ["macros"] }
percent-encoding = "2"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["limit", "util"] }
wat = "1.252"
wiremock = "0.6.5"
wit-component = "0.252"
wit-parser = "0.252"

[profile.release]
lto = "thin"
codegen-units = 1
# Runtime CPU profiles need the native symbol table. Debug sections remain
# stripped so production images do not carry full source-level debug data.
strip = "debuginfo"

[patch.crates-io]
# Upstream 1.42.1 declares an optional, unused rkyv dependency that is still
# resolved into Cargo.lock and therefore audited even though no application
# feature can reach it. This source-identical, manifest-only fork removes that
# dormant surface; see vendor/rust_decimal/MEMELOOP-FORK.md.
rust_decimal = { path = "vendor/rust_decimal" }
