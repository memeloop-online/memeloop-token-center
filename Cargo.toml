[package]
name = "memeloop-token-center"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "memeloop_token_center"
path = "src/lib.rs"

[[bin]]
name = "memeloop-token-center"
path = "src/main.rs"

[[test]]
name = "cucumber"
harness = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http = "1"
mime_guess = "2"
object_store = { version = "0.14.1", features = ["aws"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres", "sqlite"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
wasmtime = { version = "47.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[dev-dependencies]
cucumber = { version = "0.23.0", features = ["macros"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
