# cargo-deny 0.18+ configuration. Keep this policy fail-closed: dependency
# exceptions belong in a reviewed, time-bounded change rather than an implicit
# warning or an untrusted package source.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Direct archive compression still uses zstd 0.13. No published 0.13 line
  # depends on zstd >=0.14.3, so the advisory cannot be cleared by a lockfile
  # update. Archive compression uses zstd::bulk, which the legacy streaming
  # advisory does not cover.
  { id = "RUSTSEC-2026-0391", reason = "until 2026-11-26: archive compression uses Encoder::new, not a reused with_context" },
  { id = "RUSTSEC-2026-0398", reason = "until 2026-11-26: seekable decompression is not used" },
  { id = "RUSTSEC-2026-0403", reason = "until 2026-11-26: bulk decode is outside the legacy streaming path" },
  { id = "RUSTSEC-2026-0410", reason = "until 2026-11-26: the wasm allocator shim is not linked into the linux gateway" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
