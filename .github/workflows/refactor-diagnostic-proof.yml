name: MTC isolated Rust timing diagnostics
on:
  push:
    branches: [ci/mtc-refactor-proof-1041]
    paths: [.github/workflows/refactor-diagnostic-proof.yml]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        revision: [45073750a9bcb696d4225a38d088f30069e561e3, 412aa4d82242ccf82382bbffb51e97133d517a27]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Verify exact product revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Product checkout: $actual_sha"
          test "$actual_sha" = "${{ matrix.revision }}"
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Run exact tests alone and preserve original failure semantics
        run: |
          set -euo pipefail
          failed=0
          for test in \
            response_archive_spool::tests::cancelled_writer_returns_success_only_when_its_single_fence_succeeds \
            db::requests::conversations::prefix_storage::tests::sqlite_long_prefix_storage_and_lossless_replay \
            db::requests::conversations::prefix_storage::tests::postgres_long_prefix_storage_and_lossless_replay; do
            started=$SECONDS
            log="$(mktemp)"
            rc=0
            timeout --kill-after=15s 600s cargo test --locked --all-features --lib "$test" -- --exact --nocapture >"$log" 2>&1 || rc=$?
            tail -70 "$log"
            if [[ "$rc" != 0 ]] || ! grep -Eq '^test result: ok\. 1 passed;' "$log"; then failed=1; fi
            printf 'isolated %s exit=%s wall_seconds=%s; 600s command cap includes Cargo overhead\n' "$test" "$rc" "$((SECONDS - started))"
          done
          exit "$failed"
