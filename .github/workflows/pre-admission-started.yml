name: pre-admission-started
on:
  pull_request:
    paths:
      - src/db/requests/**
      - migrations/common/0164_proxy_started_obligation.sql
      - .github/workflows/pre-admission-started.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify admission cursor isolation and durable lifecycle publication
        run: |
          cargo test --locked --all-features --lib db::requests::operational_terminal::tests -- --nocapture --test-threads=1
          cargo test --locked --all-features --lib forwarding_admission_snapshot_commits_and_failures_roll_back_for_both_modes -- --nocapture
          cargo test --locked --all-features --lib postgres_request_admission_lost_commit_ack_never_dispatches_and_orphan_settles_once -- --nocapture

