name: request-capture-timing
on:
  pull_request:
    paths:
      - src/gateway_body/request_spool.rs
      - src/gateway_body/request_spool/capture_timing.rs
      - .github/workflows/request-capture-timing.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify independent capture timing gates and cancellation
        run: cargo test --locked --all-features --lib request_capture_timing -- --nocapture
