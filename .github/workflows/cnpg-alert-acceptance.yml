name: CNPG alert acceptance

on:
  pull_request:
    paths:
      - .github/workflows/cnpg-alert-acceptance.yml
      - tests/deployment/cnpg-alerts/**

permissions:
  contents: read

concurrency:
  group: cnpg-alert-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0

      - name: Install locked source-check dependency
        run: npm ci --ignore-scripts --no-fund

      - name: Verify fixture matches the pinned GitOps alert
        run: node --test tests/deployment/cnpg-alerts/source-consistency.test.ts

      - name: Check Prometheus rules with the cluster-matched promtool
        env:
          PROMETHEUS_IMAGE: quay.io/prometheus/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
        run: |
          set -euo pipefail
          docker pull "$PROMETHEUS_IMAGE"
          docker run --rm --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/tests/deployment/cnpg-alerts:/tests:ro" \
            "$PROMETHEUS_IMAGE" check rules /tests/cnpg-alert.rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/tests/deployment/cnpg-alerts:/tests:ro" \
            -w /tests "$PROMETHEUS_IMAGE" test rules cnpg-alerts.test.yml
