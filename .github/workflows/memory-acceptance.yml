name: memory-acceptance

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-hex commit SHA to test (empty means the dispatched workflow SHA)
        required: false
        type: string

permissions:
  contents: read

jobs:
  optimized-15-minute-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Initialize failure-safe evidence
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/memory-acceptance"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "requested_revision=${REQUESTED_REVISION}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$EVIDENCE_DIR/workflow.txt"
      - name: Check out requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Record exact tested revision
        id: revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          case "$REQUESTED_REVISION" in
            *[!0-9a-fA-F]*|'')
              echo 'revision must be an exact 40-hex commit SHA' >&2
              exit 1
              ;;
          esac
          if [ "${#REQUESTED_REVISION}" -ne 40 ] || \
             [ "$sha" != "$(printf '%s' "$REQUESTED_REVISION" | tr 'A-F' 'a-f')" ]; then
            echo "checked out $sha instead of exact requested commit $REQUESTED_REVISION" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved_revision=$sha" >> "$EVIDENCE_DIR/workflow.txt"
          git status --porcelain=v1 --untracked-files=all \
            > "$EVIDENCE_DIR/checkout-status.txt"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Record build toolchain
        run: |
          rustc -Vv > "$EVIDENCE_DIR/toolchain.txt"
          cargo -V >> "$EVIDENCE_DIR/toolchain.txt"
      - name: Build optimized service binary
        id: build
        shell: bash
        timeout-minutes: 35
        env:
          MTC_BUILD_GIT_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          MTC_BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)
          MTC_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')
          export MTC_BUILD_TIMESTAMP MTC_BUILD_TARGET
          {
            echo "build_revision=$MTC_BUILD_GIT_SHA"
            echo "build_timestamp=$MTC_BUILD_TIMESTAMP"
            echo "build_target=$MTC_BUILD_TARGET"
          } > "$EVIDENCE_DIR/build-metadata.txt"
          set +e
          cargo build --locked --release --bin memeloop-token-center \
            > "$EVIDENCE_DIR/build.log" 2>&1
          result=$?
          set -e
          cat "$EVIDENCE_DIR/build.log"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Run 15-minute memory, stream, and 500 MiB asset gate
        if: steps.build.outcome == 'success'
        id: benchmark
        shell: bash
        timeout-minutes: 30
        run: |
          set +e
          ops/benchmark-memory.sh \
            --profile acceptance \
            --binary target/release/memeloop-token-center \
            --gateway-limit-mib 256 \
            --gateway-headroom-mib 32 \
            --output "$EVIDENCE_DIR/memory-${{ steps.revision.outputs.sha }}.json" \
            > "$EVIDENCE_DIR/harness.log" 2>&1
          result=$?
          set -e
          cat "$EVIDENCE_DIR/harness.log"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Upload exact-revision memory evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: memory-acceptance-${{ steps.revision.outputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-acceptance/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce harness result
        if: always()
        env:
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
          HARNESS_EXIT_CODE: ${{ steps.benchmark.outputs.exit_code }}
        run: |
          if [ -z "$BUILD_EXIT_CODE" ]; then
            echo 'The optimized build did not produce an exit code' >&2
            exit 1
          fi
          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "The optimized build failed with exit code $BUILD_EXIT_CODE" >&2
            exit "$BUILD_EXIT_CODE"
          fi
          if [ -z "$HARNESS_EXIT_CODE" ]; then
            echo 'The memory harness did not produce an exit code' >&2
            exit 1
          fi
          exit "$HARNESS_EXIT_CODE"
