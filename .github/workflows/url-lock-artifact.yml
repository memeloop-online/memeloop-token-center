name: URL lock artifact
on:
  push:
    branches: [ci/mtc-refactor-proof-1041]
    paths: [.github/workflows/url-lock-artifact.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bec374e3372605eb4d0a6899dbc92ca2c3df7cef
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Resolve the patched URL crate
        run: |
          test "$(git rev-parse HEAD)" = bec374e3372605eb4d0a6899dbc92ca2c3df7cef
          cargo update -p url --precise 2.5.9
          git diff --check
          git diff --exit-code -- . ':!Cargo.lock'
          git diff -- Cargo.lock | tee "${RUNNER_TEMP}/url-lock.patch"
          test -s "${RUNNER_TEMP}/url-lock.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: url-lock-bec374e33
          path: |
            Cargo.lock
            ${{ runner.temp }}/url-lock.patch
          if-no-files-found: error
