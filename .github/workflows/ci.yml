name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build the browser-test service before Playwright starts it
        run: cargo build --locked --manifest-path ../Cargo.toml --bin memeloop-token-center
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency vulnerability scanner
        run: cargo install cargo-audit --locked
      - name: Verify ignored advisories remain unreachable optional dependencies
        run: |
          test -z "$(cargo tree --target all -i rsa 2>/dev/null)"
          test -z "$(cargo tree --target all -i rkyv 2>/dev/null)"
          # These advisories occur only in disabled optional lockfile entries;
          # the two `cargo tree` assertions above keep that assumption audited.
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0235
      - name: Install PostgreSQL and SQLite migration clients
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client sqlite3
      - name: Start MinIO and create integration-test bucket
        run: |
          # Rust/Wasmtime debug artifacts can leave a hosted runner below
          # MinIO's filesystem free-space safety threshold by test time. Keep
          # the tiny integration bucket on an isolated sparse tmpfs so the
          # storage test measures S3 behavior instead of runner disk pressure.
          docker run --detach --name mtc-test-minio --publish 9000:9000 \
            --tmpfs /data:rw,size=2g \
            --env MINIO_ROOT_USER=token-center-test \
            --env MINIO_ROOT_PASSWORD=token-center-test-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs mtc-test-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -ec 'mc alias set test http://127.0.0.1:9000 token-center-test token-center-test-secret \
              && mc mb --ignore-existing test/memeloop-token-center-test'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
        env:
          MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
          MTC_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MTC_TEST_S3_BUCKET: memeloop-token-center-test
          MTC_TEST_S3_ACCESS_KEY: token-center-test
          MTC_TEST_S3_SECRET_KEY: token-center-test-secret

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL migration smoke test
        env:
          MTC_DATABASE_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
          MTC_KEY_PEPPER: ci-key-pepper-with-more-than-thirty-two-bytes
          MTC_SERVICE_TOKEN: ci-service-token
          MTC_ARCHIVE_BACKEND: memory
        run: cargo run --locked --bin memeloop-token-center -- migrate

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [web, rust, migration-smoke, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/linonetwo/memeloop-token-center
            dockerfile: Dockerfile
            cache_scope: service
          - image: ghcr.io/linonetwo/memeloop-token-center-importer
            dockerfile: Dockerfile.importer
            cache_scope: importer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:master
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            MTC_BUILD_GIT_SHA=${{ github.sha }}
            MTC_BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
            MTC_BUILD_TARGET=linux/amd64
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart and values schema
        run: |
          helm lint --strict charts/memeloop-token-center
          helm lint --strict charts/memeloop-token-center \
            --values charts/memeloop-token-center/values-dev.yaml
      - name: Render hardened Helm profiles
        run: |
          set -euo pipefail
          helm template token-center charts/memeloop-token-center \
            --namespace token-center > /tmp/token-center-default.yaml
          helm template token-center-dev charts/memeloop-token-center \
            --namespace token-center-dev \
            --values charts/memeloop-token-center/values-dev.yaml \
            > /tmp/token-center-dev.yaml
          helm template token-center-observed charts/memeloop-token-center \
            --namespace token-center \
            --set serviceMonitor.enabled=true \
            --set roles.gateway.autoscaling.enabled=true \
            > /tmp/token-center-observed.yaml

          grep -q 'kind: NetworkPolicy' /tmp/token-center-default.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/token-center-default.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/token-center-observed.yaml
          grep -q 'kind: ServiceMonitor' /tmp/token-center-observed.yaml
          test "$(grep -c 'name: MTC_RUN_MIGRATIONS_ON_START' /tmp/token-center-default.yaml)" -eq 3
          grep -Fq 'args: ["migrate"]' /tmp/token-center-default.yaml
          if grep -A1 'name: MTC_RUN_MIGRATIONS_ON_START' /tmp/token-center-default.yaml | grep -q '"true"'; then
            echo 'Application Deployments must not run migrations on startup' >&2
            exit 1
          fi
          if grep -Eq '^kind:[[:space:]]*Secret[[:space:]]*$' \
            /tmp/token-center-default.yaml /tmp/token-center-dev.yaml /tmp/token-center-observed.yaml; then
            echo 'The chart must reference externally managed Secrets, never render them' >&2
            exit 1
          fi
          if grep -R -Fq 'kubectl.kubernetes.io/last-applied-configuration' \
            charts/memeloop-token-center; then
            echo 'Chart sources must never add the last-applied Secret disclosure annotation' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*-[[:space:]]*\{\}[[:space:]]*$' \
            /tmp/token-center-default.yaml /tmp/token-center-observed.yaml; then
            echo 'Rendered policies must not contain an allow-all empty rule' >&2
            exit 1
          fi
          if grep -Eq 'port:[[:space:]]*(1080|5432|9000)([^0-9]|$)' \
            /tmp/token-center-default.yaml; then
            echo 'Default policy must not grant private dependencies or a proxy by CIDR' >&2
            exit 1
          fi
          if helm template invalid-policy charts/memeloop-token-center \
            --set networkPolicy.egress.clusterDependencies.enabled=true \
            >/tmp/token-center-invalid-policy.yaml 2>/tmp/token-center-invalid-policy.err; then
            echo 'Values schema must reject enabled rules without CIDRs and ports' >&2
            exit 1
          fi
      - name: Validate rendered Kubernetes resources
        run: |
          curl --fail --location --retry 3 \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          cat /tmp/token-center-default.yaml /tmp/token-center-dev.yaml /tmp/token-center-observed.yaml \
            | /tmp/kubeconform -strict -summary -ignore-missing-schemas
      - run: docker compose config --quiet
