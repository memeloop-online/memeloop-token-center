name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reject committed secrets and high-risk infrastructure misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
          skip-dirs: target,web/node_modules

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Enforce license, source, duplicate, ban, and advisory policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.95.0
          command: check advisories bans licenses sources
          arguments: --all-features
      - name: Install the pinned RustSec scanner with its audited lockfile
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce the current RustSec advisory database with no exceptions
        run: cargo audit --deny warnings
      - name: Reject forbidden dependency re-entry and verify vendored provenance
        run: |
          tests/ops/rust-decimal-vendor-contract.sh
          default_tree="$(cargo tree --locked --target all --prefix none)"
          all_features_tree="$(cargo tree --locked --all-features --target all --prefix none)"
          for crate in rsa rkyv rkyv_derive sqlx-mysql sigstore; do
            if printf '%s\n' "$default_tree" | grep -E "^${crate} v"; then
              echo "$crate entered the default dependency tree" >&2
              exit 1
            fi
            if printf '%s\n' "$all_features_tree" | grep -E "^${crate} v"; then
              echo "$crate entered the all-features dependency tree" >&2
              exit 1
            fi
          done
          for crate in rsa rkyv rkyv_derive sigstore; do
            if grep -Fq "name = \"${crate}\"" Cargo.lock; then
              echo "$crate remains in Cargo.lock" >&2
              exit 1
            fi
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - name: Reject high and critical Node dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:localization
      - run: npm run build
      - name: Build the browser-test service before Cucumber.js starts it
        run: cargo build --locked --manifest-path ../Cargo.toml --bin memeloop-token-center
      - name: Install the Chromium driver used by Cucumber.js steps
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Wasmtime plus every integration-test binary can exhaust the hosted
    # runner while lld mmaps debug sections. CI does not consume test debug
    # symbols, so keep the release gate deterministic and bounded without
    # changing assertions, features, targets, or test coverage.
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install PostgreSQL and SQLite migration clients
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=60 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=60 \
            install --yes --no-install-recommends postgresql-client sqlite3
      - name: Run legacy credential operator failure-mode acceptance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/ops/test_legacy_credentials_bulk.py
      - name: Verify memory harness seed contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/load/test_benchmark_memory.py
      - name: Run isolated legacy credential PostgreSQL operator acceptance
        id: isolated_legacy_pg
        env:
          MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
        run: |
          psql --version
          cargo test --locked --test legacy_credentials_bulk_postgres -- \
            --exact postgres_identity_query_is_locked_exact_and_rejects_revoked_mappings \
            --nocapture
      - name: Diagnose isolated PostgreSQL acceptance failure
        if: failure() && steps.isolated_legacy_pg.outcome == 'failure'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: memeloop_token_center_test
          PGUSER: token_center
          PGPASSWORD: token_center
        run: |
          # Emit only aggregate/test-service state; never query statement text or rows.
          psql -X -qAt --no-password <<'SQL' || true
          SELECT current_setting('server_version');
          SELECT application_name, state, COALESCE(wait_event_type, ''),
                 COALESCE(wait_event, ''), count(*)
            FROM pg_stat_activity
           WHERE datname = current_database()
           GROUP BY application_name, state, wait_event_type, wait_event
           ORDER BY application_name, state, wait_event_type, wait_event;
          SQL
          docker logs "${{ job.services.postgres.id }}" 2>&1 \
            | grep -E 'database system is|ready to accept|checkpoint|FATAL:|PANIC:|terminating connection|unexpected EOF|could not receive data' \
            | tail -n 200 || true
      - name: Start MinIO and create integration-test bucket
        run: |
          # Rust/Wasmtime debug artifacts can leave a hosted runner below
          # MinIO's filesystem free-space safety threshold by test time. Keep
          # the tiny integration bucket on an isolated sparse tmpfs so the
          # storage test measures S3 behavior instead of runner disk pressure.
          docker run --detach --name mtc-test-minio --publish 9000:9000 \
            --tmpfs /data:rw,size=2g \
            --env MINIO_ROOT_USER=token-center-test \
            --env MINIO_ROOT_PASSWORD=token-center-test-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs mtc-test-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh \
            --volume "$PWD/tests/fixtures/minio-list-only-policy.json:/tmp/minio-list-only-policy.json:ro" \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -ec 'mc alias set test http://127.0.0.1:9000 token-center-test token-center-test-secret \
              && mc mb --ignore-existing test/memeloop-token-center-test \
              && mc admin user add test mtc-list-only mtc-list-only-secret \
              && mc admin policy create test mtc-list-only /tmp/minio-list-only-policy.json \
              && mc admin policy attach test mtc-list-only --user mtc-list-only'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
        env:
          # This binary already ran above against the clean service boundary. Keep all
          # other PostgreSQL integration tests enabled in the monolithic suite.
          MTC_CI_SKIP_ISOLATED_LEGACY_CREDENTIALS_POSTGRES: "1"
          MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
          MTC_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MTC_TEST_S3_BUCKET: memeloop-token-center-test
          MTC_TEST_S3_ACCESS_KEY: token-center-test
          MTC_TEST_S3_SECRET_KEY: token-center-test-secret
          MTC_TEST_S3_LIST_ONLY_ACCESS_KEY: mtc-list-only
          MTC_TEST_S3_LIST_ONLY_SECRET_KEY: mtc-list-only-secret

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install PostgreSQL and SQLite clients for migration acceptance
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 \
            install --yes --no-install-recommends postgresql-client sqlite3
      - name: SQLite migration and replay smoke test
        env:
          MTC_KEY_PEPPER: ci-key-pepper-with-more-than-thirty-two-bytes
          MTC_SERVICE_TOKEN: ci-bootstrap-token-not-for-production
          MTC_ARCHIVE_BACKEND: filesystem
          MTC_ARCHIVE_PATH: /tmp/mtc-sqlite-migration-smoke-archive
        run: |
          database="$RUNNER_TEMP/migration-smoke.sqlite"
          export MTC_DATABASE_URL="sqlite://$database?mode=rwc"
          cargo run --locked --bin memeloop-token-center -- migrate
          first_count="$(sqlite3 "$database" 'SELECT count(*) FROM schema_migrations')"
          cargo run --locked --bin memeloop-token-center -- migrate
          second_count="$(sqlite3 "$database" 'SELECT count(*) FROM schema_migrations')"
          test "$first_count" -gt 0
          test "$second_count" = "$first_count"
      - name: PostgreSQL migration and replay smoke test
        env:
          MTC_DATABASE_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
          MTC_KEY_PEPPER: ci-key-pepper-with-more-than-thirty-two-bytes
          MTC_SERVICE_TOKEN: ci-bootstrap-token-not-for-production
          MTC_ARCHIVE_BACKEND: filesystem
          MTC_ARCHIVE_PATH: /tmp/mtc-migration-smoke-archive
        run: |
          cargo run --locked --bin memeloop-token-center -- migrate
          first_count="$(psql -X --no-psqlrc -qAt "$MTC_DATABASE_URL" \
            -c 'SELECT count(*) FROM schema_migrations')"
          cargo run --locked --bin memeloop-token-center -- migrate
          second_count="$(psql -X --no-psqlrc -qAt "$MTC_DATABASE_URL" \
            -c 'SELECT count(*) FROM schema_migrations')"
          test "$first_count" -gt 0
          test "$second_count" = "$first_count"
      - name: Seed 100k-row observability scale fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: memeloop_token_center_test
          PGUSER: token_center
          PGPASSWORD: token_center
        run: psql -X --no-psqlrc -v ON_ERROR_STOP=1 -f tests/load/seed_postgres_observability.sql
      - name: Enforce PostgreSQL observability plans and latency
        env:
          MTC_BENCH_DATABASE_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
        run: |
          python3 tests/load/postgres_explain.py \
            --output /tmp/postgres-explain-${GITHUB_SHA}.json
      - name: Retain PostgreSQL scale-plan evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: postgres-explain-${{ github.sha }}
          path: /tmp/postgres-explain-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate resumable CPA session-archive delta export
        run: python3 tests/ops/test-session-archive-delta-export.py
      - name: Exercise CPAMP initial, overlap, incremental, and replay imports
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: memeloop_token_center_test
          PGUSER: token_center
          PGPASSWORD: token_center
        run: |
          set -euo pipefail
          schema="mig_${GITHUB_SHA:0:24}"
          printf '%s\n' "$schema" | LC_ALL=C grep -Eq '^mig_[0-9a-f]{24}$'
          run_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="memeloop-token-center-importer:ci-${GITHUB_SHA}"
          acceptance=$(mktemp -d "$RUNNER_TEMP/cpamp-acceptance-$run_id.XXXXXX")
          cleanup() {
            printf 'DROP SCHEMA IF EXISTS :"schema" CASCADE;\n' \
              | psql -X --no-psqlrc -v ON_ERROR_STOP=1 \
                -v schema="$schema" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
            chmod 0700 -- "$acceptance" 2>/dev/null || true
            rm -rf -- "$acceptance"
          }
          trap cleanup EXIT HUP INT TERM
          ops/ci/prepare-cpamp-acceptance-bundle.sh "$acceptance"
          printf 'CREATE SCHEMA :"schema";\n' \
            | psql -X --no-psqlrc -v ON_ERROR_STOP=1 \
              -v schema="$schema"
          docker build --file Dockerfile.importer --tag "$image" .
          docker run --rm --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges --cap-drop ALL \
            --env ACCEPTANCE_SCHEMA="$schema" \
            --env ACCEPTANCE_RUN_ID="$run_id" \
            --env ACCEPTANCE_WORK_ROOT=/acceptance \
            --env PGHOST=127.0.0.1 --env PGPORT=5432 \
            --env PGDATABASE="$PGDATABASE" --env PGUSER="$PGUSER" \
            --env PGPASSWORD="$PGPASSWORD" \
            --volume "$acceptance:/acceptance:ro" \
            --entrypoint /bin/sh "$image" \
            /acceptance/cpamp-import-postgres-acceptance.sh

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned OpenAPI validation dependencies
        run: python3 -m pip install --requirement tests/ops/requirements-openapi.txt
      - name: Compare Axum source routes, role boundaries, and OpenAPI
        run: |
          python3 tests/ops/test-openapi-contract.py
          python3 tests/ops/check-openapi-contract.py \
            --output /tmp/memeloop-token-center-route-contract.json
      - name: Retain the resolved route contract
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: route-contract-${{ github.sha }}
          path: /tmp/memeloop-token-center-route-contract.json
          retention-days: 14

  memory-acceptance:
    needs: [rust]
    permissions:
      contents: read
    uses: ./.github/workflows/memory-acceptance.yml
    with:
      revision: ${{ github.sha }}

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - repository-security
      - dependency-security
      - web
      - rust
      - migration-smoke
      - api-contract
      - packaging
      - memory-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center
            dockerfile: Dockerfile
            cache_scope: service
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center-importer
            dockerfile: Dockerfile.importer
            cache_scope: importer
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center-plugin-installer
            dockerfile: Dockerfile.plugin-installer
            cache_scope: plugin-installer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate shared immutable release inputs
        env:
          RELEASE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          test "$GITHUB_REPOSITORY" = memeloop-online/memeloop-token-center
          ops/ci/validate-release-inputs.sh "$RELEASE_REGISTRY" "$GITHUB_SHA" prefixed >/dev/null
      - name: Install checksum-pinned crane registry client
        shell: bash
        run: |
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          destination="$RUNNER_TEMP/crane-bin"
          curl --fail --location --retry 3 \
            https://github.com/google/go-containerregistry/releases/download/v0.21.9/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$archive"
          echo '5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e  '"$archive" | sha256sum --check
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination" crane
          echo "$destination" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true,oci-artifact=true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            MTC_BUILD_GIT_SHA_INPUT=${{ github.sha }}
            MTC_BUILD_TIMESTAMP_INPUT=${{ github.event.head_commit.timestamp }}
            MTC_BUILD_TARGET_INPUT=linux/amd64
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true
      - name: Scan the exact published digest for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
          timeout: 15m0s
      - name: Verify tag resolution, OCI revision, SBOM, and provenance
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CACHE_SCOPE: ${{ matrix.cache_scope }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build returned an invalid image digest: $DIGEST" >&2
            exit 1
          fi
          test "$GITHUB_REPOSITORY" = memeloop-online/memeloop-token-center
          tagged_reference="${IMAGE}:sha-${GITHUB_SHA}"
          resolved_digest="$(crane digest "$tagged_reference")"
          if [ "$resolved_digest" != "$DIGEST" ]; then
            echo "immutable tag resolved to $resolved_digest instead of the build digest" >&2
            exit 1
          fi
          index="$RUNNER_TEMP/${CACHE_SCOPE}-index.json"
          attestations="$RUNNER_TEMP/${CACHE_SCOPE}-attestations"
          mkdir -p "$attestations"
          ops/ci/verify-buildkit-attestations.sh \
            "$IMAGE" "$DIGEST" "$index" "$attestations"
          platform_digest="$(jq -r '
            [.manifests[] |
             select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")][0].digest
          ' "$index")"
          if [[ ! "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "attestation verifier returned an invalid platform digest: $platform_digest" >&2
            exit 1
          fi
          image_evidence="$RUNNER_TEMP/${CACHE_SCOPE}-image.json"
          docker buildx imagetools inspect "${IMAGE}@${platform_digest}" \
            --format '{{json .Image}}' >"$image_evidence"
          jq -e \
            --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" '
              .config.Labels["org.opencontainers.image.source"] == $source and
              .config.Labels["org.opencontainers.image.revision"] == $revision
            ' "$image_evidence" >/dev/null
      - name: Record immutable image digest manifest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CACHE_SCOPE: ${{ matrix.cache_scope }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build returned an invalid image digest: $DIGEST" >&2
            exit 1
          fi
          manifest="$RUNNER_TEMP/${CACHE_SCOPE}-image-digest.json"
          jq --null-input \
            --arg image "$IMAGE" \
            --arg tag "sha-$GITHUB_SHA" \
            --arg digest "$DIGEST" \
            --arg revision "$GITHUB_SHA" \
            '{schema_version: 1, image: $image, tag: $tag, digest: $digest, revision: $revision, reference: ($image + "@" + $digest)}' \
            > "$manifest"
      - name: Upload immutable image digest manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: image-digest-${{ matrix.cache_scope }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.cache_scope }}-image-digest.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-image.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-index.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-attestations/
          if-no-files-found: error
          retention-days: 30

  verify-ghcr-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the complete release set by immutable digest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = memeloop-online/memeloop-token-center
          evidence="$RUNNER_TEMP/release-evidence"
          expected='importer plugin-installer service'
          actual="$(find "$evidence" -maxdepth 1 -name '*-image-digest.json' -printf '%f\n' |
            sed 's/-image-digest\.json$//' | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$expected" ]; then
            echo "incomplete release evidence: expected '$expected', got '$actual'" >&2
            exit 1
          fi
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          expected_images="$(jq -cn --arg prefix "$prefix" '[
            ($prefix + "/memeloop-token-center"),
            ($prefix + "/memeloop-token-center-importer"),
            ($prefix + "/memeloop-token-center-plugin-installer")
          ] | sort')"
          jq -s -e \
            --arg revision "$GITHUB_SHA" \
            --argjson expected_images "$expected_images" '
            select(
              length == 3 and
              (map(.revision == $revision) | all) and
              (map(.digest | test("^sha256:[0-9a-f]{64}$")) | all) and
              (map(.reference == (.image + "@" + .digest)) | all) and
              ((map(.image) | sort) == $expected_images)
            )
          ' "$evidence"/*-image-digest.json >"$RUNNER_TEMP/release-manifest.json"
          while IFS= read -r reference; do
            docker buildx imagetools inspect "$reference" >/dev/null
          done < <(jq -r '.[].reference' "$RUNNER_TEMP/release-manifest.json")
      - name: Upload the complete immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned workflow-policy parser dependencies
        run: npm --prefix web ci --ignore-scripts
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Install pinned Kubernetes schema validator
        run: |
          curl --fail --location --retry 3 \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: Lint, render, reject invalid values, and validate Kubernetes resources
        env:
          KUBECONFORM_BIN: /tmp/kubeconform
        run: tests/ops/helm-packaging-contract.sh
      - name: Validate release workflow and Docker build contracts
        run: tests/ops/release-packaging-contract.sh
      - name: Enforce focused source-module boundaries
        run: tests/ops/source-module-size-contract.sh
      - name: Validate shared GitHub and temporary Forgejo release contracts
        run: ops/ci/run-release-source-contracts.sh
      - name: Build and exercise the hardened importer image
        run: tests/ops/importer-image-contract.sh
      - name: Build and exercise the hardened plugin installer image
        run: tests/ops/plugin-installer-image-contract.sh
      - name: Validate the hardened session archive import Job
        run: tests/ops/session-archive-import-job-contract.sh
      - run: docker compose config --quiet
