name: HTTP settings exact-product validation

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Immutable HTTP settings product commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  http-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.product_sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Format and API/load fixture contracts
        run: |
          cargo fmt --all -- --check
          npm ci --ignore-scripts --no-audit
          node --test tests/ops/test-openapi-contract.ts tests/load/test-benchmark-memory.ts
          node tests/ops/check-openapi-contract.ts
      - name: Compile all product tests
        run: cargo test --locked --all-features --all-targets --no-run
      - name: HTTP settings and transport regressions
        run: |
          failed=0
          for filter in http_settings network::tests oauth:: codex_clients plugin_release db::transport_proxy_groups::probe http2_keepalive_tests simple_http::tests pricing::tests cursor_native:: provider::antigravity::
          do
            echo "::group::$filter"
            timeout 8m cargo test --locked --all-features --lib "$filter" -- --test-threads=1 || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Check no-default-features call sites
        if: always()
        run: cargo check --locked --no-default-features --all-targets
      - name: Lint product library and tests
        if: always()
        run: cargo clippy --locked --all-features --lib --tests -- -D warnings
