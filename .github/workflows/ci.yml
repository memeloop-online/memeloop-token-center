name: PR696 transport validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 066667122a04fb0b9f2bee646ec1a45497040aec
          persist-credentials: false
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Check formatting of exact product commit
        run: cargo fmt --all -- --check
      - name: Compile the exact product library tests once
        run: cargo test --locked --all-features --lib --no-run
      - name: Validate transport and migration regressions
        run: |
          failed=0
          for filter in \
            transport_policy \
            provider::tests \
            simple_http::tests \
            http2_keepalive_tests \
            api::proxy::routing::http::tests \
            api::proxy::routing::policy::tests \
            api::sse::responses::tests \
            codex_clients \
            upstream_quota::tests \
            api::proxy::tests::ha_policy \
            api::proxy::tests::codex_http2_failure_safety \
            api::proxy::tests::codex_protocol_contract \
            api::proxy::tests::codex_http2_long_silence
          do
            echo "::group::$filter"
            cargo test --locked --all-features --lib "$filter" -- --nocapture --test-threads=1 || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Lint product library and tests
        if: always()
        run: cargo clippy --locked --all-features --lib --tests -- -D warnings
