name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build the browser-test service before Cucumber.js starts it
        run: cargo build --locked --manifest-path ../Cargo.toml --bin memeloop-token-center
      - name: Install the Chromium driver used by Cucumber.js steps
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Wasmtime plus every integration-test binary can exhaust the hosted
    # runner while lld mmaps debug sections. CI does not consume test debug
    # symbols, so keep the release gate deterministic and bounded without
    # changing assertions, features, targets, or test coverage.
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install dependency vulnerability scanner
        run: cargo install cargo-audit --locked
      - name: Verify ignored advisories remain unreachable optional dependencies
        run: |
          test -z "$(cargo tree --locked --target all -i rsa 2>/dev/null)"
          test -z "$(cargo tree --locked --target all -i rkyv 2>/dev/null)"
          # These advisories occur only in disabled optional lockfile entries;
          # the two `cargo tree` assertions above keep that assumption audited.
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0235
      - name: Install PostgreSQL and SQLite migration clients
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=60 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=60 \
            install --yes --no-install-recommends postgresql-client sqlite3
      - name: Run legacy credential operator failure-mode acceptance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/ops/test_legacy_credentials_bulk.py
      - name: Run isolated legacy credential PostgreSQL operator acceptance
        id: isolated_legacy_pg
        env:
          MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
        run: |
          psql --version
          cargo test --locked --test legacy_credentials_bulk_postgres -- \
            --exact postgres_identity_query_is_locked_exact_and_rejects_revoked_mappings \
            --nocapture
      - name: Diagnose isolated PostgreSQL acceptance failure
        if: failure() && steps.isolated_legacy_pg.outcome == 'failure'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: memeloop_token_center_test
          PGUSER: token_center
          PGPASSWORD: token_center
        run: |
          # Emit only aggregate/test-service state; never query statement text or rows.
          psql -X -qAt --no-password <<'SQL' || true
          SELECT current_setting('server_version');
          SELECT application_name, state, COALESCE(wait_event_type, ''),
                 COALESCE(wait_event, ''), count(*)
            FROM pg_stat_activity
           WHERE datname = current_database()
           GROUP BY application_name, state, wait_event_type, wait_event
           ORDER BY application_name, state, wait_event_type, wait_event;
          SQL
          docker logs "${{ job.services.postgres.id }}" 2>&1 \
            | grep -E 'database system is|ready to accept|checkpoint|FATAL:|PANIC:|terminating connection|unexpected EOF|could not receive data' \
            | tail -n 200 || true
      - name: Start MinIO and create integration-test bucket
        run: |
          # Rust/Wasmtime debug artifacts can leave a hosted runner below
          # MinIO's filesystem free-space safety threshold by test time. Keep
          # the tiny integration bucket on an isolated sparse tmpfs so the
          # storage test measures S3 behavior instead of runner disk pressure.
          docker run --detach --name mtc-test-minio --publish 9000:9000 \
            --tmpfs /data:rw,size=2g \
            --env MINIO_ROOT_USER=token-center-test \
            --env MINIO_ROOT_PASSWORD=token-center-test-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs mtc-test-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh \
            --volume "$PWD/tests/fixtures/minio-list-only-policy.json:/tmp/minio-list-only-policy.json:ro" \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -ec 'mc alias set test http://127.0.0.1:9000 token-center-test token-center-test-secret \
              && mc mb --ignore-existing test/memeloop-token-center-test \
              && mc admin user add test mtc-list-only mtc-list-only-secret \
              && mc admin policy create test mtc-list-only /tmp/minio-list-only-policy.json \
              && mc admin policy attach test mtc-list-only --user mtc-list-only'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
        env:
          # This binary already ran above against the clean service boundary. Keep all
          # other PostgreSQL integration tests enabled in the monolithic suite.
          MTC_CI_SKIP_ISOLATED_LEGACY_CREDENTIALS_POSTGRES: "1"
          MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
          MTC_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MTC_TEST_S3_BUCKET: memeloop-token-center-test
          MTC_TEST_S3_ACCESS_KEY: token-center-test
          MTC_TEST_S3_SECRET_KEY: token-center-test-secret
          MTC_TEST_S3_LIST_ONLY_ACCESS_KEY: mtc-list-only
          MTC_TEST_S3_LIST_ONLY_SECRET_KEY: mtc-list-only-secret

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: PostgreSQL migration smoke test
        env:
          MTC_DATABASE_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
          MTC_KEY_PEPPER: ci-key-pepper-with-more-than-thirty-two-bytes
          MTC_SERVICE_TOKEN: ci-bootstrap-token-not-for-production
          MTC_ARCHIVE_BACKEND: memory
        run: cargo run --locked --bin memeloop-token-center -- migrate
      - name: Validate resumable CPA session-archive delta export
        run: python3 tests/ops/test-session-archive-delta-export.py

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned OpenAPI validation dependencies
        run: python3 -m pip install --requirement tests/ops/requirements-openapi.txt
      - name: Compare Axum source routes, role boundaries, and OpenAPI
        run: |
          python3 tests/ops/test-openapi-contract.py
          python3 tests/ops/check-openapi-contract.py \
            --output /tmp/memeloop-token-center-route-contract.json
      - name: Retain the resolved route contract
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: route-contract-${{ github.sha }}
          path: /tmp/memeloop-token-center-route-contract.json
          retention-days: 14

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [web, rust, migration-smoke, api-contract, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/linonetwo/memeloop-token-center
            dockerfile: Dockerfile
            cache_scope: service
          - image: ghcr.io/linonetwo/memeloop-token-center-importer
            dockerfile: Dockerfile.importer
            cache_scope: importer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:master
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            MTC_BUILD_GIT_SHA=${{ github.sha }}
            MTC_BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
            MTC_BUILD_TARGET=linux/amd64
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest manifest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CACHE_SCOPE: ${{ matrix.cache_scope }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build returned an invalid image digest: $DIGEST" >&2
            exit 1
          fi
          manifest="$RUNNER_TEMP/${CACHE_SCOPE}-image-digest.json"
          jq --null-input \
            --arg image "$IMAGE" \
            --arg tag "sha-$GITHUB_SHA" \
            --arg digest "$DIGEST" \
            --arg revision "$GITHUB_SHA" \
            '{schema_version: 1, image: $image, tag: $tag, digest: $digest, revision: $revision, reference: ($image + "@" + $digest)}' \
            > "$manifest"
      - name: Upload immutable image digest manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: image-digest-${{ matrix.cache_scope }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.cache_scope }}-image-digest.json
          if-no-files-found: error
          retention-days: 30

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Install pinned Kubernetes schema validator
        run: |
          curl --fail --location --retry 3 \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: Lint, render, reject invalid values, and validate Kubernetes resources
        env:
          KUBECONFORM_BIN: /tmp/kubeconform
        run: tests/ops/helm-packaging-contract.sh
      - name: Validate release workflow and Docker build contracts
        run: tests/ops/release-packaging-contract.sh
      - name: Build and exercise the hardened importer image
        run: tests/ops/importer-image-contract.sh
      - name: Validate the hardened session archive import Job
        run: tests/ops/session-archive-import-job-contract.sh
      - run: docker compose config --quiet
