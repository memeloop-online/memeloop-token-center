name: MTC UNKNOWN finance projection contract
on:
  push:
    branches: [ci/mtc-refactor-proof-1041]
    paths: [.github/workflows/refactor-unknown-finance-proof.yml]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4633e10e6743bba5e8cc179778002c2f1d1a132e
          persist-credentials: false
      - name: Verify exact product revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Product checkout: $actual_sha"
          test "$actual_sha" = "4633e10e6743bba5e8cc179778002c2f1d1a132e"
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify SQLite and Postgres UNKNOWN finance projection
        run: |
          set -euo pipefail
          for dialect in sqlite postgres; do
            test_name="db::requests::operational_terminal::tests::conversation_projection::${dialect}_unknown_finance_allows_operational_conversation_projection"
            cargo test --locked --all-features --lib "$test_name" -- --exact --nocapture | tee "$dialect.log"
            grep -E '^test result: ok\. 1 passed;' "$dialect.log"
          done
  memory-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4633e10e6743bba5e8cc179778002c2f1d1a132e
          persist-credentials: false
      - name: Verify exact product revision
        run: test "$(git rev-parse HEAD)" = 4633e10e6743bba5e8cc179778002c2f1d1a132e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Verify archive memory harness test contracts
        run: node --test tests/load/test-durable-archive-memory.ts
