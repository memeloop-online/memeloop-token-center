name: claude-wire-recovery

on:
  pull_request:
    paths:
      - '.github/workflows/claude-wire-recovery.yml'
      - 'src/plugin.rs'
      - 'src/plugin/**'
      - 'src/api/plugins.rs'
      - 'src/api/proxy/**'
      - 'src/api/responses_via_anthropic.rs'
      - 'src/api/routes/control.rs'
      - 'src/db/plugin*.rs'
      - 'tests/fixtures/claude-wire-synthetic.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-wire-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-gateway-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
      INSTALLER_SOURCE: ghcr.io/memeloop-online/memeloop-token-center
      INSTALLER_DIGEST: sha256:7f04c3c5e65225bc4ea64243e52c51a37020927ff0fae00a66adabb552b141ed
      INSTALLER_SOURCE_REVISION: d72b3ad5c75efd8634390ce55a2e33d47cfa79f2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the exact official signed Claude artifact without credentials
        env:
          PLUGIN_SOURCE: ghcr.io/memeloop-online/claude-code-wire
          PLUGIN_DIGEST: sha256:3e4160580005b15c9db1e3bd419df79ee65de1d86a8fe1d4ec5aac4c88fe5906
          SIGNING_IDENTITY: https://github.com/memeloop-online/claude-code-wire/.github/workflows/publish-oci.yml@refs/heads/master
          SIGNING_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed-claude" "$RUNNER_TEMP/claude-wire-evidence"
          docker pull "$INSTALLER_SOURCE@$INSTALLER_DIGEST"
          revision=$(docker image inspect "$INSTALLER_SOURCE@$INSTALLER_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$INSTALLER_SOURCE_REVISION"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$RUNNER_TEMP/signed-claude,dst=/plugins" \
            --entrypoint /usr/local/bin/install-plugin-oci "$INSTALLER_SOURCE@$INSTALLER_DIGEST" \
            "$PLUGIN_SOURCE@$PLUGIN_DIGEST" --plugin-dir /plugins --allowed-source "$PLUGIN_SOURCE" \
            --cosign-certificate-identity "$SIGNING_IDENTITY" \
            --cosign-certificate-oidc-issuer "$SIGNING_ISSUER" \
            > "$RUNNER_TEMP/claude-wire-evidence/verified-installation.json"
          cd "$RUNNER_TEMP/signed-claude/claude-code-wire"
          printf '%s\n' \
            '51043af426632581a218c227a0f90b2de2253d27b5438519098c44d965c01f3c  plugin.wasm' \
            '95aa1c2ec715a766e865d861b6e9b00cb157c1f77056fab300fc55fa3925c68e  plugin.json' \
            | sha256sum --check --strict
          cp .mtc-oci-install.json "$RUNNER_TEMP/claude-wire-evidence/provenance.json"
          echo "MTC_CLAUDE_WIRE_FIXTURE=$RUNNER_TEMP/signed-claude/claude-code-wire" >> "$GITHUB_ENV"
          echo "MTC_CLAUDE_WIRE_EVIDENCE=$RUNNER_TEMP/claude-wire-evidence/gateway-final-wire.json" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify empty registration permissions, persistence, idempotency and two-database CAS
        run: cargo test --locked --all-features --lib empty_inventory -- --nocapture
      - name: Run signed Wasmtime through the real TCP gateway and recover to empty
        run: |
          cargo test --locked --all-features --lib -- --ignored --exact api::proxy::tests::claude_wire_recovery::signed_claude_gateway_empty_recovery_finalize_matrix --nocapture
          test -s "$MTC_CLAUDE_WIRE_EVIDENCE"
      - name: Retain synthetic final-wire and signature evidence only
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: claude-wire-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/claude-wire-evidence/
          if-no-files-found: error
          retention-days: 14
