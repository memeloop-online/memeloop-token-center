name: publish-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed 40-hex SHA pinned in candidate-publication.json
        required: true
        type: string
      source_run_id:
        description: Successful full normal ci workflow_dispatch run ID
        required: true
        type: string
      artifact_digest:
        description: Exact source artifact API SHA256 digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    if: >-
      github.repository == 'memeloop-online/memeloop-token-center' &&
      github.ref == 'refs/heads/master' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Read approved source policy without evaluating candidate code
        id: policy
        run: node --input-type=module -e 'import * as fs from "node:fs"; const p = JSON.parse(fs.readFileSync("packaging/candidate-publication.json", "utf8")); if (!/^[0-9a-f]{40}$/.test(p.candidate_sha)) throw new Error("invalid approved SHA"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "revision=" + p.candidate_sha + "\n");'
      - name: Check out approved source as inert review data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memeloop-online/memeloop-token-center
          ref: ${{ steps.policy.outputs.revision }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full CI, reviewed production delta and exact artifact digest
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: node scripts/ci/verify-candidate-source.ts
      - name: Download only the verified immutable source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verify.outputs.artifact_id }}
          run-id: ${{ steps.verify.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate-release-input
          merge-multiple: true
      - name: Verify the sealed candidate input with trusted master tools
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.revision }}
        run: |
          node scripts/ci/verify-release-service-input.ts "$RUNNER_TEMP/candidate-release-input" "$CANDIDATE_SHA"
          node scripts/ci/install-memory-binary.ts "$RUNNER_TEMP/candidate-release-input" "$CANDIDATE_SHA" "$RUNNER_TEMP/verified-candidate-binary"
      - name: Retain verified source evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: candidate-source-evidence-${{ steps.verify.outputs.revision }}
          path: candidate-source-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Forward verified input into this trusted publication run
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: candidate-release-input-${{ steps.verify.outputs.revision }}
          path: ${{ runner.temp }}/candidate-release-input/
          if-no-files-found: error
          retention-days: 1

  publish-ghcr:
    if: >-
      github.repository == 'memeloop-online/memeloop-token-center' &&
      github.ref == 'refs/heads/master' && github.ref_protected == true
    needs: [validate-candidate]
    env:
      CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.revision }}
      TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center
            dockerfile: Dockerfile.release
            cache_scope: service
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center-plugin-installer
            dockerfile: Dockerfile.plugin-installer.release
            cache_scope: plugin-installer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Download the same-run Docker-native service input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-release-input-${{ needs.validate-candidate.outputs.revision }}
          path: ${{ runner.temp }}/release-service-input
      - name: Verify the exact Docker-native service input
        run: >-
          node scripts/ci/verify-release-service-input.ts
          "$RUNNER_TEMP/release-service-input"
          "$CANDIDATE_SHA"
      - name: Validate shared immutable release inputs
        env:
          RELEASE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: node scripts/ci/validate-release-inputs.ts "$RELEASE_REGISTRY" "$TRUSTED_WORKFLOW_SHA" prefixed
      - name: Install checksum-pinned crane registry client
        run: |
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          destination="$RUNNER_TEMP/crane-bin"
          curl --fail --location --retry 3 \
            https://github.com/google/go-containerregistry/releases/download/v0.21.9/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$archive"
          echo '5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e  '"$archive" | sha256sum --check
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination" crane
          echo "$destination" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing immutable candidate tag
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/ci/require-unpublished-candidate.ts "$IMAGE" "$CANDIDATE_SHA"
      - name: Build and publish ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true,oci-artifact=true
          tags: ${{ matrix.image }}:sha-${{ needs.validate-candidate.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-candidate.outputs.revision }}
            org.opencontainers.image.version=candidate-${{ needs.validate-candidate.outputs.revision }}
            org.opencontainers.image.licenses=Apache-2.0
          build-contexts: |
            release-input=${{ runner.temp }}/release-service-input
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true
      - name: Start the exact published service image
        if: matrix.cache_scope == 'service'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --entrypoint /usr/local/bin/memeloop-token-center
          "$IMAGE@$DIGEST" --help
      - name: Scan the exact published digest for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
          timeout: 15m0s
      - name: Verify immutable tag, OCI labels, SBOM, provenance, and image evidence
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CACHE_SCOPE: ${{ matrix.cache_scope }}
          VERSION_TAG: ''
        run: node scripts/ci/run-candidate-release-tool.ts verify-published-image "$IMAGE" "$DIGEST" "$CACHE_SCOPE" "$RUNNER_TEMP"
      - name: Upload immutable image digest manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: image-digest-${{ matrix.cache_scope }}-${{ needs.validate-candidate.outputs.revision }}
          path: |
            ${{ runner.temp }}/${{ matrix.cache_scope }}-image-digest.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-image.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-index.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-attestations/
          if-no-files-found: error
          retention-days: 30

  verify-ghcr-release:
    if: >-
      github.repository == 'memeloop-online/memeloop-token-center' &&
      github.ref == 'refs/heads/master' && github.ref_protected == true
    needs: [validate-candidate, publish-ghcr]
    env:
      CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*-${{ needs.validate-candidate.outputs.revision }}
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the complete release set by immutable digest
        run: node scripts/ci/run-candidate-release-tool.ts verify-ghcr-release "$RUNNER_TEMP/release-evidence" "$RUNNER_TEMP/release-manifest.json"
      - name: Upload the complete immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-ghcr-release-${{ needs.validate-candidate.outputs.revision }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 90
