name: conversation-objects

on:
  pull_request:
    paths:
      - src/archive/**
      - src/db/**
      - src/worker.rs
      - src/api/session_reading.rs
      - .github/workflows/conversation-objects.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-objects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - run: cargo test --locked --lib archive::conversation
      - run: cargo test --locked --lib archive::text
      - run: cargo test --locked --lib archive::raw_capture
      - run: cargo test --locked --lib db::object_bodies
      - run: cargo test --locked --lib buffered_archive_waits_off_frontend
