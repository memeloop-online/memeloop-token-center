name: conversation-objects

on:
  pull_request:
    paths:
      - src/archive/**
      - src/db/**
      - src/worker.rs
      - src/api/audio.rs
      - src/api/auth.rs
      - src/gateway_body.rs
      - src/api/session_reading.rs
      - src/api/proxy/persistence.rs
      - src/api/proxy.rs
      - src/api/proxy/streaming.rs
      - src/api/proxy/upstream_response.rs
      - src/api/proxy/tests/archive_terminal.rs
      - src/api/proxy/tests/gateway_persistence.rs
      - src/response_archive_spool/**
      - .github/workflows/conversation-objects.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-objects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Start isolated RustFS TEST fixture
        env:
          RUSTFS_ACCESS_KEY: rustfs-test-fixture
          RUSTFS_SECRET_KEY: synthetic-test-only-secret-707
        run: |
          docker run --detach --name rustfs-contract --publish 127.0.0.1:19000:9000 \
            --memory 1g --cpus 2 \
            --env RUSTFS_ACCESS_KEY --env RUSTFS_SECRET_KEY \
            --env RUSTFS_ADDRESS=:9000 --env RUSTFS_CONSOLE_ENABLE=false \
            --env RUSTFS_OBS_LOG_DIRECTORY= --env RUSTFS_OBS_LOGGER_LEVEL=warn \
            --entrypoint /usr/bin/rustfs \
            rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" \
              --request PUT http://127.0.0.1:19000/conversation-contract-test; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: cargo test --locked --lib archive::conversation
      - run: cargo test --locked --lib archive::session_projection -- --test-threads=1
      - run: cargo test --locked --lib conversation::return_stream_tests
      - run: cargo test --locked --lib archive::compressed_tests
      - run: cargo test --locked --lib archive::text
      - run: cargo test --locked --lib archive::supplier_summary
      - run: cargo test --locked --lib archive::raw_capture
      - run: cargo test --locked --lib db::object_bodies
      - run: cargo test --locked --lib buffered_archive_waits_off_frontend
      - run: cargo test --locked --lib object_capture_recovers_a_completed_request
      - name: Verify RustFS multipart CAS and restart restoration
        env:
          MTC_RUSTFS_TEST_ENDPOINT: http://127.0.0.1:19000
          MTC_RUSTFS_TEST_BUCKET: conversation-contract-test
          MTC_RUSTFS_TEST_ACCESS_KEY: rustfs-test-fixture
          MTC_RUSTFS_TEST_SECRET_KEY: synthetic-test-only-secret-707
        run: |
          cargo test --locked --lib rustfs_multipart_cas_promotion_and_restart_reconstruction -- --ignored
          docker restart rustfs-contract
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "$MTC_RUSTFS_TEST_ACCESS_KEY:$MTC_RUSTFS_TEST_SECRET_KEY" \
              http://127.0.0.1:19000/conversation-contract-test >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          MTC_RUSTFS_RESTORE_ONLY=1 cargo test --locked --lib rustfs_multipart_cas_promotion_and_restart_reconstruction -- --ignored
      - run: cargo test --locked --lib api::proxy::tests::archive_terminal
      - run: cargo test --locked --lib codex_retry_streaming_failure_is_redacted_and_records_failed_terminal
      - run: cargo test --locked --lib codex_failed_then_bare_secret_event_is_redacted_for_delivery_and_preserved_in_raw_archive
      - run: cargo test --locked --lib downstream_disconnect_records_unknown_without_waiting_for_stalled_upstream
      - run: cargo test --locked --lib completed_provider_usage_survives_a_later_downstream_disconnect
      - run: cargo test --locked --lib real_http2_downstream_reset_and_tcp_close_cancel_once_and_release_permits
      - run: cargo test --locked --lib native_tls_socks_h1_h2_stream_tool_cancel_and_compact_contract
      - run: cargo test --locked --lib native_codex_ambiguous_transport_after_request_bytes_is_not_replayed
      - run: cargo test --locked --lib api::proxy::tests::upstream_error_details
      - run: cargo test --locked --lib sqlite_semantic_payload_recovers_without_source_or_duplicate_finance
      - run: cargo test --locked --lib api::audio::tests
      - run: cargo test --locked --lib api::proxy::tests::kimi
      - run: cargo test --locked --lib saturated_request_archive_does_not_change_sse_or_exactly_once_settlement
      - name: RustFS fixture diagnostics
        if: always()
        run: |
          docker inspect rustfs-contract --format 'OOMKilled={{.State.OOMKilled}}'
          docker stats --no-stream rustfs-contract
          docker logs --tail 100 rustfs-contract
