name: compact-carrier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/json_source.rs
      - src/json_source/**
      - src/api/proxy/routing/compact_file.rs
      - src/api/proxy/routing/http.rs
      - .github/workflows/compact-carrier.yml

permissions:
  contents: read

concurrency:
  group: compact-carrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: JSON indexing contracts
        run: cargo test --locked --lib json_source
      - name: Typed scratch scope publication and cleanup contracts
        run: cargo test --locked --lib archive::scratch_scope
      - name: Compact translation, large bodies, unknown fields and cancellation
        run: cargo test --locked --lib api::proxy::routing::compact_file
      - name: Compact HTTP capture and replay contracts
        run: cargo test --locked --lib api::proxy::routing::http::tests::compact
      - name: Default HTTP TLS compact and cancellation contract
        run: cargo test --locked --lib native_tls_socks_h1_h2_stream_tool_cancel_and_compact_contract
