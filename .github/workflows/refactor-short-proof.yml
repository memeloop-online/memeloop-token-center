name: MTC explicit-pagination short reference
on:
  push:
    branches: [ci/mtc-refactor-proof-1041]
    paths: [.github/workflows/refactor-short-proof.yml]
permissions:
  contents: read
jobs:
  short-reference:
    name: explicit-pagination short (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            revision: 60e6b72b9747501e96e84e342913d806c75c1e52
          - variant: pr
            revision: 8e9617ec4bf7c61b606959d91a57556e3af20e54
    steps:
      - name: Initialize evidence
        env:
          REVISION: ${{ matrix.revision }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/mtc-short"
          printf 'revision_requested=%s\nvariant=%s\nrun_id=%s\nrun_attempt=%s\n' "$REVISION" "$VARIANT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/mtc-short/workflow.txt"
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'revision must be an exact lowercase 40-hex SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Verify checkout
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/mtc-short/checkout-status.txt"
          test ! -s "$RUNNER_TEMP/mtc-short/checkout-status.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/mtc-short/workflow.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Build release binary at tested revision
        timeout-minutes: 35
        env:
          MTC_BUILD_GIT_SHA: ${{ matrix.revision }}
        shell: bash
        run: |
          export MTC_BUILD_TIMESTAMP="$(git show -s --format=%cI HEAD)"
          export MTC_BUILD_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          rustc -Vv > "$RUNNER_TEMP/mtc-short/toolchain.txt"
          cargo -V >> "$RUNNER_TEMP/mtc-short/toolchain.txt"
          cargo build --locked --release --bin memeloop-token-center 2>&1 | tee "$RUNNER_TEMP/mtc-short/build.log"
          sha256sum target/release/memeloop-token-center > "$RUNNER_TEMP/mtc-short/binary.sha256"
      - name: Prepare identical explicit-page reference harness
        env:
          HARNESS_SHA: 60e6b72b9747501e96e84e342913d806c75c1e52
        run: |
          set -euo pipefail
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/explicit-page/tests/load" "$RUNNER_TEMP/mtc-short"
          # Verify against blob IDs extracted from the fixed harness commit. This also
          # works for a shallow checkout without persisted credentials or a git fetch.
          for spec in \
            benchmark-memory.ts:b1346af6b63f2dbc29e01eb986a9e301cfef9bcc \
            benchmark-stream-barrier.ts:76b6763d854ab36cbc12de22a3cc877c9fbaa6cf \
            benchmark-soak-diagnostics.ts:0cebd8e2050c17980b1ac47209afb44c43fa970a; do
            file="${spec%%:*}"
            blob="${spec#*:}"
            test "$(git rev-parse "HEAD:tests/load/$file")" = "$blob"
            git show "$blob" > "$RUNNER_TEMP/explicit-page/tests/load/$file"
            printf '%s  %s\n' "$blob" "$file"
          done > "$RUNNER_TEMP/mtc-short/harness-original.git-blobs"
          cat "$RUNNER_TEMP/mtc-short/harness-original.git-blobs"
          sha256sum "$RUNNER_TEMP/explicit-page/tests/load/"*.ts > "$RUNNER_TEMP/mtc-short/harness-original.sha256"
          cp "$RUNNER_TEMP/explicit-page/tests/load/benchmark-memory.ts" "$RUNNER_TEMP/mtc-short/benchmark-memory-original.ts"
          node <<'NODE'
          const fs = require('fs');
          const p = `${process.env.RUNNER_TEMP}/explicit-page/tests/load/benchmark-memory.ts`;
          let s = fs.readFileSync(p, 'utf8');
          for (const route of ['tenants','service-tokens','upstreams','model-routes']) {
            const before = `/internal/v1/${route}?limit=1000000`;
            const after = `/internal/v1/${route}?limit=100`;
            if (s.split(before).length !== 2 || s.includes(JSON.stringify(after))) throw Error(`unexpected fixture: ${route}`);
            s = s.replace(before, after);
          }
          fs.writeFileSync(p, s);
          NODE
          sha256sum "$RUNNER_TEMP/explicit-page/tests/load/"*.ts > "$RUNNER_TEMP/mtc-short/harness-explicit-page.sha256"
          diff -u "$RUNNER_TEMP/mtc-short/benchmark-memory-original.ts" "$RUNNER_TEMP/explicit-page/tests/load/benchmark-memory.ts" > "$RUNNER_TEMP/mtc-short/harness.patch" || test "$?" = 1
          printf 'reference=explicit-pagination-short\nharness_sha=%s\nproduct_sha=%s\n' "$HARNESS_SHA" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/mtc-short/reference.txt"
      - name: Run explicit-pagination short reference
        timeout-minutes: 15
        run: |
          set +e
          node "$RUNNER_TEMP/explicit-page/tests/load/benchmark-memory.ts" --profile short \
            --binary "$GITHUB_WORKSPACE/target/release/memeloop-token-center" \
            --output "$RUNNER_TEMP/mtc-short/result.json" > "$RUNNER_TEMP/mtc-short/harness.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/mtc-short/exit-code.txt"
          cat "$RUNNER_TEMP/mtc-short/harness.log"
          exit "$status"
      - name: Document evidence fields and gaps
        if: always()
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          node <<'NODE' > "$RUNNER_TEMP/mtc-short/interpretation.json"
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/mtc-short/result.json`;
          let r;
          try { r = JSON.parse(fs.readFileSync(path, 'utf8')); } catch { r = null; }
          const n = v => v ?? null;
          const output = {
            reference: "explicit-pagination-short",
            requested_revision: process.env.REVISION,
            result_available: !!r,
            binary_sha256: n(r?.binary_sha256),
            control_scale: n(r?.control_scale),
            passed: n(r?.passed), error: n(r?.error), topology: n(r?.runtime_topology),
            configuration: n(r?.configuration), system: n(r?.system),
            gateway_process_rss: n(r?.resource_budget), idle: n(r?.idle),
            stream: n(r?.stream), soak: n(r?.soak),
            evidence_notes: [
              'soak.successes and soak.failures are observed completed requests; soak.achieved_rps is successes divided by elapsed seconds, target_rps is only a target.',
              'stream.observed_peak_concurrency is mock upstream streams, not TCP connection count.',
              'connection counts, whole-cgroup RSS, production PostgreSQL/S3 behavior, and long-duration capacity are not measured; missing fields are null, not zero.',
              'Evidence uses the pinned base harness with four first-page limits changed from 1000000 to 100; this is not the unmodified short gate.',
              'short uses one gateway plus separate control and worker processes, loopback mock, isolated SQLite and filesystem archive; fixture creates 100000 rows per control resource.'
            ]
          };
          console.log(JSON.stringify(output, null, 2));
          NODE
      - name: Upload evidence including failure
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: explicit-pagination-short-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mtc-short/
          if-no-files-found: error
          retention-days: 30
