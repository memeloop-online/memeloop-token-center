name: semantic-viewer-dependencies
on:
  push:
    branches: [feat/semantic-react-viewer-20261114]
    paths: [web/package.json, web/src/SemanticConversationViewer.tsx, .github/workflows/semantic-viewer-dependencies.yml]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact UI source to verify
        required: true
        type: string
      contract:
        description: Bounded browser contract set
        required: true
        type: choice
        options: [viewer, account, network]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Generate dependency lock in GHA
        if: github.event_name != 'workflow_dispatch'
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: github.event_name != 'workflow_dispatch'
        with:
          name: semantic-viewer-package-lock
          path: web/package-lock.json
          retention-days: 3
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for bounded browser contracts
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Verify fixed proxy plaintext and current-read freshness contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fb3cd0c000127bb3fbb8aec43d662089add0aa39'
          git rev-parse HEAD
          MTC_REQUIRE_BROWSER=1 node --import tsx --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='^(create and rotate keep authorized values visible and editable across keyboard, mobile and schema variants|request read freshness advances only for successful current result reads)$' e2e/secret-credential-input-browser-contract.test.ts e2e/request-lifecycle-browser-contract.test.ts 2>&1 | tee /tmp/id43-80-browser.log
          grep -Fx '# pass 2' /tmp/id43-80-browser.log
          grep -Fx '# fail 0' /tmp/id43-80-browser.log
          grep -Fx '# skipped 0' /tmp/id43-80-browser.log
      - name: Retain actual browser evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: operator-ui-${{ inputs.contract }}-${{ inputs.source_revision }}
          path: |
            web/e2e-artifacts/
            /tmp/id43-80-browser.log
          retention-days: 7
          if-no-files-found: warn
