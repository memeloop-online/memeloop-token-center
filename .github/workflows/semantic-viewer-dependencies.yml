name: semantic-viewer-dependencies
on:
  push:
    branches: [feat/semantic-react-viewer-20261114]
    paths: [web/package.json, web/src/SemanticConversationViewer.tsx, .github/workflows/semantic-viewer-dependencies.yml]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact UI source to verify
        required: true
        type: string
      contract:
        description: Bounded browser contract set
        required: true
        type: choice
        options: [viewer, account]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Generate dependency lock in GHA
        if: github.event_name != 'workflow_dispatch'
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: github.event_name != 'workflow_dispatch'
        with:
          name: semantic-viewer-package-lock
          path: web/package-lock.json
          retention-days: 3
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for bounded browser contracts
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Verify semantic viewer pages, identity, export and existing session surfaces
        if: inputs.contract == 'viewer'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_revision }}"
          MTC_REQUIRE_BROWSER=1 node --import tsx --test --test-reporter=tap e2e/app-typography-browser-contract.test.ts 2>&1 | tee /tmp/typography-contract.log
          grep -Fx '# pass 1' /tmp/typography-contract.log
          grep -Fx '# fail 0' /tmp/typography-contract.log
          grep -Fx '# skipped 0' /tmp/typography-contract.log
      - name: Verify quota consent, unknown recovery and retained observations
        if: inputs.contract == 'account'
        run: MTC_REQUIRE_BROWSER=1 node --import tsx --test --test-concurrency=1 e2e/upstream-quota-browser-contract.test.ts e2e/quota-discovery-browser-contract.test.ts e2e/quota-reads-browser-contract.test.ts e2e/quota-semantics-browser-contract.test.ts
      - name: Retain actual browser evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: operator-ui-${{ inputs.contract }}-${{ inputs.source_revision }}
          path: web/e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
