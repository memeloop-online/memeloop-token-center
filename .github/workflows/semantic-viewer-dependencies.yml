name: semantic-viewer-dependencies
on:
  push:
    branches: [feat/semantic-react-viewer-20261114]
    paths: [web/package.json, web/src/SemanticConversationViewer.tsx, .github/workflows/semantic-viewer-dependencies.yml]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact UI source to verify
        required: true
        type: string
      contract:
        description: Bounded browser contract set
        required: true
        type: choice
        options: [viewer, account, network]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 31caf3aa305813587b88246dc77182315e06f4bb
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Generate dependency lock in GHA
        if: github.event_name != 'workflow_dispatch'
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: github.event_name != 'workflow_dispatch'
        with:
          name: semantic-viewer-package-lock
          path: web/package-lock.json
          retention-days: 3
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for bounded browser contracts
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Verify fixed ID52 authenticated reload and typed-filter contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '31caf3aa305813587b88246dc77182315e06f4bb'
          git rev-parse HEAD
          MTC_REQUIRE_BROWSER=1 node --import tsx --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='^(hard reload restores applied filters only after current login and tenant revalidation|Overview request actions open focused details and bucket drilldowns preserve the tenant-scoped filter)$' e2e/operator-overview-drilldown-browser-contract.test.ts 2>&1 | tee /tmp/id52-overview.log
          grep -Fx '# pass 2' /tmp/id52-overview.log
          grep -Fx '# fail 0' /tmp/id52-overview.log
          grep -E '^ok [0-9]+ - hard reload restores applied filters only after current login and tenant revalidation$' /tmp/id52-overview.log
          grep -E '^ok [0-9]+ - Overview request actions open focused details and bucket drilldowns preserve the tenant-scoped filter$' /tmp/id52-overview.log
          MTC_REQUIRE_BROWSER=1 node --import tsx --test --test-reporter=tap --test-concurrency=1 e2e/typed-filter-builder-contract.test.ts e2e/operator-entry-client-key-contract.test.ts e2e/operator-login-cycle-browser-contract.test.ts 2>&1 | tee /tmp/id52-contracts.log
          grep -Fx '# pass 20' /tmp/id52-contracts.log
          grep -Fx '# fail 0' /tmp/id52-contracts.log
          grep -Fx '# skipped 0' /tmp/id52-contracts.log
      - name: Retain actual browser evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: operator-ui-${{ inputs.contract }}-${{ inputs.source_revision }}
          path: |
            web/e2e-artifacts/
            /tmp/id52-*.log
          retention-days: 7
          if-no-files-found: warn
