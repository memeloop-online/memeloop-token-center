name: manual-release
# Explicit operational exception: this publishes without waiting for archive
# pressure acceptance. Normal CI remains unchanged and still reports failures.
on:
  workflow_dispatch:
    inputs:
      accept_archive_risk:
        description: 'Publish despite unresolved archive pressure failures'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release-master
  cancel-in-progress: false

jobs:
  build-release-input:
    if: github.ref == 'refs/heads/master' && inputs.accept_archive_risk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Resolve release version metadata from Cargo
        id: release
        run: node scripts/ci/resolve-release-metadata.ts "$GITHUB_REF" "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build, runtime-smoke, and export the one manual-release input
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: release-input-export
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/release-service-input
          build-args: |
            MTC_BUILD_GIT_SHA_INPUT=${{ github.sha }}
            MTC_BUILD_TIMESTAMP_INPUT=manual-archive-waiver
            MTC_BUILD_TARGET_INPUT=linux/amd64
          cache-from: type=gha,scope=service-release-input
          cache-to: type=gha,mode=max,scope=service-release-input
      - name: Seal the manual release artifact
        run: |
          node scripts/ci/create-memory-binary-manifest.ts \
            "$RUNNER_TEMP/release-service-input/memeloop-token-center" \
            "$GITHUB_SHA" \
            "$RUNNER_TEMP/release-artifact"
          for file in libgcc_s.so.1 libstdc++.so.6 install-plugin-oci cosign LICENSE THIRD_PARTY_NOTICES.md; do
            cp "$RUNNER_TEMP/release-service-input/$file" "$RUNNER_TEMP/release-artifact/$file"
          done
          cp -R "$RUNNER_TEMP/release-service-input/web" "$RUNNER_TEMP/release-artifact/web"
          cp -R "$RUNNER_TEMP/release-service-input/third-party-licenses" "$RUNNER_TEMP/release-artifact/third-party-licenses"
          chmod 0555 "$RUNNER_TEMP/release-artifact/install-plugin-oci" "$RUNNER_TEMP/release-artifact/cosign"
          node scripts/ci/create-release-service-input-manifest.ts "$RUNNER_TEMP/release-artifact" "$GITHUB_SHA"
          chmod 0644 "$RUNNER_TEMP/release-artifact/memeloop-token-center"
      - name: Upload the one exact-revision manual release artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: manual-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 1
    outputs:
      version: ${{ steps.release.outputs.version }}

  publish-ghcr:
    if: github.ref == 'refs/heads/master' && inputs.accept_archive_risk
    needs: [build-release-input]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center
            dockerfile: Dockerfile.release
            cache_scope: service
          - image: ghcr.io/${{ github.repository_owner }}/memeloop-token-center-plugin-installer
            dockerfile: Dockerfile.plugin-installer.release
            cache_scope: plugin-installer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Download the one same-run manual release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manual-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/release-service-input
      - name: Verify the exact manual release input
        run: node scripts/ci/verify-release-service-input.ts "$RUNNER_TEMP/release-service-input" "$GITHUB_SHA"
      - name: Validate shared immutable release inputs
        env:
          RELEASE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: node scripts/ci/validate-release-inputs.ts "$RELEASE_REGISTRY" "$GITHUB_SHA" prefixed
      - name: Install checksum-pinned crane registry client
        run: |
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          destination="$RUNNER_TEMP/crane-bin"
          curl --fail --location --retry 3 \
            https://github.com/google/go-containerregistry/releases/download/v0.21.9/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$archive"
          echo '5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e  '"$archive" | sha256sum --check
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination" crane
          echo "$destination" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true,oci-artifact=true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-release-input.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          build-contexts: |
            release-input=${{ runner.temp }}/release-service-input
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true
      - name: Start the exact published service image
        if: matrix.cache_scope == 'service'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --entrypoint /usr/local/bin/memeloop-token-center
          "$IMAGE@$DIGEST" --help
      - name: Scan the exact published digest for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
          timeout: 15m0s
      - name: Verify immutable tag, OCI labels, SBOM, provenance, and image evidence
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CACHE_SCOPE: ${{ matrix.cache_scope }}
        run: node scripts/ci/verify-published-image.ts "$IMAGE" "$DIGEST" "$CACHE_SCOPE" "$RUNNER_TEMP"
      - name: Upload immutable image digest manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: image-digest-${{ matrix.cache_scope }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.cache_scope }}-image-digest.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-image.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-index.json
            ${{ runner.temp }}/${{ matrix.cache_scope }}-attestations/
          if-no-files-found: error
          retention-days: 30

  verify-ghcr-release:
    if: github.ref == 'refs/heads/master' && inputs.accept_archive_risk
    needs: [publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the complete release set by immutable digest
        run: node scripts/ci/verify-ghcr-release.ts "$RUNNER_TEMP/release-evidence" "$RUNNER_TEMP/release-manifest.json"
      - name: Upload the complete immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 90
