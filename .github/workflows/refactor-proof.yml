name: MTC targeted equivalence evidence
on:
  push:
    branches: [ci/mtc-refactor-proof-1041]
    paths: [.github/workflows/refactor-proof.yml]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6b3f43efcdcf0f5302e55dc4ec53478522694697
          persist-credentials: false
      - name: Verify exact product revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Product checkout: $actual_sha"
          test "$actual_sha" = "6b3f43efcdcf0f5302e55dc4ec53478522694697"
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify selected contracts run rather than silently matching zero tests
        shell: bash
        run: |
          set -uo pipefail
          select_contract() {
            local target="$1" pattern="$2" expected="$3" log actual
            shift 3
            log=$(mktemp)
            local harness_args=(--nocapture)
            if [[ "$target" == ignored-pg ]]; then harness_args+=(--ignored); fi
            local deadline=240s
            if [[ "$target" != master* && "$target" != ignored-pg ]]; then deadline=1200s; fi
            if timeout --kill-after=15s "$deadline" cargo test --locked --all-features "$@" "$pattern" -- "${harness_args[@]}" >"$log" 2>&1; then
              actual=$(sed -nE 's/^test result: ok\. ([0-9]+) passed;.*/\1/p' "$log")
            else
              actual=failed
            fi
            echo "$target $pattern: expected $expected, actual ${actual:-missing}"
            if [[ "$actual" == "$expected" ]]; then
              grep -E '^test .* \.\.\. ok$|^test result:' "$log"
            else
              tail -60 "$log"
              echo "::error::$target: missing or failing $pattern"
              failed=1
            fi
          }
          failed=0
          for pattern in connection_limits_reject_invalid_values per_ip_connection_limit_releases_on_drop owned_conversation_capture_moves_json_and_preserves_wire_shape plaintext_preparation_preserves_collaboration_tool_envelopes native_parent_preserves_reserved_collaboration_schema_and_native_history reconciliation_key_is_single_bounded_visible_ascii_and_domain_separated tenant_window_returns_every_current_account postgres_tenant_window_decodes_account_metrics native_image_parameter_validation_does_not_restrict_openai_forwarding cancelling_after_image_send_keeps_owner_and_durable_no_replay_fence; do
            select_contract library "$pattern" 1 --lib
          done
          select_contract library native_http_aliases_keep_the_codex_responses_envelope 1 --lib
          select_contract library db::request_history::history_read_tests 2 --lib
          select_contract binary server_shutdown_joins_proxy_drain_before_stopping_worker 1 --bin memeloop-token-center
          select_contract picker sqlite_projection_preserves_identity_aggregation_and_evidence 1 --test model_picker_projection
          select_contract picker postgres_projection_matches_sqlite_contract 1 --test model_picker_projection
          select_contract master-archive pending_archive_admission_never_blocks_original_chunks_or_empty_eof 1 --lib
          select_contract master-archive upstream_response::tests::archive_tap 1 --lib
          select_contract master-archive failed_capture_fact_is_retried_after_object_storage_recovers 1 --lib
          select_contract master-facts terminal_projection::fact_read 2 --lib
          select_contract master-backfill request_history::event_backfill_tests::sqlite_ 2 --lib
          select_contract ignored-pg request_history_real_services_acceptance_event_backfill_time_cursor 1 --lib
          select_contract image native_catalog_uses_google_wire_protocol 1 --lib
          select_contract image antigravity_image_uses_shared_submission_without_retained_replay 1 --lib
          select_contract image completed_image_replay_is_unretained_before_route_lookup 1 --lib
          select_contract image explicit_image_auth_rejection_settles_zero_and_never_replays 1 --lib
          select_contract image filesystem_image_request_keeps_metadata_only_and_never_resubmits_replay 1 --lib
          select_contract image manual_image_resolution_is_atomic_replay_safe_and_fences_late_completion 1 --lib
          select_contract image image_resolution_and_receipt_replay_require_active_tenant_and_valid_exact_scope 1 --lib
          select_contract image concurrent_image_resolution_has_one_receipt_and_one_charge 1 --lib
          select_contract oauth oauth::managed::kimi::tests::refresh_keeps_device_and_rotates_only_returned_fields 1 --lib
          select_contract oauth oauth::managed::kimi::tests::refresh_slow_body_is_durably_installed_once_without_another_post 1 --lib
          select_contract oauth oauth::managed::kimi::tests::refresh_connector_failures_keep_one_operation_fenced_through_three_attempts 1 --lib
          select_contract oauth oauth::copilot::tests::device_poll_maps_pending_slow_down_denied_and_expired 1 --lib
          select_contract oauth oauth::copilot::tests::refresh_is_one_exchange_and_preserves_raw_github_token 1 --lib
          select_contract oauth oauth::copilot::tests::refresh_marks_only_the_long_lived_github_token_exchange 1 --lib
          select_contract legacy archive::conversation::tests:: 4 --lib
          select_contract archive complete_coverage_retires_exact_roots_and_rejects_stale_backend_versions 1 --lib
          select_contract archive retirement_fence_hides_late_root_and_rejects_republication_without_deleting_cas 1 --lib
          select_contract archive relocated_raw_root_replays_and_binds_published_body_without_retired_copy 1 --lib
          select_contract aggregation sqlite_generation_aggregate_migration_backfills_once 1 --lib
          select_contract media api::media_body::tests::collect_bounded_distinguishes_limit_and_transport 1 --lib
          select_contract audio upstream_body_reader_waits_for_audio_after_ten_minutes 1 --lib
          select_contract audio transcription_routes_bills_measured_wav_seconds_and_archives_full_original_bodies 1 --lib
          select_contract audio client_cancellation_does_not_abandon_the_admitted_audio_lifecycle 1 --lib
          select_contract worker worker::tests::oauth_worker_ 2 --lib
          select_contract worker projection_tick_drains_metered_usage_and_records_a_fixed_metric 1 --lib
          exit "$failed"
      - name: Check all targets and features without emitting test binaries
        if: always()
        timeout-minutes: 30
        run: cargo check --locked --all-targets --all-features
