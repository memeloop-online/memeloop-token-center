name: exact-reader-contract
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Optional exact source commit to test
        required: false
        type: string
      contract:
        required: true
        type: choice
        options:
          - metadata-refresh
          - request-carrier-958
          - response-carrier-968
          - orphan-reaper-971
          - semantic-reader-scope
          - pg-executor-959
          - session-response-956
          - semantic-partial-954
          - upstream-error-779
          - semantic-mapping-948
          - bfa-reader
          - e2db-raw
          - staging-155
          - next-release
          - admission-cancel
          - quota-outage
          - conversation-812
          - history-writer-984
          - history-capture-981
          - release-927-928
permissions:
  contents: read
jobs:
  metadata-refresh-contract:
    if: inputs.contract == 'metadata-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify only the reviewed archive observation and original archive contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4a83574db5c48fcb86b07936d67d0f52db7d8d98"
          git rev-parse HEAD
          cargo check --locked --lib
          cargo test --locked --lib archive::write_observation::tests::archive_write_observations_keep_routes_outcomes_and_lengths_distinct -- --exact --nocapture 2>&1 | tee /tmp/archive-observation.log
          grep -F '1 passed; 0 failed' /tmp/archive-observation.log
          cargo test --locked --lib archive::write_observation::tests::archive_write_observations_count_encoded_multipart_not_decoded_copy_bytes -- --exact --nocapture 2>&1 | tee /tmp/archive-observation.log
          grep -F '1 passed; 0 failed' /tmp/archive-observation.log
          cargo test --locked --lib archive::tests:: -- --nocapture 2>&1 | tee /tmp/archive-regression.log
          grep -F '16 passed; 0 failed' /tmp/archive-regression.log

  orphan-reaper-contract:
    if: inputs.contract == 'orphan-reaper-971'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: token_center_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/token_center_test
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify SQLite and PostgreSQL orphan scan fairness
        run: |
          set -o pipefail
          test -n "$MTC_TEST_POSTGRES_URL"
          cargo test --locked --lib --no-run
          for selector in \
            db::requests::settlement::orphan_scan_tests::sqlite_orphan_scan_advances_past_ineligible_rows_and_revisits_late_eligibility \
            db::requests::settlement::orphan_scan_tests::postgres_orphan_scan_advances_past_ineligible_rows_and_revisits_late_eligibility
          do
            echo "Contract: $selector"
            timeout 180s cargo test --locked --lib "$selector" -- --exact 2>&1 | tee /tmp/orphan-reaper-contract.log
            grep -F '1 passed; 0 failed' /tmp/orphan-reaper-contract.log
          done
  response-carrier-contract:
    if: inputs.contract == 'response-carrier-968'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify response carrier ownership and archive behavior
        run: |
          set -o pipefail
          cargo test --locked --lib --no-run
          for selector in \
            error::tests::object_storage_classification_preserves_only_typed_safe_facts \
            error::tests::dependency_errors_do_not_retain_secret_bearing_driver_messages \
            response_archive_spool::tests::shared_capture_reaches_eof_while_all_upload_slots_are_held \
            response_archive_spool::tests::unavailable_local_directory_does_not_gate_complete_original \
            response_archive_spool::tests::cancelled_unsealed_carrier_releases_owned_capture_without_acknowledging_original \
            response_archive_spool::tests::empty_shared_carrier_publishes_the_exact_empty_original \
            response_archive_spool::tests::original_stream_capture_uses_selected_backend_without_legacy_body_copy \
            api::proxy::tests::persistence_isolation::pending_response_archive_begin_does_not_hold_first_byte_or_eof \
            api::proxy::tests::sse_delivery::large_source_backed_conversation_stream_releases_raw_bytes_before_terminal_projection
          do
            echo "Contract: $selector"
            timeout 180s cargo test --locked --lib "$selector" -- --exact 2>&1 | tee /tmp/response-carrier-contract.log
            grep -F '1 passed; 0 failed' /tmp/response-carrier-contract.log
          done
  reader-contract:
    if: inputs.contract == 'bfa-reader'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision || 'bfa6b1b794ff09197a2b2d2ade496d931b98c285' }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify qualified HEAD routing and stream detail
        run: |
          set -o pipefail
          cargo test --locked --lib archive::routing_tests::qualified_cas_reads_preserve_backend_tenant_and_stream_integrity -- --exact 2>&1 | tee /tmp/head-test.log
          grep -F '1 passed; 0 failed' /tmp/head-test.log
          cargo test --locked --lib readable_stream_archives_are_not_reported_as_missing_or_invalid 2>&1 | tee /tmp/detail-test.log
          grep -F '1 passed; 0 failed' /tmp/detail-test.log
  raw-publish-contract:
    if: inputs.contract == 'e2db-raw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision || 'e2db112d7b31e54e9c8ab5b312b9150a255d4c21' }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify relocated raw publication and binding
        run: |
          set -o pipefail
          cargo test --locked --lib relocated_raw_root_replays_and_binds_published_body_without_retired_copy 2>&1 | tee /tmp/raw-publish-test.log
          grep -F '1 passed; 0 failed' /tmp/raw-publish-test.log
  staging-contract:
    if: inputs.contract == 'staging-155'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Start isolated RustFS fixture
        env:
          RUSTFS_ACCESS_KEY: rustfs-test-fixture
          RUSTFS_SECRET_KEY: synthetic-test-only-secret-707
        run: |
          docker run --detach --name rustfs-contract --publish 127.0.0.1:19000:9000 \
            --memory 1g --cpus 2 --env RUSTFS_ACCESS_KEY --env RUSTFS_SECRET_KEY \
            --env RUSTFS_ADDRESS=:9000 --env RUSTFS_CONSOLE_ENABLE=false \
            --env RUSTFS_OBS_LOG_DIRECTORY= --env RUSTFS_OBS_LOGGER_LEVEL=warn \
            --entrypoint /usr/bin/rustfs \
            rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" \
              --request PUT http://127.0.0.1:19000/conversation-contract-test; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify reviewed request singleflight and original resource contracts
        env:
          MTC_RUSTFS_TEST_ENDPOINT: http://127.0.0.1:19000
          MTC_RUSTFS_TEST_BUCKET: conversation-contract-test
          MTC_RUSTFS_TEST_ACCESS_KEY: rustfs-test-fixture
          MTC_RUSTFS_TEST_SECRET_KEY: synthetic-test-only-secret-707
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f1f925998f93ae5e2a1ac4dd4d4ab35c38fb82d1"
          git rev-parse HEAD
          mkdir -p /tmp/request-singleflight-evidence
          cargo test --locked --lib gateway_body::carrier::resource_wakeup_tests::first_request_segment_waits_for_retained_credit_despite_free_global_ram -- --exact --nocapture 2>&1 | tee /tmp/request-singleflight-evidence/contract-1.log
          grep -F '1 passed; 0 failed' /tmp/request-singleflight-evidence/contract-1.log
          cargo test --locked --lib gateway_body::carrier::resource_wakeup_tests::request_capture_eof_does_not_join_owned_put_when_retained_credit_wakes -- --ignored --exact --nocapture 2>&1 | tee /tmp/request-singleflight-evidence/contract-2.log
          grep -F '1 passed; 0 failed' /tmp/request-singleflight-evidence/contract-2.log
          cargo test --locked --lib gateway_body::carrier::resource_wakeup_tests::actual_put_is_not_cancelled_when_ram_wakes_and_lost_ack_keeps_source -- --ignored --exact --nocapture 2>&1 | tee /tmp/request-singleflight-evidence/contract-3.log
          grep -F '1 passed; 0 failed' /tmp/request-singleflight-evidence/contract-3.log
          cargo test --locked --lib gateway_body::carrier::resource_wakeup_tests::credited_long_response_preserves_opportunistic_spill_above_source_capacity -- --ignored --exact --nocapture 2>&1 | tee /tmp/request-singleflight-evidence/contract-4.log
          grep -F '1 passed; 0 failed' /tmp/request-singleflight-evidence/contract-4.log
          cargo test --locked --lib gateway_body::carrier::resource_wakeup_tests::request_without_archive_preserves_capture_above_retained_window -- --exact --nocapture 2>&1 | tee /tmp/request-singleflight-evidence/contract-5.log
          grep -F '1 passed; 0 failed' /tmp/request-singleflight-evidence/contract-5.log
      - name: Retain request singleflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: request-singleflight-f1f925
          path: /tmp/request-singleflight-evidence/
          if-no-files-found: warn
          retention-days: 7

  next-release-contract:
    if: inputs.contract == 'next-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Run exact release contracts
        run: |
          set -o pipefail
          run_exact() {
            cargo test --locked --all-features --lib "$1" -- --exact 2>&1 | tee /tmp/exact-contract.log
            grep -F '1 passed; 0 failed' /tmp/exact-contract.log
          }
          run_exact http_settings::factory::tcp_policy_tests::actual_clients_inherit_os_tcp_recovery_and_cancel_unsent_responses
          run_exact http_settings::factory::tcp_policy_tests::explicit_600_second_request_deadline_survives_old_tcp_window_and_still_expires
          run_exact db::requests::conversations::archive_readiness_tests::sqlite_declared_identity_is_readable_while_body_is_pending
          run_exact db::requests::conversations::archive_readiness_tests::postgres_declared_identity_is_readable_while_body_is_pending
          run_exact api::proxy::persistence::tests::buffered_archive_waits_off_frontend_and_retries_without_losing_original_bytes
          run_exact api::proxy::routing::component_workspace_tests::component_materialization_retains_only_the_dispatched_prepared_body
          cargo test --locked --all-features --test request_history_cli -- --nocapture 2>&1 | tee /tmp/history-cli.log
          grep -F '1 passed; 0 failed' /tmp/history-cli.log
          cargo test --locked --all-features --lib db::request_history::tests::request_history_real_services_acceptance_start_nowait_rolls_back_partial_locks -- --ignored --exact --nocapture 2>&1 | tee /tmp/history-pg.log
          grep -F '1 passed; 0 failed' /tmp/history-pg.log
          test -n "$MTC_TEST_POSTGRES_URL"
          run_exact gateway_body::request_spool::archive_source_tests::sqlite_qualified_source_receipt_reopens_with_training_cleanup_identity
          run_exact gateway_body::request_spool::archive_source_tests::postgres_qualified_source_receipt_reopens_with_training_cleanup_identity
          run_exact api::proxy::routing::http::inference_lifetime_tests::inference_legacy_600_seconds_never_limits_headers_or_buffered_body
          run_exact api::proxy::routing::http::inference_lifetime_tests::inference_stream_has_no_absolute_or_inherited_idle_600_second_window
          run_exact api::proxy::routing::http::inference_lifetime_tests::inference_caller_cancellation_closes_headers_and_body_sockets_without_replay
          run_exact api::proxy::routing::http::inference_lifetime_tests::inference_real_truncated_body_is_still_an_error_and_never_replayed
          run_exact http_settings::factory::inference_policy_tests::inference_total_deadline_policy_is_cache_isolated_from_control_requests
          run_exact http_settings::factory::inference_policy_tests::inference_preserves_an_explicit_read_inactivity_policy
  admission-quota-contract:
    if: inputs.contract == 'admission-cancel' || inputs.contract == 'quota-outage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify admission cancellation
        if: inputs.contract == 'admission-cancel'
        run: |
          set -o pipefail
          cargo test --locked --lib api::proxy::tests::early_terminal::authenticated_body_admission_failure_has_no_supplier_or_reservation -- --exact 2>&1 | tee /tmp/admission-contract.log
          grep -F '1 passed; 0 failed' /tmp/admission-contract.log
          cargo test --locked --lib db::request_pool::tests::cancelled_executor_wait_sends_no_sql_and_closed_pool_is_not_retried -- --exact 2>&1 | tee /tmp/cancel-contract.log
          grep -F '1 passed; 0 failed' /tmp/cancel-contract.log
      - name: Verify quota outage recovery
        if: inputs.contract == 'quota-outage'
        run: |
          set -o pipefail
          cargo test --locked --lib upstream_quota::reset::tests::accepted_receipt_survives_database_outage_without_supplier_replay -- --exact 2>&1 | tee /tmp/quota-contract.log
          grep -F '1 passed; 0 failed' /tmp/quota-contract.log
  conversation-812-contract:
    if: inputs.contract == 'conversation-812'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Verify both exact conversation contracts
        run: |
          set -o pipefail
          git rev-parse HEAD
          cargo test --locked --lib api::operator_inference::tests::control_responses_preserves_image_generation_and_archives_the_conversation -- --exact 2>&1 | tee /tmp/contract-812-a.log
          grep -F '1 passed; 0 failed' /tmp/contract-812-a.log
          cargo test --locked --lib api::operator_inference::tests::control_responses_streams_image_events_and_archives_usage_and_conversation -- --exact 2>&1 | tee /tmp/contract-812-b.log
          grep -F '1 passed; 0 failed' /tmp/contract-812-b.log
  history-writer-984-contract:
    if: inputs.contract == 'history-writer-984'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Verify exact release contracts
        run: |
          set -o pipefail
          git rev-parse HEAD
          cargo test --locked --all-features --lib db::tests::terminal_projection::postgres_terminal_writer_does_not_capture_sibling_events -- --ignored --exact --nocapture 2>&1 | tee /tmp/history-writer.log
          grep -F '1 passed; 0 failed' /tmp/history-writer.log

  history-capture-981-contract:
    if: inputs.contract == 'history-capture-981'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-plugin-examples
