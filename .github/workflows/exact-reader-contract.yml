name: exact-reader-contract
on:
  workflow_dispatch:
    inputs:
      source_revision:
        required: true
        type: string
      contract:
        required: true
        type: choice
        options: [metadata-refresh]
permissions:
  contents: read
jobs:
  migration-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master2725
            source: 2725daf4a4c61033affdfe3e2c2cf36755401f6e
          - label: joint58f
            source: 58f8288be9d57591611d28200978935bbee1e3c1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install PostgreSQL and SQLite clients for migration acceptance
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Limit this invocation, not the runner's global APT configuration.
          # Missing official sources fail closed; signature/hash checks stay on.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 update
          sudo apt-get "${apt_sources[@]}" -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 \
            install --yes --no-install-recommends postgresql-client sqlite3
      - name: SQLite and PostgreSQL migration and replay smoke test
        env:
          MTC_KEY_PEPPER: ci-key-pepper-with-more-than-thirty-two-bytes
          MTC_SERVICE_TOKEN: ci-bootstrap-token-not-for-production
          MTC_ARCHIVE_BACKEND: filesystem
          MTC_ARCHIVE_PATH: /tmp/mtc-migration-smoke-archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.source }}"
          git rev-parse HEAD
          exec > >(tee "$RUNNER_TEMP/migration-${{ matrix.label }}.log") 2>&1
          for backend in sqlite postgres; do
            if [ "$backend" = sqlite ]; then
              database="$RUNNER_TEMP/migration-smoke.sqlite"
              export MTC_DATABASE_URL="sqlite://$database?mode=rwc"
              sql() { sqlite3 -batch -bail "$database" "$1"; }
            else
              export MTC_DATABASE_URL="postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test"
              sql() { psql -X -v ON_ERROR_STOP=1 -qAt "$MTC_DATABASE_URL" -c "$1"; }
            fi

            expected_versions="$(find migrations/common "migrations/$backend" -maxdepth 1 -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' |
              awk -F_ '{print $1 + 0}' | sort -nu)"
            test -n "$expected_versions"
            check_migration_ledger() {
              # v142 is a Rust data conversion recorded by the migrate CLI
              # separately from the SQL migrations; require both.
              diff -u --label "$backend expected SQL versions" --label "$backend applied SQL versions" \
                <(printf '%s\n' "$expected_versions") \
                <(sql 'SELECT version FROM schema_migrations WHERE version <> 142 ORDER BY version')
              test "$(sql 'SELECT name FROM schema_migrations WHERE version = 142')" = 'plaintext state instead of sealed envelopes'
            }
            cargo run --locked --bin memeloop-token-center -- migrate
            check_migration_ledger

            # Restore the schema-159 activation fixture by undoing all known later
            # changes, on an empty smoke database. Keep the boundary fixed so the
            # upgrade still exercises history activation as migrations advance.
            sql 'BEGIN;
              DROP TABLE upstream_oauth_rejected_generations;
              ALTER TABLE request_history_baseline_runs DROP COLUMN read_model_version;
              ALTER TABLE request_history_baseline_runs DROP COLUMN activation_epoch;
              ALTER TABLE request_history_baseline_runs DROP COLUMN chunk_count;
              ALTER TABLE request_history_baseline_runs DROP COLUMN manifest_hash;
              ALTER TABLE request_history_baseline_runs DROP COLUMN sources_complete;
              ALTER TABLE request_history_baseline_runs DROP COLUMN parity_json;
              ALTER TABLE request_history_baseline_runs DROP COLUMN target_identity;
              DROP INDEX request_records_started_pending;
              ALTER TABLE request_records DROP COLUMN started_event_pending;
              ALTER TABLE request_history_backfill DROP COLUMN after_created_at;
              ALTER TABLE request_history_backfill DROP COLUMN legacy_after_id;
              DROP INDEX request_records_orphan_settled_candidates;
              ALTER TABLE upstream_supplier_availability DROP COLUMN capacity_scope;
              ALTER TABLE upstream_quota_observations DROP COLUMN observed_at;
              ALTER TABLE upstream_quota_observations DROP COLUMN started_at;
              DROP TABLE request_history_activation;
              DELETE FROM schema_migrations WHERE version > 159;
              COMMIT;'
            test "$(sql 'SELECT max(version) FROM schema_migrations')" = 159
            sql "INSERT INTO request_history_baseline_runs
              (owner,epoch,ceiling,source_snapshot,status,created_at,updated_at)
              VALUES ('ci-schema-159',7,19,'ci-snapshot','source_complete',1,2)"

            cargo run --locked --bin memeloop-token-center -- migrate
            check_migration_ledger
            test "$(sql "SELECT count(*) FROM request_history_activation WHERE id=1 AND epoch=0 AND phase='legacy' AND transactions_json IS NULL AND baseline_owner IS NULL AND baseline_epoch IS NULL")" = 1
            test "$(sql "SELECT ceiling FROM request_history_baseline_runs
              WHERE owner = 'ci-schema-159' AND epoch = 7 AND status = 'source_complete'
                AND read_model_version IS NULL AND activation_epoch IS NULL")" = 19
            sql "UPDATE request_history_activation SET epoch=7, phase='observing', transactions_json='{}', baseline_owner='migration-smoke', baseline_epoch=7 WHERE id=1"
            ledger="$(sql "SELECT version || ':' || name || ':' || applied_at FROM schema_migrations ORDER BY version")"
            cargo run --locked --bin memeloop-token-center -- migrate
            test "$(sql "SELECT version || ':' || name || ':' || applied_at FROM schema_migrations ORDER BY version")" = "$ledger"
            test "$(sql "SELECT count(*) FROM request_history_activation WHERE id=1 AND epoch=7 AND phase='observing' AND transactions_json='{}' AND baseline_owner='migration-smoke' AND baseline_epoch=7")" = 1
          done
      - name: Seed 100k-row observability scale fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: memeloop_token_center_test
          PGUSER: token_center
          PGPASSWORD: token_center
        run: psql -X --no-psqlrc -v ON_ERROR_STOP=1 -f tests/load/seed_postgres_observability.sql
      - name: Enforce PostgreSQL observability plans and latency
        env:
          MTC_BENCH_DATABASE_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
        run: |
          node tests/load/postgres_explain.ts \
            --output /tmp/postgres-explain-${{ matrix.source }}.json
      - name: Retain PostgreSQL scale-plan evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: postgres-explain-${{ matrix.source }}
          path: /tmp/postgres-explain-${{ matrix.source }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain exact migration and replay log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration166-${{ matrix.label }}-${{ matrix.source }}
          path: ${{ runner.temp }}/migration-${{ matrix.label }}.log
          if-no-files-found: warn
          retention-days: 7
