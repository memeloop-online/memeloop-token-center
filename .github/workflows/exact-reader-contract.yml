name: exact-reader-contract
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Optional exact source commit to test
        required: false
        type: string
      contract:
        required: true
        type: choice
        options:
          - metadata-refresh
          - request-carrier-958
          - response-carrier-968
          - orphan-reaper-971
          - semantic-reader-scope
          - pg-executor-959
          - session-response-956
          - semantic-partial-954
          - upstream-error-779
          - semantic-mapping-948
          - bfa-reader
          - e2db-raw
          - staging-155
          - next-release
          - admission-cancel
          - quota-outage
          - conversation-812
          - history-writer-984
          - history-capture-981
          - release-927-928
permissions:
  contents: read
jobs:
  metadata-refresh-contract:
    if: inputs.contract == 'metadata-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: 6024a07fa3f37cf0c2e025bccb2012fc2ad5568b
      BASE_RUNTIME_SHA: 58f8288be9d57591611d28200978935bbee1e3c1
      ARTIFACT_ID: "15172646870"
      SOURCE_RUN_ID: "45940213018"
      ARTIFACT_DIGEST: 2edc4a022cd90b5f750d033ad88c933e7238ee47da276163c238d05d2cf5ddd8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6024a07fa3f37cf0c2e025bccb2012fc2ad5568b
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Verify fixed Stage-only source
        id: source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Derive only the explicit reviewed diagnostic feature build recipe
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          source=pathlib.Path('Dockerfile').read_bytes()
          old=b'experimental-plugin-revisions,plugin-distribution'
          if source.count(old)!=2:raise SystemExit('unexpected original release feature recipe')
          derived=source.replace(old,old+b',history-initialization-diagnostic')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'Dockerfile.maintenance').write_bytes(derived)
          (root/'maintenance-build.json').write_text(json.dumps({'source':os.environ['CANDIDATE_SHA'],'purpose':'diagnostic-maintenance-only','feature':'history-initialization-diagnostic','default_feature':False,'original_recipe_sha256':hashlib.sha256(source).hexdigest(),'derived_recipe_sha256':hashlib.sha256(derived).hexdigest(),'mutation':'append one diagnostic feature to both original cargo release commands'},indent=2)+'\n')
          PYCODE
      - name: Retrieve and verify only the exact sealed maintenance input
        env:
          EXPECTED_SOURCE: ${{ inputs.source_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/sealed-package"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249943725" > "$RUNNER_TEMP/sealed-package/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249943725/zip" > "$RUNNER_TEMP/sealed-package/input.zip"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,stat,tarfile,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); package=root/'sealed-package'
          meta=json.loads((package/'artifact.json').read_text())
          expected='f2e4fe048e75b6052133ec969dbdfbecc021ef2cddd886c6b44af99401c00190'
          if meta['id']!=15249943725 or meta['workflow_run']['id']!=46111492726 or meta['expired'] or meta['digest']!='sha256:'+expected:raise SystemExit('sealed artifact metadata mismatch')
          h=hashlib.sha256()
          with (package/'input.zip').open('rb') as f:
              for data in iter(lambda:f.read(1024*1024),b''):h.update(data)
          if h.hexdigest()!=expected:raise SystemExit('sealed artifact ZIP digest mismatch')
          with zipfile.ZipFile(package/'input.zip') as z:
              for item in z.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(item.external_attr>>16):raise SystemExit('unsafe sealed ZIP entry')
              z.extractall(package/'verified')
          base=package/'verified'
          if (base/'source.txt').read_text().strip()!=os.environ['CANDIDATE_SHA']:raise SystemExit('sealed source mismatch')
          checksum=(base/'SHA256SUMS').read_text().split()
          if len(checksum)!=2 or checksum[1]!='sealed-input.tar':raise SystemExit('unexpected sealed checksum entry')
          h=hashlib.sha256()
          with (base/'sealed-input.tar').open('rb') as f:
              for data in iter(lambda:f.read(1024*1024),b''):h.update(data)
          if h.hexdigest()!=checksum[0]:raise SystemExit('sealed tar checksum mismatch')
          target=root/'sealed-input';target.mkdir()
          with tarfile.open(base/'sealed-input.tar') as tar:
              for item in tar.getmembers():
                  path=pathlib.PurePosixPath(item.name)
                  if path.is_absolute() or '..' in path.parts or not (item.isfile() or item.isdir()):raise SystemExit('unsafe sealed tar entry')
              tar.extractall(target,filter='data')
          manifest=json.loads((target/'release-service-input.json').read_text())
          if manifest['schema_version']!=2 or manifest['revision']!=os.environ['CANDIDATE_SHA'] or manifest['platform']!='linux/amd64':raise SystemExit('sealed manifest identity mismatch')
          actual={str(x.relative_to(target)) for x in target.rglob('*') if x.is_file() and x.name!='release-service-input.json'}
          if actual!=set(manifest['files']):raise SystemExit('sealed complete file set mismatch')
          for name,digest in manifest['files'].items():
              if hashlib.sha256((target/name).read_bytes()).hexdigest()!=digest:raise SystemExit('sealed file hash mismatch')
          if not (target/'memeloop-token-center').stat().st_mode&0o111:raise SystemExit('sealed binary is not executable')
          print(json.dumps({'sealed_source':os.environ['CANDIDATE_SHA'],'sealed_artifact':15249943725,'sealed_zip_sha256':expected,'sealed_tar_sha256':checksum[0],'files_verified':len(actual)}))
          PYCODE
      - name: Retrieve the exact approved original 58f runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-smoke"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/native-smoke/artifact.json"
          python3 - <<'PYCODE'
          import json,os,pathlib,re
          value=os.environ['ARTIFACT_DIGEST']
          if not re.fullmatch(r'[0-9a-f]{64}',value):raise SystemExit('unexpected upload artifact digest format')
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke/artifact.json').read_text())
          if str(x['id'])!=os.environ['ARTIFACT_ID'] or str(x['workflow_run']['id'])!=os.environ['SOURCE_RUN_ID'] or x['expired'] or x['digest']!='sha256:'+os.environ['ARTIFACT_DIGEST']:raise SystemExit('artifact identity mismatch')
          PYCODE
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/native-smoke/artifact.zip"
          python3 - <<'PYCODE'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke'
          h=hashlib.sha256()
          with (root/'artifact.zip').open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
          if h.hexdigest()!=os.environ['ARTIFACT_DIGEST']:raise SystemExit('artifact ZIP digest mismatch')
          with zipfile.ZipFile(root/'artifact.zip') as z:
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts:raise SystemExit('unsafe ZIP path')
              z.extractall(root/'oci')
          PYCODE
          cd "$RUNNER_TEMP/native-smoke/oci"
          sha256sum -c SHA256SUMS
      - name: Verify original OCI bytes and native containerd runtime binding offline
        env:
          CANDIDATE_SEALED_ID: "15249943725"
          CANDIDATE_SEALED_DIGEST: f2e4fe048e75b6052133ec969dbdfbecc021ef2cddd886c6b44af99401c00190
        run: |
          set -euo pipefail
          sudo systemctl start containerd
          sudo ctr namespaces create joint58f-smoke
          python3 - <<'PYCODE'
          import gzip,hashlib,io,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke'; archive=root/'oci/service-joint58f.oci.tar'
          evidence=json.loads((root/'oci/oci-identity.json').read_text())
          if evidence['index_digest']!='sha256:12cfaf258c543e42394a239bb46fc7be256903e3c39ac67835511429dea0c5a6' or evidence['manifest_digest']!='sha256:e9025d5b380bd96d556e9be36c3b665465003bc5d3d6122db13796f1b31320ca' or evidence['config_digest']!='sha256:028f4fd3733fae62a26ef445929c6b012ae7d8345b5d91a9f0c1f417da801f51':raise SystemExit('fixed original runtime digest mismatch')
          if evidence['source']!=os.environ['BASE_RUNTIME_SHA'] or evidence['run']!=os.environ['SOURCE_RUN_ID'] or evidence['platform']!='linux/amd64':raise SystemExit('OCI source/run/platform mismatch')
          def ctr(*args):
              cmd=['sudo','ctr','-n','joint58f-smoke',*args]
              if args!=('tasks','start','joint58f-plugin-runtime'):
                  return subprocess.check_output(cmd)
              result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode:
                  def safe(raw):
                      value=raw[:16384].decode('utf-8',errors='replace')
                      return ''.join(c for c in value if c in '\n\t' or ord(c)>=32 and ord(c)!=127)
                  message='command='+json.dumps(cmd)+'\nexit_code='+str(result.returncode)+'\nstdout (first 16KiB):\n'+safe(result.stdout)+'\nstderr (first 16KiB):\n'+safe(result.stderr)
                  (root/'native-command-failure.txt').write_text(message)
                  print(message,flush=True)
                  raise subprocess.CalledProcessError(result.returncode,cmd)
              return result.stdout
          with tarfile.open(archive) as tar:
              members={m.name.removeprefix('./'):m for m in tar.getmembers() if m.isfile()}
              def read(name):return tar.extractfile(members[name]).read()
              index=read('index.json')
              if 'sha256:'+hashlib.sha256(index).hexdigest()!=evidence['index_digest']:raise SystemExit('index mismatch')
              verified=set(); descriptors={}; runtimes=[]
              def visit(d):
                  h=d['digest'].split(':',1)[1]; raw=read('blobs/sha256/'+h)
                  if len(raw)!=d['size'] or hashlib.sha256(raw).hexdigest()!=h:raise SystemExit('archive descriptor mismatch')
                  descriptors[d['digest']]=d
                  if d['digest'] in verified:return
                  verified.add(d['digest'])
                  if 'manifest' in d['mediaType'] or 'index' in d['mediaType']:
                      obj=json.loads(raw)
                      for child in obj.get('manifests',[]):visit(child)
                      if 'config' in obj:
                          visit(obj['config'])
                          for child in obj['layers']:visit(child)
                          cfg=json.loads(read('blobs/sha256/'+obj['config']['digest'].split(':')[1]))
                          if cfg.get('os')=='linux' and cfg.get('architecture')=='amd64':runtimes.append(d['digest'])
              for d in json.loads(index)['manifests']:visit(d)
              if runtimes!=[evidence['manifest_digest']]:raise SystemExit('original graph runtime is not the unique approved child')
              manifest=json.loads(read('blobs/sha256/'+evidence['manifest_digest'].split(':')[1]))
              if manifest['config']['digest']!=evidence['config_digest']:raise SystemExit('manifest/config binding mismatch')
              config=json.loads(read('blobs/sha256/'+evidence['config_digest'].split(':')[1]))
              if config.get('os')!='linux' or config.get('architecture')!='amd64' or config['config']['Labels']['org.opencontainers.image.revision']!=os.environ['BASE_RUNTIME_SHA']:raise SystemExit('runtime config mismatch')
              diffs=config['rootfs']['diff_ids']
              if len(diffs)!=len(manifest['layers']):raise SystemExit('rootfs count mismatch')
              for layer,expected in zip(manifest['layers'],diffs):
                  member=members['blobs/sha256/'+layer['digest'].split(':')[1]]
                  raw=tar.extractfile(member)
                  if layer['mediaType'].endswith('+gzip'):raw=gzip.GzipFile(fileobj=raw)
                  elif not layer['mediaType'].endswith('.tar'):raise SystemExit('unsupported layer encoding')
                  h=hashlib.sha256()
                  for b in iter(lambda:raw.read(1024*1024),b''):h.update(b)
                  if 'sha256:'+h.hexdigest()!=expected:raise SystemExit('rootfs diff_id mismatch')
          if len(verified)!=evidence['descriptors']:raise SystemExit('same-run original OCI descriptor count mismatch')
          # Preserve the original archive. Derive only a one-child index for a local import name.
          image='localhost/stage-joint58f-runtime:smoke'
          derived=root/'native-runtime.oci.tar'
          with tarfile.open(archive) as original, tarfile.open(derived,'w') as output:
              descriptor=None
              for member in original.getmembers():
                  if member.isfile() and member.name.removeprefix('./')=='blobs/sha256/'+evidence['manifest_digest'].split(':')[1]:
                      descriptor=dict(descriptors[evidence['manifest_digest']]);descriptor['annotations']={**descriptor.get('annotations',{}),'org.opencontainers.image.ref.name':image}
              if descriptor is None:raise SystemExit('runtime child absent')
              index_bytes=json.dumps({'schemaVersion':2,'mediaType':'application/vnd.oci.image.index.v1+json','manifests':[descriptor]},separators=(',',':')).encode()
              for member in original.getmembers():
                  if member.name.removeprefix('./')=='index.json':continue
                  output.addfile(member,original.extractfile(member) if member.isfile() else None)
              header=tarfile.TarInfo('index.json');header.size=len(index_bytes);header.mode=0o644
              output.addfile(header,io.BytesIO(index_bytes))
          ctr('images','import','--platform','linux/amd64',str(derived))
          rows=ctr('images','list').decode().splitlines()
          header=rows[0].split(); digest_column=header.index('DIGEST')
          matches=[r.split() for r in rows[1:] if r.split()[0]==image]
          if len(matches)!=1 or matches[0][digest_column]!=evidence['manifest_digest']:raise SystemExit('native image target differs from original child manifest')
          for digest in [evidence['manifest_digest'],evidence['config_digest'],*[layer['digest'] for layer in manifest['layers']]]:
              raw=ctr('content','get',digest); d=descriptors[digest]
              if len(raw)!=d['size'] or 'sha256:'+hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit('native runtime descriptor hash/size mismatch')
          # ctr unpack is performed by run/create, then verify its committed rootfs parent.
          chain=diffs[0]
          for d in diffs[1:]:chain='sha256:'+hashlib.sha256((chain+' '+d).encode()).hexdigest()
          drop_caps=['CAP_CHOWN','CAP_DAC_OVERRIDE','CAP_FSETID','CAP_FOWNER','CAP_MKNOD','CAP_NET_RAW','CAP_SETGID','CAP_SETUID','CAP_SETFCAP','CAP_SETPCAP','CAP_NET_BIND_SERVICE','CAP_SYS_CHROOT','CAP_KILL','CAP_AUDIT_WRITE']
          cap_args=[arg for cap in drop_caps for arg in ['--cap-drop',cap]]
          # The candidate release-input bytes are mounted read-only into the original runtime.
          binary=pathlib.Path(os.environ['RUNNER_TEMP'])/'sealed-input/memeloop-token-center'
          binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
          maintenance=root/'maintenance';maintenance.mkdir();maintenance.chmod(0o755)
          subprocess.check_call(['cp',str(binary),str(maintenance/'service')]);(maintenance/'service').chmod(0o555)
          work=root/'work';work.mkdir();work.chmod(0o700);subprocess.check_call(['sudo','chown','10001:10001',str(work)])
          ns='cf816-maintenance'
          pg_image='postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d'
          pg_name='history6024-pg-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          subprocess.check_call(['docker','pull',pg_image],stdout=subprocess.DEVNULL)
          subprocess.check_call(['docker','run','-d','--name',pg_name,'--network','none','-e','POSTGRES_USER=token_center','-e','POSTGRES_DB=history6024','-e','POSTGRES_HOST_AUTH_METHOD=trust','-e','POSTGRES_INITDB_ARGS=--encoding=UTF8',pg_image],stdout=subprocess.DEVNULL)
          import time
          for _ in range(120):
              ready=subprocess.run(['docker','exec',pg_name,'pg_isready','-h','127.0.0.1','-U','token_center','-d','history6024'],capture_output=True)
              if ready.returncode==0:break
              time.sleep(.5)
          else:raise SystemExit('pinned isolated PostgreSQL16 not ready')
          pg_info=json.loads(subprocess.check_output(['docker','inspect',pg_name]))[0]
          if pg_info['HostConfig']['NetworkMode']!='none' or pg_info['Config']['Image']!=pg_image:raise SystemExit('PG fixture image/network mismatch')
          pg_pid=pg_info['State']['Pid']
          subprocess.check_call(['sudo','ip','netns','attach',ns,str(pg_pid)])
          links=json.loads(subprocess.check_output(['sudo','ip','-n',ns,'-j','link','show']))
          if {row['ifname'] for row in links}!={'lo'}:raise SystemExit('PG fixture namespace has external interface')
          pg_client=['docker','exec',pg_name,'psql','-U','token_center','-d','history6024','-X','-A','-t','-v','ON_ERROR_STOP=1']
          version=subprocess.check_output([*pg_client,'-c','SHOW server_version_num'],text=True).strip()
          if not version.isdecimal() or int(version)//10000!=16:raise SystemExit('PG fixture is not actual version16')
          (root/'postgres-fixture.json').write_text(json.dumps({'image':pg_image,'actual_image_id':pg_info['Image'],'server_version_num':version,'network_mode':'none','interfaces':['lo'],'database':'history6024','created_for_run':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
          subprocess.check_call(['sudo','ip','-n',ns,'link','set','lo','up'])
          mock=root/'mock.py'
          mock.write_text('import http.server,json,pathlib,sys,urllib.parse\nclass Handler(http.server.BaseHTTPRequestHandler):\n def log_message(self,*args):pass\n def handle_one_request(self):\n  self.recorded=False\n  return super().handle_one_request()\n def record(self,valid,checks=None):\n  p=pathlib.Path(sys.argv[1]);x=json.loads(p.read_text()) if p.exists() else {\'total\':0,\'valid\':0}\n  x[\'total\']+=1;x[\'valid\']+=int(valid);p.write_text(json.dumps(x));self.recorded=True\n  expected=[\'method_post\',\'path_root\',\'fixed_query\',\'fixed_sql\',\'admin_auth\',\'database\']\n  flags={name:bool(checks and checks.get(name,False)) for name in expected}\n  q=pathlib.Path(sys.argv[2]);observed=json.loads(q.read_text()) if q.exists() else []\n  if len(observed)<8:observed.append(flags);q.write_text(json.dumps(observed))\n def send_error(self,*args,**kwargs):\n  if not self.recorded:self.record(False)\n  return super().send_error(*args,**kwargs)\n def do_POST(self):\n  body=self.rfile.read(int(self.headers.get(\'Content-Length\',\'0\')))\n  spec=json.loads(pathlib.Path(sys.argv[3]).read_text())\n  state=json.loads(pathlib.Path(sys.argv[1]).read_text()) if pathlib.Path(sys.argv[1]).exists() else {\'total\':0,\'valid\':0}\n  expected_sql=spec[\'sql\'][state[\'total\']] if state[\'total\']<len(spec[\'sql\']) else None\n  try:\n   target=urllib.parse.urlsplit(self.path);pairs=urllib.parse.parse_qsl(target.query,keep_blank_values=True,strict_parsing=True)\n  except ValueError:target=None;pairs=[]\n  expected=[(\'wait_end_of_query\',\'1\'),(\'optimize_move_to_prewhere\',\'0\'),(\'optimize_move_to_prewhere_if_final\',\'0\'),(\'output_format_json_quote_64bit_integers\',\'0\')]\n  checks={\'method_post\':True,\'path_root\':target is not None and target.path==\'/\' and not target.scheme and not target.netloc and not target.fragment,\'fixed_query\':sorted(pairs)==sorted(expected),\'fixed_sql\':expected_sql is not None and body==expected_sql.encode(),\'admin_auth\':self.headers.get(\'Authorization\')==\'Basic YWRtaW46YWRtaW4tcGFzc3dvcmQ=\',\'database\':self.headers.get(\'X-ClickHouse-Database\')==\'synthetic\'}\n  good=all(checks.values());self.record(good,checks)\n  if not good:self.send_error(400);return\n  self.send_response(200);self.end_headers();self.wfile.write(b\'{"ok":1}\\n\' if spec[\'mode\']==\'select\' else b\'\')\nhttp.server.HTTPServer((\'127.0.0.1\',18123),Handler).serve_forever()\n')
          count=root/'mock-count.txt'
          checks_file=root/'mock-fixed-checks.json'
          private_fixture=root/'private-fixture';private_fixture.mkdir(mode=0o700)
          expected_file=private_fixture/'mock-expected.json'
          expected_file.write_text(json.dumps({'mode':'select','sql':['SELECT 1 AS ok FORMAT JSONEachRow']}))
          server=subprocess.Popen(['sudo','ip','netns','exec',ns,'python3',str(mock),str(count),str(checks_file),str(expected_file)])
          import time
          for _ in range(100):
              probe=subprocess.run(['sudo','ip','netns','exec',ns,'python3','-c',"import socket;s=socket.create_connection(('127.0.0.1',18123),.1);s.close()"],capture_output=True)
              if probe.returncode==0:break
              time.sleep(.05)
          else:raise SystemExit('isolated synthetic mock not ready')
          namespace='/run/netns/'+ns
          envs={'LD_LIBRARY_PATH' :'/usr/local/lib','GLIBC_TUNABLES':'glibc.malloc.mmap_threshold=65536','MTC_KEY_PEPPER':'test-pepper-must-have-at-least-32-bytes','MTC_SERVICE_TOKEN':'s'*32,'MTC_DATABASE_URL':'postgres://token_center@127.0.0.1:5432/history6024','MTC_ARCHIVE_BACKEND':'filesystem','MTC_ARCHIVE_PATH':'/work/must-not-initialize-archive','MTC_REQUEST_HISTORY_URL':'http://127.0.0.1:18123','MTC_REQUEST_HISTORY_DATABASE':'synthetic','MTC_REQUEST_HISTORY_ADMIN_USER':'admin','MTC_REQUEST_HISTORY_ADMIN_PASSWORD':'admin-password','MTC_REQUEST_HISTORY_WRITER_USER':'different-writer','MTC_REQUEST_HISTORY_WRITER_PASSWORD':'different-writer-password','MTC_REQUEST_HISTORY_USER':'different-fallback','MTC_REQUEST_HISTORY_PASSWORD':'different-fallback-password'}
          env_args=[v for k,val in envs.items() for v in ['--env',k+'='+val]]
          try:
              for suffix,args in [('maintenance-migrate',['migrate']),('maintenance-help',['--help']),('maintenance-feature-help',['request-history','--help']),('maintenance-probe',['request-history','probe-transport']),('maintenance-bootstrap',['request-history','bootstrap'])]:
                  if suffix=='maintenance-bootstrap':
                      schema=pathlib.Path('src/request_history/schema.sql').read_text()
                      prefix='CREATE TABLE IF NOT EXISTS request_history_v1\n'
                      if not schema.startswith(prefix) or 'request_history_v1' in schema[len(prefix):]:raise SystemExit('reviewed initialization schema identifier mismatch')
                      table='request_history_v1'
                      columns=['stats_filter_cost_micros Nullable(Int64)','stats_model String','stats_protocol LowCardinality(String)','stats_error_code Nullable(String)','stats_upstream_account_id Nullable(UUID)','stats_route_id Nullable(UUID)','stats_duration_ms Nullable(Int64)']
                      statements=[schema]+['ALTER TABLE '+table+' ADD COLUMN IF NOT EXISTS '+column for column in columns]
                      expected_file.write_text(json.dumps({'mode':'initialization','sql':statements}))
