      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: memory-release
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify the seven exact owner read lock contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0cc0d58c76699a12085a521a50413af2783ec7f7"
          git rev-parse HEAD
          cargo check --locked --lib
          failures=0
          mkdir -p /tmp/owner-read-lock
          while IFS= read -r selector; do
            log="/tmp/owner-read-lock/${selector//::/_}.log"
            if ! cargo test --locked --lib "$selector" -- --exact --nocapture 2>&1 | tee "$log"; then failures=1; fi
            if ! grep -F '1 passed; 0 failed; 0 ignored;' "$log"; then failures=1; fi
          done <<'SELECTORS'
          db::requests::owner::tests::postgres_terminal_owner_read_lock_rechecks_pending_without_update_side_effects
          db::requests::owner::tests::postgres_reaper_rechecks_renewal_under_lock_and_races_late_finish_once
          db::requests::owner::tests::postgres_terminal_completion_keeps_owner_reads_on_one_leaf_before_settlement
          db::requests::operational_terminal::tests::unknown_bridge::sqlite_unknown_bridge_preserves_failures_and_replaces_financial_facts_once
          db::requests::operational_terminal::tests::unknown_bridge::postgres_unknown_bridge_preserves_failures_and_replaces_financial_facts_once
          db::requests::operational_terminal::tests::lifecycle_events::sqlite_lifecycle_events_do_not_wait_for_archive_or_financial_projection
          db::requests::operational_terminal::tests::lifecycle_events::postgres_lifecycle_events_do_not_wait_for_archive_or_financial_projection
          SELECTORS
          exit "$failures"
      - name: Retain exact owner read lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-read-lock-0cc0
          path: /tmp/owner-read-lock/
          if-no-files-found: warn
          retention-days: 7

