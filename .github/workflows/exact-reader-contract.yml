  stage-exact-fixture-build:
    if: inputs.contract == 'stage-exact-fixture-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-plugin-examples
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Build the isolated Stage fixture test executable without running it
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          cargo test --locked --all-features --lib --no-run --message-format=json > /tmp/stage-fixture-build.json
          executable=$(jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .target.name=="memeloop_token_center" and .executable!=null) | .executable' /tmp/stage-fixture-build.json | tail -n1)
          test -n "$executable"
          mkdir stage-exact-fixture-artifact
          cp "$executable" stage-exact-fixture-artifact/stage-fixture-tests
          printf '%s\n' "$SOURCE_REVISION" > stage-exact-fixture-artifact/SOURCE_REVISION
          cd stage-exact-fixture-artifact
          sha256sum stage-fixture-tests SOURCE_REVISION > SHA256SUMS
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: stage-exact-fixture-${{ inputs.source_revision }}
          path: stage-exact-fixture-artifact/
          retention-days: 7
          if-no-files-found: error
