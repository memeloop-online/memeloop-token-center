name: exact-reader-contract
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Optional exact source commit to test
        required: false
        type: string
      contract:
        required: true
        type: choice
        options:
          - metadata-refresh
          - request-carrier-958
          - response-carrier-968
          - orphan-reaper-971
          - semantic-reader-scope
          - pg-executor-959
          - session-response-956
          - semantic-partial-954
          - upstream-error-779
          - semantic-mapping-948
          - bfa-reader
          - e2db-raw
          - staging-155
          - next-release
          - admission-cancel
          - quota-outage
          - conversation-812
          - history-writer-984
          - history-capture-981
          - release-927-928
permissions:
  contents: read
jobs:
  metadata-refresh-contract:
    if: inputs.contract == 'metadata-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: cf816a0ade6689591a30ee726929ceaa2e29aea0
      BASE_RUNTIME_SHA: 58f8288be9d57591611d28200978935bbee1e3c1
      ARTIFACT_ID: "15172646870"
      SOURCE_RUN_ID: "45940213018"
      ARTIFACT_DIGEST: 2edc4a022cd90b5f750d033ad88c933e7238ee47da276163c238d05d2cf5ddd8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cf816a0ade6689591a30ee726929ceaa2e29aea0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Verify fixed Stage-only source
        id: source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Compile and runtime-smoke the exact original release input once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          target: release-input-export
          platforms: linux/amd64
          push: false
          outputs: type=local,dest=${{ runner.temp }}/release-service-input
          build-args: |
            MTC_BUILD_GIT_SHA_INPUT=${{ env.CANDIDATE_SHA }}
            MTC_BUILD_TIMESTAMP_INPUT=${{ steps.source.outputs.timestamp }}
            MTC_BUILD_TARGET_INPUT=linux/amd64
          cache-from: type=gha,scope=service-release-input
      - name: Seal and verify the same-source complete input
        run: |
          set -euo pipefail
          node scripts/ci/create-memory-binary-manifest.ts "$RUNNER_TEMP/release-service-input/memeloop-token-center" "$CANDIDATE_SHA" "$RUNNER_TEMP/sealed-input"
          for file in libgcc_s.so.1 libstdc++.so.6 install-plugin-oci cosign LICENSE THIRD_PARTY_NOTICES.md; do
            cp "$RUNNER_TEMP/release-service-input/$file" "$RUNNER_TEMP/sealed-input/$file"
          done
          cp -R "$RUNNER_TEMP/release-service-input/web" "$RUNNER_TEMP/sealed-input/web"
          cp -R "$RUNNER_TEMP/release-service-input/third-party-licenses" "$RUNNER_TEMP/sealed-input/third-party-licenses"
          chmod 0555 "$RUNNER_TEMP/sealed-input/memeloop-token-center" "$RUNNER_TEMP/sealed-input/install-plugin-oci" "$RUNNER_TEMP/sealed-input/cosign"
          node scripts/ci/create-release-service-input-manifest.ts "$RUNNER_TEMP/sealed-input" "$CANDIDATE_SHA"
          node scripts/ci/verify-release-service-input.ts "$RUNNER_TEMP/sealed-input" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/stage-test-oci"
          cp "$RUNNER_TEMP/sealed-input/memory-binary.json" "$RUNNER_TEMP/sealed-input/release-service-input.json" "$RUNNER_TEMP/stage-test-oci/"
      - name: Preserve verified sealed input before assembly
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-package"
          tar -C "$RUNNER_TEMP/sealed-input" -cf "$RUNNER_TEMP/sealed-package/sealed-input.tar" .
          cd "$RUNNER_TEMP/sealed-package"
          sha256sum sealed-input.tar > SHA256SUMS
          printf '%s\n' "$CANDIDATE_SHA" > source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-cf816-smoke-pending-sealed-input
          path: ${{ runner.temp }}/sealed-package/
          if-no-files-found: error
          retention-days: 3
      - name: Retrieve the exact approved original 58f runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-smoke"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/native-smoke/artifact.json"
          python3 - <<'PYCODE'
          import json,os,pathlib,re
          value=os.environ['ARTIFACT_DIGEST']
          if not re.fullmatch(r'[0-9a-f]{64}',value):raise SystemExit('unexpected upload artifact digest format')
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke/artifact.json').read_text())
          if str(x['id'])!=os.environ['ARTIFACT_ID'] or str(x['workflow_run']['id'])!=os.environ['SOURCE_RUN_ID'] or x['expired'] or x['digest']!='sha256:'+os.environ['ARTIFACT_DIGEST']:raise SystemExit('artifact identity mismatch')
          PYCODE
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/native-smoke/artifact.zip"
          python3 - <<'PYCODE'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke'
          h=hashlib.sha256()
          with (root/'artifact.zip').open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
          if h.hexdigest()!=os.environ['ARTIFACT_DIGEST']:raise SystemExit('artifact ZIP digest mismatch')
          with zipfile.ZipFile(root/'artifact.zip') as z:
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts:raise SystemExit('unsafe ZIP path')
              z.extractall(root/'oci')
          PYCODE
          cd "$RUNNER_TEMP/native-smoke/oci"
          sha256sum -c SHA256SUMS
      - name: Verify original OCI bytes and native containerd runtime binding offline
        run: |
          set -euo pipefail
          sudo systemctl start containerd
          sudo ctr namespaces create joint58f-smoke
          python3 - <<'PYCODE'
          import gzip,hashlib,io,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke'; archive=root/'oci/service-joint58f.oci.tar'
          evidence=json.loads((root/'oci/oci-identity.json').read_text())
          if evidence['index_digest']!='sha256:12cfaf258c543e42394a239bb46fc7be256903e3c39ac67835511429dea0c5a6' or evidence['manifest_digest']!='sha256:e9025d5b380bd96d556e9be36c3b665465003bc5d3d6122db13796f1b31320ca' or evidence['config_digest']!='sha256:028f4fd3733fae62a26ef445929c6b012ae7d8345b5d91a9f0c1f417da801f51':raise SystemExit('fixed original runtime digest mismatch')
          if evidence['source']!=os.environ['BASE_RUNTIME_SHA'] or evidence['run']!=os.environ['SOURCE_RUN_ID'] or evidence['platform']!='linux/amd64':raise SystemExit('OCI source/run/platform mismatch')
          def ctr(*args):
              cmd=['sudo','ctr','-n','joint58f-smoke',*args]
              if args!=('tasks','start','joint58f-plugin-runtime'):
                  return subprocess.check_output(cmd)
              result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode:
                  def safe(raw):
                      value=raw[:16384].decode('utf-8',errors='replace')
                      return ''.join(c for c in value if c in '\n\t' or ord(c)>=32 and ord(c)!=127)
                  message='command='+json.dumps(cmd)+'\nexit_code='+str(result.returncode)+'\nstdout (first 16KiB):\n'+safe(result.stdout)+'\nstderr (first 16KiB):\n'+safe(result.stderr)
                  (root/'native-command-failure.txt').write_text(message)
                  print(message,flush=True)
                  raise subprocess.CalledProcessError(result.returncode,cmd)
              return result.stdout
          with tarfile.open(archive) as tar:
              members={m.name.removeprefix('./'):m for m in tar.getmembers() if m.isfile()}
              def read(name):return tar.extractfile(members[name]).read()
              index=read('index.json')
              if 'sha256:'+hashlib.sha256(index).hexdigest()!=evidence['index_digest']:raise SystemExit('index mismatch')
              verified=set(); descriptors={}; runtimes=[]
              def visit(d):
                  h=d['digest'].split(':',1)[1]; raw=read('blobs/sha256/'+h)
                  if len(raw)!=d['size'] or hashlib.sha256(raw).hexdigest()!=h:raise SystemExit('archive descriptor mismatch')
                  descriptors[d['digest']]=d
                  if d['digest'] in verified:return
                  verified.add(d['digest'])
                  if 'manifest' in d['mediaType'] or 'index' in d['mediaType']:
                      obj=json.loads(raw)
                      for child in obj.get('manifests',[]):visit(child)
                      if 'config' in obj:
                          visit(obj['config'])
                          for child in obj['layers']:visit(child)
                          cfg=json.loads(read('blobs/sha256/'+obj['config']['digest'].split(':')[1]))
                          if cfg.get('os')=='linux' and cfg.get('architecture')=='amd64':runtimes.append(d['digest'])
              for d in json.loads(index)['manifests']:visit(d)
              if runtimes!=[evidence['manifest_digest']]:raise SystemExit('original graph runtime is not the unique approved child')
              manifest=json.loads(read('blobs/sha256/'+evidence['manifest_digest'].split(':')[1]))
              if manifest['config']['digest']!=evidence['config_digest']:raise SystemExit('manifest/config binding mismatch')
              config=json.loads(read('blobs/sha256/'+evidence['config_digest'].split(':')[1]))
              if config.get('os')!='linux' or config.get('architecture')!='amd64' or config['config']['Labels']['org.opencontainers.image.revision']!=os.environ['BASE_RUNTIME_SHA']:raise SystemExit('runtime config mismatch')
              diffs=config['rootfs']['diff_ids']
              if len(diffs)!=len(manifest['layers']):raise SystemExit('rootfs count mismatch')
              for layer,expected in zip(manifest['layers'],diffs):
                  member=members['blobs/sha256/'+layer['digest'].split(':')[1]]
                  raw=tar.extractfile(member)
                  if layer['mediaType'].endswith('+gzip'):raw=gzip.GzipFile(fileobj=raw)
                  elif not layer['mediaType'].endswith('.tar'):raise SystemExit('unsupported layer encoding')
                  h=hashlib.sha256()
                  for b in iter(lambda:raw.read(1024*1024),b''):h.update(b)
                  if 'sha256:'+h.hexdigest()!=expected:raise SystemExit('rootfs diff_id mismatch')
          if len(verified)!=evidence['descriptors']:raise SystemExit('same-run original OCI descriptor count mismatch')
          # Preserve the original archive. Derive only a one-child index for a local import name.
          image='localhost/stage-joint58f-runtime:smoke'
          derived=root/'native-runtime.oci.tar'
          with tarfile.open(archive) as original, tarfile.open(derived,'w') as output:
              descriptor=None
              for member in original.getmembers():
                  if member.isfile() and member.name.removeprefix('./')=='blobs/sha256/'+evidence['manifest_digest'].split(':')[1]:
                      descriptor=dict(descriptors[evidence['manifest_digest']]);descriptor['annotations']={**descriptor.get('annotations',{}),'org.opencontainers.image.ref.name':image}
              if descriptor is None:raise SystemExit('runtime child absent')
              index_bytes=json.dumps({'schemaVersion':2,'mediaType':'application/vnd.oci.image.index.v1+json','manifests':[descriptor]},separators=(',',':')).encode()
              for member in original.getmembers():
                  if member.name.removeprefix('./')=='index.json':continue
                  output.addfile(member,original.extractfile(member) if member.isfile() else None)
              header=tarfile.TarInfo('index.json');header.size=len(index_bytes);header.mode=0o644
              output.addfile(header,io.BytesIO(index_bytes))
          ctr('images','import','--platform','linux/amd64',str(derived))
          rows=ctr('images','list').decode().splitlines()
          header=rows[0].split(); digest_column=header.index('DIGEST')
          matches=[r.split() for r in rows[1:] if r.split()[0]==image]
          if len(matches)!=1 or matches[0][digest_column]!=evidence['manifest_digest']:raise SystemExit('native image target differs from original child manifest')
          for digest in [evidence['manifest_digest'],evidence['config_digest'],*[layer['digest'] for layer in manifest['layers']]]:
              raw=ctr('content','get',digest); d=descriptors[digest]
              if len(raw)!=d['size'] or 'sha256:'+hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit('native runtime descriptor hash/size mismatch')
          # ctr unpack is performed by run/create, then verify its committed rootfs parent.
          chain=diffs[0]
          for d in diffs[1:]:chain='sha256:'+hashlib.sha256((chain+' '+d).encode()).hexdigest()
          drop_caps=['CAP_CHOWN','CAP_DAC_OVERRIDE','CAP_FSETID','CAP_FOWNER','CAP_MKNOD','CAP_NET_RAW','CAP_SETGID','CAP_SETUID','CAP_SETFCAP','CAP_SETPCAP','CAP_NET_BIND_SERVICE','CAP_SYS_CHROOT','CAP_KILL','CAP_AUDIT_WRITE']
          cap_args=[arg for cap in drop_caps for arg in ['--cap-drop',cap]]
          # The candidate release-input bytes are mounted read-only into the original runtime.
          binary=pathlib.Path(os.environ['RUNNER_TEMP'])/'sealed-input/memeloop-token-center'
          binary_sha=hashlib.sha256(binary.read_bytes()).hexdigest()
          maintenance=root/'maintenance';maintenance.mkdir();maintenance.chmod(0o755)
          subprocess.check_call(['cp',str(binary),str(maintenance/'service')]);(maintenance/'service').chmod(0o555)
          work=root/'work';work.mkdir();work.chmod(0o700);subprocess.check_call(['sudo','chown','10001:10001',str(work)])
          ns='cf816-maintenance'
          subprocess.check_call(['sudo','ip','netns','add',ns])
          subprocess.check_call(['sudo','ip','-n',ns,'link','set','lo','up'])
          mock=root/'mock.py'
          mock.write_text('import http.server,json,pathlib,sys\nclass Handler(http.server.BaseHTTPRequestHandler):\n def log_message(self,*args):pass\n def handle_one_request(self):\n  self.recorded=False\n  return super().handle_one_request()\n def record(self,valid):\n  p=pathlib.Path(sys.argv[1]);x=json.loads(p.read_text()) if p.exists() else {\'total\':0,\'valid\':0}\n  x[\'total\']+=1;x[\'valid\']+=int(valid);p.write_text(json.dumps(x));self.recorded=True\n def send_error(self,*args,**kwargs):\n  if not self.recorded:self.record(False)\n  return super().send_error(*args,**kwargs)\n def do_POST(self):\n  body=self.rfile.read(int(self.headers.get(\'Content-Length\',\'0\')))\n  good=self.path==\'/\' and body==b\'SELECT 1 AS ok FORMAT JSONEachRow\' and self.headers.get(\'Authorization\')==\'Basic YWRtaW46YWRtaW4tcGFzc3dvcmQ=\' and self.headers.get(\'X-ClickHouse-Database\')==\'synthetic\'\n  self.record(good)\n  if not good:self.send_error(400);return\n  self.send_response(200);self.end_headers();self.wfile.write(b\'{"ok":1}\\n\')\nhttp.server.HTTPServer((\'127.0.0.1\',18123),Handler).serve_forever()\n')
          count=root/'mock-count.txt'
          server=subprocess.Popen(['sudo','ip','netns','exec',ns,'python3',str(mock),str(count)])
          import time
          for _ in range(100):
              probe=subprocess.run(['sudo','ip','netns','exec',ns,'python3','-c',"import socket;s=socket.create_connection(('127.0.0.1',18123),.1);s.close()"],capture_output=True)
              if probe.returncode==0:break
              time.sleep(.05)
          else:raise SystemExit('isolated synthetic mock not ready')
          namespace='/run/netns/'+ns
          envs={'LD_LIBRARY_PATH':'/usr/local/lib','GLIBC_TUNABLES':'glibc.malloc.mmap_threshold=65536','MTC_KEY_PEPPER':'test-pepper-must-have-at-least-32-bytes','MTC_SERVICE_TOKEN':'s'*32,'MTC_DATABASE_URL':'sqlite:///work/probe.db?mode=rwc','MTC_ARCHIVE_BACKEND':'filesystem','MTC_ARCHIVE_PATH':'/work/must-not-initialize-archive','MTC_REQUEST_HISTORY_URL':'http://127.0.0.1:18123','MTC_REQUEST_HISTORY_DATABASE':'synthetic','MTC_REQUEST_HISTORY_ADMIN_USER':'admin','MTC_REQUEST_HISTORY_ADMIN_PASSWORD':'admin-password','MTC_REQUEST_HISTORY_WRITER_USER':'different-writer','MTC_REQUEST_HISTORY_WRITER_PASSWORD':'different-writer-password','MTC_REQUEST_HISTORY_USER':'different-fallback','MTC_REQUEST_HISTORY_PASSWORD':'different-fallback-password'}
          env_args=[v for k,val in envs.items() for v in ['--env',k+'='+val]]
          try:
              for suffix,args in [('maintenance-migrate',['migrate']),('maintenance-help',['--help']),('maintenance-probe',['request-history','probe-transport'])]:
                  cid='joint58f-'+suffix
                  mounts=['--mount','type=bind,src='+str(maintenance)+',dst=/maintenance,options=rbind:ro','--mount','type=bind,src='+str(work)+',dst=/work,options=rbind:rw']
                  ctr('containers','create','--snapshotter','overlayfs','--read-only','--user','10001:10001','--with-ns','network:'+namespace,*mounts,*env_args,*cap_args,image,cid,'/maintenance/service',*args)
                  info=json.loads(ctr('containers','info',cid));spec=info['Spec']
                  snap=json.loads(ctr('snapshots','--snapshotter','overlayfs','info',info['SnapshotKey']))
                  if info['Image']!=image or snap.get('Parent')!=chain:raise SystemExit('maintenance original runtime chain mismatch')
                  if not spec['root']['readonly'] or spec['process']['user']['uid']!=10001 or not spec['process'].get('noNewPrivileges') or any(spec['process'].get('capabilities',{}).values()):raise SystemExit('maintenance runtime isolation mismatch')
                  networks=[n for n in spec['linux']['namespaces'] if n['type']=='network']
                  if len(networks)!=1 or networks[0].get('path')!=namespace:raise SystemExit('maintenance network is not isolated mock namespace')
                  bind=[m for m in spec['mounts'] if m['destination']=='/maintenance']
                  if len(bind)!=1 or bind[0]['source']!=str(maintenance) or 'ro' not in bind[0]['options']:raise SystemExit('maintenance executable mount not read-only')
                  if spec['process']['args']!=['/maintenance/service',*args]:raise SystemExit('maintenance command drift')
                  result=subprocess.run(['sudo','ctr','-n','joint58f-smoke','tasks','start',cid],capture_output=True)
                  if result.returncode:raise SystemExit('maintenance task failed rc='+str(result.returncode))
                  output=result.stdout
                  if any(v.encode() in output+result.stderr for v in ['admin-password','different-writer-password','different-fallback-password']):raise SystemExit('synthetic secret appeared in output')
                  (root/(suffix+'.txt')).write_bytes(output)
                  # Do not export process environments, which contain synthetic credentials.
                  (root/(suffix+'-isolation.json')).write_text(json.dumps({'uid':10001,'root_readonly':True,'empty_capabilities':True,'network_namespace':ns,'runtime_child':evidence['manifest_digest'],'rootfs_chain':chain,'binary_sha256':binary_sha}))
                  if suffix=='maintenance-probe':
                      rows=[json.loads(line) for line in output.decode().splitlines() if line.startswith('{')]
                      if {'transport_ready':True,'read_only':True} not in rows or not count.exists() or json.loads(count.read_text())!={'total':1,'valid':1}:raise SystemExit('maintenance ADMIN/readonly/request count contract failed')
                      subprocess.check_output(['sudo','ls','-A',str(work)])
                      subprocess.check_call(['sudo','test','!','-e',str(work/'must-not-initialize-archive')])
                  ctr('containers','delete',cid)
          finally:
              server.terminate();server.wait(timeout=10)
          if hashlib.sha256((maintenance/'service').read_bytes()).hexdigest()!=binary_sha:raise SystemExit('mounted maintenance binary changed')
          package=pathlib.Path(os.environ['RUNNER_TEMP'])/'maintenance-package';package.mkdir()
          subprocess.check_call(['cp',str(binary),str(package/'memeloop-token-center')]);(package/'memeloop-token-center').chmod(0o555)
          for label,argv in [('elf-header',['readelf','-h',str(binary)]),('elf-dynamic',['readelf','-d',str(binary)]),('elf-versions',['readelf','--version-info',str(binary)])]:
              (package/(label+'.txt')).write_bytes(subprocess.check_output(argv))
          evidence.update({'maintenance_source':os.environ['CANDIDATE_SHA'],'maintenance_binary_sha256':binary_sha,'maintenance_binary_bytes':binary.stat().st_size,'purpose':'diagnostic-maintenance-only-not-official-release','admin_probe_count':1,'maintenance_run':os.environ['GITHUB_RUN_ID'],'maintenance_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'status':'maintenance_native_pass'})
          (package/'receipt.json').write_text(json.dumps(evidence,indent=2)+'\n')
          subprocess.check_call(['cp',str(root/'maintenance-probe.txt'),str(package/'probe.txt')])
          subprocess.check_call(['cp',str(root/'maintenance-help.txt'),str(package/'help.txt')])
          with tarfile.open(package/'maintenance.tar','w') as tar:
              for item in sorted(package.iterdir()):
                  if item.name!='maintenance.tar':tar.add(item,arcname=item.name)
          h=hashlib.sha256((package/'maintenance.tar').read_bytes()).hexdigest()
          (package/'SHA256SUMS').write_text(h+'  maintenance.tar\n')
          evidence.update({'status':'smoke_pass','smoke_run':os.environ['GITHUB_RUN_ID'],'artifact_id':os.environ['ARTIFACT_ID'],'artifact_digest':'sha256:'+os.environ['ARTIFACT_DIGEST'],'rootfs_chain':chain,'runtime_image':image,'verified_descriptors':len(verified)})
          (root/'smoke-receipt.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cf816-maintenance-native-evidence
          path: |
            ${{ runner.temp }}/native-smoke/*.json
            ${{ runner.temp }}/native-smoke/*.txt
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cf816-release-maintenance-native-passed
          path: |
            ${{ runner.temp }}/maintenance-package/maintenance.tar
            ${{ runner.temp }}/maintenance-package/SHA256SUMS
            ${{ runner.temp }}/maintenance-package/receipt.json
          if-no-files-found: error
          retention-days: 3

  orphan-reaper-contract:
    if: inputs.contract == 'orphan-reaper-971'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: token_center_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/token_center_test
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify SQLite and PostgreSQL orphan scan fairness
