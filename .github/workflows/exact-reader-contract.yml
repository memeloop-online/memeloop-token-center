name: exact-reader-contract
on:
  workflow_dispatch:
    inputs:
      contract:
        required: true
        type: choice
        options:
          - bfa-reader
          - e2db-raw
permissions:
  contents: read
jobs:
  reader-contract:
    if: inputs.contract == 'bfa-reader'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bfa6b1b794ff09197a2b2d2ade496d931b98c285
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify qualified HEAD routing and stream detail
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --lib archive::routing_tests::qualified_cas_reads_preserve_backend_tenant_and_stream_integrity -- --exact 2>&1 | tee /tmp/head-test.log
          grep -F '1 passed; 0 failed' /tmp/head-test.log
          cargo test --locked --lib readable_stream_archives_are_not_reported_as_missing_or_invalid 2>&1 | tee /tmp/detail-test.log
          grep -F '1 passed; 0 failed' /tmp/detail-test.log
  raw-publish-contract:
    if: inputs.contract == 'e2db-raw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e2db112d7b31e54e9c8ab5b312b9150a255d4c21
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify relocated raw publication and binding
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --lib relocated_raw_root_replays_and_binds_published_body_without_retired_copy 2>&1 | tee /tmp/raw-publish-test.log
          grep -F '1 passed; 0 failed' /tmp/raw-publish-test.log
