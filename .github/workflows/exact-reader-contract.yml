      - name: Compile the exact library test executable before runtime windows
        run: cargo test --locked --lib --no-run
      - name: Verify six actual request carrier ownership and pressure contracts
        run: |
          set -o pipefail
          for selector in \
            gateway_body::request_spool::tests::pressure_spills_to_typed_objects_without_touching_the_body_directory \
            gateway_body::request_spool::tests::prepaid_projection_reads_without_acquiring_a_second_body_lease \
            gateway_body::normalized_encoding::cancellation_contracts::pending_write_and_finish_cancel_and_return_actual_upload_envelope \
            gateway_body::carrier::tests::published_handoff_preserves_old_readers_and_releases_only_real_ram_owners \
            gateway_body::request_spool::archive_source_tests::archive_source_survives_request_drop_without_pinning_upload_bytes_on_database \
            gateway_body::request_spool::archive_source_tests::failed_source_retries_the_original_bytes_without_releasing_their_budget
          do
            echo "Contract: $selector"
            timeout 180s cargo test --locked --lib "$selector" -- --exact --nocapture 2>&1 | tee /tmp/request-carrier-contract.log
