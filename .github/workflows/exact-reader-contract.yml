name: exact-reader-contract
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Optional exact source commit to test
        required: false
        type: string
      contract:
        required: true
        type: choice
        options:
          - metadata-refresh
          - request-carrier-958
          - response-carrier-968
          - orphan-reaper-971
          - semantic-reader-scope
          - pg-executor-959
          - session-response-956
          - semantic-partial-954
          - upstream-error-779
          - semantic-mapping-948
          - bfa-reader
          - e2db-raw
          - staging-155
          - next-release
          - admission-cancel
          - quota-outage
          - conversation-812
          - history-writer-984
          - history-capture-981
          - release-927-928
permissions:
  contents: read
jobs:
  e9f-native-smoke:
    if: inputs.contract == 'metadata-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: e9f1058dcad784e9a5160819575ccbb1b96e6d3b
      ARTIFACT_ID: "15146483558"
      SOURCE_RUN_ID: "45878050510"
      ARTIFACT_DIGEST: 8c5bcf6dcfeaf927f31fa5308094f36122f26274f1a233e09b180f1f7103aa5a
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve only the same-run exact verified OCI artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-smoke"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/native-smoke/artifact.json"
          python3 - <<'PYCODE'
          import json,os,pathlib,re
          value=os.environ['ARTIFACT_DIGEST']
          if not re.fullmatch(r'[0-9a-f]{64}',value):raise SystemExit('unexpected upload artifact digest format')
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke/artifact.json').read_text())
          if str(x['id'])!=os.environ['ARTIFACT_ID'] or str(x['workflow_run']['id'])!=os.environ['SOURCE_RUN_ID'] or x['expired'] or x['digest']!='sha256:'+os.environ['ARTIFACT_DIGEST']:raise SystemExit('artifact identity mismatch')
          PYCODE
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/native-smoke/artifact.zip"
          python3 - <<'PYCODE'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke'
          h=hashlib.sha256()
          with (root/'artifact.zip').open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
          if h.hexdigest()!=os.environ['ARTIFACT_DIGEST']:raise SystemExit('artifact ZIP digest mismatch')
          with zipfile.ZipFile(root/'artifact.zip') as z:
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts:raise SystemExit('unsafe ZIP path')
              z.extractall(root/'oci')
          PYCODE
          cd "$RUNNER_TEMP/native-smoke/oci"
          sha256sum -c SHA256SUMS
      - name: Verify original OCI bytes and native containerd runtime binding offline
        run: |
          set -euo pipefail
          sudo systemctl start containerd
          sudo ctr namespaces create e9f-smoke
          python3 - <<'PYCODE'
          import gzip,hashlib,io,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-smoke'; archive=root/'oci/service-e9f.oci.tar'
          evidence=json.loads((root/'oci/oci-identity.json').read_text())
          if evidence['source']!=os.environ['CANDIDATE_SHA'] or evidence['run']!=os.environ['SOURCE_RUN_ID'] or evidence['platform']!='linux/amd64':raise SystemExit('OCI source/run/platform mismatch')
          def ctr(*args):
              cmd=['sudo','ctr','-n','e9f-smoke',*args]
              if args!=('tasks','start','e9f-plugin-runtime'):
                  return subprocess.check_output(cmd)
              result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode:
                  def safe(raw):
                      value=raw[:16384].decode('utf-8',errors='replace')
                      return ''.join(c for c in value if c in '\n\t' or ord(c)>=32 and ord(c)!=127)
                  message='command='+json.dumps(cmd)+'\nexit_code='+str(result.returncode)+'\nstdout (first 16KiB):\n'+safe(result.stdout)+'\nstderr (first 16KiB):\n'+safe(result.stderr)
                  (root/'native-command-failure.txt').write_text(message)
                  print(message,flush=True)
                  raise subprocess.CalledProcessError(result.returncode,cmd)
              return result.stdout
          with tarfile.open(archive) as tar:
              members={m.name.removeprefix('./'):m for m in tar.getmembers() if m.isfile()}
              def read(name):return tar.extractfile(members[name]).read()
              index=read('index.json')
              if 'sha256:'+hashlib.sha256(index).hexdigest()!=evidence['index_digest']:raise SystemExit('index mismatch')
              verified=set(); descriptors={}; runtimes=[]
              def visit(d):
                  h=d['digest'].split(':',1)[1]; raw=read('blobs/sha256/'+h)
                  if len(raw)!=d['size'] or hashlib.sha256(raw).hexdigest()!=h:raise SystemExit('archive descriptor mismatch')
                  descriptors[d['digest']]=d
                  if d['digest'] in verified:return
                  verified.add(d['digest'])
                  if 'manifest' in d['mediaType'] or 'index' in d['mediaType']:
                      obj=json.loads(raw)
                      for child in obj.get('manifests',[]):visit(child)
                      if 'config' in obj:
                          visit(obj['config'])
                          for child in obj['layers']:visit(child)
                          cfg=json.loads(read('blobs/sha256/'+obj['config']['digest'].split(':')[1]))
                          if cfg.get('os')=='linux' and cfg.get('architecture')=='amd64':runtimes.append(d['digest'])
              for d in json.loads(index)['manifests']:visit(d)
              if runtimes!=[evidence['manifest_digest']]:raise SystemExit('original graph runtime is not the unique approved child')
              manifest=json.loads(read('blobs/sha256/'+evidence['manifest_digest'].split(':')[1]))
              if manifest['config']['digest']!=evidence['config_digest']:raise SystemExit('manifest/config binding mismatch')
              config=json.loads(read('blobs/sha256/'+evidence['config_digest'].split(':')[1]))
              if config.get('os')!='linux' or config.get('architecture')!='amd64' or config['config']['Labels']['org.opencontainers.image.revision']!=os.environ['CANDIDATE_SHA']:raise SystemExit('runtime config mismatch')
              diffs=config['rootfs']['diff_ids']
              if len(diffs)!=len(manifest['layers']):raise SystemExit('rootfs count mismatch')
              for layer,expected in zip(manifest['layers'],diffs):
                  member=members['blobs/sha256/'+layer['digest'].split(':')[1]]
                  raw=tar.extractfile(member)
                  if layer['mediaType'].endswith('+gzip'):raw=gzip.GzipFile(fileobj=raw)
                  elif not layer['mediaType'].endswith('.tar'):raise SystemExit('unsupported layer encoding')
                  h=hashlib.sha256()
                  for b in iter(lambda:raw.read(1024*1024),b''):h.update(b)
                  if 'sha256:'+h.hexdigest()!=expected:raise SystemExit('rootfs diff_id mismatch')
          if evidence['index_digest']!='sha256:a85646a9e0b3aebe996110f410488c8a9402196ca8864efa16b55a8c699b2417' or evidence['manifest_digest']!='sha256:d76f4e0dbfc0e804aaae572693559b693b26009f383a8238b9656549a1e21d0a' or evidence['config_digest']!='sha256:0d759d3b51bc571e201456fb98e2b18421fae3ebc741ccaf4b5cecf0d6b708bf' or len(verified)!=31:raise SystemExit('fixed original OCI identity mismatch')
          # Preserve the original archive. Derive only a one-child index for a local import name.
          image='localhost/stage-e9f-runtime:smoke'
          derived=root/'native-runtime.oci.tar'
          with tarfile.open(archive) as original, tarfile.open(derived,'w') as output:
              descriptor=None
              for member in original.getmembers():
                  if member.isfile() and member.name.removeprefix('./')=='blobs/sha256/'+evidence['manifest_digest'].split(':')[1]:
                      descriptor=dict(descriptors[evidence['manifest_digest']]);descriptor['annotations']={**descriptor.get('annotations',{}),'org.opencontainers.image.ref.name':image}
              if descriptor is None:raise SystemExit('runtime child absent')
              index_bytes=json.dumps({'schemaVersion':2,'mediaType':'application/vnd.oci.image.index.v1+json','manifests':[descriptor]},separators=(',',':')).encode()
              for member in original.getmembers():
                  if member.name.removeprefix('./')=='index.json':continue
                  output.addfile(member,original.extractfile(member) if member.isfile() else None)
              header=tarfile.TarInfo('index.json');header.size=len(index_bytes);header.mode=0o644
              output.addfile(header,io.BytesIO(index_bytes))
          ctr('images','import','--platform','linux/amd64',str(derived))
          rows=ctr('images','list').decode().splitlines()
          header=rows[0].split(); digest_column=header.index('DIGEST')
          matches=[r.split() for r in rows[1:] if r.split()[0]==image]
          if len(matches)!=1 or matches[0][digest_column]!=evidence['manifest_digest']:raise SystemExit('native image target differs from original child manifest')
          for digest in [evidence['manifest_digest'],evidence['config_digest'],*[layer['digest'] for layer in manifest['layers']]]:
              raw=ctr('content','get',digest); d=descriptors[digest]
              if len(raw)!=d['size'] or 'sha256:'+hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit('native runtime descriptor hash/size mismatch')
          # ctr unpack is performed by run/create, then verify its committed rootfs parent.
          chain=diffs[0]
          for d in diffs[1:]:chain='sha256:'+hashlib.sha256((chain+' '+d).encode()).hexdigest()
          drop_caps=['CAP_CHOWN','CAP_DAC_OVERRIDE','CAP_FSETID','CAP_FOWNER','CAP_MKNOD','CAP_NET_RAW','CAP_SETGID','CAP_SETUID','CAP_SETFCAP','CAP_SETPCAP','CAP_NET_BIND_SERVICE','CAP_SYS_CHROOT','CAP_KILL','CAP_AUDIT_WRITE']
          cap_args=[arg for cap in drop_caps for arg in ['--cap-drop',cap]]
          for suffix,args in [('help',['--help']),('plugin-runtime',['verify-plugin-runtime'])]:
              cid='e9f-'+suffix
              temp_args=['--mount','type=tmpfs,src=tmpfs,dst=/tmp,options=rw:nosuid:nodev:noexec:mode=1777:size=16m'] if suffix=='plugin-runtime' else []
              ctr('containers','create','--snapshotter','overlayfs','--read-only','--user','10001:10001',*temp_args,*cap_args,image,cid,'/usr/local/bin/memeloop-token-center',*args)
              info=json.loads(ctr('containers','info',cid))
              if info['Image']!=image:raise SystemExit('container image binding mismatch')
              snap=json.loads(ctr('snapshots','--snapshotter','overlayfs','info',info['SnapshotKey']))
              if snap.get('Parent')!=chain:raise SystemExit('container rootfs chain mismatch')
              spec=info['Spec']
              if not spec['process'].get('noNewPrivileges') or any(spec['process'].get('capabilities',{}).values()):raise SystemExit('container capability/privilege isolation mismatch')
              if not spec['root']['readonly'] or spec['process']['user']['uid']!=10001 or not any(n['type']=='network' and not n.get('path') for n in spec['linux']['namespaces']):raise SystemExit('container isolation mismatch')
              temporary=[m for m in spec['mounts'] if m['destination']=='/tmp']
              if suffix=='plugin-runtime' and (len(temporary)!=1 or temporary[0]['type']!='tmpfs' or temporary[0]['source']!='tmpfs' or not {'rw','nosuid','nodev','noexec','mode=1777','size=16m'}.issubset(set(temporary[0]['options']))):raise SystemExit('private bounded temporary mount mismatch')
              if suffix=='help' and temporary:raise SystemExit('help runtime changed temporary mounts')
              (root/(suffix+'-container.json')).write_text(json.dumps(info,indent=2))
              output=ctr('tasks','start',cid)
              (root/(suffix+'.txt')).write_bytes(output)
              ctr('containers','delete',cid)
          evidence.update({'status':'smoke_pass','smoke_run':os.environ['GITHUB_RUN_ID'],'artifact_id':os.environ['ARTIFACT_ID'],'artifact_digest':'sha256:'+os.environ['ARTIFACT_DIGEST'],'rootfs_chain':chain,'runtime_image':image,'verified_descriptors':len(verified)})
          (root/'smoke-receipt.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage-e9f-native-smoke-evidence
          path: |
            ${{ runner.temp }}/native-smoke/*.json
            ${{ runner.temp }}/native-smoke/*.txt
          if-no-files-found: error
          retention-days: 3

  orphan-reaper-contract:
    if: inputs.contract == 'orphan-reaper-971'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: token_center_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/token_center_test
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify SQLite and PostgreSQL orphan scan fairness
        run: |
          set -o pipefail
          test -n "$MTC_TEST_POSTGRES_URL"
          cargo test --locked --lib --no-run
          for selector in \
            db::requests::settlement::orphan_scan_tests::sqlite_orphan_scan_advances_past_ineligible_rows_and_revisits_late_eligibility \
            db::requests::settlement::orphan_scan_tests::postgres_orphan_scan_advances_past_ineligible_rows_and_revisits_late_eligibility
          do
            echo "Contract: $selector"
            timeout 180s cargo test --locked --lib "$selector" -- --exact 2>&1 | tee /tmp/orphan-reaper-contract.log
            grep -F '1 passed; 0 failed' /tmp/orphan-reaper-contract.log
          done
  response-carrier-contract:
    if: inputs.contract == 'response-carrier-968'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify response carrier ownership and archive behavior
        run: |
          set -o pipefail
          cargo test --locked --lib --no-run
          for selector in \
            error::tests::object_storage_classification_preserves_only_typed_safe_facts \
            error::tests::dependency_errors_do_not_retain_secret_bearing_driver_messages \
            response_archive_spool::tests::shared_capture_reaches_eof_while_all_upload_slots_are_held \
            response_archive_spool::tests::unavailable_local_directory_does_not_gate_complete_original \
            response_archive_spool::tests::cancelled_unsealed_carrier_releases_owned_capture_without_acknowledging_original \
            response_archive_spool::tests::empty_shared_carrier_publishes_the_exact_empty_original \
            response_archive_spool::tests::original_stream_capture_uses_selected_backend_without_legacy_body_copy \
            api::proxy::tests::persistence_isolation::pending_response_archive_begin_does_not_hold_first_byte_or_eof \
            api::proxy::tests::sse_delivery::large_source_backed_conversation_stream_releases_raw_bytes_before_terminal_projection
          do
            echo "Contract: $selector"
            timeout 180s cargo test --locked --lib "$selector" -- --exact 2>&1 | tee /tmp/response-carrier-contract.log
            grep -F '1 passed; 0 failed' /tmp/response-carrier-contract.log
          done
  reader-contract:
    if: inputs.contract == 'bfa-reader'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision || 'bfa6b1b794ff09197a2b2d2ade496d931b98c285' }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify qualified HEAD routing and stream detail
        run: |
          set -o pipefail
          cargo test --locked --lib archive::routing_tests::qualified_cas_reads_preserve_backend_tenant_and_stream_integrity -- --exact 2>&1 | tee /tmp/head-test.log
          grep -F '1 passed; 0 failed' /tmp/head-test.log
          cargo test --locked --lib readable_stream_archives_are_not_reported_as_missing_or_invalid 2>&1 | tee /tmp/detail-test.log
          grep -F '1 passed; 0 failed' /tmp/detail-test.log
  raw-publish-contract:
    if: inputs.contract == 'e2db-raw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision || 'e2db112d7b31e54e9c8ab5b312b9150a255d4c21' }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Verify relocated raw publication and binding
        run: |
          set -o pipefail
          cargo test --locked --lib relocated_raw_root_replays_and_binds_published_body_without_retired_copy 2>&1 | tee /tmp/raw-publish-test.log
          grep -F '1 passed; 0 failed' /tmp/raw-publish-test.log
  staging-contract:
    if: inputs.contract == 'staging-155'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Record checked-out source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: ./.github/actions/checkout-plugin-examples
      - name: Start isolated RustFS fixture
        env:
          RUSTFS_ACCESS_KEY: rustfs-test-fixture
          RUSTFS_SECRET_KEY: synthetic-test-only-secret-707
        run: |
          docker run --detach --name rustfs-contract --publish 127.0.0.1:19000:9000 \
            --memory 1g --cpus 2 --env RUSTFS_ACCESS_KEY --env RUSTFS_SECRET_KEY \
            --env RUSTFS_ADDRESS=:9000 --env RUSTFS_CONSOLE_ENABLE=false \
            --env RUSTFS_OBS_LOG_DIRECTORY= --env RUSTFS_OBS_LOGGER_LEVEL=warn \
            --entrypoint /usr/bin/rustfs \
            rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" \
              --request PUT http://127.0.0.1:19000/conversation-contract-test; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify final H2 and shared recovery proxy consumers
        env:
          MTC_RUSTFS_TEST_ENDPOINT: http://127.0.0.1:19000
          MTC_RUSTFS_TEST_BUCKET: conversation-contract-test
          MTC_RUSTFS_TEST_ACCESS_KEY: rustfs-test-fixture
          MTC_RUSTFS_TEST_SECRET_KEY: synthetic-test-only-secret-707
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6daae61a7425d206af637b9bd2a7f5e69287eeb6"
          git rev-parse HEAD
          mkdir -p /tmp/pr1041-fixture-evidence
          cargo test --locked --lib api::proxy::tests::codex_http2_failure_safety -- --nocapture 2>&1 | tee /tmp/pr1041-fixture-evidence/h2.log
          grep -F '11 passed; 0 failed' /tmp/pr1041-fixture-evidence/h2.log
          cargo test --locked --lib json_source::carrier_cancel_tests::cancellation_drops_a_pending_object_read_and_releases_the_source -- --exact --nocapture 2>&1 | tee /tmp/pr1041-fixture-evidence/cancel.log
          grep -F '1 passed; 0 failed' /tmp/pr1041-fixture-evidence/cancel.log
          cargo test --locked --lib gateway_body::carrier::small_put_tests -- --ignored --nocapture 2>&1 | tee /tmp/pr1041-fixture-evidence/small-put.log
          grep -F '5 passed; 0 failed' /tmp/pr1041-fixture-evidence/small-put.log
          cargo test --locked --lib gateway_body::carrier::resource_wakeup_tests::actual_put_is_not_cancelled_when_ram_wakes_and_lost_ack_keeps_source -- --ignored --exact --nocapture 2>&1 | tee /tmp/pr1041-fixture-evidence/resource.log
          grep -F '1 passed; 0 failed' /tmp/pr1041-fixture-evidence/resource.log
      - name: Retain the shared fixture consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1041-fixture-6daae
          path: /tmp/pr1041-fixture-evidence/
          if-no-files-found: warn
          retention-days: 7

  next-release-contract:
    if: inputs.contract == 'next-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
          POSTGRES_DB: memeloop_token_center_test
        ports:
