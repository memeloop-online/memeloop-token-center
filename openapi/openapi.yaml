          description: OAuth credential revoked locally and, when supported, at the provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisconnectUpstreamOAuthResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /internal/v1/oauth/cursor/start:
    post:
      tags: [Upstream providers]
      operationId: startCursorOAuth
      summary: Start direct Cursor PKCE authorization
      security: [{ serviceBearer: [] }]
      x-required-scope: oauth:write
