              schema: { $ref: '#/components/schemas/OperatorGenerationJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/generations/{job_id}/assets/{asset_id}:
    get:
      tags: [Operator traffic]
      operationId: downloadOperatorGenerationAsset
      summary: Stream one archived generation asset with optional byte range
      description: |
        Resolves the asset only through its job and asset UUIDs; the internal archive
        locator is never accepted or returned. Global service credentials may select a
        tenant. A tenant-scoped credential is fixed to its tenant, and a cross-tenant or
        otherwise invisible asset returns 404. Exactly one RFC 7233 byte range is
        supported; multiple or unsatisfiable ranges return 416.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
