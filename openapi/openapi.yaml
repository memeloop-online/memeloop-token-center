openapi: 3.1.0
info:
  title: Memeloop Token Center API
  version: 0.1.0
  summary: Multi-protocol AI gateway, credential, quota, and archive API
  description: |
    Contract for the API surface implemented by `src/api.rs`.

    The production Helm deployment separates the **control** and **gateway** roles.
    `/internal/v1/*` is served only by the control role. `/self/v1/*` and `/v1/*`
    are served only by the gateway role. `/healthz` is present on every HTTP-serving
    role. `/livez` is process liveness and `/readyz` checks PostgreSQL plus archive
    readiness. `/healthz` is a deprecated compatibility alias for `/livez`.

    All monetary amounts are decimal strings with at most six fractional digits.
    All timestamps named `*_at` are Unix epoch milliseconds unless stated otherwise.
    Successful and error responses under `/internal`, `/self`, and `/v1` include
    `X-MTC-API-Version: v1`.
    Issued client and service credential secrets are returned only by create/rotate
    operations and must be stored by the caller immediately.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://token-center.api.onetwo.website
    description: Gateway role
  - url: https://token-center.k3s.onetwo.website
    description: Control role
tags:
  - name: System
    description: Process status and runtime-discovered schemas/plugins.
  - name: Client credentials
    description: Stable downstream identities, secrets, policy, status, and CPA compatibility.
  - name: Service credentials
    description: Least-privilege control-plane credentials for internal integrations.
  - name: Upstream providers
    description: Unified upstream identities independent of their authentication method.
  - name: Routes and pricing
    description: Public-model routing and token/multimodal price configuration.
  - name: Credits
    description: Idempotent account grants, reversals, and ledger inspection.
  - name: Entitlements
    description: Exact, versioned subscription credit reconciliation for memeloop web.
  - name: Operator traffic
    description: Tenant/global traffic statistics, request detail, and live events.
  - name: Self service
    description: Credential-scoped, read-only usage and logical-conversation views.
  - name: OpenAI compatible
    description: OpenAI-compatible model, chat, Responses, and embedding routes.
  - name: Anthropic compatible
    description: Anthropic Messages-compatible routes used by Claude Code.
  - name: Multimodal generation
    description: Synchronous image and asynchronous image/video generation routes.
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Deprecated process-liveness compatibility alias
      description: Use `/livez`. This compatibility route does not check dependencies.
      security: []
      responses:
        '200':
          description: Process is serving HTTP.
          headers:
            Deprecation:
              description: Always `true` for this deprecated alias.
              schema: { const: 'true' }
            Link:
              description: Successor endpoint relation.
              schema: { const: '</livez>; rel="successor-version"' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /livez:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Report process liveness without probing dependencies
      security: []
      responses:
        '200':
          description: Process is serving HTTP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Probe database and archive readiness
      description: |
        Available on every HTTP role for Kubernetes probes. PostgreSQL and archive
        checks run concurrently with a two-second bound and a five-second singleflight
        cache, so probe bursts do not amplify dependency traffic.
      security: []
      responses:
        '200':
          description: Both dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: PostgreSQL or archive readiness failed or timed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    get:
      tags: [System]
      operationId: getPrometheusMetrics
      summary: Export bounded-cardinality operational metrics
      description: |
        Registered only by the control/all role. Labels are restricted to controlled
        methods, matched route templates, status classes, providers, operations,
        dependencies, pool states, and generation states. Tenant, credential, model,
        URL, resource ID, and error-text labels are deliberately excluded.
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      responses:
        '200':
          description: Prometheus text exposition.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            'text/plain; version=0.0.4; charset=utf-8':
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /version:
    get:
      tags: [System]
      operationId: getBuildVersion
      summary: Read build and API compatibility metadata
      description: Registered only by the control/all role. Local builds may report `unknown` for injected build fields.
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      responses:
        '200':
          description: Build identity and supported API versions.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/keys:
    get:
      tags: [Client credentials]
      operationId: listClientCredentials
      summary: List stable client credential identities
      description: |
        A tenant-scoped service credential is always restricted to its bound tenant.
        A global credential may omit `tenant_external_id` to inspect all tenants.
        The implementation currently returns at most 500 records and has no cursor.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: principal_external_id
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Stable identities; never contains credential secrets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedClientCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Client credentials]
      operationId: createClientCredential
      summary: Provision a stable client identity and its first credential
      description: |
        Creates or reuses the tenant and principal, creates a credit account and stable
        `key_id`, then returns the one-time `mtc_…` secret. When `Idempotency-Key` is
        supplied, an identical request may replay the same response for 24 hours; use
        of the same key with a different normalized request is rejected.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClientCredentialRequest' }
      responses:
        '201':
          description: Newly issued or idempotently replayed one-time credential.
          headers:
            X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedClientCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/keys/{key_id}/rotate:
    post:
      tags: [Client credentials]
      operationId: rotateClientCredential
      summary: Replace a client credential secret without migrating its identity
      description: |
        Revokes all previous native and legacy secrets. Policy, balance, requests, and
        conversations remain attached to the same `key_id`. `Idempotency-Key` is required;
        replaying the same rotation key within 24 hours returns the same generation and
        the same one-time secret rather than rotating again. Idempotency keys are global
        across client and service credential rotations and must not be reused for another
        resource.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters:
        - $ref: '#/components/parameters/KeyId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          description: One-time replacement credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedClientCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/policy:
    put:
      tags: [Client credentials]
      operationId: replaceClientCredentialPolicy
      summary: Replace model permissions, rate limits, and budgets
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPolicy' }
      responses:
        '200':
          description: Stored replacement policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialPolicy' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/status:
    patch:
      tags: [Client credentials]
      operationId: setClientCredentialStatus
      summary: Activate, suspend, or permanently revoke a client identity
      description: "`revoked` is terminal and revokes all credential generations. A suspended identity may be returned to active."
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                required: [key_id, status]
                properties:
                  key_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/CredentialStatus' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/legacy-credentials:
    post:
      tags: [Client credentials]
      operationId: attachLegacyClientCredential
      summary: Attach an unchanged CPA credential to a stable identity
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential, source_hash]
              properties:
                credential: { type: string, writeOnly: true, minLength: 1 }
                source_hash: { type: string, minLength: 1 }
      responses:
        '201':
          description: Legacy credential metadata; no plaintext secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/service-tokens:
    get:
      tags: [Service credentials]
      operationId: listServiceCredentials
      summary: List service credential identities
      description: Global service credentials only. Secrets are never returned.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:read
      responses:
        '200':
          description: Service credential metadata.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Service credentials]
      operationId: createServiceCredential
      summary: Create a least-privilege service credential
      description: Global service credentials only. Bind normal integrations to one tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceCredentialRequest' }
      responses:
        '201':
          description: One-time service credential secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedServiceCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/service-tokens/{service_id}/rotate:
    post:
      tags: [Service credentials]
      operationId: rotateServiceCredential
      summary: Rotate a service credential while retaining its identity and scopes
      description: |
        `Idempotency-Key` is required. Replaying the same rotation key within 24 hours
        returns the same generation and one-time token rather than rotating again.
        Idempotency keys are global across client and service credential rotations and
        must not be reused for another resource.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          description: One-time replacement service credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedServiceCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/service-tokens/{service_id}/status:
    patch:
      tags: [Service credentials]
      operationId: setServiceCredentialStatus
      summary: Activate, suspend, or permanently revoke a service credential
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                required: [service_id, status]
                properties:
                  service_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/CredentialStatus' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/provider-types:
    get:
      tags: [Upstream providers]
      operationId: listProviderTypes
      summary: List built-in and plugin-contributed provider types and JSON Schemas
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      responses:
        '200':
          description: Provider contributions available in this process.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/tenants:
    get:
      tags: [System]
      operationId: listTenants
      summary: List visible tenant external IDs
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      responses:
        '200':
          description: A scoped credential sees only its own tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [external_id]
                  properties:
                    external_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/plugins:
    get:
      tags: [System]
      operationId: listPlugins
      summary: List loaded plugin manifests
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      responses:
        '200':
          description: Sanitized loaded manifests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PluginManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/schemas:
    get:
      tags: [System]
      operationId: getConfigurationSchemas
      summary: Return JSON Schemas used by the operator UI
      description: These schemas are UI/discovery documents. Provider-specific schemas are also returned by `/internal/v1/provider-types`.
      security: [{ serviceBearer: [] }]
      x-required-scope: schemas:read
      responses:
        '200':
          description: Named JSON Schema documents.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: [object, boolean] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstreams:
    get:
      tags: [Upstream providers]
      operationId: listUpstreamProviders
      summary: List unified upstream provider accounts
      description: API credentials, OAuth, subscription bridges, and no-auth connections are authentication methods of the same upstream account resource.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      parameters: [{ $ref: '#/components/parameters/TenantFilter' }]
      responses:
        '200':
          description: Upstream account metadata without secrets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UpstreamProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Upstream providers]
      operationId: createUpstreamProvider
      summary: Create an upstream provider account with a direct credential
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUpstreamProviderRequest' }
      responses:
        '201':
          description: Stable upstream provider identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstreams/{account_id}:
    put:
      tags: [Upstream providers]
      operationId: replaceUpstreamProviderConfiguration
      summary: Replace the editable configuration of one unified upstream
      description: |
        Keeps the stable upstream identity, provider driver, authentication method,
        routes, and history. `expected_updated_at` provides optimistic concurrency.
        Repeating an already-applied identical representation is safe; a stale,
        non-identical representation returns 409. Provider JSON Schema and outbound
        destination policy are revalidated before the write.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceUpstreamProviderRequest' }
      responses:
        '200':
          description: Updated upstream account metadata without secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [Upstream providers]
      operationId: setUpstreamProviderStatus
      summary: Activate or disable one unified upstream
      description: |
        Disabling immediately removes the account from route resolution without
        deleting routes or audit history. Activation revalidates the current
        credential. Repeating the current status is safe; a stale non-identical
        transition returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetUpstreamProviderStatusRequest' }
      responses:
        '200':
          description: Upstream account in the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Upstream providers]
      operationId: deleteUpstreamProvider
      summary: Delete a disabled, unreferenced unified upstream
      description: |
        The account must be disabled, have no model routes, and have no text or
        generation request history. Otherwise it must remain disabled for audit and
        the operation returns 409. A missing account, including a repeated successful
        delete, returns 204.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredTenant'
        - $ref: '#/components/parameters/ExpectedUpdatedAt'
      responses:
        '204': { description: Upstream deleted or already absent. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/upstreams/{account_id}/health:
    post:
      tags: [Upstream providers]
      operationId: probeUpstreamProviderHealth
      summary: Probe one upstream without returning its response body
      description: |
        Performs a bounded provider-specific read using the current credential. The
        upstream response body is never read, logged, or returned. Transport and
        authentication failures are represented by `status: unhealthy` in a 200
        management response; they are not proxy responses.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Sanitized health result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamHealthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/credential:
    put:
      tags: [Upstream providers]
      operationId: rotateUpstreamCredential
      summary: Replace an upstream authentication method while retaining its account identity
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        `Idempotency-Key` is required. Replaying the same key for the same account and
        credential within 24 hours returns the stored generation. Reuse for another
        resource or different credential is rejected. The stable upstream ID, routes,
        and request history do not change.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: { $ref: '#/components/schemas/UpstreamCredential' }
      responses:
        '200':
          description: Updated upstream metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/oauth/refresh:
    post:
      tags: [Upstream providers]
      operationId: refreshUpstreamOAuthCredential
      summary: Refresh an OAuth upstream and advance its credential generation
      description: |
        `Idempotency-Key` is required and claims the refresh before the authorization
        server is called, so an ambiguous timeout can be replayed without refreshing
        twice. The stored result is replayable for 24 hours. Reuse outside the same
        upstream refresh operation is rejected.
      security: [{ serviceBearer: [] }]
      x-required-scope: oauth:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          description: Updated stable upstream identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
