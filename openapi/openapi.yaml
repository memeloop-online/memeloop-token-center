      required: [driver, login_url, session_token, expires_at, security_notice]
      properties:
        driver: { const: anthropic-claude }
        login_url: { type: string, format: uri }
        session_token: { type: string, writeOnly: true, description: Authenticated, encrypted login state bound to the tenant and operator credential. }
        expires_at: { type: integer, format: int64 }
        security_notice: { const: paste_only_the_code_from_the_login_you_started }
    StartKimiOAuthRequest:
      type: object
      additionalProperties: false
      required: [account_name]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1 }
        upstream_account_id: { type: string, format: uuid, description: Existing native Kimi upstream to reauthorize without changing its name or configuration. }
        proxy_url: { type: string, writeOnly: true, description: Optional account SOCKS5H proxy for creation by a global operator. Reauthorization uses the current account proxy and rejects this field. }
    KimiDeviceLoginStart:
      type: object
      additionalProperties: false
      required: [driver, verification_url, user_code, session_token, expires_at, poll_after_seconds, security_notice]
      properties:
        driver: { const: kimi-oauth }
        verification_url: { type: string, format: uri }
        user_code: { type: string, minLength: 1 }
        session_token: { type: string, writeOnly: true }
        expires_at: { type: integer, format: int64 }
        poll_after_seconds: { type: integer, minimum: 5 }
        security_notice: { const: only_continue_if_you_started_this_login }
    StartCopilotOAuthRequest:
      type: object
      additionalProperties: false
      required: [account_name]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1 }
        upstream_account_id: { type: string, format: uuid, description: Existing stable GitHub Copilot upstream identity to reauthorize. }
        proxy_url:
          type: string
          pattern: '^socks5h://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Optional account proxy for the complete OAuth and runtime lifecycle. Omit for a direct connection. Reauthorization reuses the current account setting.
    CopilotDeviceLoginStart:
      type: object
      additionalProperties: false
      required: [driver, verification_url, user_code, session_token, expires_at, poll_after_seconds, security_notice]
      properties:
        driver: { const: github-copilot }
        verification_url: { type: string, format: uri }
        user_code: { type: string, minLength: 1 }
        session_token: { type: string, writeOnly: true, description: Authenticated, encrypted login state bound to the tenant and operator credential. }
        expires_at: { type: integer, format: int64 }
        poll_after_seconds: { type: integer, format: int64, minimum: 1, maximum: 60 }
        security_notice: { const: only_continue_if_you_started_this_login }
    CodexDeviceLoginStart:
      type: object
      additionalProperties: false
      required: [driver, verification_url, user_code, session_token, expires_at, poll_after_seconds, security_notice]
      properties:
        driver: { const: openai-codex }
        verification_url: { type: string, format: uri }
        user_code: { type: string, minLength: 1 }
        session_token: { type: string, writeOnly: true, description: Authenticated, encrypted login state bound to the tenant and operator credential. }
        expires_at: { type: integer, format: int64 }
        poll_after_seconds: { type: integer, format: int64, minimum: 1, maximum: 60 }
        security_notice: { const: only_continue_if_you_started_this_login }
    OAuthLoginStart:
      type: object
      additionalProperties: false
      required: [driver, login_url, session_token, expires_at, poll_after_seconds]
      properties:
        driver: { type: string }
        login_url: { type: string, format: uri }
        session_token: { type: string, writeOnly: true, description: "Authenticated, encrypted login state." }
        expires_at: { type: integer, format: int64 }
        poll_after_seconds: { type: integer, format: int64, minimum: 0 }
    OAuthPollRequest:
      type: object
      required: [session_token]
      properties:
        session_token: { type: string, writeOnly: true }
    OAuthPending:
      type: object
      required: [status, retry_after_seconds]
      properties:
        status: { const: pending }
        retry_after_seconds: { type: integer, format: int64, minimum: 0 }
        message: { type: [string, 'null'] }
    PluginManifest:
      type: object
      required: [id, version, wit_version, capabilities, contributions]
      properties:
        id: { type: string }
        version: { type: string }
        wit_version: { type: string }
        wasm: { type: [string, 'null'] }
        capabilities:
          type: array
          items: { type: object, additionalProperties: true }
        contributions:
          type: object
          required: [traffic_policy, request_rewrite, configuration, providers, operator_ui, service_data]
          properties:
            traffic_policy: { type: boolean }
            request_rewrite: { type: boolean }
            configuration:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required: [schema, default]
                  properties:
                    schema: { type: object, additionalProperties: true }
                    default: {}
            providers:
              type: array
              items: { $ref: '#/components/schemas/ProviderType' }
            operator_ui:
              type: array
              description: Operator tabs and cards rendered by a core projection or a signed module from the active installed plugin snapshot.
              items: { $ref: '#/components/schemas/PluginOperatorUiContribution' }
            service_data:
              type: array
              maxItems: 32
              description: Worker-collected typed JSON feeds using a capability-audited HTTPS URL or signed component adapter.
              items: { $ref: '#/components/schemas/PluginServiceDataEndpoint' }
    PluginOperatorUiContribution:
      type: object
      additionalProperties: false
      required: [id, slot, label, icon, renderer]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        slot: { type: string, enum: [operator.sidebar.tab, operator.overview.card, operator.page.before, operator.page.after] }
        category:
          type: [object, 'null']
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
            label: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        route: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
        target_route:
          type: [string, 'null']
          enum: [overview, requests, sessions, usage, generations, providers, routes, pricing, tenants, credentials, service-credentials, plugins, system-settings, null]
        label: { type: string, minLength: 1, maxLength: 120 }
        icon: { type: string, enum: [activity, chart, database, heart, plug, shield] }
        renderer:
          type: string
          enum: [typed_data_v1, component_v1]
          description: Selects a core projection or a component from a signed runtime module.
        module_entry:
          type: [string, 'null']
          minLength: 4
          maxLength: 240
          pattern: '^[A-Za-z0-9._/-]+\.m?js$'
          allOf:
            - not: { type: string, pattern: '(^/|//)' }
            - not: { type: string, pattern: '(^|/)\.{1,2}(/|$)' }
          description: Package-relative signed JavaScript module used by component_v1.
        module_sha256:
          type: [string, 'null']
          readOnly: true
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Digest of the exact module bytes captured by the active plugin runtime.
        component_id: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
        component_props: { type: [object, 'null'], additionalProperties: true }
        presentation:
          type: [string, 'null']
          enum: [health_intelligence_v1, projection_v1, null]
        data_endpoint: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
    PluginServiceDataEndpoint:
      type: object
      additionalProperties: false
      required: [id, required_scope, response_schema, fallback, cache_ttl_seconds, timeout_millis, max_body_bytes]
      oneOf:
        - required: [url]
          not: { required: [component_adapter] }
        - required: [component_adapter]
          not: { required: [url] }
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        url: { type: string, format: uri, description: HTTPS JSON collector URL declared by the plugin HTTP capability; credentials, fragments, and query strings are rejected. }
        component_adapter:
          type: object
          additionalProperties: false
          required: [api_version, collector, normalizer, config]
          properties:
            api_version: { type: string, const: component-v1 }
            collector: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
            normalizer: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
            config: { type: object, additionalProperties: true }
        required_scope: { type: string, enum: [credits:read, entitlements:read, keys:read, metrics:read, plugins:read, prices:read, providers:read, requests:read, routes:read, schemas:read, service_tokens:read, tenants:read] }
        response_schema: { type: object, additionalProperties: true, description: Object-root JSON Schema for response data. writeOnly fields are rejected. }
        fallback: { type: object, additionalProperties: true, description: Schema-valid fallback typed data. }
        cache_ttl_seconds: { type: integer, minimum: 1, maximum: 3600 }
        timeout_millis: { type: integer, minimum: 1, maximum: 10000 }
        max_body_bytes: { type: integer, minimum: 1, maximum: 1048576 }
    PluginServiceDataResponse:
      type: object
      additionalProperties: false
      required: [data, partial, provenance]
      properties:
        data: { type: object, additionalProperties: true, description: Manifest-schema-validated typed JSON only. }
        partial: { type: boolean, description: True when a stale cache entry or manifest fallback replaced a failed upstream fetch. }
        provenance: { $ref: '#/components/schemas/PluginServiceDataProvenance' }
    PluginServiceDataProvenance:
      type: object
      additionalProperties: false
      required: [plugin_id, endpoint_id, origin, fetched_at, source, freshness, last_attempt_at, next_attempt_at, consecutive_failures]
      properties:
        plugin_id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        endpoint_id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        origin: { type: string, description: Audited HTTPS origin or signed component collector identity; no request path or credentials are exposed. }
        fetched_at: { type: integer, format: int64, minimum: 0, description: Unix epoch milliseconds of the last successful collection; zero until the first successful collection. }
        source: { type: string, enum: [network, cache, component, stale_cache, fallback] }
        freshness: { type: string, enum: [fresh, stale, unavailable] }
        last_attempt_at: { type: [integer, 'null'], format: int64 }
        next_attempt_at: { type: [integer, 'null'], format: int64 }
        consecutive_failures: { type: integer, minimum: 0 }
        error_code: { type: [string, 'null'], enum: [timeout, network, http_status, content_type, body_limit, invalid_json, schema_validation, component_execution, component_output, database, null] }
    PluginConfiguration:
      type: object
      additionalProperties: false
      required: [plugin_id, tenant_external_id, value, source, scope_version, updated_at, schema_digest]
      properties:
        plugin_id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        tenant_external_id: { type: [string, 'null'] }
        value: {}
        source: { type: string, enum: [default, global, tenant] }
        scope_version: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: [integer, 'null'], format: int64 }
        schema_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    PutPluginConfigurationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, value]
      properties:
        tenant_external_id: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        value: {}
    UpstreamModel:
      type: object
      additionalProperties: false
      required: [id, protocol, context_window, reservation_token_bound, reservation_bound_source]
      properties:
        id: { type: string, minLength: 1, maxLength: 500 }
        protocol: { type: string, minLength: 1, maxLength: 64 }
        context_window: { type: [integer, 'null'], format: int64, minimum: 1 }
        reservation_token_bound:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Conservative MemeLoop reservation bound; this is not an upstream-declared maximum output size.
        reservation_bound_source:
          type: [string, 'null']
          enum: [mtc_context_window_bound, administrator_override, null]
    ModelPickerPage:
      type: object
      additionalProperties: false
      required: [contract_version, generated_at, data, next_cursor]
      properties:
        contract_version: { type: string, const: model_picker_projection_v1 }
        generated_at: { type: integer, format: int64, minimum: 0 }
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ModelPickerItem' }
        next_cursor: { type: [string, 'null'], maxLength: 2048 }
    ModelPickerItem:
