      security: [{ clientBearer: [] }]
      x-authorization-contract:
        identity: stable-key-id
        ownership-failure: 404
        object-binding: request-id-and-asset-id
        archive-locator-exposed: false
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /self/v1/stats:
    get:
      tags: [Self service]
      operationId: getOwnStatistics
      summary: Get bounded, filtered usage for the current stable identity
      description: |
        Always binds the authenticated stable `key_id`. Omitted `to_created_at`
        means request time; omitted `from_created_at` means 30 days before the
        effective upper bound. The resulting inclusive interval may not exceed 93
        days. All supplied filters are combined with AND.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
      responses:
        '200':
          description: Own aggregate usage.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Statistics'
                  - type: object
                    required: [key_id]
                    properties:
                      key_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/usage-analysis:
    get:
      tags: [Self service]
      operationId: getOwnUsageAnalysis
      summary: Analyze bounded usage for the current stable credential
      description: |
        Always binds the stable tenant and `key_id` established by the supplied
        client credential. No tenant, key, principal, route, session, or upstream
        selector is accepted or returned. `auto` selects hourly rollups through
        31 days and daily rollups for longer ranges; the maximum inclusive range
        is 93 days. Costs remain separated by currency. Average duration is exact
        for the selected rollups; P95 is a fixed-histogram approximation capped at
        60000 ms. The response is assembled from one consistent read-only database
        snapshot.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [auto, hour, day], default: auto }
        - $ref: '#/components/parameters/ModelFilter'
        - name: protocol
          in: query
          required: false
          description: Exact canonical protocol family.
          schema: { type: string, enum: [openai, anthropic, openai-image, generation] }
        - name: status
          in: query
          required: false
          description: Terminal logical status; pending traffic is absent from usage rollups.
          schema: { type: string, enum: [success, error] }
        - $ref: '#/components/parameters/ErrorCodeFilter'
      responses:
        '200':
          description: Currency-safe analytics belonging only to the authenticated stable credential.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfUsageAnalysis' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/generations:
    get:
      tags: [Self service]
      operationId: listOwnGenerationJobs
      summary: List recent multimodal generation jobs
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit100' }]
      responses:
        '200':
          description: Own generation jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/generations/{job_id}:
    get:
      tags: [Self service]
      operationId: getOwnGenerationJob
      summary: Read one owned multimodal generation job
      security: [{ clientBearer: [] }]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned generation job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Self service]
      operationId: cancelOwnGenerationJob
      summary: Cancel one owned generation job
      description: |
        A queued job without an active worker lease is cancelled and refunded atomically.
        A running Seedance or ComfyUI job is fenced from its polling worker and returned as
        `cancelling`; its reservation remains held until a worker confirms the provider-specific
        upstream cancellation, then it becomes `cancelled` and is refunded. Repeating either
        request is idempotent. Submitting, already-finalizing, succeeded, or failed jobs return 400.
      security: [{ clientBearer: [] }]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled/cancelling job, or the same job from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /self/v1/generations/{job_id}/assets/{asset_id}:
    get:
      tags: [Self service]
      operationId: downloadOwnGenerationAsset
      summary: Stream one owned archived generation asset with optional byte range
      description: |
        The authenticated stable key identity must own the job and asset; an asset owned
        by another identity returns 404. The internal archive locator is never accepted or
        returned. Exactly one RFC 7233 byte range is supported; multiple or unsatisfiable
        ranges return 416.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /self/v1/conversations:
    get:
      tags: [Self service]
      operationId: listOwnLogicalConversations
      summary: List inferred logical conversation clusters
      security: [{ clientBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before_updated_at
          in: query
          description: Exclusive descending keyset cursor; must be paired with `before_cluster_id`.
          schema: { type: integer, format: int64 }
        - name: before_cluster_id
          in: query
          description: Exclusive descending keyset cursor; must be paired with `before_updated_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation clusters containing requests owned by the stable identity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationCluster' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/conversations/{cluster_id}:
    get:
      tags: [Self service]
      operationId: getOwnLogicalConversation
      summary: Read one logical conversation and relation evidence
      security: [{ clientBearer: [] }]
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: Maximum requests returned in this bounded conversation page.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: before_created_at
          in: query
          description: Exclusive descending request cursor; must be paired with `before_request_id`.
          schema: { type: integer, format: int64 }
        - name: before_request_id
          in: query
          description: Exclusive descending request cursor; must be paired with `before_created_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned requests and relation edges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /self/v1/sessions:
    get:
      tags: [Self service]
      operationId: listOwnLogicalSessions
      summary: List recent and active sessions for the authenticated stable key
      description: Credential rotation retains the same stable key identity and history.
      security: [{ clientBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before_last_activity_at
          in: query
          description: Exclusive descending cursor; must be paired with `before_session_id`.
          schema: { type: integer, format: int64 }
        - name: before_session_id
          in: query
          description: Exclusive descending cursor; must be paired with `before_last_activity_at`.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: state
          in: query
          schema: { type: string, enum: [all, active, has_errors], default: all }
        - name: model
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: q
          in: query
          description: Case-insensitive prefix of a session ID or this credential's alias.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Sessions visible only to the authenticated stable key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/sessions/{session_id}:
    get:
      tags: [Self service]
      operationId: getOwnLogicalSession
      summary: Read one logical session for the authenticated stable key
      security: [{ clientBearer: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: before_created_at
          in: query
          description: Exclusive cursor; must be paired with `before_request_id`.
          schema: { type: integer, format: int64 }
        - name: before_request_id
          in: query
          description: Exclusive cursor; must be paired with `before_created_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned requests and bounded relation edges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/models:
    get:
      tags: [OpenAI compatible]
      operationId: listAllowedModels
      summary: List currently routable models granted to the current credential
      security: [{ clientBearer: [] }]
      responses:
        '200':
          description: OpenAI-compatible model list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/chat/completions:
    post:
      tags: [OpenAI compatible]
      operationId: createChatCompletion
      summary: Proxy an OpenAI-compatible chat completion
      description: The body is forwarded after policy/plugin rewriting. Both JSON and SSE responses are supported and metered.
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAIChatRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/responses:
    get:
      tags: [OpenAI compatible]
      operationId: negotiateResponsesWebSocket
      summary: Negotiate the Responses transport before native WebSocket support is available
      description: |
        Temporary authenticated compatibility response for clients that probe the
        Responses WebSocket endpoint before using HTTP. This operation returns 426
        immediately so the client can use `POST /v1/responses`. It does not remove or
        replace the planned native Responses WebSocket transport.
      x-transport-negotiation:
        lifecycle: temporary-until-native-websocket
        fallback-operation: POST /v1/responses
        native-websocket-planned: true
      security: [{ clientBearer: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '426': { $ref: '#/components/responses/ResponsesWebSocketUpgradeRequired' }
    post:
      tags: [OpenAI compatible]
      operationId: createResponse
      summary: Proxy an OpenAI-compatible Responses request
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAIResponseRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/embeddings:
    post:
      tags: [OpenAI compatible]
      operationId: createEmbeddings
      summary: Proxy an OpenAI-compatible embeddings request
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAIEmbeddingRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/messages:
    post:
      tags: [Anthropic compatible]
      operationId: createAnthropicMessage
      summary: Proxy an Anthropic Messages request
      security: [{ clientBearer: [] }]
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessageRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/messages/count_tokens:
    post:
      tags: [Anthropic compatible]
      operationId: countAnthropicTokens
      summary: Proxy an Anthropic token-count request
      security: [{ clientBearer: [] }]
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessageRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/generations:
    post:
      tags: [Multimodal generation]
      operationId: createMultimodalGeneration
      summary: Queue a provider-native Seedance, SiliconFlow, or ComfyUI generation job
      description: |
        `Idempotency-Key` is optional. Its namespace is scoped to the authenticated stable
        client identity. The first request is accepted with 202; replaying the same key
        with the same canonical `model` and `input` returns the same job with 200 and does
        not reserve quota twice. Reusing it with different content returns 400.
        SiliconFlow T2V routes use `input.parameters` with required `prompt` and
        `image_size`, plus optional `negative_prompt` and integer `seed`.
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsyncGenerationRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenerationReplayed' }
        '202': { $ref: '#/components/responses/GenerationAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/videos/generations:
    post:
      tags: [Multimodal generation]
      operationId: createVideoGeneration
      summary: Queue a provider-native video generation job
      description: |
        `Idempotency-Key` is optional. Its namespace is scoped to the authenticated stable
        client identity. The first request is accepted with 202; replaying the same key
        with the same canonical `model` and `input` returns the same job with 200 and does
        not reserve quota twice. Reusing it with different content returns 400.
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsyncGenerationRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenerationReplayed' }
        '202': { $ref: '#/components/responses/GenerationAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/images/generations:
    post:
      tags: [Multimodal generation]
      operationId: createImageGeneration
      summary: Generate an image synchronously or queue a provider-native job
      description: |
        When the body contains `input`, it uses the asynchronous generation contract and
        accepts optional `Idempotency-Key`: the first submission returns 202, an identical
        replay returns the same job with 200 without a second reservation, and reuse with
        different `model` or `input` returns 400. Without `input`, this endpoint proxies
        the synchronous OpenAI Images API or a configured Codex Responses image tool.

        Synchronous idempotency is isolated by the authenticated stable `key_id` and uses
        the canonical post-policy model/request payload. Authentication and traffic-policy
        evaluation precede the replay lookup, while route/price resolution and outbound
        client validation run only for a newly claimed execution. A completed same-payload
        replay therefore remains available after its route or price changes and returns the
        exact archived status, sanitized JSON body, and original request ID; it creates no
        request record, makes no upstream call, and consumes no additional quota/billing
        reservation, per-key rate-limit window, or image execution permit. Reusing the key
        with a different payload returns 400. An identical active request returns 409; an
        expired pending lease is atomically reclaimed for a fresh execution. For URL-mode
        results, Token Center downloads the object before success and persists, returns,
        and replays only a relative
        `/self/v1/requests/{request_id}/assets/{asset_id}` reference plus sanitized asset
        metadata—never the provider URL or internal archive locator.
      security: [{ clientBearer: [] }]
      x-idempotency-contract:
        namespace: stable-key-id
        fingerprint: post-policy-canonical-model-and-request
        completed-replay: exact-status-body-and-request-id
        different-payload-status: 400
        in-progress-status: 409
        replay-preconditions:
          - authentication
          - traffic-policy-evaluation
        fresh-execution-only:
          - route-resolution
          - price-lookup
          - outbound-client-validation
        expired-pending: atomically-reclaimed
        completed-replay-effects:
          - no-request-record
          - no-upstream-request
          - no-quota-reservation
          - no-usage-settlement
          - no-key-rate-limit-window-consumption
          - no-image-execution-permit
        persisted-url-results: mtc-request-asset-reference-only
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AsyncGenerationRequest'
                - $ref: '#/components/schemas/OpenAIImageRequest'
      responses:
        '200': { $ref: '#/components/responses/ImageSuccessOrGenerationReplay' }
        '202': { $ref: '#/components/responses/GenerationAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: mts_…
      description: Bootstrap service token or a stored service credential with the required scope and tenant boundary.
    clientBearer:
      type: http
      scheme: bearer
      bearerFormat: mtc_… or imported opaque credential
      description: The active normal credential generation for one stable client identity.
    memeloopCloudHmac:
      type: apiKey
      in: header
      name: X-MTC-Webhook-Signature
      description: RustCrypto HMAC-SHA-256 signature over `timestamp + "." + exact_body`; requires the timestamp header documented on the operation.

  headers:
    RequestId:
      description: Server-generated request correlation identifier.
      schema: { type: string, format: uuid }
    ApiVersion:
      description: API contract version selected for this response.
      schema: { const: v1 }

  parameters:
    TenantFilter:
      name: tenant_external_id
      in: query
      required: false
      description: Global service credentials may select a tenant or omit it for all tenants. Scoped credentials may omit it or repeat only their bound tenant.
      schema: { type: string, maxLength: 200 }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestIdPath:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionalByteRange:
      name: Range
      in: header
      required: false
      description: One byte range, for example `bytes=0-1048575`, `bytes=1048576-`, or `bytes=-1048576`.
      schema: { type: string, pattern: '^bytes=([0-9]+-[0-9]*|-[1-9][0-9]*)$' }
    RouteId:
      name: route_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequiredTenant:
      name: tenant_external_id
      in: query
      required: true
      description: Global credentials select the owning tenant; scoped credentials may specify only their bound tenant.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ExpectedUpdatedAt:
      name: expected_updated_at
      in: query
      required: true
      description: Optimistic-concurrency version from the resource's most recently read `updated_at` value.
      schema: { type: integer, format: int64 }
    FromCreatedAt:
      name: from_created_at
      in: query
      required: false
      description: Inclusive lower bound for creation time, in Unix epoch milliseconds.
      schema: { type: integer, format: int64 }
    ToCreatedAt:
      name: to_created_at
      in: query
      required: false
      description: Inclusive upper bound for creation time, in Unix epoch milliseconds. Must not be less than `from_created_at`.
      schema: { type: integer, format: int64 }
    BeforeCreatedAt:
      name: before_created_at
      in: query
      required: false
      description: Creation timestamp from the last row of the prior page. Use together with `before_id` as an exclusive descending keyset cursor.
      schema: { type: integer, format: int64, minimum: 0 }
    AfterExternalId:
      name: after_external_id
      in: query
      required: false
      description: Exclusive ascending tenant cursor from the final row of the prior page.
      schema: { type: string, minLength: 1, maxLength: 200 }
    BeforeId:
      name: before_id
      in: query
      required: false
      description: Stable row UUID from the last row of the prior page. Use together with `before_created_at`; the concrete response documents whether this is a key, ledger-entry, request, or generation ID.
      schema: { type: string, format: uuid }
    QuarantineId:
      name: quarantine_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyFilter:
      name: key_id
      in: query
      required: false
      description: Restrict an operator request list to one stable client credential identity. Tenant authorization still applies.
      schema: { type: string, format: uuid }
    ModelFilter:
      name: model
      in: query
      required: false
      description: Exact public-model match.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ProtocolFilter:
      name: protocol
      in: query
      required: false
      description: Exact recorded protocol match, for example `openai`, `anthropic`, `openai-image`, or `generation`.
      schema: { type: string, minLength: 1, maxLength: 200 }
    StatusFilter:
      name: status
      in: query
      required: false
      description: Logical status. Success includes HTTP 2xx/3xx; error includes HTTP 4xx/5xx or failed/cancelled generation; pending includes unfinished requests or queued/running generation.
      schema: { type: string, enum: [success, error, pending] }
    ErrorCodeFilter:
      name: error_code
      in: query
      required: false
      description: Exact recorded error-code match.
      schema: { type: string, minLength: 1, maxLength: 200 }
    UpstreamAccountFilter:
      name: upstream_account_id
      in: query
      required: false
      description: Restrict results to one stable unified upstream provider identity.
      schema: { type: string, format: uuid }
    RouteFilter:
      name: route_id
      in: query
      required: false
      description: Restrict text/protocol records to one stable model route. Generation records do not carry route IDs and cannot match this filter.
      schema: { type: string, format: uuid }
    MinDurationFilter:
      name: min_duration_ms
      in: query
      required: false
      description: Inclusive lower duration bound in milliseconds.
      schema: { type: integer, format: int64, minimum: 0 }
    MaxDurationFilter:
      name: max_duration_ms
      in: query
      required: false
      description: Inclusive upper duration bound in milliseconds; must not be less than `min_duration_ms`.
      schema: { type: integer, format: int64, minimum: 0 }
    MinCostFilter:
      name: min_cost
      in: query
      required: false
      description: Inclusive lower settled-cost bound as a non-negative decimal string.
      schema: { $ref: '#/components/schemas/NonNegativeMoney' }
    MaxCostFilter:
      name: max_cost
      in: query
      required: false
      description: Inclusive upper settled-cost bound; must not be less than `min_cost`.
      schema: { $ref: '#/components/schemas/NonNegativeMoney' }
    KeyAliasFilter:
      name: key_alias
      in: query
      required: false
      description: Operator-only, case-insensitive prefix search over the stable client credential alias. SQL wildcard characters are treated literally.
      schema: { type: string, minLength: 1, maxLength: 200 }
    PrincipalFilter:
      name: principal
      in: query
      required: false
      description: Operator-only, case-insensitive prefix search over the tenant principal identifier. SQL wildcard characters are treated literally.
      schema: { type: string, minLength: 1, maxLength: 200 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    Currency:
      name: currency
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Currency' }
    CurrencyPath:
      name: currency
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Currency' }
    ModelPath:
      name: model
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit100:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 50 }
    ControlListLimit100:
      name: limit
      in: query
      required: false
      description: Bounded control-resource page size.
      schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 100 }
    Limit500:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 50 }
    CredentialListLimit500:
      name: limit
      in: query
      required: false
      description: Page size for credential reconciliation. Defaults to the legacy maximum so existing operator clients retain their pre-pagination view.
      schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 500 }

  responses:
    GroupList:
      description: Tenant-scoped groups including bounded member identifiers.
      content:
        application/json:
          schema:
            type: array
            maxItems: 10000
            items: { $ref: '#/components/schemas/Group' }
    GroupCreated:
      description: Created group, or an idempotent normalized-name replay.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Group' }
    GroupUpdated:
      description: Updated group and optimistic-concurrency version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Group' }
    InvalidRequest:
      description: Invalid JSON, field, state transition, idempotency reuse, or unsupported operation.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ResponsesWebSocketUpgradeRequired:
      description: Native Responses WebSocket transport is not available in this release; use the authenticated HTTP POST operation.
      headers:
        Upgrade:
          description: Requested protocol token; this release responds with 426 instead of switching transports.
          schema: { type: string, const: websocket }
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, malformed, revoked, expired, or invalid bearer credential.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Credential lacks the required scope, tenant boundary, or model permission.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource is absent or not visible to the authenticated identity.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The idempotency key has another payload, a version is stale, or the requested stable identity/state conflicts with existing history.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnpricedModel:
      description: Model has no price in the client's currency.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UsageRejected:
      description: Rate limit, concurrency, balance, or configured budget rejected the request before upstream execution.
      headers:
        Retry-After:
          description: Seconds until the next meaningful retry for retryable dimensions. Permanent balance/lifetime failures omit this header.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UsageLimitErrorResponse' }
    UpstreamError:
      description: Configured upstream or OAuth provider was unavailable. Sensitive upstream detail is not returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: An archive, database, or other internal dependency failed. Sensitive dependency detail is not returned.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GenerationAssetFull:
      description: Complete archived asset. Content-Type is reduced to the service allowlist and Content-Disposition uses a sanitized attachment filename.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: no-store } }
        Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
        Content-Disposition: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        image/gif:
          schema: { type: string, format: binary }
        video/mp4:
          schema: { type: string, format: binary }
        video/webm:
          schema: { type: string, format: binary }
        video/quicktime:
          schema: { type: string, format: binary }
    GenerationAssetPartial:
      description: Requested inclusive byte range from the archived asset.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: no-store } }
        Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
        Content-Range: { schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
        Content-Disposition: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        image/gif:
          schema: { type: string, format: binary }
        video/mp4:
          schema: { type: string, format: binary }
        video/webm:
          schema: { type: string, format: binary }
        video/quicktime:
          schema: { type: string, format: binary }
    RangeNotSatisfiable:
      description: The range was malformed, multiple, empty for a zero-size asset, or outside the archived object.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: no-store } }
        Content-Length: { schema: { const: 0 } }
        Content-Range: { schema: { type: string, pattern: '^bytes \*/[0-9]+$' } }
    ProxySuccess:
      description: Upstream response. Content type and streaming semantics follow the selected protocol/provider.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
        text/event-stream:
          schema: { type: string }
    GenerationAccepted:
      description: Job was priced, reserved, archived, and queued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenerationJob' }
    GenerationReplayed:
      description: Existing job returned by an idempotent replay; no second job or quota reservation was created.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenerationJob' }
    ImageSuccessOrGenerationReplay:
      description: |
        Sanitized synchronous image response, exact completed synchronous replay, or an
        existing asynchronous job returned by an idempotent replay. Synchronous URL-mode
        results contain only Token Center request-asset references, never provider URLs or
        internal archive locators.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { type: object, additionalProperties: true }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ok }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        checks:
          type: object
          additionalProperties: false
          required: [database, archive]
          properties:
            database: { type: string, enum: [ok, failed] }
            archive: { type: string, enum: [ok, failed] }
    VersionInfo:
      type: object
      additionalProperties: false
      required: [service, version, revision, build_timestamp, target, api]
      properties:
        service: { const: memeloop-token-center }
        version: { type: string }
        revision: { type: string }
        build_timestamp: { type: string }
        target: { type: string }
        api:
          type: object
          additionalProperties: false
          required: [current, supported, compatibility, deprecated]
          properties:
            current: { const: v1 }
            supported:
              type: array
              items: { const: v1 }
            compatibility: { type: string }
            deprecated:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, replacement]
                properties:
                  path: { type: string }
                  replacement: { type: string }
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      examples: ['10', '0.125', '-5']
    NonNegativeMoney:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
    Currency:
      type: string
      enum: [USD, CNY]
    ServiceTier:
      type: string
      enum: [default, auto, priority, flex, scale, batch, standard_only]
      description: Recorded/requested upstream service tier. Unknown reported tiers are settled conservatively against the maximum snapshotted tier price.
      default: default
    CredentialStatus:
      type: string
      enum: [active, suspended, revoked]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, unpriced_model, insufficient_quota, rate_limit_exceeded, not_found, conflict, invalid_request, websocket_upgrade_required, upstream_error, internal_error]
            message: { type: string }
    UsageLimitErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, reason, retryable]
          properties:
            code: { type: string, enum: [insufficient_quota, rate_limit_exceeded] }
            message: { type: string }
            reason:
              type: string
              enum: [balance_exhausted, daily_budget_exhausted, weekly_budget_exhausted, lifetime_budget_exhausted, rpm_exhausted, tpm_exhausted, concurrency_exhausted]
            retryable: { type: boolean }
    CredentialPolicy:
      type: object
      additionalProperties: false
      properties:
        requests_per_minute: { type: integer, format: int64, minimum: 1, maximum: 4294967295, default: 60 }
        tokens_per_minute: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, default: 100000 }
        max_concurrency: { type: integer, format: int64, minimum: 1, maximum: 4294967295, default: 4 }
        daily_budget: { oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }] }
        weekly_budget: { oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }] }
        lifetime_budget: { oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }] }
    CreateClientCredentialRequest:
      type: object
      additionalProperties: false
      required: [principal_external_id, alias]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$', default: default }
        principal_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        alias: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        currency: { $ref: '#/components/schemas/Currency' }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        initial_balance: { $ref: '#/components/schemas/NonNegativeMoney' }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Exact model routes granted at creation. Every route must already exist in the selected tenant.
          items: { type: string, format: uuid }
          default: []
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing route groups granted at creation. Credential groups are not accepted here.
          items: { type: string, format: uuid }
          default: []
    IssuedClientCredential:
      type: object
      additionalProperties: false
      required: [key_id, account_id, alias, currency, credential_generation, key, fingerprint]
      properties:
        key_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        key: { type: string, writeOnly: true, description: One-time native credential secret. }
        fingerprint: { type: string }
    ManagedClientCredential:
      type: object
      additionalProperties: false
      required: [key_id, account_id, tenant_external_id, principal_external_id, alias, currency, status, credential_generation, fingerprint, created_at, updated_at, policy, available_balance, reserved_balance]
      properties:
        key_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        tenant_external_id: { type: string }
        principal_external_id: { type: string }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        credential_generation: { type: integer, format: int64 }
        fingerprint: { type: [string, 'null'] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        available_balance: { $ref: '#/components/schemas/Money' }
        reserved_balance: { $ref: '#/components/schemas/Money' }
    SelfCredential:
      type: object
      additionalProperties: false
      required: [key_id, alias, currency, credential_generation, created_at, policy, available_balance]
      properties:
        key_id: { type: string, format: uuid }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        credential_generation: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        available_balance: { $ref: '#/components/schemas/Money' }
    ClientCredentialRateLimitSnapshot:
      type: object
      additionalProperties: false
      required: [limit, used, remaining, reset_at]
      properties:
        limit: { type: integer, minimum: 0, maximum: 9007199254740991 }
        used: { type: integer, minimum: 0, maximum: 9007199254740991 }
        remaining: { type: integer, minimum: 0, maximum: 9007199254740991 }
        reset_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
    ClientCredentialConcurrencySnapshot:
      type: object
      additionalProperties: false
      required: [limit, active, remaining]
      properties:
        limit: { type: integer, format: int32, minimum: 0 }
        active: { type: integer, minimum: 0, maximum: 9007199254740991 }
        remaining: { type: integer, minimum: 0, maximum: 9007199254740991 }
    ClientCredentialBudgetSnapshot:
      type: object
      additionalProperties: false
      required: [limit, settled, reserved, remaining, reset_at]
      properties:
        limit:
          oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }]
        settled: { $ref: '#/components/schemas/NonNegativeMoney' }
        reserved: { $ref: '#/components/schemas/NonNegativeMoney' }
        remaining:
          oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }]
        reset_at:
          oneOf: [{ type: integer, format: int64, description: Unix epoch milliseconds. }, { type: 'null' }]
    ClientCredentialLimitSnapshot:
      type: object
      additionalProperties: false
      required: [key_id, captured_at, currency, available_balance, reserved_balance, rpm, tpm, concurrency, daily_budget, weekly_budget, lifetime_budget]
      properties:
        key_id: { type: string, format: uuid }
        captured_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
        currency: { $ref: '#/components/schemas/Currency' }
        available_balance: { $ref: '#/components/schemas/Money' }
        reserved_balance: { $ref: '#/components/schemas/Money' }
        rpm: { $ref: '#/components/schemas/ClientCredentialRateLimitSnapshot' }
        tpm: { $ref: '#/components/schemas/ClientCredentialRateLimitSnapshot' }
        concurrency: { $ref: '#/components/schemas/ClientCredentialConcurrencySnapshot' }
        daily_budget: { $ref: '#/components/schemas/ClientCredentialBudgetSnapshot' }
        weekly_budget: { $ref: '#/components/schemas/ClientCredentialBudgetSnapshot' }
        lifetime_budget: { $ref: '#/components/schemas/ClientCredentialBudgetSnapshot' }
    StatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CredentialStatus' }
    ServiceScope:
      type: string
      enum:
        - keys:read
        - keys:write
        - credits:read
        - credits:write
        - entitlements:read
        - entitlements:write
        - generations:write
        - requests:read
        - providers:read
        - providers:write
        - plugins:read
        - plugins:write
        - oauth:write
        - imports:cpa:write
        - imports:session_archive:quarantine:read
        - imports:session_archive:quarantine:resolve
        - routes:read
        - routes:write
        - prices:read
        - prices:write
        - service_tokens:read
        - service_tokens:write
        - schemas:read
        - metrics:read
    CreateServiceCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { $ref: '#/components/schemas/ServiceScope' }
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Null creates a global operator credential; normal application integrations should be tenant-bound.
    IssuedServiceCredential:
      type: object
      additionalProperties: false
      required: [service_id, name, credential_generation, token, fingerprint, scopes, tenant_external_id]
      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        token: { type: string, writeOnly: true, description: One-time service credential secret. }
        fingerprint: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ServiceScope' }
        tenant_external_id: { type: [string, 'null'] }
    ServiceCredential:
      type: object
      additionalProperties: false
      required: [service_id, name, status, credential_generation, fingerprint, scopes, tenant_external_id, created_at, updated_at]
      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        credential_generation: { type: integer, format: int64 }
        fingerprint: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ServiceScope' }
        tenant_external_id: { type: [string, 'null'] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    JsonSchema:
      oneOf:
        - type: object
          additionalProperties: true
        - type: boolean
    OAuthAdapterContribution:
      type: object
      additionalProperties: false
      required: [api_version, flow_kind, login_url, poll_url, refresh_url]
      properties:
        api_version: { type: string, enum: [oauth-adapter-v1] }
        flow_kind: { type: string, enum: [cursor_pkce] }
        login_url: { type: string, format: uri }
        poll_url: { type: string, format: uri }
        refresh_url: { type: string, format: uri }
    ComponentAdapterContribution:
      type: object
      additionalProperties: false
      required: [api_version, max_response_bytes]
      properties:
        api_version: { type: string, enum: [buffered-v1] }
        max_response_bytes: { type: integer, minimum: 1, maximum: 4194304 }
    ProviderType:
      type: object
      additionalProperties: false
      required: [id, display_name, protocols, modalities, config_schema, credential_schema, source]
      properties:
        id: { type: string }
        display_name: { type: string }
        protocols:
          type: array
          items: { type: string, enum: [openai, anthropic, generation] }
        modalities:
          type: array
          items: { type: string, enum: [text, embedding, image, video, audio] }
        config_schema: { $ref: '#/components/schemas/JsonSchema' }
        credential_schema: { $ref: '#/components/schemas/JsonSchema' }
        oauth_adapter:
          oneOf:
            - $ref: '#/components/schemas/OAuthAdapterContribution'
            - type: 'null'
        component_adapter:
          oneOf:
            - $ref: '#/components/schemas/ComponentAdapterContribution'
            - type: 'null'
        source: { type: string }
    ApiKeyCredential:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { const: api_key }
        value: { type: string, minLength: 1, writeOnly: true }
        header: { type: string, default: authorization }
        prefix: { type: string, default: 'Bearer ' }
    ProxiedApiKeyCredential:
      type: object
      additionalProperties: false
      required: [type, value, proxy_url, proxy_network_scope]
      properties:
        type: { const: api_key_proxy }
        value: { type: string, minLength: 1, writeOnly: true }
        header: { type: string, default: authorization }
        prefix: { type: string, default: 'Bearer ' }
        proxy_url: { type: string, pattern: '^socks5://', minLength: 1, maxLength: 2048, writeOnly: true }
        proxy_network_scope: { type: string, const: private }
    OAuthCredential:
      type: object
      additionalProperties: false
      required: [type, access_token]
      properties:
        type: { const: oauth }
        access_token: { type: string, minLength: 1, writeOnly: true }
        refresh_token: { type: [string, 'null'], writeOnly: true }
        expires_at: { type: [integer, 'null'], format: int64 }
        header: { type: string, default: authorization }
        prefix: { type: string, default: 'Bearer ' }
    NoAuthCredential:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: none }
    UpstreamCredential:
      oneOf:
        - $ref: '#/components/schemas/NoAuthCredential'
        - $ref: '#/components/schemas/ApiKeyCredential'
        - $ref: '#/components/schemas/ProxiedApiKeyCredential'
        - $ref: '#/components/schemas/OAuthCredential'
      discriminator:
        propertyName: type
        mapping:
          none: '#/components/schemas/NoAuthCredential'
          api_key: '#/components/schemas/ApiKeyCredential'
          api_key_proxy: '#/components/schemas/ProxiedApiKeyCredential'
          oauth: '#/components/schemas/OAuthCredential'
    CreateUpstreamProviderRequest:
      type: object
      additionalProperties: false
      required: [name, config, credential]
      properties:
        tenant_external_id: { type: string, default: default, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        driver: { type: string, default: http-json }
        config:
          type: object
          required: [base_url]
          additionalProperties: true
          properties:
            base_url: { type: string, format: uri }
        credential: { $ref: '#/components/schemas/UpstreamCredential' }
    ReplaceUpstreamProviderRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, name, config, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        config:
          type: object
          additionalProperties: true
          description: Complete provider configuration, validated against the existing driver's JSON Schema. Authentication material is not accepted here.
        expected_updated_at: { type: integer, format: int64 }
    SetUpstreamProviderStatusRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, status, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, disabled] }
        expected_updated_at: { type: integer, format: int64 }
    UpstreamProvider:
      type: object
      additionalProperties: false
      required: [id, tenant_id, tenant_external_id, name, driver, auth_kind, connection_method, credential_generation, status, config, credential_expires_at, can_refresh, can_rotate, can_reauthorize, route_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_external_id: { type: [string, 'null'] }
        name: { type: string }
        driver: { type: string }
        auth_kind: { type: string, enum: [none, api_key, oauth], description: Stored authentication family. }
        connection_method: { type: string, enum: [none, api_key, oauth, legacy], description: Presentation metadata for the unified upstream resource; legacy is read-only historical data. }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, disabled] }
        config: { type: object, additionalProperties: true }
        credential_expires_at: { type: [integer, 'null'], format: int64 }
        can_refresh: { type: boolean, description: Managed OAuth refresh is available for the active generation. }
        can_rotate: { type: boolean, description: The credential may be replaced without changing the stable account identity. }
        can_reauthorize: { type: boolean, description: An interactive reauthorization endpoint is available. }
        route_count: { type: integer, format: int64, minimum: 0, description: Includes disabled routes retained for audit. }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
