      enum:
        - keys:read
        - keys:write
        - credits:read
        - credits:write
        - entitlements:read
        - entitlements:write
        - filter_assistant:execute
        - generations:write
        - generations:quarantine:read
        - generations:reconcile
        - requests:read
        - settlements:adjust
        - providers:read
        - providers:write
        - plugins:read
        - plugins:write
        - oauth:write
        - upstreams:import:write
        - routes:read
        - routes:write
        - prices:read
        - prices:write
        - service_tokens:read
        - service_tokens:write
        - tenants:read
        - tenants:write
        - schemas:read
        - metrics:read
    CreateServiceCredentialRequest:
      type: object
