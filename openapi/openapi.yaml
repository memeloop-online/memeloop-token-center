        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/messages/count_tokens:
    post:
      tags: [Anthropic compatible]
      operationId: countAnthropicTokens
      summary: Proxy an Anthropic token-count request
      security: [{ clientBearer: [] }]
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string }
        - name: anthropic-beta
          in: header
          required: false
          description: Capability values pass through to Anthropic-format upstream routes.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessageRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/generations:
    post:
      tags: [Multimodal generation]
      operationId: createMultimodalGeneration
      summary: Queue a provider-native Seedance, SiliconFlow, or ComfyUI generation job
      description: |
        `Idempotency-Key` is optional. Its namespace is scoped to the authenticated stable
        client identity. The first request is accepted with 202; replaying the same key
        with the same canonical `model` and `input` returns the same job with 200 and does
        not reserve quota twice. Reusing it with different content returns 400.
        SiliconFlow T2V routes use `input.parameters` with required `prompt` and
        `image_size`, plus optional `negative_prompt` and integer `seed`.
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsyncGenerationRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenerationReplayed' }
        '202': { $ref: '#/components/responses/GenerationAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/videos/generations:
    post:
      tags: [Multimodal generation]
      operationId: createVideoGeneration
      summary: Queue a provider-native video generation job
      description: |
        `Idempotency-Key` is optional. Its namespace is scoped to the authenticated stable
        client identity. The first request is accepted with 202; replaying the same key
        with the same canonical `model` and `input` returns the same job with 200 and does
        not reserve quota twice. Reusing it with different content returns 400.
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsyncGenerationRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenerationReplayed' }
        '202': { $ref: '#/components/responses/GenerationAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/images/generations:
    post:
      tags: [Multimodal generation]
      operationId: createImageGeneration
      summary: Generate an image synchronously or queue a provider-native job
      description: |
        When the body contains `input`, it uses the asynchronous generation contract and
        accepts optional `Idempotency-Key`: the first submission returns 202, an identical
        replay returns the same job with 200 without a second reservation, and reuse with
        different `model` or `input` returns 400. Without `input`, this endpoint proxies
        the synchronous OpenAI Images API or a configured Codex Responses image tool.

        Synchronous idempotency is isolated by the authenticated stable `key_id` and uses
        the canonical post-policy model/request payload. Authentication and traffic-policy
        evaluation precede the replay lookup, while route/price resolution and outbound
        client validation run only for a newly claimed execution. A completed same-payload
        replay never resubmits upstream: because media bodies are not retained, it returns
        409 `image_result_not_retained` with the original request ID. It creates no new
        request record, makes no upstream call, and consumes no additional quota/billing
        reservation, per-key rate-limit window, or image execution permit. Reusing the key
        with a different payload returns 400. An identical active request returns 409; an
        expired pending lease is atomically reclaimed for a fresh execution. For URL-mode
        results, Token Center retains only a protected provider reference and returns a relative
        `/self/v1/requests/{request_id}/assets/{asset_id}` URL. Authorized downloads stream
        from the validated provider origin with server-side credentials; media bytes, provider
        URLs, and internal references are not returned in request history or retained as assets.
      security: [{ clientBearer: [] }]
      x-idempotency-contract:
        namespace: stable-key-id
        fingerprint: post-policy-canonical-model-and-request
        completed-replay: conflict-without-upstream-resubmission
        different-payload-status: 400
        in-progress-status: 409
        replay-preconditions:
          - authentication
          - traffic-policy-evaluation
        fresh-execution-only:
          - route-resolution
          - price-lookup
          - outbound-client-validation
        expired-pending: atomically-reclaimed
        completed-replay-effects:
          - no-request-record
          - no-upstream-request
          - no-quota-reservation
          - no-usage-settlement
          - no-key-rate-limit-window-consumption
          - no-image-execution-permit
        persisted-url-results: protected-provider-reference-only
      parameters: [{ $ref: '#/components/parameters/OptionalIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AsyncGenerationRequest'
                - $ref: '#/components/schemas/OpenAIImageRequest'
      responses:
        '200': { $ref: '#/components/responses/ImageSuccessOrGenerationReplay' }
        '202': { $ref: '#/components/responses/GenerationAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: mts_…
      description: Bootstrap service token or a stored service credential with the required scope and tenant boundary.
    clientBearer:
      type: http
      scheme: bearer
      bearerFormat: mtc_… or imported opaque credential
      description: The active normal credential generation for one stable client identity.
    memeloopCloudHmac:
      type: apiKey
      in: header
      name: X-MTC-Webhook-Signature
      description: RustCrypto HMAC-SHA-256 signature over `timestamp + "." + exact_body`; requires the timestamp header documented on the operation.

  headers:
    RequestId:
      description: Server-generated request correlation identifier.
      schema: { type: string, format: uuid }
    ApiVersion:
      description: API contract version selected for this response.
      schema: { const: v1 }
    RouteCreateCreatedDisposition:
      description: '`created` is a new route; `equivalent_unowned` preserves header-less equality behaviour and cannot prove ownership.'
      schema:
        type: string
        enum: [created, equivalent_unowned]
    RouteCreateReusedDisposition:
      description: Exact replay bound to the caller's Idempotency-Key.
      schema:
        type: string
        enum: [reused]

  parameters:
    TenantFilter:
      name: tenant_external_id
      in: query
      required: false
      description: Global service credentials may select a tenant or omit it for all tenants. Scoped credentials may omit it or repeat only their bound tenant.
      schema: { type: string, maxLength: 200 }
    TenantExternalId:
      name: external_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestIdPath:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestArchiveSidePath:
      name: side
      in: path
      required: true
      description: Select the original archived downstream request or upstream response bytes.
      schema:
        type: string
        enum: [request, response]
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionalByteRange:
      name: Range
      in: header
      required: false
      description: One byte range, for example `bytes=0-1048575`, `bytes=1048576-`, or `bytes=-1048576`.
      schema: { type: string, pattern: '^bytes=([0-9]+-[0-9]*|-[1-9][0-9]*)$' }
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from the first archive-content range; a mismatch returns 412 before any bytes are streamed.
      schema: { type: string }
    RouteId:
      name: route_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequiredTenant:
      name: tenant_external_id
      in: query
      required: true
      description: Global credentials select the owning tenant; scoped credentials may specify only their bound tenant.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ExpectedUpdatedAt:
      name: expected_updated_at
      in: query
      required: true
      description: Optimistic-concurrency version from the resource's most recently read `updated_at` value.
      schema: { type: integer, format: int64 }
    FromCreatedAt:
      name: from_created_at
      in: query
      required: false
      description: Inclusive lower bound for creation time, in Unix epoch milliseconds.
      schema: { type: integer, format: int64 }
    ToCreatedAt:
      name: to_created_at
      in: query
      required: false
      description: Inclusive upper bound for creation time, in Unix epoch milliseconds. Must not be less than `from_created_at`.
      schema: { type: integer, format: int64 }
    BeforeCreatedAt:
      name: before_created_at
      in: query
      required: false
      description: Creation timestamp from the last row of the prior page. Use together with `before_id` as an exclusive descending keyset cursor.
      schema: { type: integer, format: int64, minimum: 0 }
    AfterExternalId:
      name: after_external_id
      in: query
      required: false
      description: Exclusive ascending tenant cursor from the final row of the prior page.
      schema: { type: string, minLength: 1, maxLength: 200 }
    BeforeId:
      name: before_id
      in: query
      required: false
      description: Stable row UUID from the last row of the prior page. Use together with `before_created_at`; the concrete response documents whether this is a key, ledger-entry, request, or generation ID.
      schema: { type: string, format: uuid }
    AfterSettlementSequence:
      name: after_sequence
      in: query
      required: false
      description: Immutable account-local sequence from the final row of the prior page. Use together with `after_id` as an exclusive ascending keyset cursor.
      schema: { type: integer, format: int64, minimum: 1 }
    AfterSettlementId:
      name: after_id
      in: query
      required: false
      description: Settlement UUID from the final row of the prior page. Use together with `after_sequence` as an exclusive ascending keyset cursor.
      schema: { type: string, format: uuid }
    SettlementRequestId:
      name: request_id
      in: query
      required: false
      description: Request or generation UUID for an exact settlement lookup. Must be paired with `request_kind`; the pair cannot be combined with `after_sequence` or `after_id`.
      schema: { type: string, format: uuid }
    SettlementRequestKind:
      name: request_kind
      in: query
      required: false
      description: Request type for an exact settlement lookup. Must be paired with `request_id`; the pair cannot be combined with `after_sequence` or `after_id`.
      schema: { $ref: '#/components/schemas/AccountSettlementKind' }
    RequestPageEnvelope:
      name: paged
      in: query
      required: false
      description: When true, return a cursor envelope instead of the compatibility array response. The page size remains limited by `limit`.
      schema: { type: boolean, default: false }
    KeyFilter:
      name: key_id
      in: query
      required: false
      description: Restrict an operator request list to one stable client credential identity. Tenant authorization still applies.
      schema: { type: string, format: uuid }
    ModelFilter:
      name: model
      in: query
      required: false
      description: Exact public-model match.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ProtocolFilter:
      name: protocol
      in: query
      required: false
      description: Exact recorded protocol match, for example `openai`, `anthropic`, `openai-image`, `audio-transcription`, or `generation`.
      schema: { type: string, minLength: 1, maxLength: 200 }
    StatusFilter:
      name: status
      in: query
      required: false
      description: Logical status. Success includes HTTP 2xx/3xx; error includes HTTP 4xx/5xx or failed/cancelled generation; pending includes unfinished requests or queued/running generation.
      schema: { type: string, enum: [success, error, pending] }
    ErrorCodeFilter:
      name: error_code
      in: query
      required: false
      description: Exact recorded error-code match.
      schema: { type: string, minLength: 1, maxLength: 200 }
    UpstreamAccountFilter:
      name: upstream_account_id
      in: query
      required: false
      description: Restrict results to one stable unified upstream provider identity.
      schema: { type: string, format: uuid }
    RouteFilter:
      name: route_id
      in: query
      required: false
      description: Restrict text/protocol records to one stable model route. Generation records do not carry route IDs and cannot match this filter.
      schema: { type: string, format: uuid }
    MinDurationFilter:
      name: min_duration_ms
      in: query
      required: false
      description: Inclusive lower duration bound in milliseconds.
      schema: { type: integer, format: int64, minimum: 0 }
    MaxDurationFilter:
      name: max_duration_ms
      in: query
      required: false
      description: Inclusive upper duration bound in milliseconds; must not be less than `min_duration_ms`.
      schema: { type: integer, format: int64, minimum: 0 }
    MinCostFilter:
      name: min_cost
      in: query
      required: false
      description: Inclusive lower settled-cost bound as a non-negative decimal string.
      schema: { $ref: '#/components/schemas/NonNegativeMoney' }
    MaxCostFilter:
      name: max_cost
      in: query
      required: false
      description: Inclusive upper settled-cost bound; must not be less than `min_cost`.
      schema: { $ref: '#/components/schemas/NonNegativeMoney' }
    KeyAliasFilter:
      name: key_alias
      in: query
      required: false
      description: Operator-only, case-insensitive prefix search over the stable client credential alias. SQL wildcard characters are treated literally.
      schema: { type: string, minLength: 1, maxLength: 200 }
    PrincipalFilter:
      name: principal
      in: query
      required: false
      description: Operator-only, case-insensitive prefix search over the tenant principal identifier. SQL wildcard characters are treated literally.
      schema: { type: string, minLength: 1, maxLength: 200 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    RouteCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'An exact replay within 30 days returns the same stable route with `X-MTC-Route-Create-Disposition: reused`. Use one opaque operation identifier per logical create, never credentials or request content. New automation must require this header and never use a header-less equivalent response as ownership proof.'
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    Currency:
      name: currency
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Currency' }
    CurrencyPath:
      name: currency
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Currency' }
    ModelPath:
      name: model
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit100:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 50 }
    ControlListLimit100:
      name: limit
      in: query
      required: false
      description: Bounded control-resource page size.
      schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 100 }
    Limit500:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 50 }
    SettlementListLimit500:
      name: limit
      in: query
      required: false
      description: Maximum immutable account settlements returned in this page.
      schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 100 }
    CredentialListLimit500:
      name: limit
      in: query
      required: false
      description: Page size for credential reconciliation. Defaults to the legacy maximum so existing operator clients retain their pre-pagination view.
      schema: { type: integer, format: int64, minimum: 1, maximum: 500, default: 500 }

  responses:
    GroupList:
      description: Tenant-scoped groups including bounded member identifiers.
      content:
        application/json:
          schema:
            type: array
            maxItems: 10000
            items: { $ref: '#/components/schemas/Group' }
    GroupCreated:
      description: Created group, or an idempotent normalized-name replay.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Group' }
    GroupUpdated:
      description: Updated group and optimistic-concurrency version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Group' }
    InvalidRequest:
      description: Invalid JSON, field, state transition, idempotency reuse, or unsupported operation.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTimeout:
      description: The bounded request body or upstream response deadline expired.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: The multipart body, audio file, field, or upstream response exceeded its configured bound.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Content encoding, multipart media type, or audio representation is not supported.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Bounded body admission or a required internal service is temporarily unavailable.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ResponsesWebSocketUpgradeRequired:
      description: Native Responses WebSocket transport is not available in this release; use the authenticated HTTP POST operation.
      headers:
        Upgrade:
          description: Requested protocol token; this release responds with 426 instead of switching transports.
          schema: { type: string, const: websocket }
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, malformed, revoked, expired, or invalid bearer credential.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Credential lacks the required scope, tenant boundary, or model permission.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource is absent or not visible to the authenticated identity.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The idempotency key has another payload, a version is stale, or the requested stable identity/state conflicts with existing history.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnpricedModel:
      description: Model has no price in the client's currency.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UsageRejected:
      description: Rate limit, concurrency, balance, or configured budget rejected the request before upstream execution.
      headers:
        Retry-After:
          description: Seconds until the next meaningful retry for retryable dimensions. Permanent balance/lifetime failures omit this header.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UsageLimitErrorResponse' }
    UpstreamError:
      description: Configured upstream or OAuth provider was unavailable. Sensitive upstream detail is not returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: An archive, database, or other internal dependency failed. Sensitive dependency detail is not returned.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GenerationAssetUnavailable:
      description: The protected provider asset reference expired or the provider deleted the asset.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GenerationAssetFull:
      description: Complete historical archived or provider-proxied asset. Content-Type is reduced to the service allowlist and Content-Disposition uses a sanitized attachment filename.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: no-store } }
        Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
        Content-Disposition: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        image/gif:
          schema: { type: string, format: binary }
        video/mp4:
          schema: { type: string, format: binary }
        video/webm:
          schema: { type: string, format: binary }
        video/quicktime:
          schema: { type: string, format: binary }
    RequestArchiveContentFull:
      description: Complete original archive body, streamed incrementally with no total-size limit.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: 'private, no-store' } }
        Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
        ETag: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    RequestArchiveContentPartial:
      description: Requested inclusive byte range from the original archive body.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: 'private, no-store' } }
        Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
        Content-Range: { schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
        ETag: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    RequestArchiveContentUnavailable:
      description: The selected side is pending, unavailable, invalid, or retained only as policy metadata.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ArchiveContentUnavailableErrorResponse' }
    RequestArchiveContentPreconditionFailed:
      description: If-Match does not match the currently bound archive representation; no bytes are returned.
      headers:
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: 'private, no-store' } }
        Content-Length: { schema: { const: 0 } }
        ETag: { schema: { type: string } }
    RequestArchiveContentRangeNotSatisfiable:
      description: The range was malformed, multiple, empty for a zero-size body, or outside the archived object.
      headers:
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: 'private, no-store' } }
        Content-Length: { schema: { const: 0 } }
        Content-Range: { schema: { type: string, pattern: '^bytes \*/[0-9]+$' } }
        ETag: { schema: { type: string } }
    GenerationAssetPartial:
      description: Requested inclusive byte range when the backing archive or provider honors it.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: no-store } }
        Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
        Content-Range: { schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
        Content-Disposition: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        image/gif:
          schema: { type: string, format: binary }
        video/mp4:
          schema: { type: string, format: binary }
        video/webm:
          schema: { type: string, format: binary }
        video/quicktime:
          schema: { type: string, format: binary }
    RangeNotSatisfiable:
      description: The range was malformed, multiple, empty for a zero-size asset, or outside the archived object.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Accept-Ranges: { schema: { const: bytes } }
        Cache-Control: { schema: { const: no-store } }
        Content-Length: { schema: { const: 0 } }
        Content-Range: { schema: { type: string, pattern: '^bytes \*/[0-9]+$' } }
    ProxySuccess:
      description: Upstream response. Content type and streaming semantics follow the selected protocol/provider.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
        text/event-stream:
          schema: { type: string }
    GenerationAccepted:
      description: Job was priced, reserved, archived, and queued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenerationJob' }
    GenerationReplayed:
      description: Existing job returned by an idempotent replay; no second job or quota reservation was created.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenerationJob' }
    ImageSuccessOrGenerationReplay:
      description: |
        Sanitized synchronous image response, exact completed synchronous replay, or an
        existing asynchronous job returned by an idempotent replay. Synchronous URL-mode
        results contain only Token Center request-asset references, never provider URLs or
        internal archive locators.
      headers:
        X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { type: object, additionalProperties: true }

  schemas:
    UpstreamQuotaBatchRequest:
      type: object
      additionalProperties: false
      required: [account_ids, fresh, trigger]
      properties:
        account_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        fresh:
          type: boolean
          description: Bypass a still-fresh cached snapshot while retaining shared singleflight and permits.
        trigger:
          type: string
          enum: [bulk, manual]
          description: Auditable operator intent; refresh-all uses bulk and an individual manual refresh uses manual.
    UpstreamQuotaBatchResponse:
      type: object
      additionalProperties: false
      required: [contract_version, results]
      properties:
        contract_version: { const: upstream_quota_batch_v1 }
        results:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UpstreamQuotaBatchResult' }
    UpstreamQuotaBatchResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, upstream_account_id, snapshot]
          properties:
            status: { const: success, description: A quota snapshot projection was produced; inspect its status and error_code for supplier-read failures. }
            upstream_account_id: { type: string, format: uuid }
            snapshot: { $ref: '#/paths/~1internal~1v1~1upstreams~1{account_id}~1quota/get/responses/200/content/application~1json/schema' }
        - type: object
          additionalProperties: false
          required: [status, upstream_account_id, error]
          properties:
            status: { const: error, description: The account could not produce a scoped quota projection. }
            upstream_account_id: { type: string, format: uuid }
            error:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  enum: [quota_account_not_found, quota_account_inactive, credential_invalid, quota_account_unavailable, quota_batch_timeout]
    PluginInstallation:
      type: object
      additionalProperties: false
      required: [id, inventory_id, actor, status, packages, completed_packages, review_digest, review, failure_category, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        inventory_id: { type: string }
        actor: { type: string, description: Service identity or bootstrap marker; never a credential. }
        status: { type: string, enum: [installing, review, registered, failed, interrupted] }
        packages: { type: array, maxItems: 16, items: { type: string } }
        completed_packages: { type: integer, minimum: 0, maximum: 16 }
        review_digest: { type: [string, 'null'] }
        review:
          type: [object, 'null']
          properties:
            plugins: { type: array, items: { type: object } }
        failure_category: { type: [string, 'null'], description: Bounded host category; no raw process errors. }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    PluginRuntimeHistory:
      type: object
      additionalProperties: false
      required: [runtime_enabled, installation_enabled, installations, revisions, audit]
      properties:
        installation_enabled: { type: boolean }
        runtime_enabled: { type: boolean }
        installations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PluginInstallation' } }
        revisions:
          type: array
          maxItems: 100
          items:
            type: object
            required: [revision, inventory_id, reason, created_at]
            properties:
              revision: { type: integer, format: int64 }
              inventory_id: { type: string }
              reason: { type: string }
              created_at: { type: integer, format: int64 }
        audit:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, actor, action, inventory_id, revision, outcome, created_at]
            properties:
              id: { type: string, format: uuid }
              actor: { type: string }
              action: { type: string }
              inventory_id: { type: [string, 'null'] }
              revision: { type: [integer, 'null'], format: int64 }
              outcome: { type: string }
              created_at: { type: integer, format: int64 }
    ApplicationPluginStatus:
      type: object
      additionalProperties: false
      required: [current, candidates]
      properties:
        current:
          oneOf:
            - { $ref: '#/components/schemas/ApplicationPluginRevision' }
            - { type: 'null' }
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [inventory_id, staged, plugins]
            properties:
              inventory_id: { type: string }
              staged: { type: boolean }
              plugins:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    ApplicationPluginRevision:
      type: object
      additionalProperties: false
      required: [revision, inventory_id, reason]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        inventory_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        reason: { type: string, enum: [initial, reload, rollback] }
    UpstreamQuotaResetOperation:
      type: object
      required: [id, upstream_account_id, state, credential_generation, available_credits, applicable_credits, observed_at, expires_at, prepared_by_service_id, confirmed_by_service_id, confirmed_at, created_at, updated_at, last_reconciled_at, reconciled_available_credits, reconciled_applicable_credits, settled_at, error_code, audit, effect, consumes_credits]
      properties:
        id: { type: string, format: uuid }
        upstream_account_id: { type: string, format: uuid }
        state: { type: string, enum: [prepared, submitted, accepted, unknown, expired] }
        credential_generation: { type: integer, format: int64 }
        available_credits: { type: integer, format: int64, description: Immutable preparation baseline. }
        applicable_credits: { type: integer, format: int64, description: Immutable preparation baseline. }
        observed_at: { type: integer, format: int64, description: Preparation observation epoch milliseconds. }
        expires_at: { type: integer, format: int64 }
        prepared_by_service_id: { type: string }
        confirmed_by_service_id: { type: [string, 'null'] }
        confirmed_at: { type: [integer, 'null'], format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        last_reconciled_at: { type: [integer, 'null'], format: int64 }
        reconciled_available_credits: { type: [integer, 'null'], format: int64 }
        reconciled_applicable_credits: { type: [integer, 'null'], format: int64 }
        settled_at: { type: [integer, 'null'], format: int64, description: Fresh observation time when an accepted operation's exact old available-credit balance no longer applied; not proof that this operation caused the change or reset a quota window. }
        error_code: { type: [string, 'null'] }
        audit:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, event, actor_service_id, error_code, created_at]
            properties:
              id: { type: string, format: uuid }
              event: { type: string, enum: [prepared, confirmation_claimed, dispatch_accepted, dispatch_unknown, reconciled] }
              actor_service_id: { type: [string, 'null'] }
              error_code: { type: [string, 'null'] }
              created_at: { type: integer, format: int64 }
        effect: { const: supplier_defined_codex_rate_limits }
        consumes_credits: { const: 1 }
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ok }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        checks:
          type: object
          additionalProperties: false
          required: [database, database_schema, archive]
          properties:
            database: { type: string, enum: [ok, failed] }
            database_schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [ok, unknown, outdated] }
                required_version: { type: integer, format: int64, minimum: 0 }
                latest_applied_version: { type: [integer, 'null'], format: int64, minimum: 0 }
                missing_migration_count: { type: integer, minimum: 0 }
            archive: { type: string, enum: [ok, failed] }
    VersionInfo:
      type: object
      additionalProperties: false
      required: [service, version, revision, build_timestamp, target, api]
      properties:
        service: { const: memeloop-token-center }
        version: { type: string }
        revision: { type: string }
        build_timestamp: { type: string }
        target: { type: string }
        api:
          type: object
          additionalProperties: false
          required: [current, supported, compatibility, deprecated]
          properties:
            current: { const: v1 }
            supported:
              type: array
              items: { const: v1 }
            compatibility: { type: string }
            deprecated:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, replacement]
                properties:
                  path: { type: string }
                  replacement: { type: string }
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      examples: ['10', '0.125', '-5']
    NonNegativeMoney:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
    Currency:
      type: string
      enum: [USD, CNY]
    ServiceTier:
      type: string
      enum: [default, auto, priority, flex, scale, batch, standard_only]
      description: Recorded/requested upstream service tier. Unknown reported tiers are settled conservatively against the maximum snapshotted tier price.
      default: default
    CredentialStatus:
      type: string
      enum: [active, suspended, revoked]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, unpriced_model, insufficient_quota, rate_limit_exceeded, not_found, conflict, invalid_request, websocket_upgrade_required, upstream_error, internal_error, generation_asset_unavailable, image_result_not_retained]
            message: { type: string }
            retryable: { type: boolean }
    ArchiveContentUnavailableErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, reason]
          properties:
            code: { type: string, const: archive_content_unavailable }
            message: { type: string }
            reason:
              type: string
              enum: [archive_pending, archive_object_unavailable, archive_payload_invalid, media_body_not_archived_by_policy]
    UsageLimitErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, reason, retryable]
          properties:
            code: { type: string, enum: [insufficient_quota, rate_limit_exceeded] }
            message: { type: string }
            reason:
              type: string
              enum: [balance_exhausted, daily_budget_exhausted, weekly_budget_exhausted, lifetime_budget_exhausted, rpm_exhausted, tpm_exhausted, concurrency_exhausted]
            retryable: { type: boolean }
    CredentialPolicy:
      type: object
      additionalProperties: false
      properties:
        requests_per_minute: { type: integer, format: int64, minimum: 1, maximum: 4294967295, default: 60 }
        tokens_per_minute: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, default: 100000 }
        max_concurrency: { type: integer, format: int64, minimum: 1, maximum: 4294967295, default: 4 }
        daily_budget: { oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }] }
        weekly_budget: { oneOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }, { type: 'null' }] }
