      additionalProperties: false
      required: [tenant_external_id, upstream_account_ids, included_provider_group_ids, excluded_provider_group_ids, route_group_ids, route_group_names, granted_credential_ids, custom_model_confirmed, expected_updated_at, expected_grant_revision]
      anyOf:
        - required: [upstream_account_ids]
          properties:
            upstream_account_ids:
              minItems: 1
        - required: [included_provider_group_ids]
          properties:
            included_provider_group_ids:
              minItems: 1
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Exclusion wins over explicit accounts and included provider groups.
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_names:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing normalized names are reused and missing route groups are created atomically.
          items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Stable credential IDs granted this exact route. Credential-group IDs are never accepted.
          items: { type: string, format: uuid }
        custom_model_confirmed:
          type: boolean
          description: Explicit operator acknowledgement for a model absent from a complete synchronized catalog.
        expected_updated_at: { type: integer, format: int64 }
        expected_grant_revision: { type: integer, format: int64, minimum: 0 }
    ModelRouteRouting:
      type: object
      additionalProperties: false
      required: [route_id, upstream_account_ids, included_provider_group_ids, excluded_provider_group_ids, route_group_ids, granted_credential_ids, candidate_upstream_account_ids, custom_model_confirmed, updated_at, grant_revision]
      properties:
        route_id: { type: string, format: uuid }
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        candidate_upstream_account_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          description: Active candidate accounts after provider-group inclusion and exclusion.
          items: { type: string, format: uuid }
        custom_model_confirmed: { type: boolean }
        updated_at: { type: integer, format: int64 }
        grant_revision:
          type: integer
          format: int64
          minimum: 0
          description: Version of `granted_credential_ids` only; provider and group associations use `updated_at`.
    ReplaceClientCredentialRoutingRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, route_ids, route_group_ids, expected_grant_revision]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing route groups only; this operation never creates a group.
          items: { type: string, format: uuid }
        expected_grant_revision: { type: integer, format: int64, minimum: 0 }
    ClientCredentialRouting:
      type: object
      additionalProperties: false
      required: [key_id, route_ids, route_group_ids, effective_route_ids, updated_at, grant_revision]
      properties:
        key_id: { type: string, format: uuid }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        effective_route_ids:
          type: array
          maxItems: 10000
          uniqueItems: true
          description: Deduplicated union of exact routes and current members of granted route groups.
          items: { type: string, format: uuid }
        updated_at: { type: integer, format: int64 }
        grant_revision:
          type: integer
          format: int64
          minimum: 0
          description: Version of direct `route_ids` and `route_group_ids`; derived effective routes do not change this revision.
    SetModelRouteEnabledRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, enabled, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
        expected_updated_at: { type: integer, format: int64 }
    ModelRoute:
      type: object
      additionalProperties: false
      required: [id, tenant_id, tenant_external_id, public_model, upstream_account_id, upstream_account_ids, upstream_model, protocol, priority, enabled, included_provider_group_ids, excluded_provider_group_ids, route_group_ids, granted_credential_ids, candidate_upstream_account_ids, custom_model_confirmed, grant_revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_external_id: { type: [string, 'null'] }
        public_model: { type: string }
        upstream_account_id:
          type: string
          format: uuid
          deprecated: true
          description: Legacy first explicit account, or the nil UUID for a provider-group-only route.
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        upstream_model: { type: string }
        protocol: { type: string, enum: [openai, anthropic, generation] }
        priority: { type: integer, format: int64, minimum: -1000000, maximum: 1000000 }
        enabled: { type: boolean }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        candidate_upstream_account_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
        custom_model_confirmed: { type: boolean }
        grant_revision:
          type: integer
          format: int64
          minimum: 0
          description: Version of reverse exact credential grants only.
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    TokenPriceRequest:
      type: object
      additionalProperties: false
      required: [input_per_million, output_per_million]
      properties:
        input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        cached_input_per_million:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Defaults to `input_per_million`; that fallback is marked estimated in the stored tier.
        cache_write_per_million:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Defaults to `input_per_million`; that fallback is marked estimated in the stored tier.
        output_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        service_tier:
          allOf: [{ $ref: '#/components/schemas/ServiceTier' }]
          default: default
    ModelPrice:
      type: object
      additionalProperties: false
      required: [model, currency, input_per_million, output_per_million, source, updated_at, tiers]
      properties:
        model: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        output_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        source: { type: string, description: "`manual`, `models.dev`, `litellm`, or `openrouter`." }
        updated_at: { type: integer, format: int64 }
        tiers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ModelPriceTier' }
    ModelPriceTier:
      type: object
      additionalProperties: false
      required: [service_tier, input_per_million, cached_input_per_million, cache_write_per_million, output_per_million, source, updated_at, cache_price_estimated]
      properties:
        service_tier: { $ref: '#/components/schemas/ServiceTier' }
        input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        cached_input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        cache_write_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        output_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        source: { type: string, description: "`manual`, `models.dev`, `litellm`, or `openrouter`." }
        updated_at: { type: integer, format: int64 }
        cache_price_estimated: { type: boolean, description: True when a source omitted cache read or write pricing and the input price was used conservatively. }
    ModelPriceWriteResult:
      $ref: '#/components/schemas/ModelPrice'
    ModelUsageSummary:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            required: [model, calls, input_tokens, output_tokens]
            properties:
              model: { type: string }
              calls: { type: integer, format: int64 }
              input_tokens: { type: integer, format: int64 }
              output_tokens: { type: integer, format: int64 }
    ModelPriceSyncRequest:
      type: object
      properties:
        models:
          type: array
          items: { type: string, minLength: 1 }
          default: []
        currency: { $ref: '#/components/schemas/Currency' }
        tenant_external_id: { type: [string, 'null'] }
    ModelPriceSyncResult:
      type: object
      required: [source, sources, imported, matched, candidates, unmatched, preserved, sourceResults, prices]
      properties:
        source: { type: string }
        sources:
          type: array
          items: { type: string }
        imported: { type: integer, minimum: 0 }
        matched:
          type: array
          items: { type: string }
        candidates:
          type: array
          items:
            type: object
            required: [model, candidates]
            properties:
              model: { type: string }
              candidates:
                type: array
                items:
                  type: object
                  required: [sourceModelId, source, reason, inputPerMillion, outputPerMillion, serviceTier]
                  properties:
                    sourceModelId: { type: string }
                    source: { type: string }
                    reason: { type: string }
                    inputPerMillion: { $ref: '#/components/schemas/NonNegativeMoney' }
                    outputPerMillion: { $ref: '#/components/schemas/NonNegativeMoney' }
                    serviceTier: { $ref: '#/components/schemas/ServiceTier' }
        unmatched:
          type: array
          items: { type: string }
        preserved:
          type: array
          items: { type: string }
        sourceResults:
          type: array
          items:
            type: object
            required: [source, models, skipped]
            properties:
              source: { type: string }
              models: { type: integer, minimum: 0 }
              skipped: { type: integer, minimum: 0 }
              error: { type: string }
        prices:
          type: array
          items: { $ref: '#/components/schemas/ModelPrice' }
    GenerationPriceRequest:
      type: object
      required: [billing_unit, price_per_unit]
      properties:
        billing_unit: { type: string, enum: [job, second, image, megapixel] }
        price_per_unit: { $ref: '#/components/schemas/NonNegativeMoney' }
    GenerationPrice:
      type: object
      required: [id, model, currency, billing_unit, price_per_unit]
      properties:
        id: { type: string, format: uuid }
        model: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        billing_unit: { type: string, enum: [job, second, image, megapixel] }
        price_per_unit: { $ref: '#/components/schemas/NonNegativeMoney' }
    GrantRequest:
      type: object
      required: [amount, source]
      properties:
        amount: { $ref: '#/components/schemas/NonNegativeMoney' }
        source: { type: string, minLength: 1, maxLength: 200 }
    GrantReversalRequest:
      type: object
      required: [grant_idempotency_key, source]
      properties:
        grant_idempotency_key: { type: string, minLength: 1, maxLength: 200 }
        source: { type: string, minLength: 1, maxLength: 200 }
    LedgerEntry:
      type: object
      required: [entry_id, kind, amount, currency, source, idempotency_key, created_at]
      properties:
        entry_id: { type: string, format: uuid }
        kind: { type: string, enum: [grant, grant_reversal, usage, entitlement_adjustment] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        source: { type: string }
        idempotency_key: { type: [string, 'null'] }
        created_at: { type: integer, format: int64 }
    EntitlementIdentity:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9._:-]+$'
    ReconcileEntitlementRequest:
      type: object
      additionalProperties: false
      required: [account_id, provider, external_subscription_id, external_cycle_id, period_start, period_end, currency, desired, version, source]
      properties:
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Required for a global service credential; a scoped credential may omit it and is always bound to its own tenant.
        account_id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_cycle_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        period_start: { type: integer, format: int64, minimum: 0 }
        period_end: { type: integer, format: int64, minimum: 1, description: Must be greater than `period_start`. }
        currency: { $ref: '#/components/schemas/Currency' }
        desired: { $ref: '#/components/schemas/NonNegativeMoney' }
        version: { type: integer, format: int64, minimum: 1 }
        source: { type: string, minLength: 1, maxLength: 200 }
        proration:
          description: Optional provider/business proration evidence, stored canonically; serialized size is limited to 4 KiB.
    CancelEntitlementRequest:
      type: object
      additionalProperties: false
      required: [provider, external_subscription_id, version, source]
      properties:
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Required for a global service credential; a scoped credential may omit it.
        provider: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_cycle_id:
          oneOf:
            - $ref: '#/components/schemas/EntitlementIdentity'
            - type: 'null'
          description: Optional stale-cycle guard for the current billing cycle.
        version: { type: integer, format: int64, minimum: 1 }
        source: { type: string, minLength: 1, maxLength: 200 }
    ReplaceEntitlementRequest:
      type: object
      additionalProperties: false
      required: [provider, external_subscription_id, version, source, replacement]
      properties:
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Required for a global service credential; a scoped credential may omit it.
        provider: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        version: { type: integer, format: int64, minimum: 1, description: New version for the old stable subscription identity. }
        source: { type: string, minLength: 1, maxLength: 200 }
        replacement:
          allOf:
            - $ref: '#/components/schemas/ReconcileEntitlementRequest'
          description: Full snapshot for a different stable subscription identity in the same tenant and account.
    Entitlement:
      type: object
      required: [entitlement_id, cycle_id, tenant_external_id, account_id, provider, external_subscription_id, external_cycle_id, period_start, period_end, currency, desired, consumed, remaining, status, version, replaced_by_entitlement_id, created_at, updated_at]
      properties:
        entitlement_id: { type: string, format: uuid, description: Stable provider/subscription identity. }
        cycle_id: { type: string, format: uuid, description: Stable current billing-cycle identity. }
        tenant_external_id: { type: string }
        account_id: { type: string, format: uuid }
        provider: { type: string }
        external_subscription_id: { type: string }
        external_cycle_id: { type: string }
        period_start: { type: integer, format: int64 }
        period_end: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        desired: { $ref: '#/components/schemas/NonNegativeMoney' }
        consumed:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Settled usage attributed FIFO to entitlement cycles active for this stable account.
        remaining: { $ref: '#/components/schemas/NonNegativeMoney' }
        status: { type: string, enum: [active, cancelled, replaced] }
        version: { type: integer, format: int64, minimum: 1 }
        replaced_by_entitlement_id: { type: [string, 'null'], format: uuid }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    EntitlementResult:
      allOf:
        - $ref: '#/components/schemas/Entitlement'
        - type: object
          required: [ledger_delta, replaced_entitlement_id]
          properties:
            ledger_delta:
              $ref: '#/components/schemas/Money'
              description: Net account movement from this atomic operation; a negative value withdraws unused entitlement credit.
            replaced_entitlement_id:
              type: [string, 'null']
              format: uuid
              description: Old stable subscription identity, populated only by replace.
    MemeLoopCloudSubscriptionSnapshot:
      type: object
      additionalProperties: false
      required: [tenant_external_id, principal_external_id, external_subscription_id, currency, version, status, policy]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        principal_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_cycle_id:
          oneOf:
            - $ref: '#/components/schemas/EntitlementIdentity'
            - type: 'null'
          description: Required for active snapshots; optional stale-cycle guard for cancellation.
        period_start: { type: [integer, 'null'], format: int64, minimum: 0, description: Required only for active snapshots. }
        period_end: { type: [integer, 'null'], format: int64, minimum: 1, description: Required only for active snapshots and must exceed period_start. }
        currency: { $ref: '#/components/schemas/Currency' }
        desired:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
            - type: 'null'
          description: Exact current-cycle funded amount; required only for active snapshots.
        version: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, cancelled] }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
          description: Exact model-route grants. Empty or omitted denies exact-route access.
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
          description: Route-group grants. Empty or omitted denies route-group access.
        proration:
          description: Optional active-plan evidence; canonical serialized size, including the event digest, is limited to 4 KiB.
    ProvisionedCloudCredential:
      type: object
      additionalProperties: false
      required: [key_id, account_id, alias, currency, credential_generation, fingerprint, key]
      properties:
        key_id: { type: string, format: uuid, description: Stable across credential rotation and subscription changes. }
        account_id: { type: string, format: uuid, description: Stable credit/history owner. }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        fingerprint: { type: string }
        key:
          type: [string, 'null']
          writeOnly: true
          description: Encrypted replayable one-time secret during the 24-hour provisioning window; null after expiry or rotation.
    MemeLoopCloudSubscriptionResult:
      type: object
      additionalProperties: false
      required: [credential, entitlement, policy]
      properties:
        credential: { $ref: '#/components/schemas/ProvisionedCloudCredential' }
        entitlement: { $ref: '#/components/schemas/EntitlementResult' }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
    MemeLoopCloudSubscriptionEvent:
      type: object
      additionalProperties: false
      required: [event_id, tenant_external_id, principal_external_id, key_id, entitlement_id, provider, external_subscription_id, version, subscription_status, created_at]
      properties:
        event_id: { type: string, format: uuid }
        tenant_external_id: { type: string }
        principal_external_id: { type: string }
        key_id: { type: string, format: uuid }
        entitlement_id: { type: string, format: uuid }
        provider: { type: string, const: memeloop-cloud }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        version: { type: integer, format: int64, minimum: 1 }
        subscription_status: { type: string, enum: [active, cancelled] }
        created_at: { type: integer, format: int64 }
    SelfMemeLoopCloudEntitlements:
      type: object
      additionalProperties: false
      required: [entitlements, events]
      properties:
        entitlements:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Entitlement' }
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionEvent' }
    RequestSummary:
      type: object
      required: [request_id, created_at, protocol, model, status_code, duration_ms, input_tokens, output_tokens, cost, error_code, session_context]
      properties:
        request_id: { type: string, format: uuid }
        created_at: { type: integer, format: int64 }
        protocol: { type: string }
        model: { type: string }
        status_code: { type: [integer, 'null'], format: int64 }
        duration_ms: { type: [integer, 'null'], format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost: { $ref: '#/components/schemas/Money' }
        error_code: { type: [string, 'null'] }
        session_context:
          description: |
            Persisted logical-session projection for request records. `confirmed`
            identifies the internal session accepted by durable relationship evidence;
            `unlinked` explicitly records the absence of such an association. Candidate
            edges never appear as confirmed, and generation jobs return null.
          oneOf:
            - $ref: '#/components/schemas/RequestSessionContext'
            - type: 'null'
    RequestSessionContext:
      type: object
      additionalProperties: false
      required: [session_id, association, session_name, task_kind, agent_id, semantics_source]
      properties:
        session_id:
          type: [string, 'null']
          format: uuid
          description: Internal logical-session identifier; null for unlinked records.
        association: { type: string, enum: [confirmed, unlinked] }
        session_name: { type: [string, 'null'], maxLength: 256 }
        task_kind: { type: [string, 'null'], maxLength: 256 }
        agent_id: { type: [string, 'null'], maxLength: 256 }
        semantics_source:
          type: [string, 'null']
          enum: [declared, null]
          description: Source of the optional human/execution semantics; never model- or prompt-guessed.
    RequestDetail:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required: [request_body, response_body, archive_complete]
          properties:
            request_body: true
            response_body: true
            archive_complete: { type: boolean }
            provenance:
              oneOf:
                - $ref: '#/components/schemas/RequestProvenance'
                - type: 'null'
    RequestProvenance:
      type: object
      additionalProperties: false
      required: [source, disposition, unlinked, external_request_id, proof_digest]
      properties:
        source: { type: string, minLength: 1 }
        disposition: { type: string, enum: [exact, unlinked] }
        unlinked: { type: boolean }
        external_request_id: { type: string, minLength: 1, maxLength: 512 }
        proof_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    StatisticsSummary:
      type: object
      required: [total_requests, successful_requests, failed_requests, input_tokens, output_tokens, total_cost, costs]
      properties:
        total_requests: { type: integer, format: int64 }
        successful_requests: { type: integer, format: int64 }
        failed_requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        total_cost:
          description: Single-currency compatibility value; null when the projection spans currencies.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        costs:
          type: array
          description: Stable ascending currency order; unlike currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    StatisticsBucket:
      type: object
      required: [name, requests, input_tokens, output_tokens, cost, costs]
      properties:
        name: { type: string }
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost:
          description: Single-currency compatibility value; null when the bucket spans currencies.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        costs:
          type: array
          description: Stable ascending currency order; unlike currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    Statistics:
      type: object
      required: [summary, by_model, by_day, errors]
      properties:
        summary: { $ref: '#/components/schemas/StatisticsSummary' }
        by_model:
          type: array
          items: { $ref: '#/components/schemas/StatisticsBucket' }
        by_day:
          type: array
          items: { $ref: '#/components/schemas/StatisticsBucket' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/StatisticsBucket' }
    UsageAnalysisCost:
      type: object
      additionalProperties: false
      required: [currency, cost]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        cost: { $ref: '#/components/schemas/NonNegativeMoney' }
    UsageAnalysisGenerationUnitsByModality:
      type: object
      additionalProperties: false
      required: [modality, currency, units]
      properties:
        modality:
          type: string
          enum: [image, video, unknown]
        currency: { $ref: '#/components/schemas/Currency' }
        units: { type: integer, format: int64, minimum: 0 }
    UsageAnalysisGenerationUnitsByBillingUnit:
      type: object
      additionalProperties: false
      required: [billing_unit, currency, units]
      properties:
        billing_unit:
          type: string
          minLength: 1
          description: Immutable generation price billing-unit snapshot, or unknown.
        currency: { $ref: '#/components/schemas/Currency' }
        units: { type: integer, format: int64, minimum: 0 }
    UsageAnalysisMetrics:
      type: object
      required: [requests, success, failed, input_tokens, output_tokens, cached_input_tokens, cache_write_tokens, generation_units, avg_duration_ms, p95_duration_ms, costs]
      properties:
        requests: { type: integer, format: int64, minimum: 0 }
        success: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        input_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Uncached input tokens; cached reads and writes are separate fields.
        output_tokens: { type: integer, format: int64, minimum: 0 }
        cached_input_tokens: { type: integer, format: int64, minimum: 0 }
        cache_write_tokens: { type: integer, format: int64, minimum: 0 }
        generation_units: { type: integer, format: int64, minimum: 0 }
        avg_duration_ms: { type: [number, 'null'], format: double, minimum: 0 }
        p95_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 60000
          description: Fixed-histogram approximation; values above 60000 ms are capped.
        costs:
          type: array
          description: Stable ascending currency order; amounts from different currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    UsageAnalysisDimensionBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [id, label]
          properties:
            id: { type: string, minLength: 1 }
            label: { type: string, minLength: 1 }
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysisSessionBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [id, label, key_id, key_alias, unlinked]
          properties:
            id: { type: string, minLength: 1 }
            label: { type: string, minLength: 1 }
            key_id: { type: string, format: uuid }
            key_alias: { type: string }
            unlinked: { type: boolean }
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysisTimeBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [bucket_start]
          properties:
            bucket_start:
              type: integer
              format: int64
              minimum: 0
              description: Inclusive UTC bucket start as Unix epoch milliseconds.
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysisHeatmapBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [hour_of_week]
          properties:
            hour_of_week:
              type: integer
              minimum: 0
              maximum: 167
              description: Monday 00:00 UTC is 0; Sunday 23:00 UTC is 167.
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysis:
      type: object
      additionalProperties: false
      required: [from_created_at, to_created_at, granularity, time_zone, p95_is_approximate, p95_method, upstream_grouping, summary, generation_units_by_modality, generation_units_by_billing_unit, time_series, by_model, by_key, by_session, by_upstream, by_protocol, by_status, errors, heatmap]
      properties:
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity: { type: string, enum: [hour, day] }
        time_zone: { type: string, const: UTC }
        p95_is_approximate: { type: boolean, const: true }
        p95_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        upstream_grouping:
          type: string
          const: stable_account
          description: >-
            Usage is grouped by the stable upstream account across API credential
            and OAuth rotations. Historical requests are never relabelled as the
            account's current credential generation.
        summary: { $ref: '#/components/schemas/UsageAnalysisMetrics' }
        generation_units_by_modality:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByModality' }
        generation_units_by_billing_unit:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByBillingUnit' }
        time_series:
          type: array
          items: { $ref: '#/components/schemas/UsageAnalysisTimeBucket' }
        by_model:
          type: array
          maxItems: 100
          description: >-
            `id` is the exact model value accepted by the `model` query filter;
            `label` is the same user-visible model name.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_key:
          type: array
          maxItems: 100
          description: >-
            `id` is the stable client-credential UUID accepted by `key_id`;
            `label` is its current alias and is never used as filter identity.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_session:
          type: array
          maxItems: 100
          description: >-
            Proven logical conversation cluster IDs, plus explicit
            unlinked:<stable-key-id> buckets when no reliable cluster exists.
            Unlinked requests are never guessed into another conversation.
            Session p95 is null because the compact session rollup preserves
            exact average latency but not a latency histogram.
          items: { $ref: '#/components/schemas/UsageAnalysisSessionBucket' }
        by_upstream:
          type: array
          maxItems: 100
          description: >-
            `id` is a stable upstream UUID or the `unassigned` sentinel, both
            accepted by this operation's `upstream_account_id` filter. The UUID
            is the stable account identity across credential rotations; a
            credential generation is intentionally not inferred for historical
            requests. Clients localize the sentinel label.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_protocol:
          type: array
          maxItems: 100
          description: >-
            `id` is one canonical protocol family accepted by `protocol`:
            `openai`, `anthropic`, `openai-image`, or `generation`.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_status:
          type: array
          maxItems: 100
          description: >-
            `id` is the public logical filter value `success` or `error`; the
            internal rollup value `failure` is never exposed.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        errors:
          type: array
          maxItems: 100
          description: >-
            `id` is an exact non-empty value accepted by `error_code`. Empty
            success sentinels are omitted. Ordering is request count descending,
            then error id ascending.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        heatmap:
          type: array
          maxItems: 168
          description: >-
            `hour_of_week` is a UTC display coordinate, not a query-filter
            sentinel. Missing coordinates mean zero activity and are filled by
            the client.
          items: { $ref: '#/components/schemas/UsageAnalysisHeatmapBucket' }
    SelfUsageAnalysis:
      type: object
      additionalProperties: false
      required: [from_created_at, to_created_at, granularity, time_zone, p95_is_approximate, p95_method, summary, generation_units_by_modality, generation_units_by_billing_unit, time_series, by_model, by_protocol, by_status, errors, heatmap]
      properties:
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity: { type: string, enum: [hour, day] }
        time_zone: { type: string, const: UTC }
        p95_is_approximate: { type: boolean, const: true }
        p95_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        summary: { $ref: '#/components/schemas/UsageAnalysisMetrics' }
        generation_units_by_modality:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByModality' }
        generation_units_by_billing_unit:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByBillingUnit' }
        time_series:
          type: array
          items: { $ref: '#/components/schemas/UsageAnalysisTimeBucket' }
        by_model:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_protocol:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_status:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        errors:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        heatmap:
          type: array
          maxItems: 168
          description: Missing UTC hour-of-week coordinates mean zero activity.
          items: { $ref: '#/components/schemas/UsageAnalysisHeatmapBucket' }
    GenerationJob:
      type: object
      required: [job_id, created_at, updated_at, completed_at, model, driver, billing_unit, status, upstream_job_id, estimated_units, billed_units, cost, error_code, result, assets]
      properties:
        job_id: { type: string, format: uuid }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        completed_at: { type: [integer, 'null'], format: int64 }
        model: { type: string }
        driver: { type: string }
        billing_unit: { type: string, enum: [job, second, image, megapixel] }
        status: { type: string, enum: [queued, running, cancelling, succeeded, failed, cancelled] }
        upstream_job_id: { type: [string, 'null'] }
        estimated_units: { type: integer, format: int64 }
        billed_units: { type: [integer, 'null'], format: int64 }
        cost: { $ref: '#/components/schemas/Money' }
        error_code: { type: [string, 'null'] }
        result: true
        assets:
          type: array
          items: { $ref: '#/components/schemas/GenerationAsset' }
    OperatorGenerationJob:
      allOf:
        - $ref: '#/components/schemas/GenerationJob'
        - type: object
          required: [tenant_external_id, key_id, key_alias, currency]
          properties:
            tenant_external_id: { type: string, minLength: 1 }
            key_id: { type: string, format: uuid }
            key_alias: { type: string, minLength: 1 }
            currency: { type: string, minLength: 3, maxLength: 3 }
    GenerationAsset:
      type: object
      additionalProperties: false
      required: [asset_id, index, mime_type, size_bytes, filename]
      properties:
        asset_id: { type: string, format: uuid }
        index: { type: integer, format: int64, minimum: 0 }
        mime_type: { type: string, minLength: 1 }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        filename: { type: string, minLength: 1 }
    ConversationCluster:
      type: object
      required: [cluster_id, explicit_session_id, updated_at, request_count, candidate_edge_count]
      properties:
        cluster_id: { type: string, format: uuid }
        explicit_session_id: { type: [string, 'null'] }
        updated_at: { type: integer, format: int64 }
        request_count: { type: integer, format: int64 }
        candidate_edge_count: { type: integer, format: int64 }
    ConversationEdge:
      type: object
      required: [from_request_id, to_request_id, relation, confidence, evidence]
      properties:
        from_request_id: { type: [string, 'null'], format: uuid }
        to_request_id: { type: string, format: uuid }
        relation: { type: string, enum: [continues, retry, edit, branch, compacts, subagent, candidate] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence: { type: object, additionalProperties: true }
    ConversationRequest:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required: [source, provenance, unlinked, currency]
          properties:
            source: { type: string, enum: [live, session_archive] }
            provenance: { type: string, enum: [native, archive_unlinked] }
            unlinked: { type: boolean }
            currency: { type: [string, 'null'], description: Billing currency for live requests; null for non-billable archive-only records. }
            archive_source: { type: string }
            external_request_id: { type: string, maxLength: 512 }
            execution: { $ref: '#/components/schemas/ExecutionMetadata' }
            structure: { $ref: '#/components/schemas/ExecutionStructure' }
    ExecutionMetadata:
      type: object
      additionalProperties: false
      required: [session_name, trace_id, span_id, parent_span_id, agent_id, parent_agent_id, task_kind, labels, source]
      properties:
        session_name: { type: [string, 'null'], maxLength: 256 }
        trace_id: { type: [string, 'null'], maxLength: 256 }
        span_id: { type: [string, 'null'], maxLength: 256 }
        parent_span_id: { type: [string, 'null'], maxLength: 256 }
        agent_id: { type: [string, 'null'], maxLength: 256 }
        parent_agent_id: { type: [string, 'null'], maxLength: 256 }
        task_kind: { type: [string, 'null'], maxLength: 256 }
        labels:
          type: object
          maxProperties: 16
          propertyNames: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
          additionalProperties: { type: string, maxLength: 128 }
        source: { type: string, enum: [declared] }
    ExecutionStructure:
      type: object
      additionalProperties: false
      required: [session_id, turn_id, parent_turn_id, response_id, branch_id, compaction, client_name, source]
      properties:
        session_id: { type: [string, 'null'], maxLength: 256 }
        turn_id: { type: [string, 'null'], maxLength: 256 }
        parent_turn_id: { type: [string, 'null'], maxLength: 256 }
        response_id: { type: [string, 'null'], maxLength: 256 }
        branch_id: { type: [string, 'null'], maxLength: 256 }
        compaction: { type: boolean }
        client_name: { type: [string, 'null'], maxLength: 256 }
        source: { type: string, enum: [client_protocol] }
    ConversationDetail:
      type: object
      required: [cluster, requests, edges, has_more, next_cursor, edges_truncated]
      properties:
        cluster: { $ref: '#/components/schemas/ConversationCluster' }
        requests:
          type: array
          items: { $ref: '#/components/schemas/ConversationRequest' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ConversationEdge' }
        has_more:
          type: boolean
          description: Whether an older request page remains.
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/ConversationCursor'
            - type: 'null'
        edges_truncated:
          type: boolean
          description: Whether the hard per-page edge bound omitted additional edges.
    LogicalSessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, session_name, task_kind, cluster_id, unlinked, key_id, key_alias, model, protocol, last_status, last_activity_at, active_requests, requests, errors, input_tokens, output_tokens, avg_duration_ms, costs, archived_only_requests, archived_only_errors, archived_only_input_tokens, archived_only_output_tokens, archived_only_avg_duration_ms]
      properties:
        session_id: { type: string, minLength: 1, maxLength: 80 }
        session_name: { type: [string, 'null'], maxLength: 256 }
        task_kind: { type: [string, 'null'], maxLength: 256 }
        cluster_id: { type: [string, 'null'], format: uuid }
        unlinked: { type: boolean }
        key_id: { type: string, format: uuid }
        key_alias: { type: string }
        model: { type: string }
        protocol: { type: string }
        last_status: { type: string, enum: [active, success, error, unknown] }
        last_activity_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
        active_requests: { type: integer, format: int64, minimum: 0 }
        requests: { type: integer, format: int64, minimum: 0 }
        errors: { type: integer, format: int64, minimum: 0 }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        avg_duration_ms: { type: [number, 'null'], minimum: 0 }
        costs:
          type: array
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
        archived_only_requests:
          type: integer
          format: int64
          minimum: 0
          description: Imported diagnostic records without authoritative usage facts.
        archived_only_errors: { type: integer, format: int64, minimum: 0 }
        archived_only_input_tokens: { type: integer, format: int64, minimum: 0 }
        archived_only_output_tokens: { type: integer, format: int64, minimum: 0 }
        archived_only_avg_duration_ms:
          type: [number, 'null']
          minimum: 0
          description: Non-billable archive-only average; null when no duration was imported.
    LogicalSessionListCursor:
      type: object
      additionalProperties: false
      required: [before_last_activity_at, before_session_id]
      properties:
        before_last_activity_at: { type: integer, format: int64 }
        before_session_id: { type: string, minLength: 1, maxLength: 80 }
    LogicalSessionListResponse:
      type: object
      additionalProperties: false
      required: [generated_at, sessions, next_cursor]
      properties:
        generated_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/LogicalSessionSummary' }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/LogicalSessionListCursor'
            - type: 'null'
    LogicalSessionDetail:
      type: object
      additionalProperties: false
      required: [session_id, cluster_id, unlinked, requests, edges, has_more, next_cursor, edges_truncated]
      properties:
        session_id: { type: string, minLength: 1, maxLength: 80 }
        cluster_id: { type: [string, 'null'], format: uuid }
        unlinked: { type: boolean }
        requests:
          type: array
          items: { $ref: '#/components/schemas/ConversationRequest' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ConversationEdge' }
        has_more: { type: boolean }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/ConversationCursor'
            - type: 'null'
        edges_truncated: { type: boolean }
    ConversationCursor:
      type: object
      required: [before_created_at, before_request_id]
      properties:
        before_created_at: { type: integer, format: int64 }
        before_request_id: { type: string, format: uuid }
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items:
            type: object
            required: [id, object, owned_by, modalities]
            properties:
              id: { type: string }
              object: { const: model }
              owned_by: { const: memeloop }
              modalities:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [text, image, video, embedding]
              generation_schema:
                type: object
                description: Sanitized closed scalar JSON Schema for downstream input.parameters only. It never contains workflow internals, references, remote schemas, or recursive/complex constructs, and is omitted unless every effective generation candidate has the same schema.
    OpenAIChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        messages: { type: array, items: true }
        stream: { type: boolean }
    OpenAIResponseRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        input: true
        stream: { type: boolean }
        previous_response_id:
          type: [string, 'null']
          maxLength: 256
          description: |
            OpenAI Responses continuation identifier. Schema v16 stores a successful
            upstream response `id` on the prior logical-conversation observation, so a
            later request can use this value as direct parent evidence even when the
            client does not send Token Center-specific turn headers.
    OpenAIEmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        input: true
    AnthropicMessageRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        messages: { type: array, items: true }
        max_tokens: { type: integer, minimum: 1 }
        stream: { type: boolean }
    AsyncGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        input: { type: object, additionalProperties: true, description: Provider-native Seedance input, closed SiliconFlow T2V parameters, or administrator-owned ComfyUI workflow inputs. Consult the selected model's generation_schema when present. }
    OpenAIImageRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
