  /internal/v1/accounts/{account_id}/ledger:
    get:
      tags: [Credits]
      operationId: listAccountLedger
      summary: List recent account ledger entries
      description: |
        Entries are ordered by `(created_at, entry_id)` descending. Use the final row's
        `created_at` and `entry_id` as the paired, exclusive `before_created_at` and
        `before_id` cursor. Every page remains bound to the path account and a
        tenant-scoped service credential may inspect only an account in its own tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: credits:read
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Ledger entries newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/LedgerEntry' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/entitlements:
    get:
      tags: [Entitlements]
      operationId: listEntitlements
      summary: List current subscription entitlement cycles
      description: |
        Returns at most 500 rows newest first. A tenant-scoped service credential is
        automatically bound to its tenant; explicitly selecting another tenant returns
        403. A global credential may omit the tenant to list across tenants.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: provider
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EntitlementIdentity' }
        - name: external_subscription_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EntitlementIdentity' }
      responses:
        '200':
          description: Current-cycle entitlement views matching every supplied filter.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Entitlements]
      operationId: reconcileEntitlement
      summary: Reconcile one exact external subscription-cycle entitlement
      description: |
        Sets the desired funded amount for a stable provider/subscription and billing
        cycle. A higher version is required after the first successful operation. A
        cancelled entitlement may be reactivated only with an explicitly higher version;
        a replaced identity can never be reactivated. Stable subscriptions cannot move
        accounts and stable cycle IDs cannot change period or currency.

        The replay namespace is `(tenant, Idempotency-Key)`. The same canonical payload
        returns the original response; reuse with another payload returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:write
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileEntitlementRequest' }
      responses:
        '201':
          description: Created or updated entitlement snapshot, including its exact net ledger movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/integrations/memeloop-cloud/subscription:
    put:
      tags: [Entitlements]
      operationId: syncMemeLoopCloudSubscription
      summary: Apply one signed MemeLoop Cloud registration or subscription snapshot
      description: |
        Provisions one stable principal, credit account, and downstream credential, then
        applies the exact subscription quota and credential policy. Credential rotation
        never changes the stable key/account IDs or their history. Active snapshots cover
        registration, renewal, upgrade, downgrade, and reactivation only while the stable
        credential remains active. Suspended or revoked credentials reject active snapshots
        atomically; only an operator may change credential lifecycle. Cancelled snapshots
        still withdraw the unconsumed entitlement remainder.

        `version` is monotonically increasing for the stable external subscription. Older
        out-of-order events return 409 and cannot roll quota or policy back. The replay
        namespace is the tenant plus `Idempotency-Key`; reuse with a different canonical
        snapshot returns 409. Signature input is the ASCII timestamp, one `.` byte, and
        the exact request body. The signature is `v1=` plus unpadded URL-safe base64 of
        HMAC-SHA-256. Timestamps outside a five-minute window fail closed.
      x-signature-contract:
        algorithm: HMAC-SHA-256
        encoding: base64url-no-padding
        envelope: ascii-timestamp-dot-exact-body
        tolerance-seconds: 300
        disabled-without-secret: true
      x-idempotency-contract:
        namespace: tenant-and-event-id-digest
        payload: canonical-full-snapshot
        different-payload-status: 409
        stale-version-status: 409
        quota-version-source: durable-subscription-entitlement
        policy-update: compare-and-set-on-current-entitlement-version
        routing-update: same-transaction-normalized-grants
        legacy-allowed-models: current-route-snapshot-only
        stable-history-owner: key-id-and-account-id
        raw-event-id-persisted: false
      security: [{ memeloopCloudHmac: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - name: X-MTC-Webhook-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
          description: Unix epoch seconds used in the signed envelope.
        - name: X-MTC-Webhook-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1=[A-Za-z0-9_-]{43}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionSnapshot' }
      responses:
        '200':
          description: Cancellation applied or replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionResult' }
        '201':
          description: Registration or active subscription snapshot applied or replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/integrations/memeloop-cloud/events:
    get:
      tags: [Entitlements]
      operationId: listMemeLoopCloudSubscriptionEvents
      summary: List bounded MemeLoop Cloud subscription lifecycle events
      description: |
        Returns at most 500 sanitized audit rows newest first. Tenant-scoped service
        credentials are always bound to their tenant; selecting another tenant returns
        403. Raw webhook event identities and request digests are never returned.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: principal_external_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: key_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Sanitized subscription lifecycle events.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionEvent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/v1/entitlements/cancel:
    post:
      tags: [Entitlements]
      operationId: cancelEntitlement
      summary: Cancel an external subscription without revoking consumed credit
      description: |
        Requires a version higher than the current entitlement. Only the current cycle's
        unconsumed remainder is withdrawn; `desired` and `consumed` remain auditable and
        `remaining` becomes zero. Optional `external_cycle_id` rejects a stale-cycle
        cancellation. The `(tenant, Idempotency-Key)` replay and 409 mismatch rules are
        the same as reconciliation.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:write
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEntitlementRequest' }
      responses:
        '200':
          description: Cancelled entitlement and negative-or-zero ledger delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/entitlements/replace:
    post:
      tags: [Entitlements]
      operationId: replaceEntitlement
      summary: Atomically replace one stable subscription with another
      description: |
        Requires a higher version for the old identity. The operation withdraws only the
        old cycle's unconsumed remainder, marks the old entitlement `replaced`, and funds
        a new active subscription/cycle in the same tenant and stable credit account.
        The replacement provider/subscription identity must differ and must not already
        exist. The `(tenant, Idempotency-Key)` replay and 409 mismatch rules are the same
        as reconciliation.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:write
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceEntitlementRequest' }
      responses:
        '201':
          description: New active entitlement plus the replaced stable entitlement ID and net ledger delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/requests:
    get:
      tags: [Operator traffic]
      operationId: listOperatorRequests
      summary: List recent requests and generation jobs
      description: |
        Returns at most 500 records ordered by `(created_at, request_id)` descending.
