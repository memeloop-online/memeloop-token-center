        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/responses:
    get:
      tags: [OpenAI compatible]
      operationId: negotiateResponsesWebSocket
      summary: Negotiate the Responses transport before native WebSocket support is available
      description: |
        Temporary authenticated compatibility response for clients that probe the
        Responses WebSocket endpoint before using HTTP. This operation returns 426
        immediately so the client can use `POST /v1/responses`. It does not remove or
        replace the planned native Responses WebSocket transport.
      x-transport-negotiation:
        lifecycle: temporary-until-native-websocket
        fallback-operation: POST /v1/responses
        native-websocket-planned: true
      security: [{ clientBearer: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '426': { $ref: '#/components/responses/ResponsesWebSocketUpgradeRequired' }
    post:
      tags: [OpenAI compatible]
      operationId: createResponse
      summary: Proxy an OpenAI-compatible Responses request
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAIResponseRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/embeddings:
    post:
      tags: [OpenAI compatible]
      operationId: createEmbeddings
      summary: Proxy an OpenAI-compatible embeddings request
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAIEmbeddingRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProxySuccess' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /v1/audio/transcriptions:
    post:
      tags: [OpenAI compatible]
      operationId: createAudioTranscription
      summary: Transcribe PCM16 WAV audio through an OpenAI-compatible ASR route
      description: |
        Phase one accepts one uncompressed PCM16 WAV `file` and a required `model`.
        `prompt` and `hotwords` (a JSON string array encoded as a multipart text field)
        are optional. `temperature`, when present, must be between 0 and 1 and is
        forwarded to the selected upstream.
        `response_format` is `json` by default or `verbose_json`.

        Authentication, explicit `openai-audio` model-route grants backed by the `audio`
        provider modality, upstream health admission,
        key RPM/concurrency limits, balance/budget reservation, and per-second generation
        pricing all apply. Actual duration is measured from the trusted WAV format/data
        chunks before dispatch; millisecond-resolution duration is retained in audit history and the
        configured `second` price bills the minimum whole seconds covering that duration.
        Audio bytes, prompts, hotwords, and transcription text are not archived. Request
        detail exposes only bounded accounting metadata with archive state `metadata_only`.
        The body limit is configured independently by `MTC_AUDIO_BODY_MAX_BYTES` (Helm
        `config.audioBodyMaxBytes`), defaults to 25 MiB, and never changes Responses limits.
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/OpenAIAudioTranscriptionRequest' }
      responses:
        '200':
          description: Normalized transcription response.
          headers:
            X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
            X-MTC-API-Version: { $ref: '#/components/headers/ApiVersion' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAIAudioTranscriptionJson'
                  - $ref: '#/components/schemas/OpenAIAudioTranscriptionVerboseJson'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/messages:
    post:
      tags: [Anthropic compatible]
      operationId: createAnthropicMessage
      summary: Proxy an Anthropic Messages request
      security: [{ clientBearer: [] }]
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string }
        - name: anthropic-beta
          in: header
          required: false
          description: Capability values pass through to Anthropic-format upstream routes.
          schema: { type: string }
        - name: beta
