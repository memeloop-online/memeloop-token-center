      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_external_id: { type: [string, 'null'] }
        name: { type: string }
        driver: { type: string }
        auth_kind: { type: string, enum: [none, api_key, oauth], description: Stored authentication family. }
        connection_method: { type: string, enum: [none, api_key, oauth, legacy], description: Presentation metadata for the unified upstream resource; legacy is read-only historical data. }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, disabled] }
        config: { type: object, additionalProperties: true }
        credential_expires_at: { type: [integer, 'null'], format: int64 }
        has_proxy: { type: boolean, description: True when the current encrypted credential contains a transport proxy. }
        proxy_scheme:
          type: [string, 'null']
          enum: [socks5, socks5h, null]
          description: Sanitized scheme only; socks5h means remote target DNS.
        proxy_remote_dns: { type: boolean, description: True only for socks5h. No proxy endpoint or credential is exposed. }
        proxy_label: { type: [string, 'null'], description: Server-generated generic label without host, port, username, or password. }
        proxy_fingerprint: { type: [string, 'null'], pattern: '^proxy_[0-9a-f]{16}$', description: Pepper-keyed non-reversible comparison fingerprint. }
        can_update_transport_proxy: { type: boolean, description: True only for a global operator viewing a current OAuth or proxied API-key credential supported by the explicit transport operation. }
        import_source_identity_hash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: Opaque operator-HMAC provenance for a native OAuth import; null for other accounts. }
        import_source_document_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: Canonical source-document digest for a native OAuth import; null for other accounts. }
        can_refresh: { type: boolean, description: Managed OAuth refresh is available for the active generation. }
        can_rotate: { type: boolean, description: The credential may be replaced without changing the stable account identity. }
        can_reauthorize: { type: boolean, description: An interactive reauthorization endpoint is available. }
        route_count: { type: integer, format: int64, minimum: 0, description: Includes disabled routes retained for audit. }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    UpstreamDeletionReadiness:
      type: object
      additionalProperties: false
      required: [requires_disabled, model_route_count, request_history_count, generation_history_count, imported_for_audit, can_delete]
      properties:
        requires_disabled: { type: boolean, description: The stable upstream must first transition to disabled. }
        model_route_count: { type: integer, format: int64, minimum: 0, description: Distinct direct or multi-candidate model routes, including disabled routes. }
        request_history_count: { type: integer, format: int64, minimum: 0, description: Immutable request-history rows attributed to this upstream and retained after physical deletion. }
        generation_history_count: { type: integer, format: int64, minimum: 0, description: Immutable generation-history rows attributed to this upstream and retained after physical deletion. }
        imported_for_audit: { type: boolean, description: Immutable import provenance retains the upstream for audit. }
        can_delete: { type: boolean, description: All deletion blockers were absent when this read completed; DELETE verifies them again transactionally. }
    DisconnectUpstreamOAuthRequest:
      type: object
      additionalProperties: false
      required: [expected_updated_at]
      properties:
        tenant_external_id: { type: string, default: default }
        expected_updated_at:
          type: integer
          format: int64
          description: Optimistic-concurrency value from the current upstream provider.
    DisconnectUpstreamOAuthResponse:
      type: object
      additionalProperties: false
      required: [account, provider_revocation]
      properties:
        account: { $ref: '#/components/schemas/UpstreamProvider' }
        provider_revocation:
          $ref: '#/components/schemas/ProviderRevocation'
    ProviderRevocation:
      type: object
      additionalProperties: false
      required: [kind, attempted, revoked]
      properties:
        kind:
          type: string
          enum: [provider_and_local, local_only]
        attempted: { type: boolean }
        revoked: { type: boolean }
        status_code:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
    UpstreamHealthResult:
      type: object
      additionalProperties: false
      required: [account_id, status, checked_at]
      properties:
        account_id: { type: string, format: uuid }
        status: { type: string, enum: [healthy, unhealthy] }
        error_code:
          type: [string, 'null']
          enum: [credential_invalid, destination_invalid, authentication_failed, upstream_unavailable, connection_failed, null]
        upstream_status: { type: integer, minimum: 100, maximum: 599, description: Present when an HTTP response was received; its body is discarded. }
        latency_ms: { type: integer, format: int64, minimum: 0, description: Present when a network probe was attempted. }
        checked_at: { type: integer, format: int64 }
    StartCursorOAuthRequest:
      type: object
      additionalProperties: false
      required: [account_name, provider_config]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1 }
        provider_driver: { type: string, default: http-json }
        provider_config: { type: object, additionalProperties: true }
        upstream_account_id: { type: string, format: uuid, description: Existing stable upstream identity to reauthorize. Its tenant, name, driver, and configuration must match this request. }
        proxy_url:
          type: string
          pattern: '^socks5h://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Optional account proxy for the complete OAuth and runtime lifecycle. Omit for a direct connection. Reauthorization reuses the current account setting.
        endpoints:
          type: [object, 'null']
          additionalProperties: false
          required: [login_url, poll_url, refresh_url]
          properties:
            login_url: { type: string, format: uri }
            poll_url: { type: string, format: uri }
            refresh_url: { type: string, format: uri }
          description: Custom endpoints are accepted only when the server explicitly enables loopback OAuth for tests.
    StartProviderAdapterOAuthRequest:
      type: object
      additionalProperties: false
      required: [account_name, provider_driver, provider_config]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1 }
        provider_driver: { type: string, minLength: 1 }
        provider_config: { type: object, additionalProperties: true }
        upstream_account_id: { type: string, format: uuid, description: Existing stable upstream identity to reauthorize. Its tenant, name, driver, and configuration must match this request. }
        proxy_url:
          type: string
          pattern: '^socks5h://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Optional account proxy for login polling, token refresh and runtime traffic. Omit for a direct connection. Reauthorization reuses the current account setting.
    StartCodexOAuthRequest:
      type: object
      additionalProperties: false
      required: [account_name]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1 }
        upstream_account_id: { type: string, format: uuid, description: Existing stable OpenAI Codex upstream identity to reauthorize. }
        proxy_url:
          type: string
          pattern: '^socks5h://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Optional private IP-literal SOCKS5H endpoint used by the complete OAuth and runtime lifecycle. Omit for a direct connection. Reauthorization reuses the existing account setting.
    StartProviderAuthorizationCodeRequest:
      type: object
      additionalProperties: false
      description: In-place reauthorization is supported only for Antigravity accounts with a recorded Google user identity and complete original OAuth client settings. Set upstream_account_id and the matching tenant/provider/account name; omit provider_config to reuse it, or provide identical config. Proxy changes and client/callback/scope changes are rejected. Legacy credentials missing identity or client settings do not support in-place reauthorization. Completion verifies the new Google identity against the original, preserves account name/config/status/grants and returns HTTP 200. New-account creation requires provider_config and completes with HTTP 201.
      required: [account_name, provider_driver]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1, maxLength: 200 }
        upstream_account_id: { type: [string, 'null'], format: uuid }
        provider_driver: { type: string }
        provider_config: { type: object }
        proxy_url: { type: string, writeOnly: true }
        proxy_network_scope: { type: string, enum: [private] }
        client:
          type: object
          additionalProperties: false
          required: [client_id, redirect_uri, scopes]
          description: Overrides deployment Secret defaults from MTC_PROVIDER_OAUTH_CLIENT_DEFAULTS_JSON.
          properties:
            client_id: { type: string }
            redirect_uri: { type: string, format: uri }
            scopes: { type: array, items: { type: string }, minItems: 1, maxItems: 32 }
            client_secret: { type: string, writeOnly: true }
    StartClaudeOAuthRequest:
      type: object
      additionalProperties: false
      required: [account_name]
      properties:
        tenant_external_id: { type: string, default: default }
        account_name: { type: string, minLength: 1 }
        upstream_account_id: { type: string, format: uuid, description: Existing stable Claude upstream identity to reauthorize. }
        proxy_url:
          type: string
          pattern: '^socks5h://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Optional account proxy for token exchange, profile lookup, refresh, revocation and runtime traffic. Omit for a direct connection. Reauthorization reuses the current account setting.
    CompleteClaudeOAuthRequest:
      type: object
      additionalProperties: false
      required: [session_token, authorization_code]
      properties:
        session_token: { type: string, writeOnly: true }
        authorization_code:
          type: string
