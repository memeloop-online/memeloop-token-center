            mapping:
              route: '#/components/schemas/ModelPickerRouteSelection'
              model: '#/components/schemas/ModelPickerModelSelection'
        value: { type: string, minLength: 1, maxLength: 200 }
        label: { type: string, minLength: 1, maxLength: 200 }
        sources:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ModelPickerSource' }
        sources_truncated: { type: boolean }
    ModelPickerRouteSelection:
      type: object
      additionalProperties: false
      required: [kind, route_id]
      properties:
        kind: { const: route }
        route_id: { type: string, format: uuid }
    ModelPickerModelSelection:
      type: object
      additionalProperties: false
      required: [kind, model]
      properties:
        kind: { const: model }
        model: { type: string, minLength: 1, maxLength: 200 }
    ModelPickerNamedIdentity:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1 }
    ModelPickerProviderIdentity:
      type: object
      additionalProperties: false
      required: [id, label, protocols, modalities]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        protocols:
          type: array
          uniqueItems: true
          items: { type: string }
        modalities:
          type: array
          uniqueItems: true
          items: { type: string }
    ModelPickerConfigurationAvailability:
      type: object
      additionalProperties: false
      required: [status, reasons]
      properties:
        status: { type: string, enum: [available, unavailable] }
        reasons:
          type: array
          uniqueItems: true
          items: { type: string, enum: [account_inactive, credential_unavailable, route_candidate_ineligible] }
    ModelPickerCatalogEvidence:
      type: object
      additionalProperties: false
      required: [status, observed_at, last_success_at, expires_at, error_code, model_listed]
      properties:
        status: { type: string, enum: [never_observed, loading, ready, stale, partial, error] }
        observed_at: { type: [integer, 'null'], format: int64 }
        last_success_at: { type: [integer, 'null'], format: int64 }
        expires_at: { type: [integer, 'null'], format: int64 }
        error_code:
          type: [string, 'null']
          enum: [unsupported, destination_invalid, credential_invalid, connection_failed, authentication_failed, rate_limited, upstream_unavailable, redirect_rejected, response_too_large, invalid_response, codex_no_trusted_models, null]
        model_listed: { type: boolean }
    ModelPickerSourceCapabilities:
      type: object
      additionalProperties: false
      required: [route_protocol, upstream_model, catalog_model_listed]
      properties:
        route_protocol: { type: string, minLength: 1, maxLength: 64 }
        upstream_model: { type: string, minLength: 1, maxLength: 500 }
        catalog_model_listed: { type: boolean }
    ModelPickerHealthEvidence:
      type: object
      additionalProperties: false
      required: [status, observed_at, cooldown_until, failure_kind]
      properties:
        status: { type: string, enum: [unknown, healthy, degraded, unhealthy] }
        observed_at: { type: [integer, 'null'], format: int64 }
        cooldown_until: { type: [integer, 'null'], format: int64 }
        failure_kind: { type: [string, 'null'] }
    ModelPickerSource:
      type: object
      additionalProperties: false
      required: [route_id, provider, provider_groups, provider_groups_truncated, account, configuration_availability, catalog, capabilities, passive_health]
      properties:
        route_id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ModelPickerProviderIdentity' }
        provider_groups:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ModelPickerNamedIdentity' }
        provider_groups_truncated: { type: boolean }
        account: { $ref: '#/components/schemas/ModelPickerNamedIdentity' }
        configuration_availability: { $ref: '#/components/schemas/ModelPickerConfigurationAvailability' }
        catalog: { $ref: '#/components/schemas/ModelPickerCatalogEvidence' }
        capabilities: { $ref: '#/components/schemas/ModelPickerSourceCapabilities' }
        passive_health: { $ref: '#/components/schemas/ModelPickerHealthEvidence' }
    UpstreamModelCatalog:
      type: object
      description: Internal v1 additive response update. Clients with strict unknown-field validators must update their schema before adopting the server release that adds disabled_models and the sync-only price_sync field; legacy clients that ignore unknown response properties retain their active-model semantics.
      additionalProperties: false
      required: [account_id, status, credential_generation, last_attempt_at, last_success_at, expires_at, error_code, models, disabled_models]
      properties:
        account_id: { type: string, format: uuid }
        status: { type: string, enum: [unknown, syncing, ready, stale, error] }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        last_attempt_at: { type: [integer, 'null'], format: int64 }
        last_success_at: { type: [integer, 'null'], format: int64 }
        expires_at: { type: [integer, 'null'], format: int64 }
        error_code:
          type: [string, 'null']
          enum: [unsupported, destination_invalid, credential_invalid, connection_failed, authentication_failed, rate_limited, upstream_unavailable, redirect_rejected, response_too_large, invalid_response, codex_no_trusted_models, null]
        models:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/UpstreamModel' }
        disabled_models:
          type: array
          maxItems: 10000
          description: Previously advertised model/protocol pairs missing from a successful directory response. Filtered by the same search and limit as models; never included in selectable active models. A returning pair clears its disabled entry. Transport/authentication/parse failures do not change these entries.
          items:
            type: object
            additionalProperties: false
            required: [id, protocol, status, disabled_at, reason]
            properties:
              id: { type: string, minLength: 1, maxLength: 500 }
              protocol: { type: string, minLength: 1, maxLength: 64 }
              status: { const: disabled }
              disabled_at: { type: integer, format: int64 }
              reason: { const: removed_from_upstream }
    UpstreamModelCatalogSyncResponse:
      type: object
      additionalProperties: false
      description: POST-only catalog synchronization result. Returns the complete bounded active catalog and up to 10000 disabled entries; unlike paginated GET, no additional listing request is needed. The price_sync outcome is always present and is independent of directory status.
      required: [account_id, status, credential_generation, last_attempt_at, last_success_at, expires_at, error_code, models, disabled_models, price_sync]
      properties:
        account_id: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/account_id' }
        status: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/status' }
        credential_generation: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/credential_generation' }
        last_attempt_at: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/last_attempt_at' }
        last_success_at: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/last_success_at' }
        expires_at: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/expires_at' }
        error_code: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/error_code' }
        models: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/models' }
        disabled_models: { $ref: '#/components/schemas/UpstreamModelCatalog/properties/disabled_models' }
        price_sync: { $ref: '#/components/schemas/UpstreamModelPriceSyncResult' }
    ManagedUpstreamModelSyncResponse:
      type: object
      additionalProperties: false
      required: [catalog, routes, price_sync]
      properties:
        catalog: { $ref: '#/components/schemas/UpstreamModelCatalog' }
        routes:
          type: object
          additionalProperties: false
          required: [added, disabled, restored, unchanged, skipped, warnings]
          properties:
            added: { type: integer, minimum: 0 }
            disabled: { type: integer, minimum: 0 }
            restored: { type: integer, minimum: 0 }
            unchanged: { type: integer, minimum: 0 }
            skipped:
              type: integer
              minimum: 0
              description: Number of protected/unsupported owned entries, or one when the entire account reconciliation is skipped.
            warnings:
              type: array
              items: { type: string }
              description: Machine-readable reasons such as sync_in_progress, partial_catalog, empty_catalog_protected, complete_catalog_unsupported (the current component plugin ABI cannot attest completeness), account_changed, account_or_lease_changed, catalog_not_ready, catalog_changed, operator_route_preserved, unsupported_route_model_or_protocol, or a discovery error code.
        price_sync: { $ref: '#/components/schemas/UpstreamModelPriceSyncResult' }
    UpstreamModelPriceSyncResult:
      type: object
      additionalProperties: false
      description: Directory availability is committed before pricing. Skipped means discovery failed, a directory lease was already held, or the successful directory was empty. Partial includes unavailable sources, unmatched models, or ambiguous matches. Error means no source completed or the bounded pricing service failed; existing prices are retained. No automatic sync overwrites manual prices, writes a fabricated zero, or replaces a last-known price with a lower-priority source while its preferred source is unavailable.
      required: [status, currency, imported, preserved, unmatched, ambiguous, failed_sources, error_code]
      properties:
        status: { type: string, enum: [ready, partial, error, skipped] }
        currency: { const: USD }
        imported: { type: integer, minimum: 0 }
        preserved: { type: integer, minimum: 0 }
        unmatched: { type: integer, minimum: 0 }
        ambiguous: { type: integer, minimum: 0 }
        failed_sources:
          type: array
          items: { type: string }
        error_code: { type: [string, 'null'], enum: [price_sync_failed, null] }
    AggregatedUpstreamModel:
      type: object
      additionalProperties: false
      required: [id, protocol, supported_account_count, eligible_account_count, complete_coverage, context_window, reservation_token_bound]
      properties:
        id: { type: string, minLength: 1, maxLength: 500 }
        protocol: { type: string, minLength: 1, maxLength: 64 }
        supported_account_count: { type: integer, format: int64, minimum: 1 }
        eligible_account_count: { type: integer, format: int64, minimum: 1 }
        complete_coverage: { type: boolean }
        context_window: { type: [integer, 'null'], format: int64, minimum: 1 }
        reservation_token_bound:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Conservative MemeLoop reservation bound; this is not an upstream-declared maximum output size.
    AggregatedUpstreamModelCatalog:
      type: object
      additionalProperties: false
      required: [data, eligible_account_count, unknown_account_count, unsupported_account_count, stale_account_count]
      properties:
        data:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AggregatedUpstreamModel' }
        eligible_account_count: { type: integer, format: int64, minimum: 0 }
        unknown_account_count: { type: integer, format: int64, minimum: 0 }
        unsupported_account_count:
          type: integer
          format: int64
          minimum: 0
          description: Subset of unknown accounts with a current-generation terminal server-owned unsupported discovery verdict. Never includes pending, network, authentication or permission failures. Counts satisfy unsupported_account_count <= unknown_account_count <= eligible_account_count.
        stale_account_count: { type: integer, format: int64, minimum: 0 }
    Group:
      type: object
      additionalProperties: false
      required: [id, tenant_id, tenant_external_id, name, member_ids, member_count, created_at, updated_at, routing_strategy, routing_priority, strategy_version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
        member_ids:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: { type: string, format: uuid }
        member_count: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        routing_strategy: { $ref: '#/components/schemas/NullableGroupRoutingStrategy' }
        routing_priority:
          type: integer
          format: int32
          default: 0
          description: Higher values win; ties use ascending group UUID. Credential groups always return zero.
        strategy_version:
          type: integer
          format: int64
          minimum: 0
          description: Monotonically increasing strategy revision; credential groups always return zero.
    GroupRoutingStrategy:
      type: object
      additionalProperties: false
      required: [plugin_id, config]
      properties:
        plugin_id: { type: string, minLength: 1 }
        config:
          description: JSON configuration validated against the installed plugin's configuration schema.
    NullableGroupRoutingStrategy:
      description: Null selects the host default behavior. Credential groups always return null.
      oneOf:
        - $ref: '#/components/schemas/GroupRoutingStrategy'
        - type: 'null'
    GroupRoutingStrategyCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, version, schema, default]
      properties:
        id: { type: string }
        version: { type: string }
        schema:
          description: JSON Schema for this strategy's configuration.
        default:
          description: Default JSON configuration supplied by the plugin.
    UpdateGroupRoutingStrategyRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, expected_updated_at, expected_strategy_version, routing_priority]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        expected_updated_at: { type: integer, format: int64 }
        expected_strategy_version: { type: integer, format: int64, minimum: 0 }
        routing_priority: { type: integer, format: int32 }
        routing_strategy:
          $ref: '#/components/schemas/NullableGroupRoutingStrategy'
          description: Null or omitted clears the strategy. Serialized strategy configuration is limited to 64 KiB.
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, name]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
    ReplaceGroupRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, name, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
        expected_updated_at: { type: integer, format: int64 }
    ReplaceGroupMembersRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, member_ids, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        member_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        expected_updated_at: { type: integer, format: int64 }
    CreateModelRouteRequest:
      type: object
      additionalProperties: false
      required: [public_model, upstream_model, protocol]
      anyOf:
        - required: [upstream_account_id]
        - required: [upstream_account_ids]
          properties:
            upstream_account_ids:
              minItems: 1
        - required: [included_provider_group_ids]
          properties:
            included_provider_group_ids:
              minItems: 1
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200, default: default }
        public_model: { type: string, minLength: 1, maxLength: 200 }
        upstream_account_id:
          type: string
          format: uuid
          deprecated: true
          description: Legacy single-account input; new callers use `upstream_account_ids`.
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
        upstream_model: { type: string, minLength: 1, maxLength: 500 }
        protocol: { type: string, enum: [openai, anthropic, openai-audio, generation] }
        priority: { type: integer, format: int64, minimum: -1000000, maximum: 1000000, default: 0 }
        enabled:
          type: boolean
          default: true
          description: Set false to prepare a disabled route without making it eligible for traffic.
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Exclusion wins over explicit accounts and included provider groups.
          items: { type: string, format: uuid }
          default: []
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
        route_group_names:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing normalized names are reused and missing route groups are created in the same transaction.
          items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
          default: []
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Stable credential IDs granted this exact route. Credential-group IDs are never accepted.
          items: { type: string, format: uuid }
          default: []
        custom_model_confirmed:
          type: boolean
          default: false
          description: Explicit operator acknowledgement required when the upstream model is absent from a complete synchronized catalog.
    ReplaceModelRouteRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, public_model, upstream_model, protocol, priority, expected_updated_at, expected_grant_revision]
      anyOf:
        - required: [upstream_account_id]
        - required: [upstream_account_ids]
          properties:
            upstream_account_ids:
              minItems: 1
        - required: [included_provider_group_ids]
          properties:
            included_provider_group_ids:
              minItems: 1
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        public_model: { type: string, minLength: 1, maxLength: 200 }
        upstream_account_id:
          type: string
          format: uuid
          deprecated: true
          description: Legacy single-account input; new callers use `upstream_account_ids`.
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        upstream_model: { type: string, minLength: 1, maxLength: 500 }
        protocol: { type: string, enum: [openai, anthropic, openai-audio, generation] }
        priority: { type: integer, format: int64, minimum: -1000000, maximum: 1000000 }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Exclusion wins over explicit accounts and included provider groups.
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_names:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing normalized names are reused and missing route groups are created atomically.
          items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Stable credential IDs granted this exact route. Credential-group IDs are never accepted.
          items: { type: string, format: uuid }
        custom_model_confirmed:
          type: boolean
          default: false
          description: Explicit operator acknowledgement for a model absent from a complete synchronized catalog.
        expected_updated_at: { type: integer, format: int64 }
        expected_grant_revision: { type: integer, format: int64, minimum: 0 }
    ReplaceModelRouteRoutingRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, upstream_account_ids, included_provider_group_ids, excluded_provider_group_ids, route_group_ids, route_group_names, granted_credential_ids, custom_model_confirmed, expected_updated_at, expected_grant_revision]
      anyOf:
        - required: [upstream_account_ids]
          properties:
            upstream_account_ids:
              minItems: 1
        - required: [included_provider_group_ids]
          properties:
            included_provider_group_ids:
              minItems: 1
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Exclusion wins over explicit accounts and included provider groups.
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_names:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing normalized names are reused and missing route groups are created atomically.
          items: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00-\x1F\x7F]+$' }
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Stable credential IDs granted this exact route. Credential-group IDs are never accepted.
          items: { type: string, format: uuid }
        custom_model_confirmed:
          type: boolean
          description: Explicit operator acknowledgement for a model absent from a complete synchronized catalog.
        expected_updated_at: { type: integer, format: int64 }
        expected_grant_revision: { type: integer, format: int64, minimum: 0 }
    ModelRouteRouting:
      type: object
      additionalProperties: false
      required: [route_id, upstream_account_ids, included_provider_group_ids, excluded_provider_group_ids, route_group_ids, granted_credential_ids, candidate_upstream_account_ids, custom_model_confirmed, updated_at, grant_revision]
      properties:
        route_id: { type: string, format: uuid }
        upstream_account_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        granted_credential_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        candidate_upstream_account_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          description: Active candidate accounts after provider-group inclusion and exclusion.
          items: { type: string, format: uuid }
        custom_model_confirmed: { type: boolean }
        updated_at: { type: integer, format: int64 }
        grant_revision:
          type: integer
          format: int64
          minimum: 0
          description: Version of `granted_credential_ids` only; provider and group associations use `updated_at`.
    ReplaceClientCredentialRoutingRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, route_ids, route_group_ids, expected_grant_revision]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Existing route groups only; this operation never creates a group.
          items: { type: string, format: uuid }
        expected_grant_revision: { type: integer, format: int64, minimum: 0 }
    ClientCredentialRouting:
      type: object
      additionalProperties: false
      required: [key_id, route_ids, route_group_ids, effective_route_ids, updated_at, grant_revision]
      properties:
        key_id: { type: string, format: uuid }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        effective_route_ids:
          type: array
          maxItems: 10000
          uniqueItems: true
          description: Deduplicated union of exact routes and current members of granted route groups.
          items: { type: string, format: uuid }
        updated_at: { type: integer, format: int64 }
        grant_revision:
          type: integer
          format: int64
          minimum: 0
          description: Version of direct `route_ids` and `route_group_ids`; derived effective routes do not change this revision.
    SetModelRouteEnabledRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, enabled, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
