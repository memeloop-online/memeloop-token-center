        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/requests/{request_id}:
    get:
      tags: [Self service]
      operationId: getOwnRequest
      summary: Load one owned request and its bounded archive detail
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestIdPath' }]
      responses:
        '200':
          description: Request detail only when owned by the authenticated stable identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /self/v1/requests/{request_id}/assets/{asset_id}:
    get:
      tags: [Self service]
      operationId: downloadOwnRequestAsset
      summary: Stream one owned synchronous-generation asset with optional byte range
      description: |
        The authenticated stable key identity must own both the request and asset. A
        mismatched request/asset pair, an asset owned by another identity, or a missing
        database record returns 404. The internal archive locator is never accepted or
        returned. Exactly one byte range is supported; multiple, malformed, or
