  /internal/v1/model-prices/usage-summary:
    get:
      tags: [Routes and pricing]
      operationId: getPricingUsageSummary
      summary: Discover models used in traffic for price synchronization
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      description: |
        Applies the same bounded statistics contract: omitted `to_created_at`
        means request time, omitted `from_created_at` means 30 days before the
        effective upper bound, the resulting interval may not exceed 93 days, and
        all supplied dimensions are combined with AND.
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
      responses:
        '200':
          description: Model usage totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelUsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/model-prices/sync:
    post:
      tags: [Routes and pricing]
      operationId: synchronizeModelPrices
      summary: Synchronize token prices from fixed public catalogs
      description: |
        Global service credentials only. Fetches models.dev, LiteLLM, and OpenRouter
        from server-controlled URLs. Manual prices are preserved. Ambiguous matches are
        returned as candidates and are not written automatically.
      security: [{ serviceBearer: [] }]
      x-required-scope: prices:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelPriceSyncRequest' }
      responses:
        '200':
          description: Source outcomes, matches, candidates, and current prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPriceSyncResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /internal/v1/prices/{currency}/{model}:
    post:
      tags: [Routes and pricing]
      operationId: upsertTokenModelPrice
      summary: Create or replace one manual service-tier token price
      description: |
        Global service credentials only. The stable key is
        `(model, currency, service_tier)`. Omitting either cache dimension uses
        the uncached input price and marks that fallback as estimated.
      security: [{ serviceBearer: [] }]
      x-required-scope: prices:write
