      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        proxy_url:
          type: string
          pattern: '^socks5h?://'
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Private SOCKS endpoint. Codex and remote-DNS socks5h require a private IP literal; generic socks5 may use a hostname resolving only to private addresses. Proxy authentication is returned only by the explicit management GET, never ordinary metadata.
