        first_id: { type: [string, 'null'] }
        last_id: { type: [string, 'null'] }
    AnthropicModelInfo:
      type: object
      required: [type, id, display_name, created_at]
      properties:
        type: { const: model }
        id: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    OpenAIChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        messages: { type: array, items: true }
        stream: { type: boolean }
    OpenAIResponseRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        input: true
        stream: { type: boolean }
        previous_response_id:
          type: [string, 'null']
          maxLength: 256
          description: |
            OpenAI Responses continuation identifier. Schema v16 stores a successful
            upstream response `id` on the prior logical-conversation observation, so a
            later request can use this value as direct parent evidence even when the
            client does not send Token Center-specific turn headers.
    OpenAIEmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        input: true
    OpenAIAudioTranscriptionRequest:
      type: object
      additionalProperties: false
      required: [file, model]
      properties:
        file: { type: string, format: binary, description: Uncompressed PCM16 WAV in phase one. }
        model: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, maxLength: 32000 }
        hotwords: { type: string, description: JSON-encoded array of at most 256 non-empty strings. }
        response_format: { type: string, enum: [json, verbose_json], default: json }
        temperature: { type: number, minimum: 0, maximum: 1, description: Forwarded to the selected upstream. }
    OpenAIAudioTranscriptionJson:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string }
    OpenAIAudioTranscriptionVerboseJson:
      type: object
      additionalProperties: false
      required: [text, duration, segments]
      properties:
        text: { type: string }
        task: { type: string }
        language: { type: string }
        duration: { type: number, minimum: 0, description: Upstream-reported duration when present, otherwise the trusted input WAV duration in seconds. }
        segments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [start, end, text]
            properties:
              id: { type: integer, minimum: 0 }
              seek: { type: integer, minimum: 0 }
              start: { type: number, minimum: 0 }
              end: { type: number, minimum: 0 }
              text: { type: string }
              tokens: { type: array, maxItems: 1000000, items: { type: integer, minimum: 0 } }
              temperature: { type: number }
              avg_logprob: { type: number }
              compression_ratio: { type: number }
              no_speech_prob: { type: number }
        words:
          type: array
          maxItems: 1000000
          items:
            type: object
            additionalProperties: false
            required: [word, start, end]
            properties:
              word: { type: string }
              start: { type: number, minimum: 0 }
              end: { type: number, minimum: 0 }
    AnthropicMessageRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1 }
        messages: { type: array, items: true }
        max_tokens: { type: integer, minimum: 1 }
        stream: { type: boolean }
    AsyncGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        input: { type: object, additionalProperties: true, description: Provider-native Seedance input, closed SiliconFlow T2V parameters, or administrator-owned ComfyUI workflow inputs. Consult the selected model's generation_schema when present. }
    OpenAIImageRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
