              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '201':
          description: Authorization completed and stable upstream created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '202':
          description: Authorization is still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthPending' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /internal/v1/oauth/codex/start:
    post:
      tags: [Upstream providers]
      operationId: startOpenAiCodexOAuth
      summary: Start native OpenAI Codex device authorization
      security: [{ serviceBearer: [] }]
      x-required-scope: oauth:write
      description: |
        A global operator may bind a new account to a write-only private
        IP-literal SOCKS5H proxy. When omitted, authorization and runtime use a
        direct connection. Reauthorization reuses the existing account setting.
        User-code, polling, token exchange, JWKS verification, managed refresh,
        quota operations and model requests share the selected transport.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCodexOAuthRequest' }
      responses:
        '200':
          description: Expiring device authorization details and opaque session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodexDeviceLoginStart' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
