            cursor: { const: source-bound-native-cursor-v1 }
        source_identity_contract: { const: operator-hmac-sha256-v1 }
        account_name_policies:
          type: object
          additionalProperties: false
          required: [kimi]
          properties:
            kimi: { const: neutral-server-keyed-source-suffix-v1 }
        atomic_cohort_contracts:
          type: array
          prefixItems: [{ const: atomic_kimi_cohort_v2 }]
          minItems: 1
          maxItems: 1
        credential_envelope_contract: { const: chacha20poly1305-hkdf-sha256-v2-aad-v1 }
    NativeCursorOAuthSourceRequest:
      type: object
      additionalProperties: false
      required: [contract, tenant_external_id, account_name, source_identity_hash, source_document_sha256, source_layout, source_relative_path, document]
      properties:
        contract: { const: source-bound-native-cursor-v1 }
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        account_name: { type: string, minLength: 1 }
        source_identity_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_document_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_layout: { type: string, minLength: 1, maxLength: 200 }
        source_relative_path: { type: string, minLength: 1, maxLength: 512 }
        expected_current_account_id: { type: [string, 'null'], format: uuid }
        expected_current_document_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        expected_current_credential_generation: { type: [integer, 'null'], minimum: 1 }
        proxy_url: { type: [string, 'null'], writeOnly: true }
        document:
          type: object
          writeOnly: true
          required: [accessToken, refreshToken]
          properties:
            accessToken: { type: string, minLength: 1, writeOnly: true }
            refreshToken: { type: string, minLength: 1, writeOnly: true }
    NativeCursorOAuthSourceResponse:
      type: object
      additionalProperties: false
      required: [disposition, account]
