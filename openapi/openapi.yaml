  /internal/v1/image-generation-quarantine/{request_id}/resolve:
    post:
      tags: [Generation quarantine]
      operationId: resolveImageGenerationQuarantine
      summary: Audit and settle an uncertain image submission without resending
      description: |
        Requires a persistent service actor bound to exactly the requested tenant and
        generations:reconcile. Bootstrap, global credentials, client keys and cross-tenant
        access are rejected. Exactly one visible ASCII Idempotency-Key is mandatory.
        not_delivered requires confirmed_cost_micros=0. settle_confirmed settles the
        original reservation using the independently confirmed nonnegative cost. Currency
        must match the original account currency. evidence_digest is the lowercase SHA-256
        of independently retained evidence, never raw evidence or credentials.
        A revision CAS, immutable audit receipt and original reservation settlement commit
        together. Exact same-actor replay returns the original receipt; changed payloads,
        stale revisions and competing decisions return 409. Neither action contacts an
        upstream, retries a submission, fabricates an image, nor marks the request successful.
        The request closes as failed even when a confirmed provider charge is settled.
      security: [{ serviceBearer: [] }]
      x-required-scope: generations:reconcile
      x-persistent-service-only: true
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveImageGenerationQuarantine' }
      responses:
        '200':
          description: Immutable reconciliation receipt, including exact idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageGenerationQuarantineResolution' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
