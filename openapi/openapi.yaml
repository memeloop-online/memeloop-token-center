      properties:
        resolution_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        tenant_external_id: { type: string }
        action: { type: string, enum: [not_delivered, settle_confirmed] }
        confirmed_cost_micros: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        currency: { type: string }
        evidence_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        resolved_by_service_id: { type: string, format: uuid }
