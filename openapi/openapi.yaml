      operationId: deleteArchivedTenant
      summary: Delete an archived non-default tenant with no dependent data
      security: [{ serviceBearer: [] }]
      x-required-scope: tenants:write
      parameters: [{ $ref: '#/components/parameters/TenantExternalId' }]
      responses:
        '204': { description: Tenant deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/tenant-management/{external_id}/archive:
