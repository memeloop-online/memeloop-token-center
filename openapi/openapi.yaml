        refresh_token: { type: string, minLength: 1, writeOnly: true }
        token_type: { type: string, pattern: '^[Bb][Ee][Aa][Rr][Ee][Rr]$' }
        scope: { type: [string, 'null'], maxLength: 2048 }
        device_id: { type: [string, 'null'], maxLength: 2048 }
        expired: { type: [string, 'null'], format: date-time }
        last_refresh: { type: [string, 'null'], format: date-time }
        disabled: { type: boolean, default: false }
    NativeKimiOAuthCohortAccount:
