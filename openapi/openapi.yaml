      summary: Poll native OpenAI Codex authorization and create the upstream when ready
      security: [{ serviceBearer: [] }]
      x-required-scope: oauth:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthPollRequest' }
      responses:
        '200':
          description: Existing stable upstream reauthorized or a completed session replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '201':
          description: Authorization completed and stable upstream created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '202':
          description: Authorization is still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthPending' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /internal/v1/oauth/authorization-code/start:
    post:
      tags: [Upstream providers]
      operationId: startProviderAuthorizationCode
      summary: Start standard PKCE authorization for a provider contribution
      security: [{ serviceBearer: [] }]
      x-required-scope: oauth:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartProviderAuthorizationCodeRequest' }
      responses:
        '200':
          description: Authorization URL and encrypted revision-bound session; global operator only.
          content:
            application/json:
              schema:
                type: object
                required: [driver, login_url, session_token, expires_at, recovery_expires_at]
                properties:
                  driver: { type: string }
                  login_url: { type: string, format: uri }
                  session_token: { type: string, writeOnly: true }
                  expires_at: { type: integer, format: int64 }
                  recovery_expires_at: { type: integer, format: int64, description: Deadline for already-issued result finalization only; does not extend code exchange. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/v1/oauth/authorization-code/complete:
    post:
      tags: [Upstream providers]
      operationId: completeProviderAuthorizationCode
      summary: Complete a revision-bound standard OAuth session
      description: HTTP 409 with error.code oauth_identity_mismatch means the newly authorized Google account or original client binding did not match and this session has been terminated without changing the existing upstream. Other conflict codes do not imply this terminal state.
      security: [{ serviceBearer: [] }]
      x-required-scope: oauth:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_token, callback_url]
              properties:
                session_token: { type: string, writeOnly: true }
                callback_url: { type: string, format: uri, writeOnly: true }
      responses:
        '200':
          description: Completed session replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '201':
          description: Upstream account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '202':
