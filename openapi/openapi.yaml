    post:
      tags: [Routes and pricing]
      operationId: createModelRoute
      summary: Route a public model to a unified upstream provider
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRouteRequest' }
      responses:
        '201':
          description: Enabled model route. An identical create replays the existing route with the same status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRoute' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
