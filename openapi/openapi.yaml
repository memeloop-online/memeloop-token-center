                  reversed: { $ref: '#/components/schemas/Money' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/accounts/{account_id}/ledger:
    get:
      tags: [Credits]
      operationId: listAccountLedger
      summary: List recent account ledger entries
      description: |
        Entries are ordered by `(created_at, entry_id)` descending. Use the final row's
        `created_at` and `entry_id` as the paired, exclusive `before_created_at` and
        `before_id` cursor. Every page remains bound to the path account and a
        tenant-scoped service credential may inspect only an account in its own tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: credits:read
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Ledger entries newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/LedgerEntry' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/accounts/{account_id}/settlements:
    get:
      tags: [Credits]
      operationId: listAccountSettlements
      summary: List immutable account usage settlements
      description: |
        Requires both `credits:read` and `requests:read`. Results are ordered by the
        immutable account-local `(settlement_sequence, settlement_id)` ascending key.
        Use the final row's `settlement_sequence` and `settlement_id` as the paired,
        exclusive `after_sequence` and `after_id` cursor. The paired `request_kind`
        and `request_id` select one settlement and cannot be combined with either
        cursor parameter. Every
        page remains bound to the path account, and a tenant-scoped service credential
        may inspect only an account in its own tenant. The cursor pair must identify
        an existing settlement in that account. Unknown query parameters are rejected.
        Covers prepaid terminal snapshots published after migration 86; historical
        records are not bulk-backfilled and metered-unlimited usage is excluded.
        An empty exact lookup is not evidence of zero cost. Polling consumers retain
        the final item's cursor even when next_cursor is null.
      security: [{ serviceBearer: [] }]
      x-required-scope: credits:read
      x-required-scopes: [credits:read, requests:read]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/SettlementListLimit500'
        - $ref: '#/components/parameters/AfterSettlementSequence'
        - $ref: '#/components/parameters/AfterSettlementId'
        - $ref: '#/components/parameters/SettlementRequestKind'
        - $ref: '#/components/parameters/SettlementRequestId'
      responses:
        '200':
          description: Immutable account settlements in ascending sequence order.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettlementPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/accounts/{account_id}/settlement-correction-previews:
    get:
      tags: [Credits]
      operationId: listSettlementCorrectionPreviews
      summary: Preview historical contract-ceiling settlement corrections
      description: |
        Returns only terminal text requests whose persisted `usage_basis` is exactly
        `contract_ceiling`. Historical null provenance is excluded and cannot be
        enabled by a query parameter. The response exposes immutable identities,
        archive availability, and cross-table invariants needed before a later
        correction decision. It does not read archive content, infer provider usage,
        calculate a corrected cost, or mutate balances, budgets, settlements, or
        analytics.

        Requires the dedicated `settlements:adjust` scope because these previews are
        inputs to the separately authorized correction workflow. Tenant-scoped
        credentials remain confined to accounts in their own tenant. Results use an
        exclusive ascending `(created_at, request_id)` cursor and an inclusive request
        creation window no wider than the common 93-day statistics limit. The creation
        dimension matches the statistics buckets being corrected and keeps PostgreSQL
        access bounded to the corresponding request-record partitions.
      security: [{ serviceBearer: [] }]
      x-required-scope: settlements:adjust
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from_created_at
          in: query
          required: true
          description: Inclusive lower request-creation bound in Unix epoch milliseconds.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_created_at
          in: query
          required: true
          description: Inclusive upper request-creation bound in Unix epoch milliseconds.
          schema: { type: integer, format: int64, minimum: 0 }
        - $ref: '#/components/parameters/SettlementListLimit500'
        - name: after_created_at
          in: query
          required: false
          description: Request creation timestamp from the final row of the prior page. Must be paired with `after_request_id`.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: after_request_id
          in: query
          required: false
          description: Request UUID from the final row of the prior page. Must be paired with `after_created_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Read-only correction candidates and evidence readiness.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementCorrectionPreviewPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/accounts/{account_id}/settlements/{settlement_id}/adjustments:
    put:
      tags: [Credits]
      operationId: reconcileSettlementAdjustment
      summary: Reconcile a forward-only attributed rebate for one immutable settlement
      description: |
        Reconciles one non-negative desired rebate in a stable namespace against the immutable
        gross settlement identified by the path and request identity. This endpoint does
        not alter the settlement feed record, gross usage charge, or settlement identity.
        It can only move the attributed rebate forward up to the original gross cost; a
        reversal or a lower desired amount requires a separately authorized protocol.

        Requires the dedicated `settlements:adjust` scope. `credits:write` alone does
        not authorize this operation. Tenant-scoped service credentials may act only on
        accounts in their own tenant; an unbound account or another tenant's account is
        returned as 404. The idempotency namespace is `(account_id, Idempotency-Key)`.
        An exact replay returns 200 with `replayed: true`; a new
        reconciliation, including a higher desired version, returns 201. Reusing a key
        with a different canonical request, stale version, or an amount above the gross
        settlement returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: settlements:adjust
      x-idempotency-contract:
        namespace: account-id-and-idempotency-key
        different-payload-status: 409
        exact-replay-status: 200
        new-or-higher-version-status: 201
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: settlement_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileSettlementAdjustmentRequest' }
      responses:
        '200':
          description: Exact idempotent replay of a previously reconciled adjustment.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementAdjustmentResult' }
        '201':
          description: New attributed adjustment event or a higher desired reconciliation version.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementAdjustmentResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/entitlements:
    get:
      tags: [Entitlements]
      operationId: listEntitlements
      summary: List current subscription entitlement cycles
      description: |
        Returns at most 500 rows newest first. A tenant-scoped service credential is
        automatically bound to its tenant; explicitly selecting another tenant returns
        403. A global credential may omit the tenant to list across tenants.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: provider
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EntitlementIdentity' }
        - name: external_subscription_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EntitlementIdentity' }
      responses:
        '200':
          description: Current-cycle entitlement views matching every supplied filter.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Entitlements]
      operationId: reconcileEntitlement
      summary: Reconcile one exact external subscription-cycle entitlement
      description: |
        Sets the desired funded amount for a stable provider/subscription and billing
        cycle. A higher version is required after the first successful operation. A
        cancelled entitlement may be reactivated only with an explicitly higher version;
        a replaced identity can never be reactivated. Stable subscriptions cannot move
        accounts and stable cycle IDs cannot change period or currency.

        The replay namespace is `(tenant, Idempotency-Key)`. The same canonical payload
        returns the original response; reuse with another payload returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:write
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileEntitlementRequest' }
      responses:
        '201':
          description: Created or updated entitlement snapshot, including its exact net ledger movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/integrations/memeloop-cloud/principals/ensure:
    post:
      tags: [Credentials]
      operationId: ensureMemeLoopCloudPrincipal
      summary: Ensure a stable MemeLoop Cloud principal credential
      description: |
        Ensures the same stable credit account and downstream credential used by
        MemeLoop Cloud subscription snapshots for this tenant/principal pair.
        This does not create an entitlement, change credential policy or routing,
        or post any ledger credit. A tenant-scoped service token can only ensure
        its own tenant. Replays retain the IDs and return the one-time credential
        secret only while its encrypted provisioning response remains available.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemeLoopCloudPrincipalEnsureRequest' }
      responses:
        '200':
          description: Stable credential ensured or replayed.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionedCloudCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/integrations/memeloop-cloud/subscription:
    put:
      tags: [Entitlements]
      operationId: syncMemeLoopCloudSubscription
      summary: Apply one signed MemeLoop Cloud registration or subscription snapshot
      description: |
        Provisions one stable principal, credit account, and downstream credential, then
        applies the exact subscription quota and credential policy. Credential rotation
        never changes the stable key/account IDs or their history. Active snapshots cover
        registration, renewal, upgrade, downgrade, and reactivation only while the stable
        credential remains active. Suspended or revoked credentials reject active snapshots
        atomically; only an operator may change credential lifecycle. Cancelled snapshots
        still withdraw the unconsumed entitlement remainder.

        `version` is monotonically increasing for the stable external subscription. Older
        out-of-order events return 409 and cannot roll quota or policy back. The replay
        namespace is the tenant plus `Idempotency-Key`; reuse with a different canonical
        snapshot returns 409. Signature input is the ASCII timestamp, one `.` byte, and
        the exact request body. The signature is `v1=` plus unpadded URL-safe base64 of
        HMAC-SHA-256. Timestamps outside a five-minute window fail closed.
      x-signature-contract:
        algorithm: HMAC-SHA-256
        encoding: base64url-no-padding
        envelope: ascii-timestamp-dot-exact-body
        tolerance-seconds: 300
        disabled-without-secret: true
      x-idempotency-contract:
        namespace: tenant-and-event-id-digest
        payload: canonical-full-snapshot
        different-payload-status: 409
        stale-version-status: 409
        quota-version-source: durable-subscription-entitlement
        policy-update: compare-and-set-on-current-entitlement-version
        routing-update: same-transaction-normalized-grants
        legacy-allowed-models: current-route-snapshot-only
        stable-history-owner: key-id-and-account-id
        raw-event-id-persisted: false
      security: [{ memeloopCloudHmac: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - name: X-MTC-Webhook-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
          description: Unix epoch seconds used in the signed envelope.
        - name: X-MTC-Webhook-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1=[A-Za-z0-9_-]{43}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionSnapshot' }
      responses:
        '200':
          description: Cancellation applied or replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionResult' }
        '201':
          description: Registration or active subscription snapshot applied or replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/integrations/memeloop-cloud/events:
    get:
      tags: [Entitlements]
      operationId: listMemeLoopCloudSubscriptionEvents
      summary: List bounded MemeLoop Cloud subscription lifecycle events
      description: |
        Returns at most 500 sanitized audit rows newest first. Tenant-scoped service
        credentials are always bound to their tenant; selecting another tenant returns
        403. Raw webhook event identities and request digests are never returned.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: principal_external_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: key_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Sanitized subscription lifecycle events.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionEvent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/v1/entitlements/cancel:
    post:
      tags: [Entitlements]
      operationId: cancelEntitlement
      summary: Cancel an external subscription without revoking consumed credit
      description: |
        Requires a version higher than the current entitlement. Only the current cycle's
        unconsumed remainder is withdrawn; `desired` and `consumed` remain auditable and
        `remaining` becomes zero. Optional `external_cycle_id` rejects a stale-cycle
        cancellation. The `(tenant, Idempotency-Key)` replay and 409 mismatch rules are
        the same as reconciliation.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:write
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEntitlementRequest' }
      responses:
        '200':
          description: Cancelled entitlement and negative-or-zero ledger delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/entitlements/replace:
    post:
      tags: [Entitlements]
      operationId: replaceEntitlement
      summary: Atomically replace one stable subscription with another
      description: |
        Requires a higher version for the old identity. The operation withdraws only the
        old cycle's unconsumed remainder, marks the old entitlement `replaced`, and funds
        a new active subscription/cycle in the same tenant and stable credit account.
        The replacement provider/subscription identity must differ and must not already
        exist. The `(tenant, Idempotency-Key)` replay and 409 mismatch rules are the same
        as reconciliation.
      security: [{ serviceBearer: [] }]
      x-required-scope: entitlements:write
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceEntitlementRequest' }
      responses:
        '201':
          description: New active entitlement plus the replaced stable entitlement ID and net ledger delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/requests:
    get:
      tags: [Operator traffic]
      operationId: listOperatorRequests
      summary: List recent requests and generation jobs
      description: |
        Returns at most 500 records ordered by `(created_at, request_id)` descending.
        Use `before_created_at` and `before_id` together as the exclusive keyset cursor
        from the last returned row. Time bounds are inclusive; all supplied filters are
        combined with AND. Generation jobs appear with protocol `generation`.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
        - $ref: '#/components/parameters/RequestPageEnvelope'
      responses:
        '200':
          description: Recent request summaries. Set `paged=true` to receive the authoritative next cursor envelope; the default array response remains for existing clients.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/RequestSummary' }
                  - $ref: '#/components/schemas/RequestListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/requests/{request_id}:
    get:
      tags: [Operator traffic]
      operationId: getOperatorRequest
      summary: Load one request and its bounded archive detail
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Request summary and archived bodies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/requests/{request_id}/archive/{side}:
    get:
      tags: [Operator traffic]
      operationId: streamOperatorRequestArchiveContent
      summary: Stream one request or response archive body with optional byte range
      description: |
        Uses the same `requests:read` tenant boundary as request detail. The archive
        locator is resolved only from the authorized request record and is never
        accepted or returned. Without `Range`, the complete body is streamed without
        collecting it in API memory. Exactly one byte range is supported. Clients
        paging a body should retain the first response ETag and send it in `If-Match`
        on subsequent ranges; a changed archive binding returns 412.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      x-authorization-contract:
        identity: service-tenant-boundary
        ownership-failure: 404
        object-binding: request-id-and-side
        archive-locator-exposed: false
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/RequestArchiveSidePath'
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/OptionalByteRange'
        - $ref: '#/components/parameters/OptionalIfMatch'
      responses:
        '200': { $ref: '#/components/responses/RequestArchiveContentFull' }
        '206': { $ref: '#/components/responses/RequestArchiveContentPartial' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestArchiveContentUnavailable' }
        '412': { $ref: '#/components/responses/RequestArchiveContentPreconditionFailed' }
        '416': { $ref: '#/components/responses/RequestArchiveContentRangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/requests/query:
    post:
      tags: [Operator traffic]
      operationId: queryOperatorRequestsWithTypedFilter
      summary: Query bounded request history with a typed filter AST
      description: |
        The AST is an AND-only, allow-listed predicate tree. Field names and operators
        are never used as SQL; the server maps them to indexed request columns and binds
        all values. At most 12 predicates and 100 visible rows are accepted. This endpoint
        cannot execute model-generated SQL or arbitrary query text.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TypedRequestQuery' }
      responses:
        '200':
          description: Bounded request summaries, optionally with a keyset cursor envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/RequestSummary' }
                  - $ref: '#/components/schemas/RequestListResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/filter-presets:
    get:
      tags: [Operator traffic]
      operationId: getOperatorFilterPresets
      summary: Read named and recent typed filters for the authenticated operator identity
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters: [{ $ref: '#/components/parameters/TenantFilter' }]
      responses:
        '200':
          description: Bounded per-operator saved filters. The service credential identity is the persistence principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterPresetState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operator traffic]
      operationId: saveOperatorFilterPreset
      summary: Save a named or recent typed filter for the authenticated operator identity
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutFilterPresetRequest' }
      responses:
        '200':
          description: Updated bounded preset state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterPresetState' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/filter-assistant/settings:
    get:
      tags: [Operator traffic]
      operationId: getFilterAssistantSettings
      summary: Read the tenant's filter-assistant model-route reference
      description: The response contains stable model route and billing credential references; it never returns a credential secret. A missing billing reference means model execution is not enabled.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters: [{ $ref: '#/components/parameters/TenantFilter' }]
      responses:
        '200':
          description: Configured model route or null when the assistant is not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FilterAssistantSettings'
                  - type: 'null'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Operator traffic]
      operationId: putFilterAssistantSettings
      summary: Set the tenant's approved filter-assistant model route
      description: Requires a global operator with providers:write and keys:write. The enabled text route and active billing credential must share a tenant and an eligible route grant. Updates compare expected_updated_at and create a transactional audit receipt.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutFilterAssistantSettingsRequest' }
      responses:
        '200':
          description: Stored secret-free setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterAssistantSettings' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/filter-assistant/billing-choices:
    get:
      tags: [Operator traffic]
      operationId: getFilterAssistantBillingChoices
      summary: List eligible billing credential references for a text route
      description: Checks a bounded keyset page of 100 tenant credentials against current route grants and availability. Returns only identity labels and UUIDs, never secrets, and never probes an upstream. Empty data can still have a next cursor when no credential on that page is eligible.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: model_route_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: before_created_at
          in: query
          schema: { type: integer, format: int64 }
        - name: before_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Eligible billing identities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [key_id, alias, principal]
                      properties:
                        key_id: { type: string, format: uuid }
                        alias: { type: string }
                        principal: { type: string }
                  next_cursor:
                    type: [object, 'null']
                    additionalProperties: false
                    required: [before_created_at, before_id]
                    properties:
                      before_created_at: { type: integer, format: int64 }
                      before_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/filter-assistant/plan:
    post:
      tags: [Operator traffic]
      operationId: planFilterWithAssistant
      summary: Turn natural-language filter intent into a reviewable typed AST
      description: |
        The assistant output is constrained to `TypedFilterAst` and is validated by the
        same server-side allow-list as manual filters. It is a preview only: clients must
        explicitly apply it through the typed request query endpoint. Raw SQL is neither
        accepted nor returned. The configured route is invoked through normal proxy
        accounting using the explicit billing credential. Only the bounded intent and
        fixed schema are sent. Missing billing configuration, revoked grants, exhausted
        budgets and invalid model output fail without applying a filter. Callers need
        the dedicated `filter_assistant:execute` scope because this operation incurs
        billable upstream execution; `requests:read` alone is deliberately insufficient.
      security: [{ serviceBearer: [] }]
      x-required-scope: filter_assistant:execute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilterAssistantPlanRequest' }
      responses:
        '200':
          description: Validated AST preview bound to the configured model route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterAssistantPlan' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/UnpricedModel' }
        '429': { $ref: '#/components/responses/UsageRejected' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /internal/v1/sessions:
    get:
      tags: [Operator traffic]
      operationId: listOperatorLogicalSessions
      summary: List recent and active logical sessions
      description: |
        Sessions are proven conversation clusters inferred from explicit hints and
        relation evidence. Requests without sufficient evidence are kept in the
        explicit `unlinked:<stable-key-id>` sentinel and are never guessed into a
        cluster. Global service credentials must select a tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before_last_activity_at
          in: query
          description: Exclusive descending cursor; must be paired with `before_session_id`. New cursors also include `before_key_id`.
          schema: { type: integer, format: int64 }
        - name: before_session_id
          in: query
          description: Exclusive descending cursor; must be paired with `before_last_activity_at`.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: before_key_id
          in: query
          description: Final key tie-breaker for new cursors. A legacy two-field cursor may omit it only when `key_id` scopes the request to one stable key; unscoped legacy cursors require refresh or upgrade.
          schema: { type: string, format: uuid }
        - name: key_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { type: string, enum: [all, active, has_errors], default: all }
        - name: model
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: q
          in: query
          description: Case-insensitive prefix of a session ID or credential alias.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Sessions ordered by latest activity descending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionListResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/sessions/summaries:
    post:
      tags: [Operator traffic]
      operationId: batchOperatorLogicalSessionSummaries
      summary: Read a bounded batch of logical-session summaries by identity
      description: |
        Returns only existing identities that still match the supplied list
        filters. This bounded endpoint supports realtime row replacement without
        rescanning or returning the complete first page. Global service
        credentials must select a tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogicalSessionSummaryBatchRequest' }
      responses:
        '200':
          description: Matching summaries ordered by latest activity descending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionSummaryBatchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/sessions/{session_id}:
    get:
      tags: [Operator traffic]
      operationId: getOperatorLogicalSession
      summary: Read one tenant and stable-key scoped logical session
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - $ref: '#/components/parameters/TenantFilter'
        - name: key_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: before_created_at
          in: query
          description: Exclusive cursor; must be paired with `before_request_id`.
          schema: { type: integer, format: int64 }
        - name: before_request_id
          in: query
          description: Exclusive cursor; must be paired with `before_created_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stable-key-owned requests and bounded relation edges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/requests/{request_id}/assets/{asset_id}:
    get:
      tags: [Operator traffic]
      operationId: downloadOperatorRequestAsset
      summary: Stream one synchronous-generation asset
      description: |
        Resolves the asset only through its request and asset UUIDs. New URL results are
        streamed from a protected trusted-origin provider reference without media retention;
        historical archived assets remain readable. Provider URLs, credentials, and internal
        archive locators are never returned. Global service credentials may select a
        tenant. A tenant-scoped credential is fixed to its tenant, and a cross-tenant or
        otherwise invisible request/asset pair returns 404. Provider expiry returns 410.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      x-authorization-contract:
        identity: service-credential
        tenant-isolation-failure: 404
        object-binding: request-id-and-asset-id
        archive-locator-exposed: false
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/GenerationAssetUnavailable' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/generations:
    get:
      tags: [Operator traffic]
      operationId: listOperatorGenerations
      summary: List generation jobs in the authorized tenant scope
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Jobs ordered by creation time descending.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OperatorGenerationJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/generations/{job_id}:
    get:
      tags: [Operator traffic]
      operationId: getOperatorGeneration
      summary: Read one generation job in the authorized tenant scope
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Generation job details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorGenerationJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Operator traffic]
      operationId: cancelOperatorGeneration
      summary: Cancel one queued or running generation job
      description: A global service credential must explicitly select a tenant. Tenant-scoped credentials remain fixed to their tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: generations:write
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Cancelled job or durable cancellation request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorGenerationJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/generations/{job_id}/assets/{asset_id}:
    get:
      tags: [Operator traffic]
      operationId: downloadOperatorGenerationAsset
      summary: Stream one generation asset with optional byte range
      description: |
        Resolves the asset only through its job and asset UUIDs. New assets are streamed
        from a protected, trusted-origin provider reference without retaining the media;
        historical archived assets remain readable. The internal archive locator, provider URL,
        and credential are never returned. Global service credentials may select a
        tenant. A tenant-scoped credential is fixed to its tenant, and a cross-tenant or
        otherwise invisible asset returns 404. Provider expiry or deletion returns 410.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/GenerationAssetUnavailable' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/stats:
    get:
      tags: [Operator traffic]
      operationId: getOperatorStatistics
      summary: Get bounded, filtered tenant or global aggregates
      description: |
        Uses the same applicable filters as the operator request list. Omitted
        `to_created_at` means request time; omitted `from_created_at` means 30 days
        before the effective upper bound. The resulting inclusive interval may not
        exceed 93 days. All filters are combined with AND.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
      responses:
        '200':
          description: Request, token, cost, model, day, and error aggregates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/monitoring-snapshot:
    get:
      tags: [Operator traffic]
      operationId: getOperatorMonitoringSnapshot
      summary: Read a bounded terminal-traffic monitoring snapshot
      description: |
        Requires an explicit `scope` and inclusive time window. `scope=tenant`
        requires `tenant_external_id`; `scope=global` requires a global service
        credential and must omit that selector. The response identifies the
        resolved scope and exact window. Windows are capped at 93 days; up to
        31 days reads hourly rollups and longer windows read daily rollups.
        Complete buckets use compact terminal rollups and only the two partial
        edge buckets read terminal request/generation facts. It never scans
        `request_records`, request bodies, started rows, or full raw history.
        Costs remain separate by currency. The top list contains no more than
        ten stable upstream-account/model pairs, and each row has no more than
        five terminal outcomes. Health is versioned; a zero-traffic window is
        `unknown`, never inferred as healthy.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      x-query-plan:
        complete-buckets: usage_analysis_hourly-or-daily
        edge-buckets: terminal-request-and-generation-facts-only
        top-upstream-models: 10
        terminal-outcomes-per-row: 5
        raw-request-records: forbidden
      parameters:
        - name: scope
          in: query
          required: true
          description: Explicit operator read scope. Global scope is unavailable to tenant-scoped service credentials.
          schema: { type: string, enum: [tenant, global] }
        - name: tenant_external_id
          in: query
          required: false
          description: Required when `scope=tenant`; forbidden when `scope=global`.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: from_created_at
          in: query
          required: true
          description: Inclusive Unix epoch milliseconds start.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_created_at
          in: query
          required: true
          description: Inclusive Unix epoch milliseconds end.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Currency-safe terminal monitoring summary and bounded stable upstream/model drilldowns.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorMonitoringSnapshot' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/usage-analysis:
    get:
      tags: [Operator traffic]
      operationId: getOperatorUsageAnalysis
      summary: Analyze bounded tenant or global usage from hourly or daily rollups
      description: |
        Reads only compact terminal request and generation rollups; it never scans the raw
        request table. `auto` selects hourly buckets through 31 days and daily buckets for
        longer ranges. Omitted bounds default to the last 24 hours (`auto`/`hour`) or seven
        days (`day`). The inclusive interval may not exceed 93 days, and explicit hourly
        intervals may not exceed 31 days. Bucket starts and heatmap coordinates are UTC.
        Costs are returned as a currency-keyed array and are never added across currencies.
        Duration P95 values are bounded-histogram approximations capped at 60000 ms.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [auto, hour, day], default: auto }
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - name: protocol
          in: query
          required: false
          description: Exact canonical protocol family.
          schema: { type: string, enum: [openai, anthropic, openai-image, audio-transcription, generation] }
        - name: status
          in: query
          required: false
          description: Terminal logical status; pending traffic is intentionally absent from usage rollups.
          schema: { type: string, enum: [success, error] }
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - name: upstream_account_id
          in: query
          required: false
          description: One stable upstream UUID, or `unassigned` for terminal activity recorded without an upstream.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, const: unassigned }
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
      responses:
        '200':
          description: Currency-safe terminal usage projections and UTC time buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageAnalysis' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/usage-analysis/trends:
    get:
      tags: [Operator traffic]
      operationId: getOperatorUsageAnalysisTrends
      summary: Read the bounded summary and time-series usage projection
      description: |
        Uses the same tenant scope, filters, inclusive range, bucket selection, and metric
        aggregation as the complete usage-analysis resource. The response is restricted to
        summary and time-series data and executes one business aggregation statement; it does
        not load dimension, session, generation-breakdown, or heatmap projections.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [auto, hour, day], default: auto }
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - name: protocol
          in: query
          required: false
          description: Exact canonical protocol family.
          schema: { type: string, enum: [openai, anthropic, openai-image, audio-transcription, generation] }
        - name: status
          in: query
          required: false
          description: Terminal logical status; pending traffic is intentionally absent from usage rollups.
          schema: { type: string, enum: [success, error] }
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - name: upstream_account_id
          in: query
          required: false
          description: One stable upstream UUID, or `unassigned` for terminal activity recorded without an upstream.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, const: unassigned }
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
      responses:
        '200':
          description: Currency-safe summary and UTC time buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageAnalysisTrends' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/request-events:
    get:
      tags: [Operator traffic]
      operationId: streamRequestEvents
      summary: Tail request lifecycle and archive transitions over SSE
      description: |
        Use the `(after_event_at, after_event_id)` pair as the durable resume cursor.
        Event data is an authoritative bounded RequestEvent snapshot. Clients merge
        by request_id and may refetch that one detail; they do not poll the list.
        Event names include `request.started`, `request.finished`, and
        `request.projected`; the last is committed only after asynchronous session
        semantics are queryable. Archive terminal events are bounded convergence
        signals and never include archive bodies or object locators.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: after_event_at
          in: query
          schema: { type: integer, format: int64, description: Unix epoch milliseconds. }
        - name: after_event_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: SSE stream. Each `data` field conforms to RequestEvent.
          content:
            text/event-stream:
              schema:
                type: string
                description: JSON-encoded RequestEvent in each SSE data field.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal:
    get:
      tags: [Self service]
      operationId: getSelfServicePortal
      summary: Load the browser self-service application
      security: []
      responses:
        '200':
          description: HTML application shell.
          content:
            text/html:
              schema: { type: string }
  /self/v1/entitlements:
    get:
      tags: [Self service]
      operationId: getOwnMemeLoopCloudEntitlements
      summary: Read subscription state and lifecycle events for the current stable credential
      description: |
        Resolves entitlement history through the authenticated stable key's credit account.
        No tenant, principal, account, or key selector is accepted, and rotation leaves this
        view attached to the same key_id and history.
      security: [{ clientBearer: [] }]
      responses:
        '200':
          description: Own current MemeLoop Cloud entitlements and sanitized lifecycle events.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfMemeLoopCloudEntitlements' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/key:
    get:
      tags: [Self service]
      operationId: getCurrentClientCredential
      summary: Read the current stable identity, policy, and available balance
      security: [{ clientBearer: [] }]
      responses:
        '200':
          description: Data belonging only to the authenticated stable client identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/key/limits:
    get:
      tags: [Self service]
      operationId: getOwnClientCredentialLimitSnapshot
      summary: Read current limits and headroom for the authenticated stable key
      security: [{ clientBearer: [] }]
      responses:
        '200':
          description: Snapshot bound to the authenticated key; no request parameter can select another credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCredentialLimitSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/requests:
    get:
      tags: [Self service]
      operationId: listOwnRequests
      summary: List recent requests for the current stable identity
      description: |
        Returns at most 100 text/protocol request records ordered by `(created_at,
        request_id)` descending. The authenticated `key_id` is always applied and cannot
        be overridden. Use `before_created_at` and `before_id` together as the exclusive
        keyset cursor. Time bounds are inclusive and all supplied filters are combined
        with AND. Generation jobs are listed separately under `/self/v1/generations`.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
      responses:
        '200':
          description: Own request summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RequestSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/requests/{request_id}:
    get:
      tags: [Self service]
      operationId: getOwnRequest
      summary: Load one owned request and its bounded archive detail
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestIdPath' }]
      responses:
        '200':
          description: Request detail only when owned by the authenticated stable identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /self/v1/requests/{request_id}/archive/{side}:
    get:
      tags: [Self service]
      operationId: streamOwnRequestArchiveContent
      summary: Stream one owned request or response archive body with optional byte range
      description: |
        The authenticated stable key identity must own the request. The internal archive
        locator is resolved only from that owned record and is never accepted or returned.
        Without `Range`, the complete body is streamed without collecting it in API memory.
        Exactly one byte range is supported. Clients paging a body should retain the first
        response ETag and send it in `If-Match` on subsequent ranges; a changed archive
        binding returns 412. Policy-retained metadata is never returned as original body
        content and instead produces a structured 409 reason.
      security: [{ clientBearer: [] }]
      x-authorization-contract:
        identity: stable-key-id
        ownership-failure: 404
        object-binding: request-id-and-side
        archive-locator-exposed: false
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/RequestArchiveSidePath'
        - $ref: '#/components/parameters/OptionalByteRange'
        - $ref: '#/components/parameters/OptionalIfMatch'
      responses:
        '200': { $ref: '#/components/responses/RequestArchiveContentFull' }
        '206': { $ref: '#/components/responses/RequestArchiveContentPartial' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestArchiveContentUnavailable' }
        '412': { $ref: '#/components/responses/RequestArchiveContentPreconditionFailed' }
        '416': { $ref: '#/components/responses/RequestArchiveContentRangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /self/v1/requests/{request_id}/assets/{asset_id}:
    get:
      tags: [Self service]
      operationId: downloadOwnRequestAsset
      summary: Stream one owned synchronous-generation asset
      description: |
        The authenticated stable key identity must own both the request and asset. A
        mismatched request/asset pair, an asset owned by another identity, or a missing
        database record returns 404. New URL results are streamed from a protected
        trusted-origin provider reference without media retention; historical archived assets
        remain readable. Provider URLs, credentials, and internal locators are never returned.
        Provider expiry returns 410.
      security: [{ clientBearer: [] }]
      x-authorization-contract:
        identity: stable-key-id
        ownership-failure: 404
        object-binding: request-id-and-asset-id
        archive-locator-exposed: false
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/GenerationAssetUnavailable' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /self/v1/stats:
    get:
      tags: [Self service]
      operationId: getOwnStatistics
      summary: Get bounded, filtered usage for the current stable identity
      description: |
        Always binds the authenticated stable `key_id`. Omitted `to_created_at`
        means request time; omitted `from_created_at` means 30 days before the
        effective upper bound. The resulting inclusive interval may not exceed 93
        days. All supplied filters are combined with AND.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
      responses:
        '200':
          description: Own aggregate usage.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Statistics'
                  - type: object
                    required: [key_id]
                    properties:
                      key_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/usage-analysis:
    get:
      tags: [Self service]
      operationId: getOwnUsageAnalysis
      summary: Analyze bounded usage for the current stable credential
      description: |
        Always binds the stable tenant and `key_id` established by the supplied
        client credential. No tenant, key, principal, route, session, or upstream
        selector is accepted or returned. `auto` selects hourly rollups through
        31 days and daily rollups for longer ranges; the maximum inclusive range
        is 93 days. Costs remain separated by currency. Average duration is exact
        for the selected rollups; P95 is a fixed-histogram approximation capped at
        60000 ms. The response is assembled from one consistent read-only database
        snapshot.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [auto, hour, day], default: auto }
        - $ref: '#/components/parameters/ModelFilter'
        - name: protocol
          in: query
          required: false
          description: Exact canonical protocol family.
          schema: { type: string, enum: [openai, anthropic, openai-image, audio-transcription, generation] }
        - name: status
          in: query
          required: false
          description: Terminal logical status; pending traffic is absent from usage rollups.
          schema: { type: string, enum: [success, error] }
        - $ref: '#/components/parameters/ErrorCodeFilter'
      responses:
        '200':
          description: Currency-safe analytics belonging only to the authenticated stable credential.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfUsageAnalysis' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/generations:
    get:
      tags: [Self service]
      operationId: listOwnGenerationJobs
      summary: List recent multimodal generation jobs
      security: [{ clientBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit100' }]
      responses:
        '200':
          description: Own generation jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/generations/{job_id}:
    get:
      tags: [Self service]
      operationId: getOwnGenerationJob
      summary: Read one owned multimodal generation job
      security: [{ clientBearer: [] }]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned generation job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Self service]
      operationId: cancelOwnGenerationJob
      summary: Cancel one owned generation job
      description: |
        A queued job without an active worker lease is cancelled and refunded atomically.
        A running Seedance or ComfyUI job is fenced from its polling worker and returned as
        `cancelling`; its reservation remains held until a worker confirms the provider-specific
        upstream cancellation, then it becomes `cancelled` and is refunded. Repeating either
        request is idempotent. Submitting, already-finalizing, succeeded, or failed jobs return 400.
      security: [{ clientBearer: [] }]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled/cancelling job, or the same job from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /self/v1/generations/{job_id}/assets/{asset_id}:
    get:
      tags: [Self service]
      operationId: downloadOwnGenerationAsset
      summary: Stream one owned generation asset with optional byte range
      description: |
        The authenticated stable key identity must own the job and asset; an asset owned
        by another identity returns 404. New jobs retain only a protected provider reference;
        this endpoint validates its trusted origin, applies server-side credentials only to the
        provider origin, and streams without retaining media bytes. Historical archived assets
        remain readable. Provider expiry or deletion returns 410. Internal archive locators,
        provider URLs, and credentials are never returned.
      security: [{ clientBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/AssetIdPath'
        - $ref: '#/components/parameters/OptionalByteRange'
      responses:
        '200': { $ref: '#/components/responses/GenerationAssetFull' }
        '206': { $ref: '#/components/responses/GenerationAssetPartial' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/GenerationAssetUnavailable' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /self/v1/conversations:
    get:
      tags: [Self service]
      operationId: listOwnLogicalConversations
      summary: List inferred logical conversation clusters
      security: [{ clientBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before_updated_at
          in: query
          description: Exclusive descending keyset cursor; must be paired with `before_cluster_id`.
          schema: { type: integer, format: int64 }
        - name: before_cluster_id
          in: query
          description: Exclusive descending keyset cursor; must be paired with `before_updated_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation clusters containing requests owned by the stable identity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationCluster' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/conversations/{cluster_id}:
    get:
      tags: [Self service]
      operationId: getOwnLogicalConversation
      summary: Read one logical conversation and relation evidence
      security: [{ clientBearer: [] }]
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: Maximum requests returned in this bounded conversation page.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: before_created_at
          in: query
          description: Exclusive descending request cursor; must be paired with `before_request_id`.
          schema: { type: integer, format: int64 }
        - name: before_request_id
          in: query
          description: Exclusive descending request cursor; must be paired with `before_created_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned requests and relation edges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /self/v1/sessions:
    get:
      tags: [Self service]
      operationId: listOwnLogicalSessions
      summary: List recent and active sessions for the authenticated stable key
      description: Credential rotation retains the same stable key identity and history.
      security: [{ clientBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before_last_activity_at
          in: query
          description: Exclusive descending cursor; must be paired with `before_session_id`. New cursors also include `before_key_id`.
          schema: { type: integer, format: int64 }
        - name: before_session_id
          in: query
          description: Exclusive descending cursor; must be paired with `before_last_activity_at`.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: before_key_id
          in: query
          description: Final key tie-breaker for new cursors. A legacy two-field cursor may omit it because this operation is already scoped to the authenticated stable key.
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { type: string, enum: [all, active, has_errors], default: all }
        - name: model
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: q
          in: query
          description: Case-insensitive prefix of a session ID or this credential's alias.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Sessions visible only to the authenticated stable key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /self/v1/sessions/{session_id}:
    get:
      tags: [Self service]
      operationId: getOwnLogicalSession
      summary: Read one logical session for the authenticated stable key
      security: [{ clientBearer: [] }]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: before_created_at
          in: query
          description: Exclusive cursor; must be paired with `before_request_id`.
          schema: { type: integer, format: int64 }
        - name: before_request_id
          in: query
          description: Exclusive cursor; must be paired with `before_created_at`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned requests and bounded relation edges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSessionDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/models:
    get:
      tags: [OpenAI compatible, Anthropic compatible]
      operationId: listAllowedModels
      summary: List currently routable models granted to the current credential
      description: Without Anthropic pagination parameters, returns the OpenAI-compatible model list. Anthropic gateway discovery accepts `limit` from 1 to 1000 with optional `before_id` or `after_id`, and returns only models with an authorized Anthropic route.
      security: [{ clientBearer: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          description: When Anthropic pagination is selected, omitted limit uses 20.
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: before_id
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: after_id
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: OpenAI-compatible or Anthropic gateway model list, selected by the pagination query.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAIModelList'
                  - $ref: '#/components/schemas/AnthropicModelList'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/chat/completions:
    post:
      tags: [OpenAI compatible]
      operationId: createChatCompletion
      summary: Proxy an OpenAI-compatible chat completion
      description: The body is forwarded after policy/plugin rewriting. Both JSON and SSE responses are supported and metered.
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenAIChatRequest' }
      responses:
