openapi: 3.1.0
info:
  title: Memeloop Token Center API
  version: 0.1.2
  summary: Multi-protocol AI gateway, credential, quota, and archive API
  description: |
    Contract for the API surface implemented under `src/api/`.

    The production Helm deployment separates the **control** and **gateway** roles.
    `/internal/v1/*` is served only by the control role. `/self/v1/*` and `/v1/*`
    are served only by the gateway role. `/healthz` is present on every HTTP-serving
    role. `/livez` is process liveness and `/readyz` runs bounded PostgreSQL and
    archive probes. PostgreSQL determines the readiness HTTP status; archive
    failure is reported as degraded without withdrawing gateway endpoints.
    `/healthz` is a deprecated compatibility alias for `/livez`.

    All monetary amounts are decimal strings with at most six fractional digits.
    All timestamps named `*_at` are Unix epoch milliseconds unless stated otherwise.
    Successful and error responses under `/internal`, `/self`, and `/v1` include
    `X-MTC-API-Version: v1`.
    Issued client and service credential secrets are returned only by create/rotate
    operations and must be stored by the caller immediately.

    Native Codex account `transport_policy` supports runtime dispatch controls:
    `dispatch_max_in_flight` (1..64, default 4), `dispatch_max_queued`
    (0..1024, default 32), and `dispatch_queue_timeout_millis`
    (1..300000, default 30000). Each gateway process queues fairly per account
    and credential-free proxy endpoint identity. Queue capacity/timeout rejects
    return HTTP 503, `Retry-After: 1`, and error.code
    `codex_dispatch_queue_capacity` / `codex_dispatch_queue_timeout`.
    Primary queue rejection occurs before durable request, reservation, RPM,
    archive and billing admission. Same-account transport retries and response
    streams retain their dispatch permit; candidate failover acquires the new
    lane without holding the previous lane. Runtime reductions drain existing
    requests rather than cancelling them; new queue waits use the current policy.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
tags:
  - name: System
    description: Process status and runtime-discovered schemas/plugins.
  - name: Client credentials
    description: Stable downstream identities, secrets, policy, status, and imported credential continuity.
  - name: Service credentials
    description: Least-privilege control-plane credentials for internal integrations.
  - name: Upstream providers
    description: Unified upstream identities independent of their authentication method.
  - name: Routes and pricing
    description: Public-model routing and token/multimodal price configuration.
  - name: Groups
    description: |
      Tenant-scoped provider groups, route groups, and credential groups. Provider
      groups participate in route candidate selection and route groups participate
      in credential authorization. Credential groups are presentation-only
      classification and never grant a route, model, provider, or permission.
  - name: Credits
    description: Idempotent account grants, reversals, and ledger inspection.
  - name: Entitlements
    description: Exact, versioned subscription credit reconciliation for memeloop web.
  - name: Operator traffic
    description: Tenant/global traffic statistics, request detail, and live events.
  - name: Generation quarantine
    description: Tenant-bound evidence-confirmed reconciliation of interrupted provider submissions.
  - name: Self service
    description: Credential-scoped, read-only usage and logical-conversation views.
  - name: OpenAI compatible
    description: OpenAI-compatible model, chat, Responses, and embedding routes.
  - name: Anthropic compatible
    description: Anthropic Messages-compatible routes used by Claude Code.
  - name: Multimodal generation
    description: Synchronous image and asynchronous image/video generation routes.
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Deprecated process-liveness compatibility alias
      description: Use `/livez`. This compatibility route does not check dependencies.
      security: []
      responses:
        '200':
          description: Process is serving HTTP.
          headers:
            Deprecation:
              description: Always `true` for this deprecated alias.
              schema: { const: 'true' }
            Link:
              description: Successor endpoint relation.
              schema: { const: '</livez>; rel="successor-version"' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /livez:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Report process liveness without probing dependencies
      security: []
      responses:
        '200':
          description: Process is serving HTTP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Probe database readiness and archive degradation
      description: |
        Available on every HTTP role for Kubernetes probes. PostgreSQL and archive
        checks run concurrently with bounded deadlines and a five-second singleflight
        cache, so probe bursts do not amplify dependency traffic. Database reachability
        and the complete migration registry determine the HTTP status. An archive failure
        is returned as HTTP 200 with `status: degraded` and `checks.archive: failed`;
        archive-dependent image/video operations still fail closed.
      security: []
      responses:
        '200':
          description: PostgreSQL is ready; archive is either ready or explicitly degraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: PostgreSQL readiness failed, timed out, or its schema is missing a migration required by this binary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    get:
      tags: [System]
      operationId: getPrometheusMetrics
      summary: Export bounded-cardinality operational metrics
      description: |
        Registered by gateway, control and all roles. Labels are restricted to controlled
        methods, matched route templates, status classes, providers, operations,
        dependencies, pool states, and generation states. Tenant, credential, model,
        URL, resource ID, and error-text labels are deliberately excluded.
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      responses:
        '200':
          description: Prometheus text exposition.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            'text/plain; version=0.0.4; charset=utf-8':
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /version:
    get:
      tags: [System]
      operationId: getBuildVersion
      summary: Read build and API compatibility metadata
      description: Registered only by the control/all role. Local builds may report `unknown` for injected build fields.
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      responses:
        '200':
          description: Build identity and supported API versions.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/keys:
    get:
      tags: [Client credentials]
      operationId: listClientCredentials
      summary: List stable client credential identities
      description: |
        A tenant-scoped service credential is always restricted to its bound tenant.
        A global credential may omit `tenant_external_id` to inspect all tenants.
        Records are ordered by `(created_at, key_id)` descending. Use the final row's
        `created_at` and `key_id` as the paired, exclusive `before_created_at` and
        `before_id` cursor. The response omits credential secrets, so a caller
        that lost a create response can reconcile the stable `key_id`, `account_id`,
        fingerprint, generation, policy and balance, then use Copy when
        `credential_copy_available` is true. An authorized source holding the current
        value can submit it through the credential endpoint before copying.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: principal_external_id
          in: query
          schema: { type: string, maxLength: 200 }
        - name: key_id
          in: query
          description: Return only the exact stable credential identity. Secret values are excluded from this search.
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Literal substring of alias or principal, applied before pagination. ASCII matching is case-insensitive; original non-ASCII spelling is preserved and searchable. Unicode case folding follows the database collation. Never searches secrets.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          description: Status filter applied before pagination.
          schema: { type: string, enum: [active, suspended, revoked] }
        - name: creation_source
          in: query
          description: Creation origin, applied before pagination. Historical identities retain unknown provenance. Deleted identities are excluded.
          schema: { type: string, enum: [manual, api, unknown, manual_or_unknown] }
        - $ref: '#/components/parameters/CredentialListLimit500'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Stable identities without credential secrets.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/ManagedClientCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Client credentials]
      operationId: createClientCredential
      summary: Provision a stable client identity and its first credential
      description: |
        Creates or reuses the tenant and principal, creates a credit account and stable
        `key_id`, then returns the one-time `mtc_…` secret. When `Idempotency-Key` is
        supplied, an identical request may replay the same response for 24 hours; use
        of the same key with a different normalized request is rejected. The
        `memeloop-cloud-principal:` namespace is reserved for the Cloud integration
        and cannot be claimed through this generic endpoint.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClientCredentialRequest' }
      responses:
        '201':
          description: Newly issued or idempotently replayed one-time credential.
          headers:
            X-MTC-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedClientCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/keys/delete:
    post:
      tags: [Client credentials]
      operationId: deleteClientCredentials
      summary: Revoke and remove selected credentials from the directory
      description: Atomically checks the tenant of every selected identity, revokes all credentials and clears stored secret material. Request attribution, credit balances and accounting records remain intact. Repeating the same selection is safe. This is logical deletion, not erasure of billing history.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_external_id, key_ids]
              properties:
                tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
                key_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Every selected credential is logically deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted_key_ids]
                properties:
                  deleted_key_ids:
                    type: array
                    maxItems: 100
                    items: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/rotate:
    post:
      tags: [Client credentials]
      operationId: rotateClientCredential
      summary: Replace a client credential secret without migrating its identity
      description: |
        Revokes all previous native and legacy secrets. Policy, balance, requests, and
        conversations remain attached to the same `key_id`. `Idempotency-Key` is required;
        replaying the same rotation key within 24 hours returns the same generation and
        the same one-time secret rather than rotating again. Idempotency keys are global
        across client and service credential rotations and must not be reused for another
        resource.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters:
        - $ref: '#/components/parameters/KeyId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          description: One-time replacement credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedClientCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/credential:
    put:
      tags: [Client credentials]
      operationId: storeClientCredential
      summary: Store an already-active client credential for direct authorized copying
      description: |
        Verifies the supplied credential against the active stable key and stores its original
        value for Copy. The credential keeps its current generation.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreClientCredentialRequest' }
      responses:
        '204': { description: Original credential stored; no secret is returned. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/copy:
    post:
      tags: [Client credentials]
      operationId: copyClientCredential
      summary: Copy a durable active client credential
      description: |
        Returns plaintext to an authorized Copy request while the matching key generation
        remains active. Credential lists and self-service APIs omit the secret. Repeated
        authorized calls return the same current-generation credential and retain its
        generation. Submit a current value through the credential endpoint when Copy needs
        an original value.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      responses:
        '200':
          description: The active client credential for immediate copying.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopiedClientCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/alias:
    patch:
      tags: [Client credentials]
      operationId: renameClientCredential
      summary: Rename a stable client credential without changing its identity
      description: The trimmed alias is display metadata. The stable key, principal, policy, balance, request history, and credential generations remain unchanged.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alias]
              properties:
                alias: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
      responses:
        '200':
          description: Updated key-local display metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [key_id, alias, updated_at]
                properties:
                  key_id: { type: string, format: uuid }
                  alias: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
                  updated_at: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/limits:
    get:
      tags: [Client credentials]
      operationId: getClientCredentialLimitSnapshot
      summary: Read current rate, concurrency, budget, and balance headroom
      description: The snapshot is captured for the selected stable key. A tenant-scoped service credential cannot select a key in another tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:read
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      responses:
        '200':
          description: Current configured limits and transactional consumption.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCredentialLimitSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/policy:
    put:
      tags: [Client credentials]
      operationId: replaceClientCredentialPolicy
      summary: Replace model permissions, rate limits, and budgets
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPolicy' }
      responses:
        '200':
          description: Stored replacement policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialPolicy' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/keys/{key_id}/routing:
    get:
      tags: [Groups]
      operationId: getClientCredentialRouting
      summary: Read exact-route and route-group grants for one stable credential
      description: |
        Returns direct route grants, route-group grants, and the deduplicated effective
        route set. Credential groups are intentionally absent because they only
        organize credentials in the operator UI and never grant access. Route-group
        membership changes are reflected in `effective_route_ids` immediately without
        changing the credential's direct-grant revision.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:read
      x-authorization-contract:
        tenant-source: stable-key-id
        credential-groups-grant-permission: false
      parameters:
        - $ref: '#/components/parameters/KeyId'
        - $ref: '#/components/parameters/RequiredTenant'
      responses:
        '200':
          description: Current normalized grants and their relation revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCredentialRouting' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Groups]
      operationId: replaceClientCredentialRouting
      summary: Atomically replace exact-route and route-group grants
      description: |
        `expected_grant_revision` is a compare-and-set token read from the routing
        representation. The replacement is all-or-nothing and may only reference
        existing routes and route groups in the credential tenant. Credential-group
        IDs are not accepted. A stale revision returns 409 and changes nothing.
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      x-authorization-contract:
        tenant-source: stable-key-id
        credential-groups-grant-permission: false
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceClientCredentialRoutingRequest' }
      responses:
        '200':
          description: Atomically replaced grants with a new relation revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCredentialRouting' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/keys/{key_id}/status:
    patch:
      tags: [Client credentials]
      operationId: setClientCredentialStatus
      summary: Activate, suspend, or permanently revoke a client identity
      description: "`revoked` is terminal and revokes all credential generations. A suspended identity may be returned to active."
      security: [{ serviceBearer: [] }]
      x-required-scope: keys:write
      parameters: [{ $ref: '#/components/parameters/KeyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                required: [key_id, status]
                properties:
                  key_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/CredentialStatus' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/service-tokens:
    get:
      tags: [Service credentials]
      operationId: listServiceCredentials
      summary: List service credential identities
      description: Global service credentials only. Secrets are never returned.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:read
      parameters:
        - $ref: '#/components/parameters/ControlListLimit100'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Service credential metadata.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/ServiceCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Service credentials]
      operationId: createServiceCredential
      summary: Create a least-privilege service credential
      description: Global service credentials only. Bind normal integrations to one tenant.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceCredentialRequest' }
      responses:
        '201':
          description: One-time service credential secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedServiceCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/service-tokens/{service_id}/rotate:
    post:
      tags: [Service credentials]
      operationId: rotateServiceCredential
      summary: Rotate a service credential while retaining its identity and scopes
      description: |
        `Idempotency-Key` is required. Replaying the same rotation key within 24 hours
        returns the same generation and one-time token rather than rotating again.
        Idempotency keys are global across client and service credential rotations and
        must not be reused for another resource.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          description: One-time replacement service credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedServiceCredential' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/service-tokens/{service_id}/copy:
    post:
      tags: [Service credentials]
      operationId: copyServiceCredential
      summary: Copy a durable active service credential
      description: |
        Global service-token management only. Returns the current original credential through
        a no-store Copy request and retains its generation.
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      responses:
        '200':
          description: The active service credential for immediate copying.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopiedServiceCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/service-tokens/{service_id}/status:
    patch:
      tags: [Service credentials]
      operationId: setServiceCredentialStatus
      summary: Activate, suspend, or permanently revoke a service credential
      security: [{ serviceBearer: [] }]
      x-required-scope: service_tokens:write
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      requestBody:
        required: true
        content:
          application/json:
