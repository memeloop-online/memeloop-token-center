        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/oauth/cursor/poll:
    post:
      tags: [Upstream providers]
      operationId: pollCursorOAuth
