        - $ref: '#/components/parameters/ModelPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPriceRequest' }
      responses:
        '200':
          description: Complete model price view including every configured tier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPriceWriteResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/generation-prices:
