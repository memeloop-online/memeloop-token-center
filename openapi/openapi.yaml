    ManagedClientCredential:
      type: object
      additionalProperties: false
      required: [key_id, account_id, tenant_external_id, principal_external_id, alias, currency, status, credential_generation, fingerprint, credential_copy_available, created_at, updated_at, policy, available_balance, reserved_balance]
