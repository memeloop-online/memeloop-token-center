  /internal/v1/generations/quarantine/{job_id}/resolutions:
    post:
      tags: [Generation quarantine]
      operationId: resolveGenerationQuarantine
      summary: Reconcile an interrupted submission using independently retained evidence
      description: |
        Requires a persistent service credential bound to the requested tenant with
        generations:reconcile. Bootstrap, global, broad generations:write, client keys,
        cross-tenant access, active leases, stale revisions, unknown actions and duplicate
        decisions are rejected. Only confirmed_submitted is supported: it requires a
        provider submission ID and resumes normal running processing. Unknown and
        confirmed_not_submitted assertions are rejected and leave credit reserved.
        An expired lease alone cannot prove the old process cannot resume its POST;
        safe release requires a future server-verifiable dispatch-stop protocol.
        This API never directly contacts a provider or settles/refunds credit.
        Confirmed delivery starts a bounded 24-hour polling window at confirmation time;
        the original admission timestamp is preserved. The normal timeout policy resumes
        at that deadline. Replaying a resolution never extends the window.
        evidence_digest is the lowercase SHA-256 of independently retained confirmation
        evidence, never the raw evidence or credentials. The operator is responsible for
        verifying the evidence against the provider before making this assertion.
        CAS transition, immutable audit and Idempotency-Key receipt commit together.
        An exact same-actor, same-tenant replay returns the original receipt; changed
        payloads or a second key for an already resolved attempt return 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: generations:reconcile
      x-persistent-service-only: true
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_external_id, expected_revision, action, evidence_digest, upstream_job_id]
              properties:
                tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
                expected_revision: { type: string, pattern: '^[0-9a-f]{64}$' }
                action: { type: string, enum: [confirmed_submitted] }
                evidence_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
                upstream_job_id: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_.:-]+$' }
      responses:
        '200':
          description: Immutable reconciliation receipt, including exact idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationQuarantineResolution' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

