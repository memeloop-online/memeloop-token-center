  /internal/v1/model-routes/{route_id}:
    put:
      tags: [Routes and pricing]
      operationId: replaceModelRoute
      summary: Replace a model route using optimistic concurrency
      description: |
        The upstream must be active, belong to the selected tenant, and support the
        requested protocol. Repeating the already-applied target values returns the
        current route even if `expected_updated_at` is the older value. A stale version
        for a different change, or a conflicting route uniqueness key, returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:write
      parameters: [{ $ref: '#/components/parameters/RouteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceModelRouteRequest' }
      responses:
        '200':
          description: Updated route or idempotent replay of the already-applied values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRoute' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [Routes and pricing]
      operationId: setModelRouteEnabled
      summary: Enable or disable a model route using optimistic concurrency
      description: Repeating the current target state is idempotent; a stale version for a real state change returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:write
      parameters: [{ $ref: '#/components/parameters/RouteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetModelRouteEnabledRequest' }
      responses:
        '200':
          description: Route in the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRoute' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Routes and pricing]
      operationId: deleteModelRoute
      summary: Delete a disabled, unreferenced model route
      description: |
        The route must first be disabled and must not be referenced by request history.
        A stale `expected_updated_at`, enabled route, or historical reference returns
        409. A missing route, including a repeated successful delete, returns 204.
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:write
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/RequiredTenant'
        - $ref: '#/components/parameters/ExpectedUpdatedAt'
      responses:
        '204': { description: Route deleted or already absent. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/model-prices:
