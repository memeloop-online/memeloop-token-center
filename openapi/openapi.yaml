  /internal/v1/stats:
    get:
      tags: [Operator traffic]
      operationId: getOperatorStatistics
      summary: Get bounded, filtered tenant or global aggregates
      description: |
        Uses the same applicable filters as the operator request list. Omitted
        `to_created_at` means request time; omitted `from_created_at` means 30 days
        before the effective upper bound. The resulting inclusive interval may not
        exceed 93 days. All filters are combined with AND.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/ProtocolFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - $ref: '#/components/parameters/UpstreamAccountFilter'
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/MinDurationFilter'
        - $ref: '#/components/parameters/MaxDurationFilter'
        - $ref: '#/components/parameters/MinCostFilter'
        - $ref: '#/components/parameters/MaxCostFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
      responses:
        '200':
          description: Request, token, cost, model, day, and error aggregates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/usage-analysis:
    get:
      tags: [Operator traffic]
      operationId: getOperatorUsageAnalysis
      summary: Analyze bounded tenant or global usage from hourly or daily rollups
      description: |
        Reads only compact terminal request and generation rollups; it never scans the raw
        request table. `auto` selects hourly buckets through 31 days and daily buckets for
        longer ranges. Omitted bounds default to the last 24 hours (`auto`/`hour`) or seven
        days (`day`). The inclusive interval may not exceed 93 days, and explicit hourly
        intervals may not exceed 31 days. Bucket starts and heatmap coordinates are UTC.
        Costs are returned as a currency-keyed array and are never added across currencies.
        Duration P95 values are bounded-histogram approximations capped at 60000 ms.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [auto, hour, day], default: auto }
        - $ref: '#/components/parameters/KeyFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - name: protocol
          in: query
          required: false
          description: Exact canonical protocol family.
          schema: { type: string, enum: [openai, anthropic, openai-image, generation] }
        - name: status
          in: query
          required: false
          description: Terminal logical status; pending traffic is intentionally absent from usage rollups.
          schema: { type: string, enum: [success, error] }
        - $ref: '#/components/parameters/ErrorCodeFilter'
        - name: upstream_account_id
          in: query
          required: false
          description: One stable upstream UUID, or `unassigned` for terminal activity recorded without an upstream.
          schema:
            oneOf:
              - { type: string, format: uuid }
              - { type: string, const: unassigned }
        - $ref: '#/components/parameters/RouteFilter'
        - $ref: '#/components/parameters/KeyAliasFilter'
        - $ref: '#/components/parameters/PrincipalFilter'
      responses:
        '200':
          description: Currency-safe terminal usage projections and UTC time buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageAnalysis' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/request-events:
    get:
      tags: [Operator traffic]
      operationId: streamRequestEvents
      summary: Tail started and finished request events over SSE
      description: Use the `(after_event_at, after_event_id)` pair as the durable resume cursor. Event names are `request.started` and `request.finished`.
      security: [{ serviceBearer: [] }]
      x-required-scope: requests:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - name: after_event_at
          in: query
          schema: { type: integer, format: int64, description: Unix epoch milliseconds. }
        - name: after_event_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: SSE stream. Each `data` field is a RequestEvent JSON object.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

