        creation_source: { type: string, enum: [manual, api, unknown] }
        archived_at: { type: [integer, 'null'], format: int64 }
        key_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        tenant_external_id: { type: string }
        principal_external_id: { type: string }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        credential_generation: { type: integer, format: int64 }
        fingerprint: { type: [string, 'null'] }
        credential_copy_available: { type: boolean, description: Whether Copy credential can return the active credential. }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        available_balance: { $ref: '#/components/schemas/Money' }
        reserved_balance: { $ref: '#/components/schemas/Money' }
    SelfCredential:
      type: object
      additionalProperties: false
      required: [key_id, alias, currency, credential_generation, created_at, policy, available_balance]
      properties:
        key_id: { type: string, format: uuid }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        credential_generation: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        available_balance: { $ref: '#/components/schemas/Money' }
    ClientCredentialRateLimitSnapshot:
      type: object
      additionalProperties: false
      required: [limit, used, remaining, reset_at]
      properties:
        limit: { type: integer, minimum: 0, maximum: 9007199254740991 }
        used: { type: integer, minimum: 0, maximum: 9007199254740991 }
        remaining: { type: integer, minimum: 0, maximum: 9007199254740991 }
        reset_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
    ClientCredentialConcurrencySnapshot:
      type: object
      additionalProperties: false
      required: [limit, active, remaining]
      properties:
        limit: { type: integer, format: int32, minimum: 0 }
