      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        token: { type: string, writeOnly: true, description: One-time service credential secret. }
        fingerprint: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ServiceScope' }
        tenant_external_id: { type: [string, 'null'] }
    ServiceCredential:
      type: object
      additionalProperties: false
      required: [service_id, name, status, credential_generation, fingerprint, credential_copy_available, scopes, tenant_external_id, created_at, updated_at]
      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        credential_generation: { type: integer, format: int64 }
        fingerprint: { type: string }
        credential_copy_available: { type: boolean, description: Whether Copy credential can return the active service credential. }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ServiceScope' }
        tenant_external_id: { type: [string, 'null'] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    CopiedServiceCredential:
      type: object
      additionalProperties: false
      required: [service_id, credential_generation, token]
      properties:
        service_id: { type: string, format: uuid }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        token: { type: string, writeOnly: true, description: Active service credential returned by a no-store Copy request. }
    JsonSchema:
      oneOf:
        - type: object
          additionalProperties: true
        - type: boolean
    OAuthAdapterContribution:
      type: object
      additionalProperties: false
      required: [api_version, flow_kind, login_url, poll_url, refresh_url]
      properties:
        api_version: { type: string, enum: [oauth-adapter-v1] }
        flow_kind:
          type: string
          enum: [cursor_pkce, openai_device, claude_manual_pkce, github_device_copilot, kimi_device]
        login_url: { type: string, format: uri }
        poll_url: { type: string, format: uri }
        refresh_url: { type: string, format: uri }
    ComponentAdapterContribution:
      type: object
      additionalProperties: false
      required: [api_version, max_response_bytes]
      properties:
        api_version: { type: string, enum: [buffered-v1] }
        max_response_bytes: { type: integer, minimum: 1, maximum: 4194304 }
    RequestCompatibility:
      type: object
      additionalProperties: false
      required: [third_party, responses_via_chat_v1, responses_transport_configurable, codex_multi_agent_v2]
      properties:
        third_party: { type: boolean }
        responses_via_chat_v1: { type: boolean }
        responses_via_chat_dialect:
          type: string
          enum: [openai_chat_v1, kimi_v1]
        responses_transport_configurable:
          type: boolean
          description: Account configuration selects native_responses or chat_completions through the provider's closed responses_transport schema.
        codex_multi_agent_v2: { type: boolean }
    ProviderType:
      type: object
      additionalProperties: false
      required: [id, display_name, protocols, modalities, config_schema, credential_schema, source]
      properties:
        id: { type: string }
        display_name: { type: string }
        protocols:
          type: array
          items: { type: string, enum: [openai, anthropic, openai-audio, generation] }
        modalities:
          type: array
          items: { type: string, enum: [text, embedding, image, video, audio] }
        config_schema: { $ref: '#/components/schemas/JsonSchema' }
        credential_schema: { $ref: '#/components/schemas/JsonSchema' }
        oauth_adapter:
          oneOf:
            - $ref: '#/components/schemas/OAuthAdapterContribution'
            - type: 'null'
        component_adapter:
          oneOf:
            - $ref: '#/components/schemas/ComponentAdapterContribution'
            - type: 'null'
        request_compatibility:
          oneOf:
            - $ref: '#/components/schemas/RequestCompatibility'
            - type: 'null'
        source: { type: string }
    ApiKeyCredential:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { const: api_key }
        value: { type: string, minLength: 1, writeOnly: true }
        header: { type: string, default: authorization }
        prefix: { type: string, default: 'Bearer ' }
    ProxiedApiKeyCredential:
      type: object
      additionalProperties: false
      required: [type, value, proxy_url, proxy_network_scope]
      properties:
        type: { const: api_key_proxy }
        value: { type: string, minLength: 1, writeOnly: true }
        header: { type: string, default: authorization }
        prefix: { type: string, default: 'Bearer ' }
        proxy_url: { type: string, pattern: '^socks5h?://', minLength: 1, maxLength: 2048, writeOnly: true, description: 'Explicit private SOCKS proxy. socks5 resolves targets locally; socks5h preserves remote DNS and requires a private IP-literal proxy endpoint.' }
        proxy_network_scope: { type: string, const: private }
    OAuthCredential:
      type: object
      additionalProperties: false
      required: [type, access_token]
      properties:
        type: { const: oauth }
        access_token: { type: string, minLength: 1, writeOnly: true }
        refresh_token: { type: [string, 'null'], writeOnly: true }
        expires_at: { type: [integer, 'null'], format: int64 }
        header: { type: string, default: authorization }
        prefix: { type: string, default: 'Bearer ' }
        proxy_url: { type: [string, 'null'], pattern: '^socks5h?://', minLength: 1, maxLength: 2048, writeOnly: true, description: 'Explicit private SOCKS proxy. socks5 resolves targets locally; socks5h preserves remote DNS and requires a private IP-literal proxy endpoint.' }
        proxy_network_scope:
          oneOf:
            - { type: string, const: private }
            - { type: 'null' }
    NoAuthCredential:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: none }
    UpstreamCredential:
      oneOf:
        - $ref: '#/components/schemas/NoAuthCredential'
        - $ref: '#/components/schemas/ApiKeyCredential'
        - $ref: '#/components/schemas/ProxiedApiKeyCredential'
        - $ref: '#/components/schemas/OAuthCredential'
      discriminator:
        propertyName: type
        mapping:
          none: '#/components/schemas/NoAuthCredential'
          api_key: '#/components/schemas/ApiKeyCredential'
          api_key_proxy: '#/components/schemas/ProxiedApiKeyCredential'
          oauth: '#/components/schemas/OAuthCredential'
    NativeOAuthImportCapabilities:
      type: object
