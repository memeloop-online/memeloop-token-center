      properties:
        key_id: { type: string, format: uuid }
        captured_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
        currency: { $ref: '#/components/schemas/Currency' }
        available_balance: { $ref: '#/components/schemas/Money' }
        reserved_balance: { $ref: '#/components/schemas/Money' }
        rpm: { $ref: '#/components/schemas/ClientCredentialRateLimitSnapshot' }
        tpm: { $ref: '#/components/schemas/ClientCredentialRateLimitSnapshot' }
        concurrency: { $ref: '#/components/schemas/ClientCredentialConcurrencySnapshot' }
        daily_budget: { $ref: '#/components/schemas/ClientCredentialBudgetSnapshot' }
        weekly_budget: { $ref: '#/components/schemas/ClientCredentialBudgetSnapshot' }
        lifetime_budget: { $ref: '#/components/schemas/ClientCredentialBudgetSnapshot' }
    TenantIdentifierRequest:
      type: object
      additionalProperties: false
