        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        source: { type: string, minLength: 1, maxLength: 256 }
        external_request_id: { type: string, minLength: 1, maxLength: 512 }
        record_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        reason_code: { type: string, enum: [missing_credential_hash, unproven_identity] }
        source_started_at: { type: integer, format: int64 }
        source_completed_at: { type: [integer, 'null'], format: int64 }
        protocol: { type: string, minLength: 1, maxLength: 64 }
        model: { type: string, minLength: 1, maxLength: 512 }
        status_code: { type: [integer, 'null'], format: int64, minimum: 100, maximum: 599 }
        duration_ms: { type: [integer, 'null'], format: int64, minimum: 0 }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        error_code: { type: [string, 'null'], maxLength: 256 }
        state: { type: string, enum: [pending, resolved, dismissed] }
    ResolveSessionArchiveQuarantineRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, action, expected_record_digest, evidence_digest]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        action:
          type: string
          enum: [associate, dismiss]
          description: Associate requires `key_id`; dismiss requires it to be absent or null.
        key_id: { type: [string, 'null'], format: uuid }
        expected_record_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Optimistic-concurrency digest copied from the reviewed quarantine record.
        evidence_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 digest of independently retained operator evidence; raw evidence is never accepted.
        note: { type: [string, 'null'], maxLength: 2000, pattern: '^[^\x00-\x1F\x7F]*$' }
      allOf:
        - if:
            properties: { action: { const: associate } }
          then:
            required: [key_id]
            properties: { key_id: { type: string, format: uuid } }
        - if:
            properties: { action: { const: dismiss } }
          then:
            properties: { key_id: { type: 'null' } }
    SessionArchiveQuarantineResolution:
      type: object
      additionalProperties: false
      required: [id, quarantine_id, action, key_id, evidence_digest, created_at]
      properties:
        id: { type: string, format: uuid }
        quarantine_id: { type: string, format: uuid }
        action: { type: string, enum: [associate, dismiss] }
        key_id: { type: [string, 'null'], format: uuid }
        evidence_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        created_at: { type: integer, format: int64 }
