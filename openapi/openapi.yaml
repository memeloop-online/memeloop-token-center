        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    TokenPriceRequest:
      type: object
      additionalProperties: false
      required: [input_per_million, output_per_million]
      properties:
        input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        cached_input_per_million:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Defaults to `input_per_million`; that fallback is marked estimated in the stored tier.
        cache_write_per_million:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Defaults to `input_per_million`; that fallback is marked estimated in the stored tier.
        output_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        service_tier:
          allOf: [{ $ref: '#/components/schemas/ServiceTier' }]
          default: default
    ModelPrice:
      type: object
      additionalProperties: false
      required: [model, currency, input_per_million, output_per_million, source, updated_at, tiers]
      properties:
        model: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        output_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        source: { type: string, description: "`manual`, `models.dev`, `litellm`, or `openrouter`." }
        updated_at: { type: integer, format: int64 }
        tiers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ModelPriceTier' }
    ModelPriceTier:
      type: object
      additionalProperties: false
      required: [service_tier, input_per_million, cached_input_per_million, cache_write_per_million, output_per_million, source, updated_at, cache_price_estimated]
      properties:
        service_tier: { $ref: '#/components/schemas/ServiceTier' }
        input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        cached_input_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        cache_write_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        output_per_million: { $ref: '#/components/schemas/NonNegativeMoney' }
        source: { type: string, description: "`manual`, `models.dev`, `litellm`, or `openrouter`." }
        updated_at: { type: integer, format: int64 }
        cache_price_estimated: { type: boolean, description: True when a source omitted cache read or write pricing and the input price was used conservatively. }
    ModelPriceWriteResult:
      $ref: '#/components/schemas/ModelPrice'
    ModelUsageSummary:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            required: [model, calls, input_tokens, output_tokens]
            properties:
              model: { type: string }
              calls: { type: integer, format: int64 }
              input_tokens: { type: integer, format: int64 }
              output_tokens: { type: integer, format: int64 }
    ModelPriceSyncRequest:
      type: object
      properties:
        models:
          type: array
          items: { type: string, minLength: 1 }
          default: []
        currency: { $ref: '#/components/schemas/Currency' }
        tenant_external_id: { type: [string, 'null'] }
    ModelPriceSyncResult:
      type: object
      required: [source, sources, imported, matched, candidates, unmatched, preserved, sourceResults, prices]
      properties:
        source: { type: string }
        sources:
          type: array
          items: { type: string }
        imported: { type: integer, minimum: 0 }
        matched:
          type: array
          items: { type: string }
        candidates:
          type: array
          items:
            type: object
            required: [model, candidates]
            properties:
              model: { type: string }
              candidates:
                type: array
                items:
                  type: object
                  required: [sourceModelId, source, reason, inputPerMillion, outputPerMillion, serviceTier]
                  properties:
                    sourceModelId: { type: string }
                    source: { type: string }
                    reason: { type: string }
                    inputPerMillion: { $ref: '#/components/schemas/NonNegativeMoney' }
                    outputPerMillion: { $ref: '#/components/schemas/NonNegativeMoney' }
                    serviceTier: { $ref: '#/components/schemas/ServiceTier' }
        unmatched:
          type: array
          items: { type: string }
        preserved:
          type: array
          items: { type: string }
        sourceResults:
          type: array
          items:
            type: object
            required: [source, models, skipped]
            properties:
              source: { type: string }
              models: { type: integer, minimum: 0 }
              skipped: { type: integer, minimum: 0 }
              error: { type: string }
        prices:
          type: array
          items: { $ref: '#/components/schemas/ModelPrice' }
    GenerationPriceRequest:
      type: object
      required: [billing_unit, price_per_unit]
      properties:
        billing_unit: { type: string, enum: [job, second, image, megapixel] }
        price_per_unit: { $ref: '#/components/schemas/NonNegativeMoney' }
    GenerationPrice:
      type: object
      required: [id, model, currency, billing_unit, price_per_unit]
      properties:
        id: { type: string, format: uuid }
        model: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        billing_unit: { type: string, enum: [job, second, image, megapixel] }
        price_per_unit: { $ref: '#/components/schemas/NonNegativeMoney' }
    GrantRequest:
      type: object
      required: [amount, source]
      properties:
        amount: { $ref: '#/components/schemas/NonNegativeMoney' }
        source: { type: string, minLength: 1, maxLength: 200 }
    GrantReversalRequest:
      type: object
      required: [grant_idempotency_key, source]
      properties:
        grant_idempotency_key: { type: string, minLength: 1, maxLength: 200 }
        source: { type: string, minLength: 1, maxLength: 200 }
    LedgerEntry:
      type: object
      required: [entry_id, kind, amount, currency, source, idempotency_key, created_at]
      properties:
        entry_id: { type: string, format: uuid }
        kind: { type: string, enum: [grant, grant_reversal, usage, entitlement_adjustment] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        source: { type: string }
        idempotency_key: { type: [string, 'null'] }
        created_at: { type: integer, format: int64 }
    AccountSettlementKind:
      type: string
      enum: [text, generation]
    AccountSettlement:
      type: object
      description: Local ledger settlements, not supplier invoices. Token provenance is unknown for historical rows without usage_basis; contract ceilings are not measured token consumption.
      additionalProperties: false
      required: [settlement_id, settlement_sequence, request_id, kind, account_id, key_id, model, cost, currency, settled_at, completed_at, input_tokens, cached_input_tokens, cache_write_tokens, output_tokens]
      properties:
        settlement_id: { type: string, format: uuid }
        settlement_sequence: { type: integer, format: int64 }
        request_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AccountSettlementKind' }
        account_id: { type: string, format: uuid }
        key_id: { type: string, format: uuid }
        model: { type: string }
        cost: { $ref: '#/components/schemas/NonNegativeMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        settled_at: { type: integer, format: int64 }
        completed_at: { type: integer, format: int64 }
        input_tokens: { type: [integer, 'null'], format: int64 }
        cached_input_tokens: { type: [integer, 'null'], format: int64 }
        cache_write_tokens: { type: [integer, 'null'], format: int64 }
        output_tokens: { type: [integer, 'null'], format: int64 }
        usage_basis:
          type: [string, 'null']
          enum: [provider_reported, provider_estimated, contract_ceiling, not_observed, null]
          description: Text-token provenance; null means historical or non-text provenance is unknown.
    AccountSettlementCursor:
      type: object
      additionalProperties: false
      required: [after_sequence, after_id]
      properties:
        after_sequence: { type: integer, format: int64 }
        after_id: { type: string, format: uuid }
    AccountSettlementPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AccountSettlement' }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/AccountSettlementCursor'
            - type: 'null'
    SettlementCorrectionOriginal:
      type: object
      additionalProperties: false
      description: Raw persisted settlement inputs. Historical corrupt token counts are preserved verbatim, including negative values, and make the non-negative/token-ceiling invariants false.
      required: [usage_basis, cost, input_tokens, cached_input_tokens, cache_write_tokens, output_tokens]
      properties:
        usage_basis: { type: string, const: contract_ceiling }
        cost: { $ref: '#/components/schemas/NonNegativeMoney' }
        input_tokens: { type: integer, format: int64 }
        cached_input_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
    SettlementCorrectionEvidence:
      type: object
      additionalProperties: false
      required: [archive_state, response_available, provider_usage]
      properties:
        archive_state: { $ref: '#/components/schemas/RequestArchiveState' }
        response_available:
          type: boolean
          description: True only when a non-gap response object is durably bound; response bytes are not read by this preview.
        provider_usage:
          type: string
          const: not_evaluated
          description: Provider usage remains deliberately unevaluated until a separately reviewed evidence step.
    SettlementCorrectionInvariants:
      type: object
      additionalProperties: false
      required: [reservation_settled, reservation_actual_matches_cost, token_counts_non_negative, token_ceiling_matches_reservation, usage_ledger_unique, usage_ledger_matches_cost, settlement_feed]
      properties:
        reservation_settled: { type: boolean }
        reservation_actual_matches_cost: { type: boolean }
        token_counts_non_negative:
          type: boolean
          description: True only when all persisted request token counts and the reservation token ceiling are non-negative.
        token_ceiling_matches_reservation:
          type: boolean
          description: True only when token counts are non-negative, cache counts are zero, and input plus output equals the reservation ceiling.
        usage_ledger_unique: { type: boolean }
        usage_ledger_matches_cost: { type: boolean }
        settlement_feed:
          type: string
          enum: [matched, not_applicable_metered, missing, mismatch]
    SettlementCorrectionPending:
      type: object
      additionalProperties: false
      required: [corrected_usage_basis, corrected_cost, maximum_possible_rebate, required_confirmation]
      properties:
        corrected_usage_basis:
          type: [string, 'null']
          enum: [provider_reported, not_observed, null]
          description: Always null in the read-only preview; a later evidence decision selects a value.
        corrected_cost:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
            - type: 'null'
          description: Always null until provider-reported usage or non-observation is confirmed.
        maximum_possible_rebate:
          allOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }]
          description: Upper bound equal to the original local settlement, not a recommended rebate.
        required_confirmation:
          type: string
          const: provider_reported_usage_or_not_observed
    SettlementCorrectionPreview:
      type: object
      additionalProperties: false
      required: [request_id, reservation_id, usage_ledger_entry_id, account_id, key_id, protocol, model, status_code, error_code, created_at, completed_at, currency, original, evidence, invariants, review_state, pending_correction]
      properties:
        request_id: { type: string, format: uuid }
        reservation_id: { type: string, format: uuid }
        usage_ledger_entry_id:
          type: [string, 'null']
          format: uuid
          description: Present only when exactly one usage ledger row is bound to the reservation.
        account_id: { type: string, format: uuid }
        key_id: { type: string, format: uuid }
        protocol: { type: string }
        model: { type: string }
        status_code: { type: integer, format: int64 }
        error_code: { type: [string, 'null'] }
        created_at: { type: integer, format: int64, minimum: 0 }
        completed_at: { type: integer, format: int64, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        original: { $ref: '#/components/schemas/SettlementCorrectionOriginal' }
        evidence: { $ref: '#/components/schemas/SettlementCorrectionEvidence' }
        invariants: { $ref: '#/components/schemas/SettlementCorrectionInvariants' }
        review_state:
          type: string
          enum: [ready_for_evidence, invariant_mismatch]
        pending_correction: { $ref: '#/components/schemas/SettlementCorrectionPending' }
    SettlementCorrectionPreviewCursor:
      type: object
      additionalProperties: false
      required: [after_created_at, after_request_id]
      properties:
        after_created_at: { type: integer, format: int64, minimum: 0 }
        after_request_id: { type: string, format: uuid }
    SettlementCorrectionPreviewPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/SettlementCorrectionPreview' }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/SettlementCorrectionPreviewCursor'
            - type: 'null'
    SettlementAdjustmentNamespace:
      type: string
      const: memeloop-cloud:usage-discount
      description: The only namespace accepted in the initial release. Future integration namespaces require explicit API authorization rather than generic owner:name acceptance.
    SettlementAdjustmentDecisionDigest:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Lower-case SHA-256 digest of the external discount decision evidence. Raw decision evidence is not accepted or returned.
    ReconcileSettlementAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [namespace, request_kind, request_id, currency, version, desired_rebate, decision_digest, source]
      properties:
        namespace: { $ref: '#/components/schemas/SettlementAdjustmentNamespace' }
        request_kind: { $ref: '#/components/schemas/AccountSettlementKind' }
        request_id: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        version: { type: integer, format: int64, minimum: 1 }
        desired_rebate:
          allOf: [{ $ref: '#/components/schemas/NonNegativeMoney' }]
          description: A non-negative, forward-only desired total for this settlement and namespace, not a negative charge or reversal. Zero permits an initial no-op decision event; after a non-zero value, lowering it requires the separate reversal protocol.
        decision_digest: { $ref: '#/components/schemas/SettlementAdjustmentDecisionDigest' }
        source: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
    SettlementAdjustmentResult:
      type: object
      additionalProperties: false
      required: [adjustment_entry_id, event_id, account_id, settlement_id, namespace, request_kind, request_id, currency, desired_rebate, applied_delta, cumulative_rebate, remaining_rebate, version, created_at, replayed]
      properties:
        adjustment_entry_id:
          type: [string, 'null']
          format: uuid
          description: Ledger adjustment entry created for a positive delta; null when the desired total did not move.
        event_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        settlement_id: { type: string, format: uuid }
        namespace: { $ref: '#/components/schemas/SettlementAdjustmentNamespace' }
        request_kind: { $ref: '#/components/schemas/AccountSettlementKind' }
        request_id: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        desired_rebate: { $ref: '#/components/schemas/NonNegativeMoney' }
        applied_delta: { $ref: '#/components/schemas/NonNegativeMoney' }
        cumulative_rebate: { $ref: '#/components/schemas/NonNegativeMoney' }
        remaining_rebate: { $ref: '#/components/schemas/NonNegativeMoney' }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: integer, format: int64, description: Unix epoch milliseconds. }
        replayed: { type: boolean }
    EntitlementIdentity:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9._:-]+$'
    ReconcileEntitlementRequest:
      type: object
      additionalProperties: false
      required: [account_id, provider, external_subscription_id, external_cycle_id, period_start, period_end, currency, desired, version, source]
      properties:
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Required for a global service credential; a scoped credential may omit it and is always bound to its own tenant.
        account_id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_cycle_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        period_start: { type: integer, format: int64, minimum: 0 }
        period_end: { type: integer, format: int64, minimum: 1, description: Must be greater than `period_start`. }
        currency: { $ref: '#/components/schemas/Currency' }
        desired: { $ref: '#/components/schemas/NonNegativeMoney' }
        version: { type: integer, format: int64, minimum: 1 }
        source: { type: string, minLength: 1, maxLength: 200 }
        proration:
          description: Optional provider/business proration evidence, stored canonically; serialized size is limited to 4 KiB.
    CancelEntitlementRequest:
      type: object
      additionalProperties: false
      required: [provider, external_subscription_id, version, source]
      properties:
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Required for a global service credential; a scoped credential may omit it.
        provider: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_cycle_id:
          oneOf:
            - $ref: '#/components/schemas/EntitlementIdentity'
            - type: 'null'
          description: Optional stale-cycle guard for the current billing cycle.
        version: { type: integer, format: int64, minimum: 1 }
        source: { type: string, minLength: 1, maxLength: 200 }
    ReplaceEntitlementRequest:
      type: object
      additionalProperties: false
      required: [provider, external_subscription_id, version, source, replacement]
      properties:
        tenant_external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Required for a global service credential; a scoped credential may omit it.
        provider: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        version: { type: integer, format: int64, minimum: 1, description: New version for the old stable subscription identity. }
        source: { type: string, minLength: 1, maxLength: 200 }
        replacement:
          allOf:
            - $ref: '#/components/schemas/ReconcileEntitlementRequest'
          description: Full snapshot for a different stable subscription identity in the same tenant and account.
    Entitlement:
      type: object
      required: [entitlement_id, cycle_id, tenant_external_id, account_id, provider, external_subscription_id, external_cycle_id, period_start, period_end, currency, desired, consumed, remaining, status, version, replaced_by_entitlement_id, created_at, updated_at]
      properties:
        entitlement_id: { type: string, format: uuid, description: Stable provider/subscription identity. }
        cycle_id: { type: string, format: uuid, description: Stable current billing-cycle identity. }
        tenant_external_id: { type: string }
        account_id: { type: string, format: uuid }
        provider: { type: string }
        external_subscription_id: { type: string }
        external_cycle_id: { type: string }
        period_start: { type: integer, format: int64 }
        period_end: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        desired: { $ref: '#/components/schemas/NonNegativeMoney' }
        consumed:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Settled usage attributed FIFO to entitlement cycles active for this stable account.
        remaining: { $ref: '#/components/schemas/NonNegativeMoney' }
        status: { type: string, enum: [active, cancelled, replaced] }
        version: { type: integer, format: int64, minimum: 1 }
        replaced_by_entitlement_id: { type: [string, 'null'], format: uuid }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    EntitlementResult:
      allOf:
        - $ref: '#/components/schemas/Entitlement'
        - type: object
          required: [ledger_delta, replaced_entitlement_id]
          properties:
            ledger_delta:
              $ref: '#/components/schemas/Money'
              description: Net account movement from this atomic operation; a negative value withdraws unused entitlement credit.
            replaced_entitlement_id:
              type: [string, 'null']
              format: uuid
              description: Old stable subscription identity, populated only by replace.
    MemeLoopCloudPrincipalEnsureRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, principal_external_id, currency]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        principal_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        currency: { $ref: '#/components/schemas/Currency' }
    MemeLoopCloudSubscriptionSnapshot:
      type: object
      additionalProperties: false
      required: [tenant_external_id, principal_external_id, external_subscription_id, currency, version, status, policy]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        principal_external_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]+$' }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        external_cycle_id:
          oneOf:
            - $ref: '#/components/schemas/EntitlementIdentity'
            - type: 'null'
          description: Required for active snapshots; optional stale-cycle guard for cancellation.
        period_start: { type: [integer, 'null'], format: int64, minimum: 0, description: Required only for active snapshots. }
        period_end: { type: [integer, 'null'], format: int64, minimum: 1, description: Required only for active snapshots and must exceed period_start. }
        currency: { $ref: '#/components/schemas/Currency' }
        desired:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
            - type: 'null'
          description: Exact current-cycle funded amount; required only for active snapshots.
        version: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, cancelled] }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        route_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
          description: Exact model-route grants. Empty or omitted denies exact-route access.
        route_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
          description: Route-group grants. Empty or omitted denies route-group access.
        proration:
          description: Optional active-plan evidence; canonical serialized size, including the event digest, is limited to 4 KiB.
    ProvisionedCloudCredential:
      type: object
      additionalProperties: false
      required: [key_id, account_id, alias, currency, credential_generation, fingerprint, key]
      properties:
        key_id: { type: string, format: uuid, description: Stable across credential rotation and subscription changes. }
        account_id: { type: string, format: uuid, description: Stable credit/history owner. }
        alias: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        credential_generation: { type: integer, format: int64, minimum: 1 }
        fingerprint: { type: string }
        key:
          type: [string, 'null']
          writeOnly: true
          description: Encrypted replayable one-time secret during the 24-hour provisioning window; null after expiry or rotation.
    MemeLoopCloudSubscriptionResult:
      type: object
      additionalProperties: false
      required: [credential, entitlement, policy]
      properties:
        credential: { $ref: '#/components/schemas/ProvisionedCloudCredential' }
        entitlement: { $ref: '#/components/schemas/EntitlementResult' }
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
    MemeLoopCloudSubscriptionEvent:
      type: object
      additionalProperties: false
      required: [event_id, tenant_external_id, principal_external_id, key_id, entitlement_id, provider, external_subscription_id, version, subscription_status, created_at]
      properties:
        event_id: { type: string, format: uuid }
        tenant_external_id: { type: string }
        principal_external_id: { type: string }
        key_id: { type: string, format: uuid }
        entitlement_id: { type: string, format: uuid }
        provider: { type: string, const: memeloop-cloud }
        external_subscription_id: { $ref: '#/components/schemas/EntitlementIdentity' }
        version: { type: integer, format: int64, minimum: 1 }
        subscription_status: { type: string, enum: [active, cancelled] }
        created_at: { type: integer, format: int64 }
    SelfMemeLoopCloudEntitlements:
      type: object
      additionalProperties: false
      required: [entitlements, events]
      properties:
        entitlements:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Entitlement' }
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MemeLoopCloudSubscriptionEvent' }
    RequestSummary:
      type: object
      required: [request_id, created_at, completed_at, source_completed_at, lifecycle_state, protocol, model, upstream_account_id, route_id, status_code, duration_ms, input_tokens, cached_input_tokens, cache_write_tokens, output_tokens, cost, currency, usage, billing, error_code, archive_state, credential_identity, session_context]
      properties:
        usage_basis:
          type: [string, 'null']
          enum: [provider_reported, provider_estimated, contract_ceiling, not_observed, null]
          description: Provenance of recorded token quantities. Contract ceiling is a conservative accounting bound, never observed generation throughput; null/absence is unknown historical provenance. Cost remains the amount settled in the local ledger, not a claim about the provider invoice.
        compaction:
          type: [boolean, 'null']
          enum: [true, null]
          description: Explicit persisted client context-compaction evidence. True only for a declared compaction marker; null or absence means unknown, including legacy default-false observations. Never inferred from duration, model, archive compression or request contents while serving history.
        request_id: { type: string, format: uuid }
        created_at: { type: integer, format: int64 }
        completed_at:
          type: [integer, 'null']
          format: int64
          description: Terminal accounting timestamp in Unix milliseconds; null while pending or when the historical record lacks a terminal timestamp.
        source_completed_at:
          type: [integer, 'null']
          format: int64
          description: Source-reported completion time for archive-only history; native records do not synthesize it.
        lifecycle_state: { $ref: '#/components/schemas/RequestLifecycleState' }
        protocol: { type: string }
        model: { type: string }
        upstream_account_id:
          type: [string, 'null']
          format: uuid
          description: Stable final upstream assignment. For text traffic this is not a routing-attempt history.
        route_id:
          type: [string, 'null']
          format: uuid
          description: Stable recorded route assignment; null when historical traffic has no route snapshot.
        status_code: { type: [integer, 'null'], format: int64 }
        duration_ms: { type: [integer, 'null'], format: int64 }
        first_output_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Gateway-observed time from request start to the first nonempty output delta. Null for records without an observed delta.
        generation_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Gateway-observed interval from first output delta to successful protocol terminal, sampled before terminal settlement. Null for missing, failed, or zero-length observations; not supplier-internal decoding time.
        input_tokens: { type: [integer, 'null'], format: int64 }
        cached_input_tokens:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Input tokens served from the upstream cache tier.
        cache_write_tokens:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Input tokens written to the upstream cache tier.
        output_tokens: { type: [integer, 'null'], format: int64 }
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        currency:
          type: [string, 'null']
          description: Durably recorded historical billing currency; null when the immutable source fact is unavailable.
        usage: { $ref: '#/components/schemas/RequestUsage' }
        billing: { $ref: '#/components/schemas/RequestBilling' }
        error_code: { type: [string, 'null'] }
        archive_state: { $ref: '#/components/schemas/RequestArchiveState' }
        credential_identity:
          description: Operator-scoped stable credential identity; null in self-service projections.
          oneOf:
            - $ref: '#/components/schemas/RequestCredentialIdentity'
            - type: 'null'
        session_context:
          description: |
            Persisted logical-session projection for request records. `confirmed`
            identifies the internal session accepted by durable relationship evidence;
            `unlinked` explicitly records the absence of such an association. Candidate
            edges never appear as confirmed, and generation jobs return null.
          oneOf:
            - $ref: '#/components/schemas/RequestSessionContext'
            - type: 'null'
    RequestLifecycleState:
      type: string
      enum: [preparing, queued, submitting, running, cancelling, pending, succeeded, failed, cancelled]
      description: Execution lifecycle, independent from the persisted product error code.
    RequestArchiveState:
      type: string
      enum: [capturing, pending, uploading, metadata_only, bound, gap]
      description: Current durable archive workflow state. `metadata_only` means product policy retained bounded audit/accounting metadata but intentionally stored no request or response body.
    RequestTokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, cached_input_tokens, cache_write_tokens, output_tokens]
      properties:
        input_tokens: { type: [integer, 'null'], format: int64, minimum: 0 }
        cached_input_tokens: { type: [integer, 'null'], format: int64, minimum: 0 }
        cache_write_tokens: { type: [integer, 'null'], format: int64, minimum: 0 }
        output_tokens: { type: [integer, 'null'], format: int64, minimum: 0 }
    RequestGenerationUsage:
      type: object
      additionalProperties: false
      required: [billed_units, billing_unit]
      properties:
        billed_units: { type: [integer, 'null'], format: int64, minimum: 0 }
        billing_unit: { type: [string, 'null'] }
    RequestUsage:
      type: object
      additionalProperties: false
      required: [tokens, generation]
      properties:
        tokens:
          oneOf:
            - $ref: '#/components/schemas/RequestTokenUsage'
            - type: 'null'
        generation:
          oneOf:
            - $ref: '#/components/schemas/RequestGenerationUsage'
            - type: 'null'
    RequestBilling:
      type: object
      additionalProperties: false
      required: [billable, cost, currency]
      properties:
        billable:
          type: boolean
          description: False for archive-only projections, which never enter MTC billing aggregates.
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        currency: { type: [string, 'null'] }
    RequestCredentialIdentity:
      type: object
      additionalProperties: false
      required: [tenant_external_id, key_id, key_alias, principal_external_id]
      properties:
        tenant_external_id: { type: string, minLength: 1 }
        key_id: { type: string, format: uuid }
        key_alias: { type: string, minLength: 1 }
        principal_external_id: { type: string, minLength: 1 }
    RequestListCursor:
      type: object
      additionalProperties: false
      required: [before_created_at, before_id]
      properties:
        before_created_at:
          type: integer
          format: int64
          description: Creation timestamp of the last visible row.
        before_id:
          type: string
          format: uuid
          description: Stable request or generation ID of the last visible row.
    RequestListResponse:
      type: object
      additionalProperties: false
      required: [requests, next_cursor]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/RequestSummary' }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/RequestListCursor'
            - type: 'null'
    TypedFilterValue:
      description: Tagged values prevent a filter field from receiving an implicit string or untyped JSON value.
      oneOf:
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: text }, value: { type: string, minLength: 1, maxLength: 200 } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: model }, value: { type: string, minLength: 1, maxLength: 200 } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: protocol }, value: { type: string, minLength: 1, maxLength: 200, description: Exact historical protocol value. } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: status }, value: { type: string, enum: [success, error, pending] } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: uuid }, value: { type: string, format: uuid } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: integer }, value: { type: integer, format: int64 } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: timestamp }, value: { type: integer, format: int64, minimum: 0 } } }
        - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: money_micros }, value: { type: integer, format: int64 } } }
    TypedFilterCondition:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          enum: [created_at, key_id, model, protocol, status, error_code, upstream_account_id, route_id, duration_ms, cost_micros, key_alias, principal]
        operator:
          type: string
          enum: [equals, not_equals, contains, greater_than, greater_than_or_equal, less_than, less_than_or_equal, between]
        value: { $ref: '#/components/schemas/TypedFilterValue' }
        upper:
          oneOf:
            - $ref: '#/components/schemas/TypedFilterValue'
            - type: 'null'
      description: The server validates each field/value/operator combination; `upper` is accepted only for `between`.
    TypedFilterAst:
      type: object
      additionalProperties: false
      required: [logical_operator, conditions]
      properties:
        logical_operator: { type: string, const: and }
        conditions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/TypedFilterCondition' }
    TypedRequestQuery:
      type: object
      additionalProperties: false
      required: [ast]
      properties:
        tenant_external_id: { type: [string, 'null'], maxLength: 200 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100 }
        paged: { type: boolean, default: true }
        before_created_at: { type: [integer, 'null'], format: int64 }
        before_id: { type: [string, 'null'], format: uuid }
        ast: { $ref: '#/components/schemas/TypedFilterAst' }
    NamedFilterPreset:
      type: object
      additionalProperties: false
      required: [name, ast, updated_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        ast: { $ref: '#/components/schemas/TypedFilterAst' }
        updated_at: { type: integer, format: int64 }
    FilterPresetState:
      type: object
      additionalProperties: false
      required: [named, recent]
      properties:
        named: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/NamedFilterPreset' } }
        recent: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/TypedFilterAst' } }
    PutFilterPresetRequest:
      type: object
      additionalProperties: false
      required: [ast]
      properties:
        tenant_external_id: { type: [string, 'null'], maxLength: 200 }
        name: { type: [string, 'null'], maxLength: 80 }
        ast: { $ref: '#/components/schemas/TypedFilterAst' }
    FilterAssistantSettings:
      type: object
      additionalProperties: false
      required: [model_route_id, updated_at]
      properties:
        model_route_id:
          type: string
          format: uuid
          description: Stable enabled MTC model-route reference; no credential material is returned.
        updated_at: { type: integer, format: int64 }
        billing_key_id: { type: [string, 'null'], format: uuid }
    PutFilterAssistantSettingsRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, model_route_id, billing_key_id, expected_updated_at]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        model_route_id: { type: string, format: uuid }
        billing_key_id: { type: string, format: uuid }
        expected_updated_at: { type: [integer, 'null'], format: int64 }
    FilterAssistantPlanRequest:
      type: object
      additionalProperties: false
      required: [tenant_external_id, prompt]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, minLength: 1, maxLength: 2000 }
    FilterAssistantPlan:
      type: object
      additionalProperties: false
      required: [model_route_id, ast]
      properties:
        model_route_id: { type: string, format: uuid }
        ast: { $ref: '#/components/schemas/TypedFilterAst' }
    RequestSessionContext:
      type: object
      additionalProperties: false
      required: [session_id, association, session_name, task_kind, agent_id, semantics_source]
      properties:
        session_id:
          type: [string, 'null']
          format: uuid
          description: Internal logical-session identifier; null for unlinked records.
        association: { type: string, enum: [confirmed, unlinked] }
        session_name: { type: [string, 'null'], maxLength: 256 }
        task_kind: { type: [string, 'null'], maxLength: 256 }
        agent_id: { type: [string, 'null'], maxLength: 256 }
        semantics_source:
          type: [string, 'null']
          enum: [declared, null]
          description: Source of the optional human/execution semantics; never model- or prompt-guessed.
    RequestDetail:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required: [request_body, response_body, archive_complete, archive]
          properties:
            request_body: true
            response_body: true
            archive_complete: { type: boolean }
            archive: { $ref: '#/components/schemas/RequestArchiveCompleteness' }
            provenance:
              oneOf:
                - $ref: '#/components/schemas/RequestProvenance'
                - type: 'null'
    RequestArchiveSide:
      type: object
      additionalProperties: false
      required: [state, complete, reason]
      properties:
        state: { $ref: '#/components/schemas/RequestArchiveState' }
        complete: { type: boolean }
        reason:
          type: [string, 'null']
          description: Sanitized product reason code; never an object locator or storage error text.
    RequestArchiveCompleteness:
      type: object
      additionalProperties: false
      required: [request, response]
      properties:
        request: { $ref: '#/components/schemas/RequestArchiveSide' }
        response: { $ref: '#/components/schemas/RequestArchiveSide' }
    RequestEvent:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required: [event_id, event_at, event_kind, key_id]
          properties:
            event_id: { type: string, format: uuid }
            event_at: { type: integer, format: int64 }
            event_kind:
              type: string
              enum: [started, finished, projected, archive_bound, archive_gap]
            key_id: { type: string, format: uuid }
    RequestProvenance:
      type: object
      additionalProperties: false
      required: [source, disposition, unlinked, external_request_id, proof_digest]
      properties:
        source: { type: string, minLength: 1 }
        disposition: { type: string, enum: [exact, unlinked] }
        unlinked: { type: boolean }
        external_request_id: { type: string, minLength: 1, maxLength: 512 }
        proof_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
    StatisticsSummary:
      type: object
      required: [total_requests, successful_requests, failed_requests, input_tokens, output_tokens, total_cost, costs]
      properties:
        total_requests: { type: integer, format: int64 }
        successful_requests: { type: integer, format: int64 }
        failed_requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        total_cost:
          description: Single-currency compatibility value; null when the projection spans currencies.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        costs:
          type: array
          description: Stable ascending currency order; unlike currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    StatisticsBucket:
      type: object
      required: [name, requests, input_tokens, output_tokens, cost, costs]
      properties:
        name: { type: string }
        requests: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost:
          description: Single-currency compatibility value; null when the bucket spans currencies.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        costs:
          type: array
          description: Stable ascending currency order; unlike currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    Statistics:
      type: object
      required: [summary, by_model, by_day, errors]
      properties:
        summary: { $ref: '#/components/schemas/StatisticsSummary' }
        by_model:
          type: array
          items: { $ref: '#/components/schemas/StatisticsBucket' }
        by_day:
          type: array
          items: { $ref: '#/components/schemas/StatisticsBucket' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/StatisticsBucket' }
    UpstreamAccountAvailabilityWindow:
      type: object
      additionalProperties: false
      required: [contract_version, generated_at, tenant_external_id, from_created_at, to_created_at, granularity, latency_is_approximate, latency_method, accounts]
      properties:
        contract_version: { type: string, const: upstream_account_availability_v1 }
        generated_at: { type: integer, format: int64, minimum: 0 }
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity: { type: string, enum: [hour, day] }
        latency_is_approximate: { type: boolean, const: true }
        latency_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        accounts:
          type: array
          description: All current accounts for the tenant, ordered by stable account ID; no top-N truncation or pagination.
          items: { $ref: '#/components/schemas/UpstreamAccountAvailability' }
    UpstreamAccountAvailability:
      type: object
      additionalProperties: false
      required: [upstream_account_id, metrics, terminal_outcomes]
      properties:
        upstream_account_id: { type: string, minLength: 1 }
        metrics: { $ref: '#/components/schemas/MonitoringMetrics' }
        terminal_outcomes:
          type: array
          maxItems: 5
          description: Newest terminal request/generation facts across all models for this account in the inclusive window; excludes in-flight traffic.
          items: { $ref: '#/components/schemas/MonitoringTerminalOutcome' }
    MonitoringMetrics:
      type: object
      additionalProperties: false
      description: Current servers emit total_tokens and cache_rate; those additive fields remain optional in the v1 schema so older generated clients retain compatibility.
      required: [requests, successful_requests, failed_requests, avg_duration_ms, p95_duration_ms, p95_is_capped, costs]
      properties:
        requests: { type: integer, format: int64, minimum: 0 }
        successful_requests: { type: integer, format: int64, minimum: 0 }
        failed_requests: { type: integer, format: int64, minimum: 0 }
        total_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Uncached input, cached reads, cache writes, and output tokens, each counted once.
        cache_rate:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: Cached-read tokens divided by uncached input plus cached reads plus cache writes; null when that denominator is zero.
        avg_duration_ms: { type: [number, 'null'], format: double, minimum: 0 }
        p95_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 60000
          description: Fixed-histogram upper-bound approximation, capped at 60000 ms.
        p95_is_capped:
          type: boolean
          description: True when P95 falls in the open-ended over-60000ms bucket. The numeric capped value is not an exact P95; false with null means no estimate.
        costs:
          type: array
          description: Stable ascending currency order; values from unlike currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    MonitoringFreshness:
      type: object
      additionalProperties: false
      required: [latest_terminal_created_at, age_millis]
      properties:
        latest_terminal_created_at:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Original creation time of the newest terminal request/generation fact in the selected window.
        age_millis:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Snapshot generation time minus latest_terminal_created_at; null with no terminal traffic.
    MonitoringHealth:
      type: object
      additionalProperties: false
      required: [version, status, observed_at]
      properties:
        version:
          type: string
          const: upstream_breaker_v1
          description: Versioned interpretation of durable upstream breaker state.
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
          description: Zero terminal traffic is unknown, not healthy.
        observed_at:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Latest durable breaker observation used by this health interpretation, when present.
    MonitoringTerminalOutcome:
      type: object
      additionalProperties: false
      required: [id, source, created_at, status, duration_ms, error_code]
      properties:
        id: { type: string, minLength: 1 }
        source: { type: string, enum: [request, generation] }
        created_at:
          type: integer
          format: int64
          minimum: 0
          description: Original request/job creation time retained by the terminal fact.
        status: { type: string, enum: [success, failure] }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        error_code: { type: [string, 'null'], maxLength: 200 }
    MonitoringUpstreamModel:
      type: object
      additionalProperties: false
      required: [upstream_account_id, upstream_name, model, metrics, health, terminal_outcomes]
      properties:
        upstream_account_id:
          type: string
          minLength: 1
          description: Stable upstream account identity across credential rotation.
        upstream_name: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        metrics: { $ref: '#/components/schemas/MonitoringMetrics' }
        health: { $ref: '#/components/schemas/MonitoringHealth' }
        terminal_outcomes:
          type: array
          maxItems: 5
          description: Newest terminal facts only; started/in-flight traffic is excluded.
          items: { $ref: '#/components/schemas/MonitoringTerminalOutcome' }
    OperatorMonitoringSnapshot:
      type: object
      additionalProperties: false
      required: [contract_version, generated_at, scope, from_created_at, to_created_at, granularity, latency_is_approximate, latency_method, summary, freshness, health, top_upstream_models]
      properties:
        contract_version: { type: string, const: v1 }
        generated_at: { type: integer, format: int64, minimum: 0 }
        scope: { type: string, enum: [tenant, global] }
        tenant_external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Present exactly for `scope=tenant`.
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity:
          type: string
          enum: [hour, day]
          description: Hour through 31 days; day over 31 days up to the 93-day maximum.
        latency_is_approximate: { type: boolean, const: true }
        latency_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        summary: { $ref: '#/components/schemas/MonitoringMetrics' }
        freshness: { $ref: '#/components/schemas/MonitoringFreshness' }
        health: { $ref: '#/components/schemas/MonitoringHealth' }
        top_upstream_models:
          type: array
          maxItems: 10
          description: Top stable upstream-account/model pairs by terminal requests. Unassigned traffic remains in summary only.
          items: { $ref: '#/components/schemas/MonitoringUpstreamModel' }
    UsageAnalysisCost:
      type: object
      description: Aggregated locally recorded settlement amounts, which can include conservative contract-ceiling charges; not a measurement of supplier cost or an invoice. Historical usage provenance is unknown.
      additionalProperties: false
      required: [currency, cost]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        cost: { $ref: '#/components/schemas/NonNegativeMoney' }
    UsageAnalysisGenerationUnitsByModality:
      type: object
      additionalProperties: false
      required: [modality, currency, units]
      properties:
        modality:
          type: string
          enum: [image, video, unknown]
        currency: { $ref: '#/components/schemas/Currency' }
        units: { type: integer, format: int64, minimum: 0 }
    UsageAnalysisGenerationUnitsByBillingUnit:
      type: object
      additionalProperties: false
      required: [billing_unit, currency, units]
      properties:
        billing_unit:
          type: string
          minLength: 1
          description: Immutable generation price billing-unit snapshot, or unknown.
        currency: { $ref: '#/components/schemas/Currency' }
        units: { type: integer, format: int64, minimum: 0 }
    UsageAnalysisMetrics:
      type: object
      required: [requests, success, failed, input_tokens, output_tokens, cached_input_tokens, cache_write_tokens, generation_units, avg_duration_ms, p95_duration_ms, p95_is_capped, costs]
      properties:
        output_rate:
          type: object
          description: Retained successful provider-reported text requests, excluding known compaction. Total request time, not decoding time. Missing on older servers; zero samples means unavailable.
          required: [requests, output_tokens, duration_ms]
          properties:
            requests: { type: integer, format: int64, minimum: 0 }
            output_tokens: { type: integer, format: int64, minimum: 0 }
            duration_ms: { type: integer, format: int64, minimum: 0 }
        requests: { type: integer, format: int64, minimum: 0 }
        success: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        input_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Uncached input tokens; cached reads and writes are separate fields.
        output_tokens: { type: integer, format: int64, minimum: 0 }
        cached_input_tokens: { type: integer, format: int64, minimum: 0 }
        cache_write_tokens: { type: integer, format: int64, minimum: 0 }
        generation_units: { type: integer, format: int64, minimum: 0 }
        avg_duration_ms: { type: [number, 'null'], format: double, minimum: 0 }
        p95_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 60000
          description: Fixed-histogram approximation; values above 60000 ms are capped.
        p95_is_capped:
          type: boolean
          description: True when P95 falls in the open-ended over-60000ms bucket. Do not plot the capped numeric value as an exact latency.
        costs:
          type: array
          description: Stable ascending currency order; amounts from different currencies are never added.
          items: { $ref: '#/components/schemas/UsageAnalysisCost' }
    UsageAnalysisDimensionBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [id, label]
          properties:
            id: { type: string, minLength: 1 }
            label: { type: string, minLength: 1 }
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysisSessionBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [id, label, key_id, key_alias, unlinked]
          properties:
            id: { type: string, minLength: 1 }
            label: { type: string, minLength: 1 }
            key_id: { type: string, format: uuid }
            key_alias: { type: string }
            unlinked: { type: boolean }
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysisTimeBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [bucket_start]
          properties:
            bucket_start:
              type: integer
              format: int64
              minimum: 0
              description: Inclusive UTC bucket start as Unix epoch milliseconds.
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysisHeatmapBucket:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [hour_of_week]
          properties:
            hour_of_week:
              type: integer
              minimum: 0
              maximum: 167
              description: Monday 00:00 UTC is 0; Sunday 23:00 UTC is 167.
        - $ref: '#/components/schemas/UsageAnalysisMetrics'
    UsageAnalysis:
      type: object
      additionalProperties: false
      required: [from_created_at, to_created_at, granularity, time_zone, p95_is_approximate, p95_method, upstream_grouping, summary, generation_units_by_modality, generation_units_by_billing_unit, time_series, by_model, by_key, by_session, by_upstream, by_protocol, by_status, errors, heatmap]
      properties:
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity: { type: string, enum: [hour, day] }
        time_zone: { type: string, const: UTC }
        p95_is_approximate: { type: boolean, const: true }
        p95_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        upstream_grouping:
          type: string
          const: stable_account
          description: >-
            Usage is grouped by the stable upstream account across API credential
            and OAuth rotations. Historical requests are never relabelled as the
            account's current credential generation.
        summary: { $ref: '#/components/schemas/UsageAnalysisMetrics' }
        generation_units_by_modality:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByModality' }
        generation_units_by_billing_unit:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByBillingUnit' }
        time_series:
          type: array
          items: { $ref: '#/components/schemas/UsageAnalysisTimeBucket' }
        by_model:
          type: array
          maxItems: 100
          description: >-
            `id` is the exact model value accepted by the `model` query filter;
            `label` is the same user-visible model name.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_key:
          type: array
          maxItems: 100
          description: >-
            `id` is the stable client-credential UUID accepted by `key_id`;
            `label` is its current alias and is never used as filter identity.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_session:
          type: array
          maxItems: 100
          description: >-
            Proven logical conversation cluster IDs, plus explicit
            unlinked:<stable-key-id> buckets when no reliable cluster exists.
            Unlinked requests are never guessed into another conversation.
            Session p95 is null because the compact session rollup preserves
            exact average latency but not a latency histogram.
          items: { $ref: '#/components/schemas/UsageAnalysisSessionBucket' }
        by_upstream:
          type: array
          maxItems: 100
          description: >-
            `id` is a stable upstream UUID or the `unassigned` sentinel, both
            accepted by this operation's `upstream_account_id` filter. The UUID
            is the stable account identity across credential rotations; a
            credential generation is intentionally not inferred for historical
            requests. Clients localize the sentinel label.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_protocol:
          type: array
          maxItems: 100
          description: >-
            `id` is one canonical protocol family accepted by `protocol`:
            `openai`, `anthropic`, `openai-image`, `audio-transcription`, or `generation`.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_status:
          type: array
          maxItems: 100
          description: >-
            `id` is the public logical filter value `success` or `error`; the
            internal rollup value `failure` is never exposed.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        errors:
          type: array
          maxItems: 100
          description: >-
            `id` is an exact non-empty value accepted by `error_code`. Empty
            success sentinels are omitted. Ordering is request count descending,
            then error id ascending.
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        heatmap:
          type: array
          maxItems: 168
          description: >-
            `hour_of_week` is a UTC display coordinate, not a query-filter
            sentinel. Missing coordinates mean zero activity and are filled by
            the client.
          items: { $ref: '#/components/schemas/UsageAnalysisHeatmapBucket' }
    UsageAnalysisTrends:
      type: object
      additionalProperties: false
      required: [from_created_at, to_created_at, granularity, time_zone, p95_is_approximate, p95_method, summary, time_series]
      properties:
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity: { type: string, enum: [hour, day] }
        time_zone: { type: string, const: UTC }
        p95_is_approximate: { type: boolean, const: true }
        p95_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        summary: { $ref: '#/components/schemas/UsageAnalysisMetrics' }
        time_series:
          type: array
          items: { $ref: '#/components/schemas/UsageAnalysisTimeBucket' }
    SelfUsageAnalysis:
      type: object
      additionalProperties: false
      required: [from_created_at, to_created_at, granularity, time_zone, p95_is_approximate, p95_method, summary, generation_units_by_modality, generation_units_by_billing_unit, time_series, by_model, by_protocol, by_status, errors, heatmap]
      properties:
        from_created_at: { type: integer, format: int64, minimum: 0 }
        to_created_at: { type: integer, format: int64, minimum: 0 }
        granularity: { type: string, enum: [hour, day] }
        time_zone: { type: string, const: UTC }
        p95_is_approximate: { type: boolean, const: true }
        p95_method: { type: string, const: fixed_histogram_upper_bound_capped_60000ms }
        summary: { $ref: '#/components/schemas/UsageAnalysisMetrics' }
        generation_units_by_modality:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByModality' }
        generation_units_by_billing_unit:
          type: array
          description: Units remain separated by currency and are never added across currencies.
          items: { $ref: '#/components/schemas/UsageAnalysisGenerationUnitsByBillingUnit' }
        time_series:
          type: array
          items: { $ref: '#/components/schemas/UsageAnalysisTimeBucket' }
        by_model:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_protocol:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        by_status:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        errors:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsageAnalysisDimensionBucket' }
        heatmap:
          type: array
          maxItems: 168
          description: Missing UTC hour-of-week coordinates mean zero activity.
          items: { $ref: '#/components/schemas/UsageAnalysisHeatmapBucket' }
    ResolveImageGenerationQuarantine:
      type: object
      additionalProperties: false
      required: [tenant_external_id, expected_revision, action, confirmed_cost_micros, currency, evidence_digest]
      properties:
        tenant_external_id: { type: string, minLength: 1, maxLength: 200 }
        expected_revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        action: { type: string, enum: [not_delivered, settle_confirmed] }
        confirmed_cost_micros: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        evidence_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
      allOf:
        - if:
            properties:
              action: { const: not_delivered }
          then:
            properties:
              confirmed_cost_micros: { const: 0 }

    ImageGenerationQuarantine:
      type: object
      additionalProperties: false
      required: [request_id, tenant_external_id, model, currency, reserved_micros, submission_started_at, submission_uncertain_at, revision, status, resolution]
      properties:
        request_id: { type: string, format: uuid }
        tenant_external_id: { type: string }
        model: { type: string }
        currency: { type: string }
        reserved_micros: { type: integer, format: int64 }
        submission_started_at: { type: integer, format: int64 }
        submission_uncertain_at: { type: integer, format: int64 }
        revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { type: string, enum: [awaiting_confirmation, resolved] }
        resolution:
          description: Null while awaiting confirmation; the immutable receipt after resolution. List results contain only awaiting_confirmation entries.
          oneOf:
            - $ref: '#/components/schemas/ImageGenerationQuarantineResolution'
            - type: 'null'

    ImageGenerationQuarantineResolution:
      type: object
