      properties:
        source: { $ref: '#/components/schemas/NativeOAuthImportSource' }
        source_type: { const: kimi }
        source_identity_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_document_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        expected_current_account_id: { type: [string, 'null'], format: uuid }
        expected_current_document_sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        expected_current_credential_generation: { type: [integer, 'null'], format: int64, minimum: 1 }
        document: { $ref: '#/components/schemas/NativeKimiOAuthDocument' }
      allOf:
        - oneOf:
            - properties:
                expected_current_account_id: { type: 'null' }
                expected_current_document_sha256: { type: 'null' }
                expected_current_credential_generation: { type: 'null' }
            - properties:
                expected_current_account_id: { type: string, format: uuid }
                expected_current_document_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                expected_current_credential_generation: { type: integer, format: int64, minimum: 1 }
    NativeKimiOAuthCohortApproval:
