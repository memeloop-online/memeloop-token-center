        protocol: { type: string, enum: [openai, anthropic, openai-audio, generation] }
        priority: { type: integer, format: int64, minimum: -1000000, maximum: 1000000 }
        enabled: { type: boolean }
        included_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        excluded_provider_group_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        route_group_ids:
