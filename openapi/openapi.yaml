        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/tenant-management/{external_id}/restore:
    post:
      tags: [System]
      operationId: restoreTenant
      summary: Restore an archived non-default tenant
      security: [{ serviceBearer: [] }]
      x-required-scope: tenants:write
      parameters: [{ $ref: '#/components/parameters/TenantExternalId' }]
      responses:
        '200': { description: Restored tenant., content: { application/json: { schema: { $ref: '#/components/schemas/TenantManagement' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/diagnostics/runtime:
    get:
      tags: [System]
      operationId: getRuntimeDiagnostics
      summary: Read bounded process, allocator, and profiling status
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      responses:
        '200':
          description: A no-store snapshot of low-cardinality runtime diagnostics.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/diagnostics/cpu-profile:
    post:
      tags: [System]
      operationId: captureCpuProfile
      summary: Capture a bounded Google pprof CPU profile when runtime profiling is enabled
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      parameters:
        - name: seconds
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: Google pprof protobuf suitable for pprof-compatible analysis tools.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/vnd.google.protobuf:
              schema: { type: string, format: binary, maxLength: 33554432 }
        '400': { description: Profiling duration is outside the configured bound. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/diagnostics/heap-profile:
    post:
      tags: [System]
      operationId: captureHeapProfile
      summary: Capture a bounded jemalloc heap profile when runtime profiling is enabled
      security: [{ serviceBearer: [] }]
      x-required-scope: metrics:read
      parameters:
        - name: seconds
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: A jemalloc heap profile for offline analysis.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/octet-stream:
              schema: { type: string, format: binary, maxLength: 67108864 }
        '400': { description: Profiling duration is outside the configured bound. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/plugins/group-routing-strategies:
    get:
      tags: [Groups]
      operationId: listGroupRoutingStrategies
      summary: List installed group-routing-v1 strategy plugins and their configuration schemas
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:read
      responses:
        '200':
          description: Installed strategy catalog from the pinned plugin revision.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupRoutingStrategyCatalogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/plugins:
    get:
      tags: [System]
      operationId: listPlugins
      summary: List loaded plugin manifests
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      responses:
        '200':
          description: Sanitized loaded manifests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PluginManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/plugins/runtime-access:
    get:
      tags: [System]
      operationId: getPluginRuntimeAccess
      summary: Read the current plugin reader's runtime-management capability
      description: Available without experimental features or inventory configuration. Tenant-bound plugin readers receive false for both capabilities. Global plugin readers can view runtime data when compiled in; management additionally requires plugins:write. Does not read global runtime data. The Operator mounts runtime reads only with view capability and enables mutations only with manage capability; endpoints still independently enforce authorization.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      responses:
        '200':
          description: Current principal capability only; no tenant or inventory information.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [can_view_runtime, can_manage_runtime]
                properties:
                  can_manage_runtime: { type: boolean }
                  can_view_runtime: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/plugin-runtime:
    get:
      tags: [System]
      operationId: getApplicationPluginRuntime
      summary: Read the current installed-plugin revision and host-approved candidates
      description: Service images include experimental-plugin-revisions. Requires a global plugins:read credential. Without host inventory configuration this read returns an empty status and history reports runtime_enabled false; mutations remain disabled. An unpublished head is null. No filesystem roots, digests or provenance are exposed.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      x-global-operator-only: true
      responses:
        '200':
          description: Current revision and configured version IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPluginStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/plugin-runtime/history:
    get:
      tags: [System]
      operationId: getPluginRuntimeHistory
      summary: Read plugin installation tasks, version history and actor audit
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      x-global-operator-only: true
      parameters:
        - { name: before_revision, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: before_audit_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: At most 100 records per list; installation summaries omit full manifests. No host paths, trust keys, registry credentials or raw process output.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRuntimeHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/plugin-runtime/installations:
    post:
      tags: [System]
      operationId: installPluginInventory
      summary: Install new signed OCI packages into an inactive inventory for review
      description: Requires host installation policy. The host owns storage roots, allowed repositories, Cosign trust keys and registry credential files. Only digest-pinned references and a fresh inventory ID are accepted. A durable task survives HTTP disconnect; exact retries reuse the task. Successful download does not register grants or publish a revision.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      x-global-operator-only: true
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inventory_id, packages]
              properties:
                inventory_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                packages:
                  type: array
                  minItems: 1
                  maxItems: 16
                  uniqueItems: true
                  items: { type: string, maxLength: 2048, pattern: '^[^@]+@sha256:[0-9A-Fa-f]{64}$' }
      responses:
        '202':
          description: Durable installation task or exact replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstallation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/plugin-runtime/installations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [System]
      operationId: getPluginInstallationReview
      summary: Inspect one installation and its bounded signed-manifest review
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      x-global-operator-only: true
      responses:
        '200':
          description: Installation detail; review includes every manifest and capability, capped at 4 MiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/plugin-runtime/installations/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [System]
      operationId: approvePluginInstallation
      summary: Approve the exact reviewed package contracts and register an inactive candidate
      description: Revalidates installed bytes, current signing-trust fingerprint and stored configuration. Grants are derived only after explicit global approval of the exact review digest. Approval is idempotent and audited; activation still requires publish CAS.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      x-global-operator-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [review_digest]
              properties:
                review_digest: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '204': { description: 'Approved inventory registered and validated, or exact replay.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/plugin-runtime/installations/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [System]
      operationId: retryPluginInstallation
      summary: Retry a failed or interrupted installation under current host trust
      description: Reuses the exact package references and owned root. Re-verifies signatures and existing package bytes. Lease attempts fence stale completion, and the retrying actor is audited.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      x-global-operator-only: true
      responses:
        '202':
          description: Installation retry or current durable state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/plugin-runtime/candidates:
    get:
      tags: [System]
      operationId: listApplicationPluginCandidates
      summary: Read current revision and candidate versions (runtime status alias)
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      x-global-operator-only: true
      responses:
        '200':
          description: Current revision and configured version IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPluginStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [System]
      operationId: stageApplicationPluginInventory
      summary: Validate a preinstalled application plugin inventory (experimental)
      description: Requires host-only MTC_PLUGIN_INVENTORY_FILE configuration; service images include experimental-plugin-revisions. Global operators only; this staging endpoint accepts an inventory ID, never a URL, path, Wasm, grant, or tenant override. New contracts are permitted when the immutable inventory has explicit approved grants.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      x-global-operator-only: true
      x-experimental-feature: experimental-plugin-revisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inventory_id]
              properties:
                inventory_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        '204': { description: Verified immutable inventory identity staged. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/plugin-runtime/publish:
    post:
      tags: [System]
      operationId: publishApplicationPluginInventory
      summary: Publish a global application snapshot using revision CAS (experimental)
      description: Requires host-only MTC_PLUGIN_INVENTORY_FILE configuration; service images include experimental-plugin-revisions. Validates a preinstalled inventory and atomically publishes expected_revision plus one. Zero bootstraps an absent head. Exact idempotency replay returns its original receipt, not the latest head. Global operators only; unknown fields and remote installation inputs are rejected.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      x-global-operator-only: true
      x-experimental-feature: experimental-plugin-revisions
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inventory_id, expected_revision]
              properties:
                inventory_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                expected_revision: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Original publication receipt, including exact replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPluginRevision' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/plugin-runtime/rollback:
    post:
      tags: [System]
      operationId: rollbackApplicationPluginInventory
      summary: Publish an earlier inventory as a new monotonic revision (experimental)
      description: Requires host-only MTC_PLUGIN_INVENTORY_FILE configuration; service images include experimental-plugin-revisions. Global operators only. Target must be earlier than expected_revision and locally available with the original approved identity. Rollback publishes expected_revision plus one and never rewinds head.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      x-global-operator-only: true
      x-experimental-feature: experimental-plugin-revisions
      parameters: [{ $ref: '#/components/parameters/RequiredIdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_revision, expected_revision]
              properties:
                target_revision: { type: integer, format: int64, minimum: 1 }
                expected_revision: { type: integer, format: int64, minimum: 2 }
      responses:
        '200':
          description: Original rollback receipt with a strictly new revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPluginRevision' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/v1/plugins/{plugin_id}/configuration:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
    get:
      tags: [System]
      operationId: getPluginConfiguration
      summary: Read the effective plugin configuration and selected-scope version
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      parameters:
        - name: tenant_external_id
          in: query
          required: false
          description: Omit for the global layer. A tenant-scoped service credential is always bound to its own tenant.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Tenant override, inherited global value, or manifest default. `scope_version` is always the selected write scope and is zero when that scope has no row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginConfiguration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [System]
      operationId: putPluginConfiguration
      summary: Validate and atomically replace one global or tenant plugin configuration
      description: The value is validated against the currently loaded plugin schema. Optimistic `expected_version` and the scoped Idempotency-Key prevent lost or duplicate updates.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:write
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutPluginConfigurationRequest' }
      responses:
        '200':
          description: Persisted configuration for the selected scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginConfiguration' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/plugins/{plugin_id}/data/{endpoint_id}:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
      - name: endpoint_id
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
    get:
      tags: [System]
      operationId: getPluginServiceData
      summary: Read one manifest-declared typed plugin data snapshot
      description: |
        The caller must hold `plugins:read` and the endpoint's manifest-declared
        `required_scope`; a tenant-scoped service credential remains bound to its own
        tenant. A worker periodically refreshes the endpoint through either the bounded
        GET-only HTTPS collector or its signed component collector/normalizer. Operator
        requests only read the durable last-good snapshot, so collection latency and
        source outages cannot block inference or the UI request path. The response includes
        freshness, retry timing and a host-owned failure code. Remote HTML, scripts,
        credentials and arbitrary plugin error text are never returned.
      security: [{ serviceBearer: [] }]
      x-required-scope: plugins:read
      x-manifest-required-scope: true
      x-collection-contract:
        execution-role: worker
        adapters: [https-json, component-v1]
        allowed-origins: manifest-http-capability
        browser-credentials-forwarded: false
        response: durable-schema-validated-last-good
      parameters:
        - name: tenant_external_id
          in: query
          required: false
          description: Omit for the aggregate/global view. A tenant-scoped service credential cannot select another tenant.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Fresh, cached, stale, or fallback typed data. `partial` distinguishes degradation without changing the JSON shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginServiceDataResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/schemas:
    get:
      tags: [System]
      operationId: getConfigurationSchemas
      summary: Return JSON Schemas used by the operator UI
      description: These schemas are UI/discovery documents. Provider-specific schemas are also returned by `/internal/v1/provider-types`.
      security: [{ serviceBearer: [] }]
      x-required-scope: schemas:read
      responses:
        '200':
          description: Named JSON Schema documents.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: [object, boolean] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstreams:
    get:
      tags: [Upstream providers]
      operationId: listUpstreamProviders
      summary: List unified upstream provider accounts
      description: API credentials, native OAuth, plugin-provided authorization, and no-auth connections are authentication methods of the same upstream account resource.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      parameters:
        - $ref: '#/components/parameters/TenantFilter'
        - $ref: '#/components/parameters/ControlListLimit100'
        - $ref: '#/components/parameters/BeforeCreatedAt'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Upstream account metadata without secrets.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/UpstreamProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Upstream providers]
      operationId: createUpstreamProvider
      summary: Create an upstream provider account with a direct credential
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUpstreamProviderRequest' }
      responses:
        '201':
          description: Stable upstream provider identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstream-availability:
    get:
      tags: [Upstream providers]
      operationId: getUpstreamAccountAvailability
      summary: Read tenant-scoped terminal traffic for every current upstream account
      description: |
        Requires both `providers:read` and `requests:read`. An explicit tenant is
        mandatory even for global service credentials; tenant-scoped credentials
        may only select their own tenant. Unknown query parameters are rejected.
        Both bounds are required inclusive Unix epoch milliseconds, must be
        non-negative, and must satisfy from_created_at <= to_created_at with a
        difference no greater than 93 days. Differences through 31 days use hour
        granularity; longer windows use day granularity. Complete buckets use
        terminal rollups and partial edges use request/generation terminal facts.
        Every current account is included, without top-model truncation, including
        disabled accounts and accounts with no terminal traffic. Empty accounts
        have zero counts, null latency metrics, and empty costs/outcomes; this
        response does not assign a health status. Each account includes at most
        five newest terminal facts across all models, with explicit source.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      x-required-scopes: [providers:read, requests:read]
      parameters:
        - name: tenant_external_id
          in: query
          required: true
          description: Trimmed non-empty tenant selector, limited to 200 UTF-8 bytes.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: from_created_at
          in: query
          required: true
          description: Inclusive Unix epoch milliseconds start.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_created_at
          in: query
          required: true
          description: Inclusive Unix epoch milliseconds end; at most 93 days after the start.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Account-complete terminal metrics for the selected tenant and exact window.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamAccountAvailabilityWindow' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstreams/{account_id}/deletion-readiness:
    get:
      tags: [Upstream providers]
      operationId: getUpstreamProviderDeletionReadiness
      summary: Read the blockers before deleting an upstream provider
      description: |
        Returns the exact lifecycle, explicit-model-route, immutable-history, and
        import-provenance state for deletion. Explicit route counts include every
        direct and multi-candidate reference, including disabled routes retained
        for audit. Request and generation history is retained with a sanitized
        upstream identity snapshot and does not block physical account deletion.
        This is a read-only preview; DELETE repeats the blocking checks
        transactionally.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredTenant'
      responses:
        '200':
          description: Current deletion constraints for the stable upstream identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamDeletionReadiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}:
    put:
      tags: [Upstream providers]
      operationId: replaceUpstreamProviderConfiguration
      summary: Replace the editable configuration of one unified upstream
      description: |
        Keeps the stable upstream identity, provider driver, authentication method,
        routes, and history. `expected_updated_at` provides optimistic concurrency.
        Repeating an already-applied identical representation is safe; a stale,
        non-identical representation returns 409. Provider JSON Schema and outbound
        destination policy are revalidated before the write.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceUpstreamProviderRequest' }
      responses:
        '200':
          description: Updated upstream account metadata without secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [Upstream providers]
      operationId: setUpstreamProviderStatus
      summary: Activate or disable one unified upstream
      description: |
        Disabling immediately removes the account from route resolution without
        deleting routes or audit history. Activation revalidates the current
        credential. Repeating the current status is safe; a stale non-identical
        transition returns 409.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetUpstreamProviderStatusRequest' }
      responses:
        '200':
          description: Upstream account in the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Upstream providers]
      operationId: deleteUpstreamProvider
      summary: Delete a disabled, unreferenced unified upstream
      description: |
        The account must be disabled and have no direct or multi-candidate
        model-route references or retained import provenance. DELETE writes a
        sanitized historical identity snapshot and preserves request and generation
        facts while physically removing the account and its credentials. A missing
        account, including a repeated successful delete, returns 204.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredTenant'
        - $ref: '#/components/parameters/ExpectedUpdatedAt'
      responses:
        '204': { description: Upstream deleted or already absent. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/upstreams/quota/batch:
    post:
      tags: [Upstream providers]
      operationId: batchReadUpstreamQuota
      summary: Refresh one bounded page of upstream quota snapshots
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      x-quota-batch-contract:
        max-accounts: 100
        account-credential-load-statements: 1
        handler-concurrency: 3
        total-deadline-millis: 270000
        cache: shared
        singleflight: shared-per-account
        global-permits: shared
        partial-results: true
        supplier-reset: forbidden
        tenant-source: authenticated-service-scope-and-account-ownership
      description: |
        Loads the requested account identities and current encrypted credentials in
        one database statement, constrained by the authenticated service tenant when
        present. The body cannot select a tenant. At most three account reads run at
        once and they reuse the same per-account cache, singleflight and process-wide
        quota permits as the single-account endpoint. A shared 270-second handler
        deadline cancels unfinished reads and returns a sanitized per-account timeout
        while retaining completed results. This endpoint is read-only: it never
        refreshes OAuth credentials or consumes a reset credit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamQuotaBatchRequest' }
      responses:
        '200':
          description: Ordered per-account quota results; one item may fail without failing its peers.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamQuotaBatchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstreams/{account_id}/quota:
    get:
      tags: [Upstream providers]
      operationId: getUpstreamQuota
      summary: Read a sanitized native supplier quota snapshot
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      description: |
        Requires an explicit authorized tenant. Performs only bounded native
        Codex/Kimi usage GETs and the Codex reset-credit GET with server-held
        encrypted credentials.
        Never consumes a reset credit or exposes supplier bodies or secrets.
        Snapshots are cached for 30 seconds with bounded singleflight/concurrency;
        stale observations may be retained for five minutes after a read error.
        Operator refresh actions set `fresh=true` to bypass a still-current cache
        entry (while retaining request coalescing) and identify the initiating
        action with `trigger=manual|bulk` for structured diagnostics.
        Unsupported means no quota adapter, not zero quota or unlimited usage.
        A fresh observation may clear a quota-exhausted routing row only when the
        main code limit reports allowed=true and does not report limit_reached=true.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: tenant_external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: fresh
          in: query
          required: false
          description: Bypass a current cached snapshot; a newer concurrent supplier read may still satisfy this request.
          schema: { type: boolean, default: false }
        - name: trigger
          in: query
          required: false
          description: Operator action used for structured quota-read diagnostics. Defaults to manual for compatibility.
          schema: { type: string, enum: [manual, bulk], default: manual }
      responses:
        '200':
          description: Sanitized quota; provider-supported reset is distinct from implemented reset.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, upstream_account_id, tenant_external_id, provider, status, observed_at, stale_after, stale, freshness, plan_type, workspace, capabilities, subscription_active_until, reset_credits, windows, credits, reset_capability, error_code]
                properties:
                  contract_version: { const: upstream_quota_v1 }
                  cache_hit: { type: boolean, description: Optional additive v1 diagnostic. True for cached or singleflight results and stale evidence returned before a supplier attempt. Ordinary cache hits preserve the original attempt history; early admission failures have no current supplier attempts. }
                  attempts:
                    type: array
                    maxItems: 8
                    description: Sanitized per-endpoint supplier attempts; no URLs, proxy credentials, tokens or supplier error bodies. Shared by manual and batch reads. Empty when no supplier attempt was made.
                    items:
                      type: object
                      additionalProperties: false
                      required: [endpoint_kind, attempt, limit, failure_stage, outcome, error_code, elapsed_ms, retry_delay_ms, trigger, cache_hit]
                      properties:
                        endpoint_kind: { type: string }
                        attempt: { type: integer, minimum: 1, maximum: 4 }
                        limit: { type: integer, minimum: 1, maximum: 4 }
                        failure_stage: { type: string }
                        outcome: { type: string, enum: [success, retry, error] }
                        error_code: { type: [string, 'null'] }
                        elapsed_ms: { type: integer, minimum: 0 }
                        retry_delay_ms: { type: [integer, 'null'], minimum: 0 }
                        trigger: { type: string, enum: [manual, bulk, background_recovery, reset_workflow] }
                        cache_hit: { const: false }
                  upstream_account_id: { type: string, format: uuid }
                  tenant_external_id: { type: string }
                  provider: { type: string }
                  status: { type: string, enum: [ready, error, unsupported] }
                  observed_at: { type: [integer, 'null'], format: int64, description: Unix epoch milliseconds of supplier observation. }
                  stale_after: { type: [integer, 'null'], format: int64, description: Unix epoch milliseconds freshness deadline. }
                  stale: { type: boolean }
                  freshness: { type: string, enum: [unobserved, fresh, stale] }
                  plan_type: { type: [string, 'null'] }
                  workspace: { type: [string, 'null'], description: Verified supplier workspace label; null when the native adapter has no source contract. }
                  subscription_active_until: { type: [integer, 'null'], format: int64, description: Verified subscription expiry, never OAuth access-token expiry. }
                  capabilities:
                    type: object
                    required: [read, plan, workspace, window_amounts, window_amount_unit, window_percent, reset_credit_expiry, subscription_expiry, supplier_read_only, refreshes_credentials, consumes_reset_credit]
                    properties:
                      read: { type: boolean }
                      plan: { type: boolean }
                      workspace: { type: boolean }
                      window_amounts: { type: boolean }
                      window_amount_unit: { type: boolean }
                      window_percent: { type: boolean }
                      reset_credit_expiry: { type: boolean }
                      subscription_expiry: { type: boolean }
                      supplier_read_only: { type: boolean, description: The quota inspection itself does not mutate the supplier. }
                      refreshes_credentials: { type: boolean }
                      consumes_reset_credit: { type: boolean }
                  reset_credits:
                    type: array
                    maxItems: 1024
                    items:
                      type: object
                      required: [status, granted_at, expires_at, source]
                      properties:
                        status: { type: [string, 'null'] }
                        granted_at: { type: [integer, 'null'], format: int64 }
                        expires_at: { type: [integer, 'null'], format: int64 }
                        source: { type: string, enum: [codex_reset_credits] }
                  error_code: { type: [string, 'null'], description: Sanitized product error code; never upstream text. }
                  credits:
                    type: object
                    required: [balance, unlimited, has_credits, source]
                    properties:
                      balance: { type: [string, 'null'], description: Supplier decimal balance, not customer key balance. }
                      unlimited: { type: [boolean, 'null'] }
                      has_credits: { type: [boolean, 'null'] }
                      source: { type: [string, 'null'], enum: [codex_usage, null] }
                  reset_capability:
                    type: object
                    required: [provider_supported, implementation_available, prepare_available, confirmation_required, retryable, available_credits, applicable_credits, reason, credit_error_code, evidence]
                    properties:
                      provider_supported: { type: [boolean, 'null'] }
                      implementation_available: { type: boolean }
                      prepare_available: { type: boolean, description: Preparing is read-only and remains retryable after transient refresh failures. }
                      confirmation_required: { type: boolean }
                      retryable: { type: boolean, description: Current capability evidence may be refreshed without changing the integration. }
                      available_credits: { type: [integer, 'null'], format: int64 }
                      applicable_credits: { type: [integer, 'null'], format: int64 }
                      reason: { type: string }
                      credit_error_code: { type: [string, 'null'] }
                      evidence: { type: string, enum: [server_driver_contract, unknown_provider], description: Server-held driver capability; dispatch still requires fresh credit evidence. }
                  windows:
                    type: array
                    maxItems: 68
                    items:
                      type: object
                      required: [id, label, used_percent, used, remaining, limit, unit, reset_at, period_seconds, source, reset_is_estimated, allowed, limit_reached]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        used_percent: { type: [number, 'null'] }
                        used: { type: [number, 'null'] }
                        remaining: { type: [number, 'null'] }
                        limit: { type: [number, 'null'] }
                        unit: { type: [string, 'null'], description: Supplier-declared unit; null when amounts are unitless or the contract is unknown. }
                        reset_at: { type: [integer, 'null'], format: int64, description: Unix epoch milliseconds. }
                        period_seconds: { type: [integer, 'null'], format: int64 }
                        source: { type: string }
                        reset_is_estimated: { type: boolean }
                        allowed: { type: [boolean, 'null'] }
                        limit_reached: { type: [boolean, 'null'] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/quota-reset/prepare:
    post:
      tags: [Upstream providers]
      operationId: prepareUpstreamQuotaReset
      summary: Prepare an explicitly confirmed supplier reset-credit consumption
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        Fresh read-only quota/credit observations are required. Creates a durable
        operation and one-time secret confirmation token, expiring in 120 seconds,
        bound to this account, credential generation, actor and credit observations.
        No credit is consumed by prepare. A still-unresolved operation blocks another.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - name: tenant_external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: One-time confirmation secret and immutable operation baseline. Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [operation, confirmation_token, idempotency_replayed]
                properties:
                  operation: { $ref: '#/components/schemas/UpstreamQuotaResetOperation' }
                  confirmation_token: { type: string, writeOnly: false, description: Memory-only secret returned for the initial preparation and an exact replay of its Idempotency-Key; never logged or durably persisted by clients. }
                  idempotency_replayed: { type: boolean, description: True when the same caller/account prepare key returned the existing operation. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Missing fresh applicable credits or an unresolved operation. }
        '503':
          description: Transient fresh-read or local-capacity failure; retrying the same Idempotency-Key is safe.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }

  /internal/v1/upstreams/{account_id}/quota-reset/current:
    get:
      tags: [Upstream providers]
      operationId: getCurrentUpstreamQuotaReset
      summary: Recover the current unresolved reset operation after a client reload
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        Reads only durable local state and does not require a live supplier
        credential. Returns null when no prepared, submitted, accepted or unknown
        operation still locks the account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: tenant_external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Current unresolved operation or null. Cache-Control no-store.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/UpstreamQuotaResetOperation' }
                  - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/quota-reset/{operation_id}:
    get:
      tags: [Upstream providers]
      operationId: getUpstreamQuotaReset
      summary: Read durable reset dispatch state without requiring a live supplier credential
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: operation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenant_external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Durable state, never a claim of supplier-side idempotency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamQuotaResetOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/quota-reset/{operation_id}/confirm:
    post:
      tags: [Upstream providers]
      operationId: confirmUpstreamQuotaReset
      summary: Spend one reset credit after explicit confirmation and a durable dispatch claim
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        Consumes a real supplier credit. Only the prepare actor may confirm using
        the unexpired one-time token. Fresh credit counts and current credential
        generation must still match. Commits submitted before a single consume
        POST; redirects and HTTP retries are disabled. Uncertain outcomes become
        unknown and must never be retried under the same or a new operation.
        Accepted means HTTP 2xx only, not proven consumption or window recovery.
        Submitted and unknown remain locked. Accepted remains locked until a
        later fresh supplier credit read proves that its exact old credit balance
        no longer applies; this releases the lock without attributing the balance
        change to this operation or claiming quota-window recovery.
        Transient local capacity, DNS, proxy, or client-construction failures
        before the durable claim return 503 and are safe to retry with the same key.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - name: operation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenant_external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation_token, confirmation]
              properties:
                confirmation_token: { type: string, minLength: 32, maxLength: 256 }
                confirmation: { const: consume_one_supplier_reset_credit }
      responses:
        '200':
          description: Durable submitted, accepted, or unknown dispatch result, including an exact idempotent replay; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamQuotaResetOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Stale, expired, mismatched or already dispatched confirmation.' }
        '503':
          description: Transient pre-claim failure; the operation remains prepared and the same Idempotency-Key is safe to retry.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }

  /internal/v1/upstreams/{account_id}/quota-reset/{operation_id}/reconcile:
    post:
      tags: [Upstream providers]
      operationId: reconcileUpstreamQuotaReset
      summary: Record fresh supplier GET observations without repeating consumption
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        Only dispatched operations can be reconciled. Preserves the original
        confirmation baseline and state; never infers that a changed credit
        balance proves this operation succeeded. For accepted operations only,
        a fresh lower available-credit count records settlement and releases the
        old account lock because the prepared balance no longer applies. This may
        also reflect credit expiry and is not proof of reset completion. Unknown
        and submitted operations stay locked. The observation must use the same
        credential generation and transport revision recorded by preparation.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: operation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenant_external_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Original baseline plus separately named reconciled observations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamQuotaResetOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Prepared operation or unavailable fresh supplier evidence. }
        '503':
          description: Transient fresh-read or local-capacity failure; reconciliation remains read-only and retryable.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }

  /internal/v1/upstreams/{account_id}/health:
    post:
      tags: [Upstream providers]
      operationId: probeUpstreamProviderHealth
      summary: Probe one upstream without returning its response body
      description: |
        Performs a bounded provider-specific read using the current credential. The
        upstream response body is never read, logged, or returned. Transport and
        authentication failures are represented by `status: unhealthy` in a 200
        management response; they are not proxy responses.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Sanitized health result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamHealthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/credential:
    put:
      tags: [Upstream providers]
      operationId: rotateUpstreamCredential
      summary: Replace an upstream authentication method while retaining its account identity
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        `Idempotency-Key` is required. Replaying the same key for the same account and
        credential within 24 hours returns the stored generation. Reuse for another
        resource or different credential is rejected. The stable upstream ID, routes,
        and request history do not change.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: { $ref: '#/components/schemas/UpstreamCredential' }
      responses:
        '200':
          description: Updated upstream metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/transport-proxy:
    get:
      tags: [Upstream providers]
      operationId: getUpstreamTransportProxySettings
      summary: Read the selected account's full proxy URL for management editing and copying
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        Requires the same global operator authority as editing private transport
        proxies and verifies the explicitly selected tenant owns the account.
        Returns only credential-backed proxy settings and account CAS revisions,
        including proxy username and password where configured. Never returns
        API keys, OAuth access/refresh tokens, adapter state or configuration.
        Works for supported OAuth and API-key proxy credentials. An unconfigured
        proxy is null. Ordinary account lists remain sanitized. No upstream
        connection, probe, refresh or mutation is performed.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredTenant'
      responses:
        '200':
          description: Explicit management-only proxy settings; private, no-store.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account_id, proxy_url, proxy_network_scope, updated_at, credential_generation, supported]
                properties:
                  account_id: { type: string, format: uuid }
                  proxy_url: { type: [string, 'null'] }
                  proxy_network_scope: { type: [string, 'null'], enum: [private, null] }
                  updated_at: { type: integer, format: int64 }
                  credential_generation: { type: integer, format: int64 }
                  supported: { type: boolean, description: Whether this credential has an OAuth or proxied API-key container supported by the transport editor. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Upstream providers]
      operationId: rotateOpenAiCodexTransportProxy
      summary: Replace only the transport proxy of a supported existing upstream credential
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      description: |
        Requires a global operator authorized for the tenant, an existing OAuth
        or proxied API-key credential, `Idempotency-Key`, and exact account/credential
        compare-and-swap values.
        The operation preserves all non-proxy credential material and account
        configuration, installs a new encrypted credential generation, and records an
        audit row containing only keyed fingerprints and schemes. Codex retains
        its fixed official endpoint and private IP-literal socks5h requirement.
        Generic socks5 endpoints must resolve only to private addresses; socks5h
        requires a private IP literal. Unsupported credential containers reject
        the edit. PUT returns sanitized metadata; only the explicit GET above
        returns the proxy original value.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCodexTransportProxyRequest' }
      responses:
        '200':
          description: Updated sanitized upstream metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamProvider' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/upstreams/{account_id}/models:
    get:
      tags: [Upstream providers]
      operationId: listUpstreamModels
      summary: Search the last complete model catalog for one upstream
      description: A stale or failed refresh retains the last complete snapshot. The response never includes upstream response bodies or credentials. Either `providers:read` or `routes:read` is accepted.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:read
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TenantFilter'
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
      responses:
        '200':
          description: Current account-scoped catalog snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamModelCatalog' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/upstreams/{account_id}/models/sync:
    post:
      tags: [Upstream providers]
      operationId: syncUpstreamModels
      summary: Refresh one upstream model catalog using its stored destination and credential
      description: Concurrent directory refreshes are collapsed by a database lease. The client cannot supply a discovery URL. Successful discovery atomically publishes new and retained models and records removed models as disabled, immediately excluding them from catalog-managed routing without changing manual route settings. The server then synchronizes USD prices for the full discovered catalog, using the same coordinator as background account refreshes. Price-source failures are reported separately in price_sync and never undo directory changes or manual prices. Discovery failure preserves the prior snapshot and disabled state and skips price synchronization.
      security: [{ serviceBearer: [] }]
      x-required-scope: providers:write
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Refreshed, stale, unsupported, or already-syncing catalog state, returning up to 10000 active and 10000 disabled entries without a follow-up GET.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamModelCatalogSyncResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/upstreams/{account_id}/models/sync-routes:
    post:
      tags: [Upstream providers]
      operationId: syncUpstreamModelsAndManagedRoutes
      summary: Refresh a complete catalog and reconcile explicitly managed model routes
      description: Requires both providers:write and routes:write. This opt-in operation is separate from models/sync and background refresh. Only a successful, complete, nonempty discovery can add or disable managed routes. Failed, timed-out, paginated, partial, malformed and empty responses preserve the last catalog and all managed routes. A concurrent refresh returns skipped with sync_in_progress; callers may retry. Managed identity is tenant/account/upstream_model/protocol, not public model; retries cannot duplicate owned routes and existing manual candidates are never adopted. Public model equals upstream model, with priority zero and wildcard catalog protocols mapped only to openai. No credential grants or groups are created or replaced. Operator status changes (including no-op disables), edits, archive and deletion protect the route from subsequent reconciliation; deletion leaves an ownership tombstone. Only catalog_missing disables can be restored automatically. Catalog publication precedes a transactional route reconciliation; changed/stale snapshots skip reconciliation safely and a retry converges. After a successful catalog publication and route reconciliation, the server synchronizes USD prices for the deduplicated model identities in this complete response. It uses only configured public price catalogs and the existing deterministic matcher; the caller cannot supply models, source URLs, currency, or price values. This bounded server-owned side effect is not a delegation of global prices:write. Manual prices and last-known prices whose preferred source is unavailable are preserved; pricing failures never roll back catalog or route changes.
      security: [{ serviceBearer: [] }]
      x-required-scopes: [providers:write, routes:write]
      x-price-sync-contract:
        authority: server-verified-catalog
        model-set: current-complete-discovery
        currency: USD
        caller-supplied-models: forbidden
        caller-supplied-sources: forbidden
        caller-supplied-prices: forbidden
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TenantFilter'
      responses:
        '200':
          description: Catalog state plus route change counters and warnings; inspect warnings because success does not imply reconciliation ran.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUpstreamModelSyncResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/upstream-models:
    get:
      tags: [Model routes]
      operationId: searchEligibleUpstreamModels
      summary: Search model coverage for explicit providers and provider groups
      description: Explicit accounts and included provider groups are unioned, then excluded provider groups are removed. Exclusion always wins. Route groups and credential groups never participate. Either `providers:read` or `routes:read` is accepted.
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:read
      parameters:
        - $ref: '#/components/parameters/RequiredTenant'
        - name: account_ids
          in: query
          description: Comma-separated explicit upstream account UUIDs, at most 100.
          schema: { type: string }
        - name: include_provider_group_ids
          in: query
          description: Comma-separated provider group UUIDs, at most 100.
          schema: { type: string }
        - name: exclude_provider_group_ids
          in: query
          description: Comma-separated provider group UUIDs, at most 100. Exclusion wins over explicit and included selection.
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Bounded model union with per-model coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregatedUpstreamModelCatalog' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/model-picker-options:
    get:
      tags: [Model routes]
      operationId: listModelPickerOptions
      summary: Search the authoritative read-only operator model picker projection
      description: |
        Returns one logical route or public-model selection per item and aggregates
        every matching configured upstream into `sources`. Only public provider
        drivers are included. The projection reads persisted configuration, catalog,
        and passive breaker evidence in one bounded projection database statement
        after service authentication; it never
        probes an upstream, synchronizes a catalog, decrypts credentials, or performs
        provider network I/O. Cursors are bound to the tenant, selection kind, search
        text, candidate filters, and current public provider catalog.
      security: [{ serviceBearer: [] }]
      x-required-scope: routes:read
      x-required-scopes: [routes:read, providers:read]
      x-projection-contract:
        database-statements-after-authentication: 1
        public-provider-catalog-only: true
        provider-network-io: forbidden
        catalog-sync: forbidden
        active-health-probe: forbidden
        credential-decryption: forbidden
      parameters:
        - $ref: '#/components/parameters/RequiredTenant'
        - name: selection_kind
          in: query
          required: true
          schema: { type: string, enum: [route, model] }
        - name: q
          in: query
          schema: { type: string, maxLength: 500, default: '' }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: account_ids
          in: query
          description: Comma-separated explicit upstream account UUIDs, at most 100.
          schema: { type: string }
        - name: include_provider_group_ids
          in: query
          description: Comma-separated provider group UUIDs, at most 100.
          schema: { type: string }
        - name: exclude_provider_group_ids
          in: query
          description: Comma-separated provider group UUIDs, at most 100. Exclusion wins.
          schema: { type: string }
      responses:
        '200':
          description: One bounded picker page with stable logical identities and source evidence.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPickerPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/upstreams/{account_id}/oauth/refresh:
    post:
      tags: [Upstream providers]
      operationId: refreshUpstreamOAuthCredential
      summary: Refresh an OAuth upstream and advance its credential generation
      description: |
        `Idempotency-Key` is required and claims the refresh before the authorization
