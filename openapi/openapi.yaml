        accounts:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/NativeKimiOAuthCohortAccount' }
    NativeKimiOAuthCohortResponse:
      type: object
      additionalProperties: false
      required: [disposition, accounts]
      properties:
        disposition: { type: string, enum: [created, converged, replayed, rotated] }
        accounts:
          type: array
          minItems: 2
          maxItems: 2
