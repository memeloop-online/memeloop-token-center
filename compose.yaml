services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memeloop_token_center
      POSTGRES_USER: token_center
      POSTGRES_PASSWORD: token_center
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_center -d memeloop_token_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: token-center
      MINIO_ROOT_PASSWORD: token-center-development-secret
    volumes:
      - minio-data:/data

  minio-bootstrap:
    image: quay.io/minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until mc alias set local http://minio:9000 token-center token-center-development-secret; do sleep 1; done;
        mc mb --ignore-existing local/memeloop-token-center

  token-center:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      MTC_DATABASE_URL: postgres://token_center:token_center@postgres:5432/memeloop_token_center
      MTC_KEY_PEPPER: local-development-pepper-change-before-production
      # Fixed local-only fixture; production must inject a generated Secret.
      MTC_SERVICE_TOKEN: local-development-bootstrap-token
      MTC_ARCHIVE_BACKEND: s3
      MTC_S3_BUCKET: memeloop-token-center
      MTC_S3_ENDPOINT: http://minio:9000
      MTC_S3_REGION: us-east-1
      MTC_S3_ACCESS_KEY: token-center
      MTC_S3_SECRET_KEY: token-center-development-secret
      MTC_S3_ALLOW_HTTP: "true"
      MTC_UPSTREAM_OPENAI_URL: ${MTC_UPSTREAM_OPENAI_URL:-http://host.docker.internal:4010}
      MTC_UPSTREAM_ANTHROPIC_URL: ${MTC_UPSTREAM_ANTHROPIC_URL:-http://host.docker.internal:4010}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  minio-data:
